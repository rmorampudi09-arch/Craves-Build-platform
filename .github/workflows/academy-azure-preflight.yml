name: Academy Azure read-only preflight

on:
  push:
    branches: [main]
    paths: ['.github/workflows/academy-azure-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: academy-azure-readonly-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check existing OIDC configuration without exposing values
        shell: bash
        env:
          CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "$CLIENT" || -z "$TENANT" || -z "$SUBSCRIPTION" ]]; then
            echo '::error::The existing GitHub Azure OIDC configuration is incomplete. No Azure change was attempted. Use the established Azure DevOps service connection; do not paste credentials into chat.'
            exit 1
          fi
      - name: Authenticate using the existing GitHub Azure OIDC connection
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Read existing Auth revision and backup configuration only
        shell: bash
        run: |
          set -euo pipefail
          set +x
          az containerapp show --resource-group rg-craves-prodlow-centralindia --name ca-craves-auth-service-prodlow --only-show-errors \
            --query '{name:name,latest:properties.latestRevisionName,ready:properties.latestReadyRevisionName,mode:properties.configuration.activeRevisionsMode,minReplicas:properties.template.scale.minReplicas,maxReplicas:properties.template.scale.maxReplicas,image:properties.template.containers[0].image}' --output json
          revision=$(az containerapp show --resource-group rg-craves-prodlow-centralindia --name ca-craves-auth-service-prodlow --query properties.latestReadyRevisionName --output tsv --only-show-errors)
          test -n "$revision"
          az containerapp revision show --resource-group rg-craves-prodlow-centralindia --name ca-craves-auth-service-prodlow --revision "$revision" --only-show-errors \
            --query '{name:name,active:properties.active,health:properties.healthState,running:properties.runningState,image:properties.template.containers[0].image}' --output json
          flag=$(az containerapp show --resource-group rg-craves-prodlow-centralindia --name ca-craves-auth-service-prodlow --only-show-errors \
            --query "properties.template.containers[0].env[?name=='CRAVES_ACADEMY_ENABLED'].value | [0]" --output tsv)
          case "$flag" in
            true|True|TRUE) echo 'Academy feature flag: true' ;;
            false|False|FALSE|'') echo 'Academy feature flag: false or unset' ;;
            *) echo 'Academy feature flag: unresolved; value deliberately not printed' ;;
          esac
          az postgres flexible-server show --resource-group rg-craves-prodlow-centralindia --name pg-craves-prodlow-l3ing6 --only-show-errors \
            --query '{name:name,state:state,retentionDays:backup.backupRetentionDays,earliestRestoreDate:backup.earliestRestoreDate}' --output json
          echo 'Read-only inspection complete. No image, flag, secret, network, scale, database or provider change was made.'
