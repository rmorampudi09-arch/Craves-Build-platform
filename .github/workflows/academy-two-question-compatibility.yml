name: Academy one-time curriculum compatibility edit
on:
  pull_request:
    paths: ['.github/workflows/academy-two-question-compatibility.yml']
permissions:
  contents: write
concurrency:
  group: academy-one-time-editor
  cancel-in-progress: false
jobs:
  edit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/academy-enterprise-completion-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/academy-enterprise-completion-20260913
      - name: Preserve the deployed two-question contract and all reasoning exercises
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('services/auth-service/src/main/resources/academy/engineering')
          for name in ['java-engineering', 'mobile-engineering', 'data-engineering', 'document-engineering', 'service-labs']:
              path = root / (name + '.json')
              data = json.loads(path.read_text())
              for lesson in data['course']['lessons']:
                  if len(lesson['questions']) == 2:
                      assert any(s['label'] == 'Reasoning checkpoint (ungraded)' for s in lesson['steps'])
                      continue
                  assert len(lesson['questions']) == 3
                  q = lesson['questions'].pop()
                  lesson['steps'].append({'label': 'Reasoning checkpoint (ungraded)', 'detail': q['prompt'] + ' Explain your answer before reading the resolution. Resolution: ' + q['options'][q['answer']] + '. ' + q['explanation']})
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          path = root / 'index.json'
          data = json.loads(path.read_text())
          data['evidenceLabel'] = data['evidenceLabel'].replace('175 explained questions', '150 graded questions plus 25 ungraded reasoning checkpoints')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          path = Path('scripts/academy/verify-curriculum.py')
          value = path.read_text().replace('15, 75, 175)', '15, 75, 150)').replace("len(lesson['questions']) in (2, 3)", "len(lesson['questions']) == 2").replace("len(lesson['questions']) == 3", "len(lesson['questions']) == 2")
          path.write_text(value)
          path = Path('services/auth-service/src/test/java/in/craves/auth/academy/AcademyCoreTest.java')
          value = path.read_text().replace('assertEquals(175,questions)', 'assertEquals(150,questions)').replace('assertEquals(3,lesson.path("questions").size())', 'assertEquals(2,lesson.path("questions").size())')
          path.write_text(value)
          PY
          python3 scripts/academy/verify-curriculum.py
          python3 scripts/academy/test-release-guard.py
          git diff --check
          git add services/auth-service/src/main/resources/academy/engineering/{java-engineering,mobile-engineering,data-engineering,document-engineering,service-labs,index}.json scripts/academy/verify-curriculum.py services/auth-service/src/test/java/in/craves/auth/academy/AcademyCoreTest.java
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(academy): retain reasoning exercises within the deployed quiz contract'
          git push origin HEAD:refs/heads/feat/academy-enterprise-completion-20260913
