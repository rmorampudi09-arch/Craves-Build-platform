name: Active Azure release preflight CI
on:
  pull_request:
    paths:
      - 'scripts/release/rmorampudi09_preflight.py'
      - 'scripts/release/tests/test_rmorampudi09_preflight.py'
      - 'scripts/release/active_address_release.py'
      - 'scripts/release/preserve_bank_binding.py'
      - 'scripts/release/tests/test_preserve_bank_binding.py'
      - 'scripts/release/tests/test_active_address_release.py'
      - 'azure-pipelines-rmorampudi09-address-readiness.yml'
      - '.github/workflows/active-release-preflight-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/release/tests -p test_rmorampudi09_preflight.py -v
      - run: python -m unittest discover -s scripts/release/tests -p test_active_address_release.py -v
      - run: python -m unittest discover -s scripts/release/tests -p test_preserve_bank_binding.py -v
