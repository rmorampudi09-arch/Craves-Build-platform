name: Admin dashboard CI

on:
  pull_request:
    branches: [main]
    paths:
      - apps/customer-web-next/**
      - services/order-service/**
      - services/user-chef-service/**
      - services/integration-service/**
      - infra/apim/admin-dashboard/**
      - infra/apim/admin-directory/**
      - infra/apim/admin-operational-investigations/**
      - infra/apim/subscription-backoffice/**
      - scripts/apim/configure-admin-dashboard-apim.sh
      - scripts/apim/configure-admin-directory-apim.sh
      - scripts/apim/configure-admin-operational-investigations-apim.sh
      - scripts/apim/configure-chef-review-document-list-apim.sh
      - azure-pipelines-admin-dashboard*.yml
      - azure-pipelines-admin-directory-apim.yml
      - azure-pipelines-chef-application-apim.yml
      - .github/workflows/admin-dashboard-ci.yml
  push:
    branches: [main]
    paths:
      - apps/customer-web-next/**
      - services/order-service/**
      - services/user-chef-service/**
      - services/integration-service/**
      - infra/apim/admin-dashboard/**
      - infra/apim/admin-directory/**
      - infra/apim/admin-operational-investigations/**
      - infra/apim/subscription-backoffice/**
      - scripts/apim/configure-admin-dashboard-apim.sh
      - scripts/apim/configure-admin-directory-apim.sh
      - scripts/apim/configure-admin-operational-investigations-apim.sh
      - scripts/apim/configure-chef-review-document-list-apim.sh
      - azure-pipelines-admin-dashboard*.yml
      - azure-pipelines-admin-directory-apim.yml
      - azure-pipelines-chef-application-apim.yml
      - .github/workflows/admin-dashboard-ci.yml

permissions:
  contents: read

concurrency:
  group: admin-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Next.js admin checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer-web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/customer-web-next/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          CRAVES_API_BASE_URL: https://example.invalid/api/v1
          NEXT_PUBLIC_CASHFREE_MODE: sandbox

  order-service:
    name: Order-service admin checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp test

  user-chef-service:
    name: User/Chef admin checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-chef-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp test

  integration-service:
    name: Integration admin financial checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/integration-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp test

  apim:
    name: Admin APIM syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/apim/configure-admin-dashboard-apim.sh
      - run: bash -n scripts/apim/configure-admin-directory-apim.sh
      - run: bash -n scripts/apim/configure-admin-operational-investigations-apim.sh
      - run: bash -n scripts/apim/configure-chef-review-document-list-apim.sh
