name: Admin session security CI
on:
  pull_request:
    paths:
      - 'services/auth-service/**'
      - 'apps/customer-web-next/**'
      - 'apps/delivery-intelligence-admin/**'
      - '.github/workflows/admin-session-ci.yml'
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: craves_admin_session_ci
          POSTGRES_USER: session_ci
          POSTGRES_PASSWORD: disposable-session-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U session_ci -d craves_admin_session_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp -f services/auth-service/pom.xml verify
        env:
          ADMIN_SESSION_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/craves_admin_session_ci
          ADMIN_SESSION_TEST_DB_USER: session_ci
          ADMIN_SESSION_TEST_DB_PASSWORD: disposable-session-ci
  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-web-next, delivery-intelligence-admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
