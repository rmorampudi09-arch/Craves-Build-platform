name: Apply approved menu category UI

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/apply-approved-menu-category-ui.yml

permissions:
  contents: write

jobs:
  apply-category-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - name: Apply approved category selectors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}, found {count}')
              path.write_text(text.replace(old, new, 1))

          files = {
           'apps/mobile/src/shared/catalog/menuCategories.ts': "export const CHEF_MENU_CATEGORIES = [\n  'Biriyani',\n  'Curry',\n  'Tiffin',\n  'Snakes',\n  'Roti & Chapati',\n  'Sweet Item',\n  'Rice',\n  'Fast Food',\n] as const;\n\nexport type ChefMenuCategory = (typeof CHEF_MENU_CATEGORIES)[number];\n\nexport const CUSTOMER_MENU_CATEGORIES = ['All', ...CHEF_MENU_CATEGORIES] as const;\nexport type CustomerMenuCategory = (typeof CUSTOMER_MENU_CATEGORIES)[number];\n",
           'apps/mobile/src/shared/catalog/menuCategories.test.ts': "import {\n  CHEF_MENU_CATEGORIES,\n  CUSTOMER_MENU_CATEGORIES,\n} from './menuCategories';\n\ndescribe('menu category catalog', () => {\n  it('keeps the approved customer category order including All', () => {\n    expect(CUSTOMER_MENU_CATEGORIES).toEqual([\n      'All',\n      'Biriyani',\n      'Curry',\n      'Tiffin',\n      'Snakes',\n      'Roti & Chapati',\n      'Sweet Item',\n      'Rice',\n      'Fast Food',\n    ]);\n  });\n\n  it('keeps chef selection limited to the approved item categories', () => {\n    expect(CHEF_MENU_CATEGORIES).toEqual([\n      'Biriyani',\n      'Curry',\n      'Tiffin',\n      'Snakes',\n      'Roti & Chapati',\n      'Sweet Item',\n      'Rice',\n      'Fast Food',\n    ]);\n    expect(CHEF_MENU_CATEGORIES).not.toContain('All');\n  });\n});\n",
           'apps/mobile/src/features/home/components/HomeCategoryRail.tsx': 'import React from \'react\';\nimport {\n  Image,\n  Pressable,\n  ScrollView,\n  StyleSheet,\n  Text,\n  type ImageSourcePropType,\n} from \'react-native\';\nimport {\n  CUSTOMER_MENU_CATEGORIES,\n  type CustomerMenuCategory,\n} from \'../../../shared/catalog/menuCategories\';\nimport {\n  colors,\n  fontWeight,\n  spacing,\n  typography,\n} from \'../../../design/tokens\';\n\ndeclare const require: (path: string) => ImageSourcePropType;\n\nconst CATEGORY_IMAGES: Record<CustomerMenuCategory, ImageSourcePropType> = {\n  All: require(\'../../../assets/categories/all.jpg\'),\n  Biriyani: require(\'../../../assets/categories/biriyani.jpg\'),\n  Curry: require(\'../../../assets/categories/curry.jpg\'),\n  Tiffin: require(\'../../../assets/categories/tiffin.jpg\'),\n  Snakes: require(\'../../../assets/categories/snakes.jpg\'),\n  \'Roti & Chapati\': require(\'../../../assets/categories/roti-chapati.jpg\'),\n  \'Sweet Item\': require(\'../../../assets/categories/sweet-item.jpg\'),\n  Rice: require(\'../../../assets/categories/rice.jpg\'),\n  \'Fast Food\': require(\'../../../assets/categories/fast-food.jpg\'),\n};\n\ninterface HomeCategoryRailProps {\n  selectedCategory: string | null;\n  onSelect: (category: string | null) => void;\n}\n\nexport function HomeCategoryRail({\n  selectedCategory,\n  onSelect,\n}: HomeCategoryRailProps) {\n  return (\n    <ScrollView\n      horizontal\n      contentContainerStyle={styles.row}\n      keyboardShouldPersistTaps="handled"\n      showsHorizontalScrollIndicator={false}>\n      {CUSTOMER_MENU_CATEGORIES.map(category => {\n        const filterValue = category === \'All\' ? null : category;\n        const selected = selectedCategory === filterValue;\n\n        return (\n          <Pressable\n            key={category}\n            accessibilityLabel={`${category} category`}\n            accessibilityRole="button"\n            accessibilityState={{selected}}\n            onPress={() => onSelect(filterValue)}\n            style={({pressed}) => [styles.item, pressed && styles.itemPressed]}>\n            <Image\n              accessibilityIgnoresInvertColors\n              resizeMode="cover"\n              source={CATEGORY_IMAGES[category]}\n              style={styles.image}\n            />\n            <Text\n              numberOfLines={2}\n              style={[styles.label, selected && styles.labelSelected]}>\n              {category}\n            </Text>\n          </Pressable>\n        );\n      })}\n    </ScrollView>\n  );\n}\n\nconst styles = StyleSheet.create({\n  row: {\n    gap: spacing.md,\n    paddingHorizontal: spacing.md,\n    paddingTop: spacing.md,\n    paddingBottom: spacing.xs,\n  },\n  item: {\n    alignItems: \'center\',\n    width: 76,\n  },\n  itemPressed: {\n    opacity: 0.82,\n  },\n  image: {\n    width: 68,\n    height: 68,\n    borderRadius: 34,\n    backgroundColor: colors.surfaceMuted,\n  },\n  label: {\n    color: colors.espressoBrown,\n    fontSize: typography.tiny,\n    fontWeight: fontWeight.semibold,\n    marginTop: spacing.xs,\n    textAlign: \'center\',\n  },\n  labelSelected: {\n    color: colors.flameRed,\n  },\n});\n',
           'apps/mobile/src/features/chefMenu/components/ChefMenuCategorySelector.tsx': 'import React from \'react\';\nimport {Pressable, StyleSheet, Text, View} from \'react-native\';\nimport {\n  colors,\n  fontWeight,\n  radius,\n  spacing,\n  touchTarget,\n  typography,\n} from \'../../../design/tokens\';\nimport {\n  CHEF_MENU_CATEGORIES,\n  type ChefMenuCategory,\n} from \'../../../shared/catalog/menuCategories\';\n\ninterface ChefMenuCategorySelectorProps {\n  value: string;\n  error?: string;\n  disabled?: boolean;\n  onChange: (category: ChefMenuCategory) => void;\n}\n\nexport function ChefMenuCategorySelector({\n  value,\n  error,\n  disabled = false,\n  onChange,\n}: ChefMenuCategorySelectorProps) {\n  return (\n    <View style={styles.fieldBlock}>\n      <Text style={styles.fieldLabel}>Category</Text>\n      <View style={styles.options}>\n        {CHEF_MENU_CATEGORIES.map(category => {\n          const selected = value === category;\n          return (\n            <Pressable\n              key={category}\n              accessibilityRole="radio"\n              accessibilityState={{checked: selected, disabled}}\n              disabled={disabled}\n              onPress={() => onChange(category)}\n              style={({pressed}) => [\n                styles.option,\n                selected && styles.optionSelected,\n                (pressed || disabled) && styles.optionMuted,\n              ]}>\n              <Text\n                style={[\n                  styles.optionText,\n                  selected && styles.optionTextSelected,\n                ]}>\n                {category}\n              </Text>\n            </Pressable>\n          );\n        })}\n      </View>\n      {error ? (\n        <Text style={styles.fieldError}>{error}</Text>\n      ) : (\n        <Text style={styles.fieldHelper}>Select one category for this item.</Text>\n      )}\n    </View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  fieldBlock: {marginBottom: spacing.md},\n  fieldLabel: {\n    color: colors.textPrimary,\n    fontSize: typography.small,\n    fontWeight: fontWeight.semibold,\n    marginBottom: spacing.xs,\n  },\n  options: {\n    flexDirection: \'row\',\n    flexWrap: \'wrap\',\n    gap: spacing.xs,\n  },\n  option: {\n    alignItems: \'center\',\n    backgroundColor: colors.white,\n    borderColor: colors.borderStrong,\n    borderRadius: radius.pill,\n    borderWidth: 1,\n    justifyContent: \'center\',\n    minHeight: touchTarget.minimum,\n    paddingHorizontal: spacing.md,\n  },\n  optionSelected: {backgroundColor: colors.flameRed, borderColor: colors.flameRed},\n  optionMuted: {opacity: 0.72},\n  optionText: {\n    color: colors.textPrimary,\n    fontSize: typography.small,\n    fontWeight: fontWeight.semibold,\n  },\n  optionTextSelected: {color: colors.white},\n  fieldError: {color: colors.error, fontSize: typography.small, marginTop: spacing.xxs},\n  fieldHelper: {color: colors.textSecondary, fontSize: typography.tiny, marginTop: spacing.xxs},\n});\n',
          }
          for rel, content in files.items():
              path = root / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content)

          home = root / 'apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx'
          replace_once(home, "  ScrollView,\n", "")
          replace_once(home, "import {Chip} from '../../../shared/components/Chip';\n", "import {HomeCategoryRail} from '../components/HomeCategoryRail';\n")
          replace_once(home, '      {categories.length > 0 ? (\n        <ScrollView\n          horizontal\n          contentContainerStyle={styles.categoryRow}\n          keyboardShouldPersistTaps="handled"\n          showsHorizontalScrollIndicator={false}>\n          <Chip\n            label="All"\n            selected={selectedCategory === null}\n            onPress={() => setSelectedCategory(null)}\n          />\n          {categories.map(category => (\n            <Chip\n              key={category}\n              label={category}\n              selected={selectedCategory === category}\n              onPress={() => setSelectedCategory(category)}\n            />\n          ))}\n        </ScrollView>\n      ) : null}', '      {categories.length > 0 ? (\n        <HomeCategoryRail\n          selectedCategory={selectedCategory}\n          onSelect={setSelectedCategory}\n        />\n      ) : null}')

          add = root / 'apps/mobile/src/features/chefMenu/screens/ChefAddMenuItemScreen.tsx'
          replace_once(add, "import {Icon} from '../../../shared/components/Icon';\n", "import {Icon} from '../../../shared/components/Icon';\nimport {ChefMenuCategorySelector} from '../components/ChefMenuCategorySelector';\n")
          replace_once(add, '            <Controller\n              control={control}\n              name="category"\n              render={({field}) => (\n                <FormField\n                  autoCapitalize="words"\n                  error={errors.category?.message}\n                  helper="Category options are not provided by the current server, so enter the category name."\n                  label="Category"\n                  onBlur={field.onBlur}\n                  onChangeText={field.onChange}\n                  placeholder="e.g. Starters"\n                  value={field.value}\n                />\n              )}\n            />', '            <Controller\n              control={control}\n              name="category"\n              render={({field}) => (\n                <ChefMenuCategorySelector\n                  disabled={submitting}\n                  error={errors.category?.message}\n                  onChange={category => {\n                    field.onChange(category);\n                    field.onBlur();\n                  }}\n                  value={field.value}\n                />\n              )}\n            />')

          edit = root / 'apps/mobile/src/features/chefMenu/screens/ChefEditMenuItemScreen.tsx'
          replace_once(edit, "import {Icon} from '../../../shared/components/Icon';\n", "import {Icon} from '../../../shared/components/Icon';\nimport {ChefMenuCategorySelector} from '../components/ChefMenuCategorySelector';\n")
          replace_once(edit, '            <Controller\n              control={control}\n              name="category"\n              render={({field}) => (\n                <FormField\n                  autoCapitalize="words"\n                  error={errors.category?.message}\n                  helper="The current server exposes category as free text; no category metadata route is available."\n                  label="Category"\n                  onBlur={field.onBlur}\n                  onChangeText={field.onChange}\n                  value={field.value}\n                />\n              )}\n            />', '            <Controller\n              control={control}\n              name="category"\n              render={({field}) => (\n                <ChefMenuCategorySelector\n                  disabled={submitting}\n                  error={errors.category?.message}\n                  onChange={category => {\n                    field.onChange(category);\n                    field.onBlur();\n                  }}\n                  value={field.value}\n                />\n              )}\n            />')
          PY

      - name: Commit category UI changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src
          git diff --cached --check
          git commit -m "Add static menu categories and chef selector"
          git push origin HEAD:mobile-ui-rebuild-from-scratch
