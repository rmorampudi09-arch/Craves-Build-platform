name: Apply customer mobile UI fixes 2026-08-21

on:
  push:
    branches:
      - fix/customer-mobile-ui-navigation-2026-08-21
    paths:
      - .github/workflows/apply-customer-mobile-ui-fixes-2026-08-21.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-mobile-ui-navigation-2026-08-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Apply focused source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              write(path, text)

          def regex_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"Expected one regex match in {path}, got {count}: {pattern}")
              write(path, updated)

          # Shared deterministic fallback. Current Catalog contracts expose sellable/available,
          # but no per-dish remaining quantity. Keep a stable display count until that contract exists.
          Path('apps/mobile/src/shared/menuAvailability.ts').write_text("""/**
           * The current public Catalog/discovery contracts expose whether a dish is sellable,
           * but not a remaining-quantity count. Until the backend adds that authoritative field,
           * derive a stable per-item display count so the UI does not change between renders.
           */
          export function getDisplayAvailabilityCount(itemId: string): number {
            let hash = 0;
            for (let index = 0; index < itemId.length; index += 1) {
              hash = (Math.imul(hash, 31) + itemId.charCodeAt(index)) >>> 0;
            }
            return 5 + (hash % 8);
          }
          """)
          Path('apps/mobile/src/shared/menuAvailability.test.ts').write_text("""import {getDisplayAvailabilityCount} from './menuAvailability';

          describe('getDisplayAvailabilityCount', () => {
            it('returns a stable positive placeholder count for the same menu item', () => {
              const id = '11111111-1111-4111-8111-111111111111';
              expect(getDisplayAvailabilityCount(id)).toBe(getDisplayAvailabilityCount(id));
              expect(getDisplayAvailabilityCount(id)).toBeGreaterThanOrEqual(5);
              expect(getDisplayAvailabilityCount(id)).toBeLessThanOrEqual(12);
            });
          });
          """)

          # Hide the custom customer menu surface while the keyboard is visible.
          path = 'apps/mobile/src/app/navigation/CustomerBottomNavController.tsx'
          replace_once(path, """  useContext,\n  useMemo,\n""", """  useContext,\n  useEffect,\n  useMemo,\n""")
          replace_once(path, """  Animated,\n  Easing,\n  Pressable,\n""", """  Animated,\n  Easing,\n  Keyboard,\n  Pressable,\n""")
          replace_once(path, """  const [barHeight, setBarHeight] = useState(0);\n  const activeTabRoute = props.state.routes[props.state.index];\n""", """  const [barHeight, setBarHeight] = useState(0);\n  const [keyboardVisible, setKeyboardVisible] = useState(false);\n  const activeTabRoute = props.state.routes[props.state.index];\n""")
          replace_once(path, """  const handleLayout = useCallback((event: LayoutChangeEvent) => {\n    setBarHeight(Math.ceil(event.nativeEvent.layout.height));\n  }, []);\n\n  const handleOpenCart = useCallback(() => {\n""", """  const handleLayout = useCallback((event: LayoutChangeEvent) => {\n    setBarHeight(Math.ceil(event.nativeEvent.layout.height));\n  }, []);\n\n  useEffect(() => {\n    const showSubscription = Keyboard.addListener('keyboardDidShow', () => {\n      setKeyboardVisible(true);\n    });\n    const hideSubscription = Keyboard.addListener('keyboardDidHide', () => {\n      setKeyboardVisible(false);\n    });\n    return () => {\n      showSubscription.remove();\n      hideSubscription.remove();\n    };\n  }, []);\n\n  const handleOpenCart = useCallback(() => {\n""")
          replace_once(path, """  if (!focusedRoutePolicy.bottomNavigationVisible) {\n    return null;\n  }\n""", """  if (keyboardVisible || !focusedRoutePolicy.bottomNavigationVisible) {\n    return null;\n  }\n""")

          # Make Profile always return to its root after leaving a deep Profile destination,
          # and hydrate the server cart as soon as the signed-in customer shell launches.
          path = 'apps/mobile/src/app/navigation/customerTabs.ts'
          replace_once(path, """export const CUSTOMER_TAB_STATE_OPTIONS = {\n  lazy: true,\n  popToTopOnBlur: false,\n} as const;\n\nexport function getCustomerTabDefinition(\n""", """export const CUSTOMER_TAB_STATE_OPTIONS = {\n  lazy: true,\n  popToTopOnBlur: false,\n} as const;\n\n/**\n * Profile can be opened deeply from Orders/Help. Once Profile loses focus, reset\n * that nested stack so the next explicit Profile-tab press always opens Profile root.\n */\nexport const CUSTOMER_PROFILE_TAB_STATE_OPTIONS = {\n  ...CUSTOMER_TAB_STATE_OPTIONS,\n  popToTopOnBlur: true,\n} as const;\n\nexport function getCustomerTabDefinition(\n""")

          path = 'apps/mobile/src/app/navigation/customerTabs.test.ts'
          replace_once(path, """  CUSTOMER_TAB_ACTIVE_COLOR,\n  CUSTOMER_TAB_STATE_OPTIONS,\n""", """  CUSTOMER_PROFILE_TAB_STATE_OPTIONS,\n  CUSTOMER_TAB_ACTIVE_COLOR,\n  CUSTOMER_TAB_STATE_OPTIONS,\n""")
          replace_once(path, """  it('maps every route to an explicit accessible icon definition', () => {\n""", """  it('resets only the Profile nested stack after leaving a deep profile route', () => {\n    expect(CUSTOMER_PROFILE_TAB_STATE_OPTIONS).toEqual({\n      lazy: true,\n      popToTopOnBlur: true,\n    });\n  });\n\n  it('maps every route to an explicit accessible icon definition', () => {\n""")

          path = 'apps/mobile/src/app/navigation/CustomerRootNavigator.tsx'
          replace_once(path, """import {CustomerCartScreen} from '../../features/cart/screens/CustomerCartScreen';\n""", """import {CustomerCartScreen} from '../../features/cart/screens/CustomerCartScreen';\nimport {refreshCartSnapshot} from '../../features/cart/state/cartRefresh';\n""")
          replace_once(path, """  CUSTOMER_TAB_ACTIVE_COLOR,\n  CUSTOMER_TAB_INACTIVE_COLOR,\n  CUSTOMER_TAB_STATE_OPTIONS,\n""", """  CUSTOMER_PROFILE_TAB_STATE_OPTIONS,\n  CUSTOMER_TAB_ACTIVE_COLOR,\n  CUSTOMER_TAB_INACTIVE_COLOR,\n  CUSTOMER_TAB_STATE_OPTIONS,\n""")
          replace_once(path, """const profileTabOptions = {\n  tabBarAccessibilityLabel: `${profileTab.label} tab`,\n""", """const profileTabOptions = {\n  ...CUSTOMER_PROFILE_TAB_STATE_OPTIONS,\n  tabBarAccessibilityLabel: `${profileTab.label} tab`,\n""")
          replace_once(path, """function CustomerHomeStackNavigator() {\n""", """function CustomerLaunchCartResolver() {\n  const dispatch = useAppDispatch();\n  const identityId = useAppSelector(state => state.auth.identity?.id ?? null);\n  const refreshedIdentityRef = React.useRef<string | null>(null);\n\n  React.useEffect(() => {\n    if (!identityId) {\n      refreshedIdentityRef.current = null;\n      return;\n    }\n    if (refreshedIdentityRef.current === identityId) return;\n\n    refreshedIdentityRef.current = identityId;\n    void dispatch(refreshCartSnapshot());\n  }, [dispatch, identityId]);\n\n  return null;\n}\n\nfunction CustomerHomeStackNavigator() {\n""")
          replace_once(path, """      <CustomerLaunchLocationResolver />\n      <CustomerTabsNavigator />\n""", """      <CustomerLaunchLocationResolver />\n      <CustomerLaunchCartResolver />\n      <CustomerTabsNavigator />\n""")

          # Chefs discovery: only View kitchen is actionable, search rises on focus,
          # and the filter matches the Home filter treatment.
          path = 'apps/mobile/src/features/chefDiscovery/screens/DiscoverHomeChefsScreen.tsx'
          replace_once(path, """  View,\n  type NativeScrollEvent,\n""", """  View,\n  type LayoutChangeEvent,\n  type NativeScrollEvent,\n""")
          replace_once(path, """import {ScreenShell} from '../../../shared/components/ScreenShell';\n""", """import {Icon} from '../../../shared/components/Icon';\nimport {ScreenShell} from '../../../shared/components/ScreenShell';\n""")
          regex_once(path, r"interface KitchenCardProps \{.*?\n\}\n\nexport function DiscoverHomeChefsScreen", """interface KitchenCardProps {\n  kitchen: NearbyKitchen;\n  onViewKitchen: (kitchen: NearbyKitchen) => void;\n}\n\nfunction KitchenCard({kitchen, onViewKitchen}: KitchenCardProps) {\n  const title = kitchen.kitchenName;\n  const location = formatKitchenLocation(kitchen);\n\n  return (\n    <View style={styles.kitchenCard}>\n      <View style={styles.avatar}>\n        <Text style={styles.avatarText}>{getKitchenInitials(kitchen)}</Text>\n      </View>\n      <View style={styles.cardBody}>\n        <View style={styles.cardTitleRow}>\n          <View style={styles.cardTitleCopy}>\n            <Text numberOfLines={1} style={styles.kitchenTitle}>\n              {title}\n            </Text>\n          </View>\n          <View style={styles.availableBadge}>\n            <Text style={styles.availableBadgeText}>Open</Text>\n          </View>\n        </View>\n\n        {kitchen.description ? (\n          <Text numberOfLines={2} style={styles.description}>\n            {kitchen.description}\n          </Text>\n        ) : null}\n\n        <Text numberOfLines={1} style={styles.metadata}>\n          {[formatKitchenDistance(kitchen.distanceMeters), location]\n            .filter(Boolean)\n            .join(' • ')}\n        </Text>\n\n        <View style={styles.cardFooter}>\n          <Text style={styles.menuCount}>\n            {kitchen.activeMenuItemCount}{' '}\n            {kitchen.activeMenuItemCount === 1 ? 'dish available' : 'dishes available'}\n          </Text>\n          <Pressable\n            accessibilityHint=\"Opens this kitchen's public profile and available dishes\"\n            accessibilityLabel={`View ${title} kitchen`}\n            accessibilityRole=\"button\"\n            onPress={() => onViewKitchen(kitchen)}\n            style={({pressed}) => [styles.viewKitchenButton, pressed && styles.filterButtonPressed]}>\n            <Text style={styles.viewKitchen}>View kitchen</Text>\n            <Icon name=\"chevron-right\" size={18} color={colors.flameRedAccessible} surface={false} />\n          </Pressable>\n        </View>\n      </View>\n    </View>\n  );\n}\n\nexport function DiscoverHomeChefsScreen""")
          replace_once(path, """  const [locationSelectorVisible, setLocationSelectorVisible] = useState(false);\n  const listRef = useRef<FlatList<NearbyKitchen>>(null);\n""", """  const [locationSelectorVisible, setLocationSelectorVisible] = useState(false);\n  const listRef = useRef<FlatList<NearbyKitchen>>(null);\n  const searchRowYRef = useRef(0);\n""")
          replace_once(path, """  const saveListOffset = useCallback(\n""", """  const handleSearchRowLayout = useCallback((event: LayoutChangeEvent) => {\n    searchRowYRef.current = event.nativeEvent.layout.y;\n  }, []);\n\n  const handleSearchFocus = useCallback(() => {\n    requestAnimationFrame(() => {\n      listRef.current?.scrollToOffset({\n        offset: Math.max(0, searchRowYRef.current - spacing.sm),\n        animated: true,\n      });\n    });\n  }, []);\n\n  const saveListOffset = useCallback(\n""")
          old_search = """      <View style={styles.searchRow}>\n        <DiscoverySearchInput\n          accessibilityLabel=\"Search nearby kitchens\"\n          onChangeText={handleSearchChange}\n          onClear={handleClearSearch}\n          placeholder=\"Search chefs, kitchens or area\"\n          style={styles.searchField}\n          value={search.draft}\n        />\n        <Pressable\n          accessibilityHint=\"Open filter and sort options\"\n          accessibilityLabel=\"Filters\"\n          accessibilityRole=\"button\"\n          onPress={openFilters}\n          style={({pressed}) => [styles.filterButton, pressed && styles.filterButtonPressed]}>\n          <Text style={styles.filterButtonText}>Filters</Text>\n        </Pressable>\n      </View>\n"""
          new_search = """      <View onLayout={handleSearchRowLayout} style={styles.searchRow}>\n        <DiscoverySearchInput\n          accessibilityLabel=\"Search nearby kitchens\"\n          onChangeText={handleSearchChange}\n          onClear={handleClearSearch}\n          onFocus={handleSearchFocus}\n          placeholder=\"Search chefs, kitchens or area\"\n          style={styles.searchField}\n          value={search.draft}\n        />\n        <Pressable\n          accessibilityHint=\"Open filter and sort options\"\n          accessibilityLabel=\"Filters\"\n          accessibilityRole=\"button\"\n          onPress={openFilters}\n          style={({pressed}) => [styles.filterButton, pressed && styles.filterButtonPressed]}>\n          <Icon name=\"filter\" size={18} color={colors.flameRedAccessible} surface={false} />\n          <Text style={styles.filterButtonText}>Filters</Text>\n        </Pressable>\n      </View>\n"""
          replace_once(path, old_search, new_search)
          replace_once(path, """    <ScreenShell edges={['top']} keyboardAvoiding={false} testID=\"discover-home-chefs\">\n""", """    <ScreenShell edges={['top']} keyboardAvoiding testID=\"discover-home-chefs\">\n""")
          replace_once(path, """        data={visibleKitchens}\n        keyboardShouldPersistTaps=\"handled\"\n""", """        data={visibleKitchens}\n        keyboardDismissMode=\"on-drag\"\n        keyboardShouldPersistTaps=\"handled\"\n""")
          replace_once(path, """          <KitchenCard kitchen={item} onPress={openKitchenProfile} />\n""", """          <KitchenCard kitchen={item} onViewKitchen={openKitchenProfile} />\n""")
          replace_once(path, """  searchRow: {\n    flexDirection: 'row',\n    gap: spacing.sm,\n""", """  searchRow: {\n    flexDirection: 'row',\n    alignItems: 'stretch',\n    gap: spacing.sm,\n""")
          replace_once(path, """  searchField: {\n    flex: 1,\n  },\n  filterButton: {\n    minHeight: touchTarget.comfortable,\n    paddingHorizontal: spacing.md,\n    borderRadius: radius.md,\n    backgroundColor: colors.flameRed,\n    alignItems: 'center',\n    justifyContent: 'center',\n    ...elevation.primaryAction,\n  },\n  filterButtonPressed: {\n    opacity: 0.84,\n    transform: [{scale: 0.98}],\n  },\n  filterButtonText: {\n    color: colors.white,\n    fontSize: typography.small,\n    fontWeight: fontWeight.bold,\n  },\n""", """  searchField: {\n    minWidth: 0,\n    flex: 1,\n  },\n  filterButton: {\n    minHeight: touchTarget.minimum,\n    minWidth: 92,\n    flexDirection: 'row',\n    paddingHorizontal: spacing.sm,\n    borderRadius: radius.md,\n    borderWidth: 1,\n    borderColor: colors.borderStrong,\n    backgroundColor: colors.white,\n    alignItems: 'center',\n    justifyContent: 'center',\n    gap: spacing.xxs,\n  },\n  filterButtonPressed: {\n    backgroundColor: colors.surfaceMuted,\n    transform: [{scale: 0.98}],\n  },\n  filterButtonText: {\n    color: colors.flameRedAccessible,\n    fontSize: typography.small,\n    fontWeight: fontWeight.semibold,\n  },\n""")
          replace_once(path, """  viewKitchen: {\n    color: colors.flameRed,\n""", """  viewKitchenButton: {\n    minHeight: touchTarget.minimum,\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'center',\n    gap: spacing.xxs,\n    paddingHorizontal: spacing.xs,\n    borderRadius: radius.md,\n  },\n  viewKitchen: {\n    color: colors.flameRedAccessible,\n""")

          # Kitchen-profile preview cards: match reference layout and add availability count.
          path = 'apps/mobile/src/features/kitchenProfile/screens/CustomerKitchenProfileScreen.tsx'
          replace_once(path, """import {ScreenShell} from '../../../shared/components/ScreenShell';\n""", """import {ScreenShell} from '../../../shared/components/ScreenShell';\nimport {getDisplayAvailabilityCount} from '../../../shared/menuAvailability';\n""")
          regex_once(path, r"function MenuPreviewCard\(\{.*?\n\}\n\nexport function CustomerKitchenProfileScreen", """function MenuPreviewCard({\n  item,\n  cartLine,\n  busy,\n  favorite,\n  favoritePending,\n  favoriteDisabled,\n  onFavoriteToggle,\n  onOpen,\n  onIncrease,\n  onDecrease,\n}: MenuPreviewCardProps) {\n  const image = getCustomerKitchenMenuImage(item);\n  const availableCount = getDisplayAvailabilityCount(item.id);\n  const typeLabel = foodTypeLabel(item.foodType);\n  const typeColor =\n    item.foodType === 'VEG'\n      ? colors.success\n      : item.foodType === 'EGG'\n        ? colors.warning\n        : colors.error;\n\n  const purchaseControl = cartLine ? (\n    <View style={styles.quantityControl}>\n      <Pressable\n        accessibilityLabel={`Decrease ${item.itemName} quantity`}\n        accessibilityRole=\"button\"\n        disabled={busy}\n        onPress={() => onDecrease(cartLine)}\n        style={({pressed}) => [\n          styles.quantityButton,\n          busy && styles.disabled,\n          pressed && !busy && styles.pressed,\n        ]}>\n        <Text style={styles.quantityButtonText}>−</Text>\n      </Pressable>\n      <Text accessibilityLabel={`${cartLine.quantity} in cart`} style={styles.quantityText}>\n        {cartLine.quantity}\n      </Text>\n      <Pressable\n        accessibilityLabel={`Increase ${item.itemName} quantity`}\n        accessibilityRole=\"button\"\n        disabled={busy}\n        onPress={() => onIncrease(item)}\n        style={({pressed}) => [\n          styles.quantityButton,\n          busy && styles.disabled,\n          pressed && !busy && styles.pressed,\n        ]}>\n        <Text style={styles.quantityButtonText}>+</Text>\n      </Pressable>\n    </View>\n  ) : (\n    <Pressable\n      accessibilityLabel={`Add ${item.itemName} to cart`}\n      accessibilityRole=\"button\"\n      accessibilityState={{busy, disabled: busy}}\n      disabled={busy}\n      onPress={() => onIncrease(item)}\n      style={({pressed}) => [\n        styles.addButton,\n        busy && styles.disabled,\n        pressed && !busy && styles.pressed,\n      ]}>\n      <Text style={styles.addButtonText}>{busy ? 'Adding…' : 'Add'}</Text>\n    </Pressable>\n  );\n\n  return (\n    <View style={styles.menuCard}>\n      <View style={styles.menuCardRow}>\n        <Pressable\n          accessibilityLabel={`Open ${item.itemName}`}\n          accessibilityRole=\"button\"\n          onPress={() => onOpen(item.id)}\n          style={({pressed}) => [styles.menuImagePressable, pressed && styles.pressed]}>\n          {image ? (\n            <Image\n              accessibilityIgnoresInvertColors\n              accessibilityLabel={`${item.itemName} image`}\n              source={{uri: image.url}}\n              resizeMode=\"cover\"\n              style={styles.menuImage}\n            />\n          ) : (\n            <View style={styles.menuImageFallback}>\n              <Text style={styles.menuImageFallbackText}>{item.category}</Text>\n            </View>\n          )}\n        </Pressable>\n\n        <View style={styles.menuCopy}>\n          <Pressable\n            accessibilityLabel={`Open ${item.itemName}`}\n            accessibilityRole=\"button\"\n            onPress={() => onOpen(item.id)}\n            style={({pressed}) => pressed && styles.pressed}>\n            <Text numberOfLines={2} style={styles.menuTitle}>\n              {item.itemName}\n            </Text>\n            <View style={styles.availabilityRow}>\n              <Icon name=\"check\" size={16} color={colors.success} surface={false} />\n              <Text style={styles.availabilityText}>Available - {availableCount}</Text>\n            </View>\n            <View style={styles.menuMetadataRow}>\n              <Text numberOfLines={1} style={styles.menuMeta}>{item.category}</Text>\n              {item.preparationTimeMinutes ? (\n                <>\n                  <Text style={styles.metadataSeparator}>|</Text>\n                  <Icon name=\"clock\" size={16} color={colors.textSecondary} surface={false} />\n                  <Text style={styles.menuMeta}>{item.preparationTimeMinutes} min</Text>\n                </>\n              ) : null}\n            </View>\n            <View style={styles.foodTypePill}>\n              <View style={[styles.foodTypeDot, {backgroundColor: typeColor}]} />\n              <Text style={styles.foodTypeText}>{typeLabel}</Text>\n            </View>\n          </Pressable>\n\n          <View style={styles.menuPurchaseRow}>\n            <Text style={styles.menuPrice}>\n              {formatDishDetailPrice(item.price.amount, item.price.currency)}\n            </Text>\n            {purchaseControl}\n          </View>\n        </View>\n      </View>\n\n      <CustomerFavoriteHeartButton\n        favorite={favorite}\n        pending={favoritePending}\n        disabled={favoriteDisabled}\n        itemLabel={item.itemName}\n        onToggle={() => onFavoriteToggle(item.id, favorite)}\n        style={styles.favoriteButton}\n      />\n    </View>\n  );\n}\n\nexport function CustomerKitchenProfileScreen""")
          regex_once(path, r"  favoriteButton: \{.*?\n  emptyMenuCard: \{", """  favoriteButton: {\n    position: 'absolute',\n    top: spacing.xs,\n    right: spacing.xs,\n    zIndex: 4,\n  },\n  menuCard: {\n    minHeight: 164,\n    borderWidth: 1,\n    borderColor: colors.border,\n    borderRadius: radius.lg,\n    backgroundColor: colors.white,\n    overflow: 'hidden',\n    ...elevation.card,\n  },\n  menuCardRow: {\n    flexDirection: 'row',\n    alignItems: 'stretch',\n  },\n  menuImagePressable: {\n    width: 132,\n    minHeight: 164,\n  },\n  menuImage: {\n    width: 132,\n    height: 164,\n    backgroundColor: colors.surfaceMuted,\n  },\n  menuImageFallback: {\n    width: 132,\n    height: 164,\n    alignItems: 'center',\n    justifyContent: 'center',\n    padding: spacing.sm,\n    backgroundColor: colors.surfaceMuted,\n  },\n  menuImageFallbackText: {\n    color: colors.flameRed,\n    fontSize: typography.small,\n    fontWeight: fontWeight.bold,\n    textAlign: 'center',\n  },\n  menuCopy: {\n    flex: 1,\n    minWidth: 0,\n    padding: spacing.sm,\n    paddingRight: spacing.md,\n  },\n  menuTitle: {\n    paddingRight: touchTarget.minimum,\n    color: colors.espressoBrown,\n    fontSize: typography.body,\n    fontWeight: fontWeight.bold,\n  },\n  availabilityRow: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    gap: spacing.xxs,\n    marginTop: spacing.xxs,\n  },\n  availabilityText: {\n    color: colors.success,\n    fontSize: typography.tiny,\n    fontWeight: fontWeight.medium,\n  },\n  menuMetadataRow: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    flexWrap: 'wrap',\n    gap: spacing.xxs,\n    marginTop: spacing.xs,\n  },\n  menuMeta: {\n    color: colors.textSecondary,\n    fontSize: typography.tiny,\n  },\n  metadataSeparator: {\n    color: colors.borderStrong,\n    fontSize: typography.tiny,\n    marginHorizontal: spacing.xxs,\n  },\n  foodTypePill: {\n    alignSelf: 'flex-start',\n    flexDirection: 'row',\n    alignItems: 'center',\n    gap: spacing.xxs,\n    marginTop: spacing.xs,\n    borderWidth: 1,\n    borderColor: colors.border,\n    borderRadius: radius.pill,\n    paddingHorizontal: spacing.xs,\n    paddingVertical: spacing.xxs,\n    backgroundColor: colors.white,\n  },\n  foodTypeDot: {\n    width: 8,\n    height: 8,\n    borderRadius: radius.pill,\n  },\n  foodTypeText: {\n    color: colors.textPrimary,\n    fontSize: typography.tiny,\n    fontWeight: fontWeight.medium,\n  },\n  menuPurchaseRow: {\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'space-between',\n    gap: spacing.sm,\n    marginTop: spacing.sm,\n  },\n  menuPrice: {\n    flexShrink: 1,\n    color: colors.espressoBrown,\n    fontSize: typography.heading,\n    fontWeight: fontWeight.extrabold,\n  },\n  addButton: {\n    minHeight: touchTarget.minimum,\n    minWidth: 104,\n    paddingHorizontal: spacing.md,\n    borderRadius: radius.md,\n    alignItems: 'center',\n    justifyContent: 'center',\n    backgroundColor: colors.flameRed,\n  },\n  addButtonText: {\n    color: colors.white,\n    fontSize: typography.body,\n    fontWeight: fontWeight.bold,\n  },\n  quantityControl: {\n    minHeight: touchTarget.minimum,\n    minWidth: 120,\n    borderRadius: radius.md,\n    borderWidth: 1,\n    borderColor: colors.flameRed,\n    flexDirection: 'row',\n    alignItems: 'center',\n    justifyContent: 'space-between',\n    backgroundColor: colors.white,\n    overflow: 'hidden',\n  },\n  quantityButton: {\n    width: touchTarget.minimum,\n    height: touchTarget.minimum,\n    alignItems: 'center',\n    justifyContent: 'center',\n  },\n  quantityButtonText: {\n    color: colors.flameRed,\n    fontSize: typography.heading,\n    fontWeight: fontWeight.bold,\n  },\n  quantityText: {\n    color: colors.espressoBrown,\n    fontSize: typography.body,\n    fontWeight: fontWeight.bold,\n  },\n  emptyMenuCard: {""")

          # Home dish cards: image overlays + price/title + availability + compact purchase row.
