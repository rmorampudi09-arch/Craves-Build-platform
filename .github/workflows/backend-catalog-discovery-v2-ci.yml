name: CRAVES Backend Catalog Discovery v2 CI

on:
  push:
    branches:
      - feature/backend-catalog-discovery-v2-20260911
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/backend-catalog-discovery-v2-ci.yml'
      - 'docs/handover/2026-09-11-backend-catalog-discovery-v2.md'
  pull_request:
    branches:
      - main
    paths:
      - 'services/catalog-service/**'
      - '.github/workflows/backend-catalog-discovery-v2-ci.yml'
      - 'docs/handover/2026-09-11-backend-catalog-discovery-v2.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-catalog-discovery-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Architecture, truth and scale guards
        shell: bash
        run: |
          set -euo pipefail
          service='services/catalog-service/src/main/java/in/craves/catalog/service/NearbyDiscoveryService.java'
          controller='services/catalog-service/src/main/java/in/craves/catalog/web/NearbyDiscoveryController.java'
          cache='services/catalog-service/src/main/java/in/craves/catalog/service/DiscoveryCacheService.java'
          schedule='services/catalog-service/src/main/java/in/craves/catalog/service/KitchenScheduleService.java'
          bulk='services/catalog-service/src/main/java/in/craves/catalog/service/BulkMenuAvailabilityService.java'
          test -s "$service"
          test -s "$controller"
          test -s "$cache"
          test -s "$schedule"
          test -s "$bulk"
          grep -q 'ST_DWithin' "$service"
          grep -q 'plainto_tsquery' "$service"
          grep -q 'minPrice' "$service"
          grep -q 'maxPrice' "$service"
          grep -q 'maxPreparationTimeMinutes' "$service"
          grep -q 'invalidateAllDiscovery' services/catalog-service/src/main/java/in/craves/catalog/web/KitchenController.java
          grep -q 'CRAVES_DISCOVERY_CACHE_ENABLED:false' services/catalog-service/src/main/resources/application.yml
          grep -q 'FOR UPDATE' "$bulk"
          ! grep -R --line-number -E 'rating|sponsored|commission|free.delivery|medical|diabetic|guaranteed' \
              services/catalog-service/src/main/java/in/craves/catalog/service/{DiscoveryCriteria,NearbyDiscoveryService,DiscoveryCacheService}.java
          ! grep -R --line-number -E 'System\.out|printStackTrace|Authorization: Bearer|client[_-]?secret|password\s*=' \
              services/catalog-service/src/main/java/in/craves/catalog/{service,web,config}
      - name: Maven clean verify — Catalog Service
        working-directory: services/catalog-service
        run: mvn -B -ntp clean verify
