name: Backend Customer Reorder Build

on:
  push:
    branches: [backend-customer-reorder-20260816]
    paths: [.github/workflows/backend-customer-reorder-build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend-customer-reorder-20260816
          fetch-depth: 0
      - name: Add atomic reorder contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:220]}')
              p.write_text(text.replace(old, new, 1))

          controller = 'services/order-service/src/main/java/in/craves/order/web/CartController.java'
          replace(controller,
              "    @PostMapping(\"/validate\")\n    public CartResponse validateCart(@AuthenticationPrincipal CravesPrincipal principal) {\n        return orderService.validateCart(principal);\n    }",
              "    @PostMapping(\"/validate\")\n    public CartResponse validateCart(@AuthenticationPrincipal CravesPrincipal principal) {\n        return orderService.validateCart(principal);\n    }\n\n    @PostMapping(\"/reorder/{orderId}\")\n    public CartResponse reorder(\n        @AuthenticationPrincipal CravesPrincipal principal,\n        @PathVariable UUID orderId\n    ) {\n        return orderService.replaceCartFromOrder(principal, orderId);\n    }")

          service = 'services/order-service/src/main/java/in/craves/order/service/OrderService.java'
          replace(service,
              "    @Transactional\n    public CartResponse validateCart(CravesPrincipal principal) {",
              "    @Transactional\n    public CartResponse replaceCartFromOrder(CravesPrincipal principal, UUID orderId) {\n        requireCustomer(principal);\n        if (orderId == null) {\n            throw OrderApiException.badRequest(\"ORDER_ID_REQUIRED\", \"Order id is required to reorder.\");\n        }\n\n        OrderResponse historicalOrder = getOrderForCustomer(principal, orderId);\n        if (historicalOrder.items() == null || historicalOrder.items().isEmpty()) {\n            throw OrderApiException.badRequest(\"ORDER_HAS_NO_ITEMS\", \"This order has no items to reorder.\");\n        }\n\n        // Resolve and validate every historical menu item before touching the existing cart.\n        // Any unavailable item fails the transaction with the current cart unchanged.\n        record ReorderResolvedItem(CatalogMenuItem item, CatalogKitchen kitchen, int quantity) {}\n        List<ReorderResolvedItem> resolved = new ArrayList<>();\n        for (OrderItemResponse historicalItem : historicalOrder.items()) {\n            if (historicalItem.menuItemId() == null || historicalItem.quantity() < 1) {\n                throw OrderApiException.badRequest(\"ORDER_ITEM_INVALID\", \"This historical order cannot be reordered.\");\n            }\n            CatalogMenuItem currentItem = catalogClient.getActiveMenuItem(historicalItem.menuItemId());\n            CatalogKitchen currentKitchen = catalogClient.getKitchen(currentItem.kitchenId());\n            resolved.add(new ReorderResolvedItem(currentItem, currentKitchen, historicalItem.quantity()));\n        }\n\n        UUID cartId = getOrCreateCartId(principal.identityId());\n        jdbcTemplate.update(\"DELETE FROM order_schema.cart_item WHERE cart_id = ?\", cartId);\n        for (ReorderResolvedItem replacement : resolved) {\n            CatalogMenuItem item = replacement.item();\n            jdbcTemplate.update(\n                \"INSERT INTO order_schema.cart_item (id, cart_id, menu_item_id, kitchen_id, item_name_snapshot, kitchen_name_snapshot, unit_price_snapshot, currency_snapshot, quantity, created_at, updated_at) \" +\n                    \"VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, now(), now())\",\n                UUID.randomUUID(),\n                cartId,\n                item.id(),\n                item.kitchenId(),\n                item.itemName(),\n                displayKitchenName(replacement.kitchen()),\n                item.price(),\n                currency(item.currency()),\n                replacement.quantity()\n            );\n        }\n        touchCart(cartId);\n        return mapCart(cartId, principal.identityId());\n    }\n\n    @Transactional\n    public CartResponse validateCart(CravesPrincipal principal) {")

          test = Path('services/order-service/src/test/java/in/craves/order/web/CartControllerReorderContractTest.java')
          test.write_text('''package in.craves.order.web;\n\nimport static org.assertj.core.api.Assertions.assertThat;\n\nimport java.lang.reflect.Method;\nimport java.util.Arrays;\nimport org.junit.jupiter.api.Test;\nimport org.springframework.web.bind.annotation.PostMapping;\n\nclass CartControllerReorderContractTest {\n    @Test\n    void publishesCustomerReorderAsPostUnderCartBoundary() {\n        Method reorder = Arrays.stream(CartController.class.getDeclaredMethods())\n            .filter(method -> method.getName().equals("reorder"))\n            .findFirst()\n            .orElseThrow();\n        PostMapping mapping = reorder.getAnnotation(PostMapping.class);\n        assertThat(mapping).isNotNull();\n        assertThat(mapping.value()).containsExactly("/reorder/{orderId}");\n    }\n}\n''')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify order service
        working-directory: services/order-service
        run: mvn -B clean verify
      - name: Commit backend and remove one-shot workflow
        run: |
          git config user.name 'craves-backend-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/backend-customer-reorder-build.yml
          git add services/order-service
          git commit -m 'Add atomic customer reorder cart replacement'
          git push origin HEAD:backend-customer-reorder-20260816
