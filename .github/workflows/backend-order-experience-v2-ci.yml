name: CRAVES Backend Order Experience v2 CI

on:
  push:
    branches:
      - feature/backend-order-experience-v2-20260911
    paths:
      - 'services/order-service/**'
      - '.github/workflows/backend-order-experience-v2-ci.yml'
      - 'docs/handover/2026-09-11-backend-order-experience-v2.md'
  pull_request:
    branches:
      - main
    paths:
      - 'services/order-service/**'
      - '.github/workflows/backend-order-experience-v2-ci.yml'
      - 'docs/handover/2026-09-11-backend-order-experience-v2.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-order-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Ownership, current-truth and scale guards
        shell: bash
        run: |
          set -euo pipefail
          history='services/order-service/src/main/java/in/craves/order/service/OrderHistoryService.java'
          preflight='services/order-service/src/main/java/in/craves/order/service/CartPreflightService.java'
          catalog='services/order-service/src/main/java/in/craves/order/service/CatalogClient.java'
          test -s "$history"
          test -s "$preflight"
          test -s "$catalog"
          grep -q 'customer_identity_id' "$history"
          grep -q 'chef_identity_id' "$history"
          grep -q 'created_at' "$history"
          grep -q 'LIMIT' "$history"
          grep -q 'resolveActiveMenuItems' "$preflight"
          grep -q 'PRICE_CHANGED' "$preflight"
          grep -q 'DELIVERY_METADATA_MISSING' "$preflight"
          grep -q '/internal/menu-items/resolve' "$catalog"
          grep -q 'X-Craves-Internal-Key' "$catalog"
          test -s services/order-service/src/main/resources/db/migration/V16__order_history_cursor_indexes.sql
          ! grep -R --line-number -E 'System\.out|printStackTrace|Authorization: Bearer|client[_-]?secret|password\s*=' \
              services/order-service/src/main/java/in/craves/order/service/{OrderHistoryService,OrderHistoryCursorCodec,CartPreflightService,CatalogClient}.java \
              services/order-service/src/main/java/in/craves/order/web/{CustomerOrderHistoryController,ChefOrderHistoryController,CartPreflightDtos,CartController}.java
      - name: Maven clean verify — Order Service
        working-directory: services/order-service
        run: mvn -B -ntp clean verify
