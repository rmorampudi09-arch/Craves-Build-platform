name: Backend PDF Documents CI
on:
  push:
    branches: [feature/backend-pdf-documents-20260911]
    paths: ['.github/workflows/backend-pdf-documents-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    name: Resolve offline test dependency (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve Spring-managed XML serialization library
        run: mvn -B -ntp -f services/notification-service/pom.xml dependency:get -Dartifact=com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.17.3
      - name: Package missing dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdf-dependency-addon
          tar -czf /tmp/pdf-dependency-addon/maven-addon.tar.gz -C "$HOME/.m2" repository/com/fasterxml repository/org/codehaus/woodstox repository/com/fasterxml/woodstox
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-dependency-addon
          path: /tmp/pdf-dependency-addon/
          retention-days: 1
          if-no-files-found: error
