name: Craves PDF Documents CI
on:
  push:
    branches: [main, feature/backend-pdf-documents-20260911]
    paths:
      - '.github/workflows/backend-pdf-documents-ci.yml'
      - 'services/**/documents/**'
      - 'services/**/web/*DocumentSourceController.java'
      - 'services/**/web/*DocumentSource*Test.java'
      - 'services/notification-service/pom.xml'
      - 'services/notification-service/modules/pdf-documents/**'
      - 'services/notification-service/src/main/resources/db/migration/V6__private_pdf_documents.sql'
      - 'apps/customer-web-next/src/**/document*'
      - 'apps/customer-web-next/src/app/api/documents/**'
      - 'apps/customer-web-next/src/app/chef/statements/**'
      - 'apps/customer-web-next/src/app/chef/earnings/page.tsx'
      - 'apps/customer-web-next/src/screens/OrderHistory/**'
      - 'scripts/documents/**'
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths: ['services/**', 'apps/customer-web-next/**', 'scripts/documents/**', '.github/workflows/backend-pdf-documents-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-module-ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Java 21 - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [notification-service, order-service, integration-service, subscription-service]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pdf_module_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pdf_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d pdf_module_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOCUMENT_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/pdf_module_test
      DOCUMENT_TEST_DB_USER: postgres
      DOCUMENT_TEST_DB_PASSWORD: pdf_test_only
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Full owning-service tests and package
        run: mvn -B -ntp -f services/${{ matrix.service }}/pom.xml verify
      - name: Verify required PDF tests actually executed
        run: >-
          python3 scripts/documents/verify-test-evidence.py --service ${{ matrix.service }}
          --reports services/${{ matrix.service }}/target/surefire-reports
          --output services/${{ matrix.service }}/target/pdf-test-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-${{ matrix.service }}-evidence
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/document-examples/
            services/${{ matrix.service }}/target/pdf-test-summary.json
          retention-days: 14
          if-no-files-found: warn
  web:
    name: Web lint, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/customer-web-next/package-lock.json
      - run: npm ci
        working-directory: apps/customer-web-next
      - name: Verify customer and chef web
        working-directory: apps/customer-web-next
        env: {NEXT_TELEMETRY_DISABLED: '1'}
        run: npm run verify
      - name: Test APIM routing and privacy plans without Azure access
        run: python3 -m unittest discover -s scripts/documents -p test_configure_apim.py -v
      - name: Preserve verification metadata
        run: |
          mkdir -p /tmp/pdf-web-evidence
          git rev-parse HEAD > /tmp/pdf-web-evidence/source-sha.txt
          test -f apps/customer-web-next/.next/BUILD_ID
          cp apps/customer-web-next/.next/BUILD_ID /tmp/pdf-web-evidence/
          echo 'Full web verification passed for the accompanying source SHA.' > /tmp/pdf-web-evidence/WEB_VERIFY_PASSED.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-web-evidence
          path: /tmp/pdf-web-evidence/
          retention-days: 14
  delivery:
    name: Package tested source, examples and full handover
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'reportlab==4.4.3'
      - uses: actions/download-artifact@v4
        with:
          pattern: pdf-*-evidence
          path: /tmp/pdf-evidence
      - name: Build exact source ZIP and 50-plus-page source handover
        run: python scripts/documents/package-delivery.py --evidence /tmp/pdf-evidence --output /tmp/pdf-delivery
      - uses: actions/upload-artifact@v4
        with:
          name: Craves-PDF-Documents-Delivery
          path: /tmp/pdf-delivery/
          retention-days: 30
          if-no-files-found: error
