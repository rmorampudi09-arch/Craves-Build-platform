name: Backend PDF Documents CI
on:
  push:
    branches: [feature/backend-pdf-documents-20260911]
    paths: ['.github/workflows/backend-pdf-documents-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    name: Prepare JUnit runtime (not PDF module acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run unchanged notification baseline to resolve test runner
        run: mvn -B -ntp -f services/notification-service/pom.xml test
      - name: Package test runner cache without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdf-test-runtime
          tar -czf /tmp/pdf-test-runtime/maven-test-runtime.tar.gz -C "$HOME/.m2" repository/org/apache/maven/surefire repository/org/junit repository/org/opentest4j repository/org/apiguardian
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-test-runtime
          path: /tmp/pdf-test-runtime/
          retention-days: 1
          if-no-files-found: error
