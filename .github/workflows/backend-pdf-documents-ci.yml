name: Backend PDF Documents CI
on:
  push:
    branches: [feature/backend-pdf-documents-20260911]
    paths: ['.github/workflows/backend-pdf-documents-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    name: Prepare offline test tools (not module acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/customer-web-next/package-lock.json
      - name: Install pinned current web dependencies
        working-directory: apps/customer-web-next
        run: npm ci
      - name: Export test-only tooling without credentials or customer records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdf-offline-tools/pg/lib /tmp/pdf-offline-tools/pg/bin
          PG_BIN="$(find /usr/lib/postgresql -path '*/bin/postgres' -type f | sort -V | tail -1 | xargs dirname)"
          test -x "$PG_BIN/postgres"
          cp -a "$PG_BIN" /tmp/pdf-offline-tools/pg/
          PG_VERSION="$(basename "$(dirname "$PG_BIN")")"
          cp -a "/usr/share/postgresql/$PG_VERSION" /tmp/pdf-offline-tools/pg/share
          cp -a "/usr/lib/postgresql/$PG_VERSION/lib" /tmp/pdf-offline-tools/pg/pg-lib
          find /tmp/pdf-offline-tools/pg/bin /tmp/pdf-offline-tools/pg/pg-lib -type f -exec ldd {} \; 2>/dev/null | awk '/=> \/|^\// {for (i=1;i<=NF;i++) if ($i ~ /^\//) print $i}' | sort -u > /tmp/pdf-offline-tools/pg/libs.txt || true
          while IFS= read -r lib; do
            case "$(basename "$lib")" in libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*) continue;; esac
            cp -L "$lib" /tmp/pdf-offline-tools/pg/lib/ || exit 1
          done < /tmp/pdf-offline-tools/pg/libs.txt
          tar -czf /tmp/pdf-offline-tools/postgres-tools.tar.gz -C /tmp/pdf-offline-tools pg
          tar -czf /tmp/pdf-offline-tools/web-node-modules.tar.gz -C apps/customer-web-next node_modules
          rm -rf /tmp/pdf-offline-tools/pg
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-offline-validation-tools
          path: /tmp/pdf-offline-tools/*.tar.gz
          retention-days: 1
          if-no-files-found: error
