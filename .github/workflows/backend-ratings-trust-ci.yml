name: CRAVES Backend Ratings and Trust CI

on:
  push:
    branches:
      - feature/backend-ratings-trust-20260911
    paths:
      - 'services/order-service/**'
      - '.github/workflows/backend-ratings-trust-ci.yml'
      - 'docs/handover/2026-09-11-backend-ratings-trust.md'
  pull_request:
    branches:
      - main
    paths:
      - 'services/order-service/**'
      - '.github/workflows/backend-ratings-trust-ci.yml'
      - 'docs/handover/2026-09-11-backend-ratings-trust.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-order-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Review architecture and migration safety gate
        shell: bash
        run: |
          set -euo pipefail
          migration='services/order-service/src/main/resources/db/migration/V22__order_reviews_and_trust_foundation.sql'
          service='services/order-service/src/main/java/in/craves/order/review/OrderReviewService.java'
          test -s "$migration"
          test -s "$service"
          grep -q 'uk_order_review_customer_order' "$migration"
          grep -q "WHERE status = 'PUBLISHED'" "$migration"
          grep -q 'order_review_revision' "$migration"
          grep -q 'order_review_moderation_audit' "$migration"
          grep -q 'delivery_rating' "$migration"
          grep -q 'FOR UPDATE' "$service"
          grep -q 'expectedVersion' "$service"
          grep -q 'ReviewMediaAuthorizer' "$service"
          ! grep -q 'INSERT INTO order_schema.review_tag_definition' "$migration"
          ! grep -R --line-number -E 'System\.out|printStackTrace|Authorization: Bearer|client[_-]?secret|password\s*=' \
              services/order-service/src/main/java/in/craves/order/review \
              services/order-service/src/main/java/in/craves/order/web/*Review*.java
      - name: Maven clean verify — Order Service
        working-directory: services/order-service
        run: mvn -B -ntp clean verify
