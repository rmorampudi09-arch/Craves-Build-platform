name: CRAVES Backend Scheduled Orders CI

on:
  push:
    branches:
      - feature/backend-scheduled-orders-20260911
    paths:
      - 'services/order-service/**'
      - '.github/workflows/backend-scheduled-orders-ci.yml'
      - 'docs/handover/2026-09-11-backend-scheduled-orders.md'
  pull_request:
    branches:
      - main
    paths:
      - 'services/order-service/**'
      - '.github/workflows/backend-scheduled-orders-ci.yml'
      - 'docs/handover/2026-09-11-backend-scheduled-orders.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-scheduled-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Scheduling architecture and policy-boundary guard
        shell: bash
        run: |
          set -euo pipefail
          migration='services/order-service/src/main/resources/db/migration/V23__scheduled_order_foundation.sql'
          service='services/order-service/src/main/java/in/craves/order/schedule/ScheduledOrderService.java'
          internal='services/order-service/src/main/java/in/craves/order/web/InternalScheduledOrderController.java'
          test -s "$migration"
          test -s "$service"
          test -s "$internal"
          grep -q 'uk_scheduled_order_request_idempotency' "$migration"
          grep -q 'uk_scheduled_order_request_active_checkout' "$migration"
          grep -q 'PAYMENT_BEFORE_CHEF_CONFIRMATION' "$migration"
          grep -q 'PAYMENT_AFTER_ALL_CHEFS_CONFIRM' "$migration"
          grep -q 'FOR UPDATE' "$service"
          grep -q 'requestFingerprint' "$service"
          grep -q 'chef_identity_id' "$service"
          grep -q 'schedule-payment-eligibility' "$internal"
          grep -q 'MessageDigest.isEqual' "$internal"
          ! grep -q 'INSERT INTO order_schema.scheduled_order_policy' "$migration"
          ! grep -R --line-number -E '(defaultLead|defaultHorizon|defaultSlot|refundAmount|cancellationFee|commission|penalty)' \
              services/order-service/src/main/java/in/craves/order/schedule \
              services/order-service/src/main/java/in/craves/order/web/*ScheduledOrder*.java
          ! grep -R --line-number -E 'System\.out|printStackTrace|Authorization: Bearer|client[_-]?secret|password\s*=' \
              services/order-service/src/main/java/in/craves/order/schedule \
              services/order-service/src/main/java/in/craves/order/web/*ScheduledOrder*.java
      - name: Maven clean verify — Order Service
        working-directory: services/order-service
        run: mvn -B -ntp clean verify
