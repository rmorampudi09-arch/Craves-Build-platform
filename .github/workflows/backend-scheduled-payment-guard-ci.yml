name: CRAVES Backend Scheduled Payment Guard CI

on:
  push:
    branches:
      - feature/backend-scheduled-payment-guard-20260911
    paths:
      - 'services/integration-service/**'
      - '.github/workflows/backend-scheduled-payment-guard-ci.yml'
      - 'docs/handover/2026-09-11-backend-scheduled-payment-guard.md'
  pull_request:
    branches:
      - main
    paths:
      - 'services/integration-service/**'
      - '.github/workflows/backend-scheduled-payment-guard-ci.yml'
      - 'docs/handover/2026-09-11-backend-scheduled-payment-guard.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-scheduled-payment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fail-closed and recovery guards
        shell: bash
        run: |
          set -euo pipefail
          properties='services/integration-service/src/main/java/in/craves/integration/config/ScheduledPaymentGuardProperties.java'
          guard='services/integration-service/src/main/java/in/craves/integration/payment/ScheduledPaymentEligibilityGuard.java'
          controller='services/integration-service/src/main/java/in/craves/integration/web/PaymentController.java'
          test -s "$properties"
          test -s "$guard"
          grep -q 'CRAVES_SCHEDULED_PAYMENT_GUARD_ENABLED:false' "$properties"
          grep -q 'payment_schema.payment_order' "$guard"
          grep -q 'validateOwnedCheckout' "$guard"
          grep -q 'schedule-payment-eligibility' "$guard"
          grep -q 'SCHEDULE_NOT_ELIGIBLE' "$guard"
          grep -q 'scheduledPaymentGuard.requireEligibleForNewPayment' "$controller"
          guard_line="$(grep -n 'scheduledPaymentGuard.requireEligibleForNewPayment' "$controller" | cut -d: -f1)"
          payment_line="$(grep -n 'paymentService.createPaymentOrder' "$controller" | cut -d: -f1)"
          test "$guard_line" -lt "$payment_line"
          ! grep -R --line-number -E 'System\.out|printStackTrace|Authorization: Bearer|client[_-]?secret\s*=|password\s*=' \
              services/integration-service/src/main/java/in/craves/integration/{config/ScheduledPaymentGuardProperties.java,payment/ScheduledPaymentEligibilityGuard.java,web/PaymentController.java}
      - name: Maven clean verify — Integration Service
        working-directory: services/integration-service
        run: mvn -B -ntp clean verify
