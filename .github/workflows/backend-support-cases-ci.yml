name: CRAVES Backend Support Cases CI

on:
  push:
    branches:
      - feature/backend-support-cases-convergence-20260911
    paths:
      - 'services/user-chef-service/**'
      - '.github/workflows/backend-support-cases-ci.yml'
      - 'docs/handover/2026-09-11-backend-support-cases-convergence.md'
  pull_request:
    branches:
      - main
    paths:
      - 'services/user-chef-service/**'
      - '.github/workflows/backend-support-cases-ci.yml'
      - 'docs/handover/2026-09-11-backend-support-cases-convergence.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-user-chef-support:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify support-case schema and privacy boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s services/user-chef-service/src/main/resources/db/migration/V7__support_case_domain.sql
          grep -q 'support_case_message' services/user-chef-service/src/main/resources/db/migration/V7__support_case_domain.sql
          grep -q 'internal_note' services/user-chef-service/src/main/resources/db/migration/V7__support_case_domain.sql
          grep -q 'requester_identity_id' services/user-chef-service/src/main/java/in/craves/userchef/service/SupportCaseService.java
          # Internal notes are excluded by the requester SQL projection; the DTO view
          # separately redacts staff identities and status notes, verified by Maven below.
          grep -q 'AND internal_note = false' services/user-chef-service/src/main/java/in/craves/userchef/service/SupportCaseService.java
          test -s services/user-chef-service/src/test/java/in/craves/userchef/web/RequesterSupportViewTest.java
          ! grep -R --line-number -E 'System\.out|printStackTrace|Authorization: Bearer|client[_-]?secret|password\s*=' services/user-chef-service/src/main/java/in/craves/userchef/{service,support,web}/SupportCase* services/user-chef-service/src/main/java/in/craves/userchef/web/{AdminSupportCaseController,RequesterSupportView}.java
      - name: Maven clean verify — User/Chef Service
        working-directory: services/user-chef-service
        run: mvn -B -ntp clean verify
