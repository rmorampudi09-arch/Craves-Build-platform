name: Build exact e0fc4c5 ARM64 APK

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/build-exact-e0fc4c5-arm64.yml

permissions:
  contents: write

jobs:
  build-exact-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact requested commit
        uses: actions/checkout@v4
        with:
          ref: e0fc4c52a2a92a473aacca0bdc55892f10c138e5
          fetch-depth: 1

      - name: Record running build
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/exact-e0fc4c5-build-final.txt';
            const content = `RUNNING\n${context.runId}\ne0fc4c52a2a92a473aacca0bdc55892f10c138e5\ncraves-mobile-e0fc4c5-arm64-apk\n`;
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'mobile-ui-rebuild-from-scratch'});
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'mobile-ui-rebuild-from-scratch',
              message: `chore(mobile): record exact APK run ${context.runId}`,
              content: Buffer.from(content).toString('base64'),
              ...(sha ? {sha} : {}),
            });

      - name: Verify exact source commit
        run: |
          test "$(git rev-parse HEAD)" = "e0fc4c52a2a92a473aacca0bdc55892f10c138e5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Configure production API runtime
        working-directory: apps/mobile
        run: cp .env.example .env

      - name: Build standalone ARM64 release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          CRAVES_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/app/debug.keystore
          CRAVES_ANDROID_KEYSTORE_PASSWORD: android
          CRAVES_ANDROID_KEY_ALIAS: androiddebugkey
          CRAVES_ANDROID_KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify APK and embedded JavaScript bundle
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle$'

      - name: Verify APK signature
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload exact-commit ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-mobile-e0fc4c5-arm64-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Record successful build
        uses: actions/github-script@v7
        with:
          script: |
            const path = '.github/exact-e0fc4c5-build-final.txt';
            const current = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'mobile-ui-rebuild-from-scratch'});
            const content = `SUCCESS\n${context.runId}\ne0fc4c52a2a92a473aacca0bdc55892f10c138e5\ncraves-mobile-e0fc4c5-arm64-apk\n`;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: 'mobile-ui-rebuild-from-scratch',
              message: `chore(mobile): confirm exact APK run ${context.runId}`,
              content: Buffer.from(content).toString('base64'),
              sha: current.data.sha,
            });
