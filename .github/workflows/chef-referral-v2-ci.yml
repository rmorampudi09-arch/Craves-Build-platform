name: Chef referral v2 CI
on:
  push:
    branches: [feat/chef-referral-v2-20260915]
    paths: ['services/referral-service/**', 'scripts/referrals/**', 'docs/referrals/**', 'apps/customer-web-next/src/components/referrals/**', 'apps/customer-web-next/src/lib/referrals/**', 'apps/mobile/src/features/referralsV2/**', '.github/workflows/chef-referral-v2-ci.yml']
  pull_request:
    paths: ['services/referral-service/**', 'scripts/referrals/**', 'docs/referrals/**', 'apps/customer-web-next/src/components/referrals/**', 'apps/customer-web-next/src/lib/referrals/**', 'apps/mobile/src/features/referralsV2/**', '.github/workflows/chef-referral-v2-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chef-referral-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  referral:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: referral_test
          POSTGRES_USER: referral_test
          POSTGRES_PASSWORD: disposable_referral_test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U referral_test -d referral_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REFERRAL_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/referral_test
      REFERRAL_TEST_DB_USER: referral_test
      REFERRAL_TEST_DB_PASSWORD: disposable_referral_test_only
      REFERRAL_TEST_CONFIRM: YES_DISPOSABLE_REFERRAL_TEST_ONLY
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/referral-service/pom.xml
      - name: Enforce add-only scope
        run: python3 scripts/referrals/verify-additive.py
      - name: Compile and verify against disposable PostgreSQL
        run: mvn -B -ntp -f services/referral-service/pom.xml verify
      - name: Require executed non-skipped database tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          reports = list(Path('services/referral-service/target/failsafe-reports').glob('TEST-*.xml'))
          assert reports, 'Missing PostgreSQL integration-test results'
          suites = [E.parse(p).getroot() for p in reports]
          assert sum(int(s.attrib['tests']) for s in suites) >= 3
          assert all(int(s.attrib.get(k, '0')) == 0 for s in suites for k in ['failures', 'errors', 'skipped'])
          print('Executed PostgreSQL integration cases:', sum(int(s.attrib['tests']) for s in suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chef-referral-v2-backend-evidence-${{ github.sha }}
          path: |
            services/referral-service/target/surefire-reports/
            services/referral-service/target/failsafe-reports/
          retention-days: 14
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/customer-web-next
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/customer-web-next/package-lock.json
      - run: npm ci
      - name: Lint existing app plus additive components
        run: npm run lint
      - name: Typecheck without editing the app configuration
        run: npm run typecheck
      - name: Referral contracts, first touch, BFF and rendering tests
        run: npx vitest run --config ../../scripts/referrals/web-vitest.config.mts --reporter=default --reporter=junit --outputFile.junit=../../referral-web-results.xml
      - name: Existing application regression tests
        run: npm test
      - name: Production web compilation (no deployment)
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chef-referral-v2-web-evidence-${{ github.sha }}
          path: referral-web-results.xml
          retention-days: 14
