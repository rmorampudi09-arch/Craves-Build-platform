name: Craves documentation suite

on:
  push:
    branches: [main]
    paths:
      - 'documentation/tools/**'
      - '.github/workflows/craves-documentation-suite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf
      - name: Generate documentation PDFs
        run: python documentation/tools/generate_docs.py
      - name: Validate page counts and confidential footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          root=Path('documentation')
          pdfs=sorted(root.rglob('*.pdf'))
          assert len(pdfs)==25, f'expected 25 PDFs, found {len(pdfs)}'
          rows=[]
          for pdf in pdfs:
              r=PdfReader(str(pdf))
              pages=len(r.pages)
              assert pages>=50, f'{pdf}: only {pages} pages'
              words=0
              for p in r.pages:
                  words += len((p.extract_text() or '').split())
              if '10-confidential-internal' in str(pdf):
                  for i,p in enumerate(r.pages,1):
                      txt=p.extract_text() or ''
                      assert 'Confidential — Internal Use Only.' in txt, f'{pdf} page {i}: missing confidential footer'
              rows.append((str(pdf.relative_to(root)),pages,words))
          lines=['# Documentation Validation','', 'Automated validation executed by `.github/workflows/craves-documentation-suite.yml`.', '', '| PDF | Pages | Extracted words |','|---|---:|---:|']
          lines += [f'| `{p}` | {n} | {w} |' for p,n,w in rows]
          lines += ['', '## Result', '', 'PASS - all 25 PDFs exist, each is at least 50 pages, and every page of the three confidential PDFs contains the required `Confidential — Internal Use Only.` footer.', '']
          (root/'VALIDATION.md').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Commit generated documentation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add documentation
          if git diff --cached --quiet; then
            echo 'No generated documentation changes to commit.'
          else
            git commit -m 'docs: generate complete Craves documentation suite'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi