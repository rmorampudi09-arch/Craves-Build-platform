name: Customer checkout CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/customer-web-next/**'
      - 'infra/apim/customer-checkout/**'
      - 'scripts/apim/configure-customer-checkout-apim.sh'
      - 'azure-pipelines-customer-web-next-checkout-ci.yml'
      - '.github/workflows/customer-checkout-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-checkout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checkout-web:
    name: Customer checkout typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/customer-web-next/package-lock.json
      - name: Install dependencies
        working-directory: apps/customer-web-next
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/customer-web-next
        run: npm run typecheck
      - name: Test
        working-directory: apps/customer-web-next
        run: npm run test
      - name: Build
        working-directory: apps/customer-web-next
        run: npm run build

  checkout-contracts:
    name: Checkout and APIM safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/apim/configure-customer-checkout-apim.sh
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('infra/apim/customer-checkout/customer-checkout-policy.xml')
          print('Customer checkout APIM policy XML is valid.')
          PY
          grep -q 'deliveryAddressId' apps/customer-web-next/src/lib/checkout-contract.ts
          grep -q 'pricingQuoteId' apps/customer-web-next/src/lib/checkout-contract.ts
          grep -q 'parseCheckoutQuote' apps/customer-web-next/src/lib/checkout-contract.ts
          grep -q 'isSameOrigin' apps/customer-web-next/src/app/api/checkout/route.ts
          grep -q 'isSameOrigin' apps/customer-web-next/src/app/api/checkout/quote/route.ts
          grep -q 'quote-customer-checkout' scripts/apim/configure-customer-checkout-apim.sh
          if grep -REn '(platformFee|taxAmount|deliveryFee|grandTotal)[[:space:]]*[-+*/]|[-+*/][[:space:]]*(platformFee|taxAmount|deliveryFee|grandTotal)' apps/customer-web-next/src/components/customer-checkout.tsx; then
            echo 'ERROR: Frontend checkout appears to calculate backend-owned charges.' >&2
            exit 1
          fi
          echo 'Checkout safety contracts passed.'

  package-implementation:
    name: Package tested implementation
    if: github.event_name == 'pull_request'
    needs: [checkout-web, checkout-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Build implementation archive
        id: package
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ARCHIVE="craves-dynamic-delivery-pricing-pr240.zip"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "Packaging feature changes from merge base $MERGE_BASE to $HEAD_SHA"
          git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$HEAD_SHA" | sort > IMPLEMENTATION-MANIFEST.txt
          git diff --binary "$MERGE_BASE" "$HEAD_SHA" > craves-dynamic-delivery-pricing-pr240.patch
          zip -q "$ARCHIVE" IMPLEMENTATION-MANIFEST.txt craves-dynamic-delivery-pricing-pr240.patch
          while IFS= read -r file; do
            if [[ -f "$file" ]]; then
              zip -q "$ARCHIVE" "$file"
            fi
          done < IMPLEMENTATION-MANIFEST.txt
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Packaged $(wc -l < IMPLEMENTATION-MANIFEST.txt) complete feature-changed files."
      - name: Upload implementation archive
        uses: actions/upload-artifact@v4
        with:
          name: craves-dynamic-delivery-pricing-pr240
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
