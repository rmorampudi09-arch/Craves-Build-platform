name: Delivery Intelligence History Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-intelligence-history-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/integration-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Integration Service
        run: mvn -B -ntp test
