name: Delivery Intelligence Runtime Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-intelligence-runtime-repair.yml'

permissions:
  id-token: write
  contents: read

env:
  RG: rg-craves-prodlow-centralindia
  APIM: apim-craves-prodlow-l3ing6
  APIM_API_ID: craves-admin-operational-investigations-v1
  INTEGRATION_APP: ca-craves-integration-service-pr
  DASHBOARD_APP: ca-craves-delivery-intel-prodlow
  AFD_PROFILE: afd-craves-prodlow
  AFD_ROUTE: craves-delivery-intel-route
  AFD_ORIGIN_GROUP: craves-delivery-intel-origin-group
  AFD_ORIGIN: craves-delivery-intel-origin

jobs:
  diagnose:
    name: Diagnose live Delivery Intelligence path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Azure login using existing OIDC binding
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect production runtime without writes
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x

          echo '=== Azure account ==='
          az account show --query '{name:name,id:id}' -o json

          echo '=== Integration Service ==='
          INTEGRATION_JSON="$(az containerapp show -g "$RG" -n "$INTEGRATION_APP" -o json)"
          jq '{latestRevisionName:.properties.latestRevisionName,latestReadyRevisionName:.properties.latestReadyRevisionName,runningStatus:.properties.runningStatus,fqdn:.properties.configuration.ingress.fqdn,image:.properties.template.containers[0].image}' <<<"$INTEGRATION_JSON"
          INTEGRATION_FQDN="$(jq -r '.properties.configuration.ingress.fqdn // empty' <<<"$INTEGRATION_JSON")"

          echo '=== Delivery Intelligence dashboard app ==='
          DASHBOARD_JSON="$(az containerapp show -g "$RG" -n "$DASHBOARD_APP" -o json)"
          jq '{latestRevisionName:.properties.latestRevisionName,latestReadyRevisionName:.properties.latestReadyRevisionName,runningStatus:.properties.runningStatus,fqdn:.properties.configuration.ingress.fqdn,image:.properties.template.containers[0].image,env:[.properties.template.containers[0].env[]? | select(.name=="CRAVES_API_BASE_URL") | {name,value}]}' <<<"$DASHBOARD_JSON"
          DASHBOARD_FQDN="$(jq -r '.properties.configuration.ingress.fqdn // empty' <<<"$DASHBOARD_JSON")"

          echo '=== APIM API ownership and backend ==='
          az apim api show -g "$RG" --service-name "$APIM" --api-id "$APIM_API_ID" --query '{name:name,path:path,serviceUrl:serviceUrl,subscriptionRequired:subscriptionRequired}' -o json || true
          az apim api operation list -g "$RG" --service-name "$APIM" --api-id "$APIM_API_ID" --query '[].{name:name,method:method,urlTemplate:urlTemplate}' -o json || true

          echo '=== APIM Delivery Intelligence operation policy backend target ==='
          SUB="$(az account show --query id -o tsv)"
          API_MGMT="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.ApiManagement/service/${APIM}/apis/${APIM_API_ID}"
          az rest --method get --url "${API_MGMT}/operations/get-admin-delivery-intelligence-overview/policies/policy?api-version=2022-08-01" --query properties.value -o tsv 2>/dev/null | sed -n '1,120p' || true

          echo '=== Front Door route/origin ==='
          az extension add -n cdn --upgrade --yes --only-show-errors >/dev/null
          SUFFIX="$(tr -d '-' <<<"$SUB" | cut -c1-8 | tr '[:upper:]' '[:lower:]')"
          ENDPOINT="craves-prodlow-${SUFFIX}"
          az afd route show -g "$RG" --profile-name "$AFD_PROFILE" --endpoint-name "$ENDPOINT" --route-name "$AFD_ROUTE" --query '{enabledState:enabledState,patternsToMatch:patternsToMatch,originGroup:id,customDomains:customDomains}' -o json || true
          az afd origin show -g "$RG" --profile-name "$AFD_PROFILE" --origin-group-name "$AFD_ORIGIN_GROUP" --origin-name "$AFD_ORIGIN" --query '{enabledState:enabledState,hostName:hostName,originHostHeader:originHostHeader}' -o json || true

          probe() {
            local label="$1" url="$2" expected="$3" body headers status
            body="$(mktemp)"; headers="$(mktemp)"
            status="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            echo "PROBE ${label}: HTTP ${status} expected ${expected}"
            echo 'Headers:'
            grep -Ei '^(HTTP/|content-type:|x-correlation-id:|x-craves-correlation-id:|server:|via:|x-azure-ref:)' "$headers" || true
            echo 'Body:'
            head -c 1200 "$body" || true
            echo
            rm -f "$body" "$headers"
          }

          echo '=== HTTP probes (unauthenticated by design) ==='
          [[ -n "$INTEGRATION_FQDN" ]] && probe 'integration-health' "https://${INTEGRATION_FQDN}/actuator/health" '200'
          [[ -n "$INTEGRATION_FQDN" ]] && probe 'integration-direct-overview' "https://${INTEGRATION_FQDN}/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35" '401'
          probe 'apim-overview' 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35' '401'
          [[ -n "$DASHBOARD_FQDN" ]] && probe 'dashboard-health-direct' "https://${DASHBOARD_FQDN}/delivery-intelligence/api/health" '200'
          [[ -n "$DASHBOARD_FQDN" ]] && probe 'dashboard-bff-direct' "https://${DASHBOARD_FQDN}/delivery-intelligence/api/delivery-intelligence/overview?hours=24&limit=35" '401'
          probe 'dashboard-health-frontdoor' 'https://admin.craves.in/delivery-intelligence/api/health' '200'
          probe 'dashboard-bff-frontdoor' 'https://admin.craves.in/delivery-intelligence/api/delivery-intelligence/overview?hours=24&limit=35' '401'

          echo 'DIAGNOSTIC_COMPLETE'
