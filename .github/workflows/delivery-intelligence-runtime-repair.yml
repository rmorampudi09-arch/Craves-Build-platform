name: Delivery Intelligence Runtime Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delivery-intelligence-runtime-repair.yml'

permissions:
  id-token: write
  contents: read

env:
  RG: rg-craves-prodlow-centralindia
  APIM: apim-craves-prodlow-l3ing6
  APIM_API_ID: craves-admin-operational-investigations-v1
  INTEGRATION_APP: ca-craves-integration-service-pr
  DASHBOARD_APP: ca-craves-delivery-intel-prodlow
  AFD_PROFILE: afd-craves-prodlow
  AFD_ROUTE: craves-delivery-intel-route
  AFD_ORIGIN_GROUP: craves-delivery-intel-origin-group
  AFD_ORIGIN: craves-delivery-intel-origin

jobs:
  diagnose:
    name: Diagnose live Delivery Intelligence path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Probe Delivery Intelligence public and token boundaries
        id: public_probe
        shell: bash
        run: |
          set -Eeuo pipefail
          probe() {
            local label="$1" expected="$2" url="$3"; shift 3
            local body headers status
            body="$(mktemp)"; headers="$(mktemp)"
            status="$(curl -sS --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$@" "$url" || true)"
            echo "PROBE ${label}: HTTP ${status} expected ${expected}"
            grep -Ei '^(HTTP/|content-type:|cache-control:|x-correlation-id:|x-craves-correlation-id:|server:|via:|x-azure-ref:)' "$headers" || true
            echo 'Body:'
            head -c 1600 "$body" || true
            echo
            echo "${label}=${status}" >> "$GITHUB_OUTPUT"
            rm -f "$body" "$headers"
          }

          FAKE='eyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIwMDAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDAiLCJpc3MiOiJjcmF2ZXMtdGVzdCIsImF1ZCI6ImNyYXZlcyIsImV4cCI6NDEwMjQ0NDgwMH0.invalid'

          probe 'apim_overview' '401' 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35'
          probe 'apim_overview_fake_bearer' '401' 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35' -H "Authorization: Bearer ${FAKE}"
          probe 'apim_auth_me_fake_bearer' '401' 'https://api.craves.in/api/v1/auth/me' -H "Authorization: Bearer ${FAKE}"
          probe 'frontdoor_health' '200' 'https://admin.craves.in/delivery-intelligence/api/health'
          probe 'frontdoor_admin_me' '401' 'https://admin.craves.in/delivery-intelligence/api/admin/me'
          probe 'frontdoor_overview' '401' 'https://admin.craves.in/delivery-intelligence/api/delivery-intelligence/overview?hours=24&limit=35'
          probe 'frontdoor_admin_me_fake_cookie' '401' 'https://admin.craves.in/delivery-intelligence/api/admin/me' -H "Cookie: craves_access_token=${FAKE}"
          probe 'frontdoor_overview_fake_cookie' '401' 'https://admin.craves.in/delivery-intelligence/api/delivery-intelligence/overview?hours=24&limit=35' -H "Cookie: craves_access_token=${FAKE}"

      - name: Summarize probe matrix
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Delivery Intelligence live probe matrix'
            echo '| Probe | Actual | Expected |'
            echo '|---|---:|---:|'
            echo '| APIM overview unsigned | ${{ steps.public_probe.outputs.apim_overview }} | 401 |'
            echo '| APIM overview fake bearer | ${{ steps.public_probe.outputs.apim_overview_fake_bearer }} | 401 |'
            echo '| APIM auth/me fake bearer | ${{ steps.public_probe.outputs.apim_auth_me_fake_bearer }} | 401 |'
            echo '| Front Door health | ${{ steps.public_probe.outputs.frontdoor_health }} | 200 |'
            echo '| BFF admin/me unsigned | ${{ steps.public_probe.outputs.frontdoor_admin_me }} | 401 |'
            echo '| BFF overview unsigned | ${{ steps.public_probe.outputs.frontdoor_overview }} | 401 |'
            echo '| BFF admin/me fake cookie | ${{ steps.public_probe.outputs.frontdoor_admin_me_fake_cookie }} | 401 |'
            echo '| BFF overview fake cookie | ${{ steps.public_probe.outputs.frontdoor_overview_fake_cookie }} | 401 |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure login using existing OIDC binding
        id: azure_login
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect production runtime without writes
        if: steps.azure_login.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          az account show --query '{name:name,id:id}' -o json
          INTEGRATION_JSON="$(az containerapp show -g "$RG" -n "$INTEGRATION_APP" -o json)"
          DASHBOARD_JSON="$(az containerapp show -g "$RG" -n "$DASHBOARD_APP" -o json)"
          jq '{latestRevisionName:.properties.latestRevisionName,latestReadyRevisionName:.properties.latestReadyRevisionName,runningStatus:.properties.runningStatus,fqdn:.properties.configuration.ingress.fqdn,image:.properties.template.containers[0].image}' <<<"$INTEGRATION_JSON"
          jq '{latestRevisionName:.properties.latestRevisionName,latestReadyRevisionName:.properties.latestReadyRevisionName,runningStatus:.properties.runningStatus,fqdn:.properties.configuration.ingress.fqdn,image:.properties.template.containers[0].image,env:[.properties.template.containers[0].env[]? | select(.name=="CRAVES_API_BASE_URL") | {name,value}]}' <<<"$DASHBOARD_JSON"
          az apim api show -g "$RG" --service-name "$APIM" --api-id "$APIM_API_ID" --query '{name:name,path:path,serviceUrl:serviceUrl,subscriptionRequired:subscriptionRequired}' -o json || true
