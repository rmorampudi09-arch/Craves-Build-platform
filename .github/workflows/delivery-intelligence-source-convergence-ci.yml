name: CRAVES Delivery Intelligence Source Convergence CI

on:
  push:
    branches:
      - feature/delivery-intelligence-source-convergence-20260910
    paths:
      - 'apps/delivery-intelligence-admin/**'
      - 'services/integration-service/src/main/java/in/craves/integration/admin/deliveryintelligence/**'
      - 'services/integration-service/src/test/java/in/craves/integration/admin/deliveryintelligence/**'
      - 'services/integration-service/src/main/java/in/craves/integration/config/WebSecurityConfiguration.java'
      - 'services/integration-service/src/main/resources/db/migration/V115__razorpay_webhook_delivery_guard.sql'
      - 'services/integration-service/src/main/resources/db/migration/V116__shadowfax_hyperlocal_marketplace_contract.sql'
      - 'services/integration-service/src/main/resources/db/migration/V117__delivery_intelligence_admin_read_indexes.sql'
      - 'services/integration-service/src/main/resources/db/migration/V117__delivery_intelligence_admin_read_indexes.sql.conf'
      - 'scripts/apim/configure-delivery-intelligence-admin-apim.sh'
      - 'scripts/frontdoor/configure-delivery-intelligence-admin-route.sh'
      - 'scripts/release/verify-integration-flyway-history.sh'
      - '.github/workflows/delivery-intelligence-source-convergence-ci.yml'
      - 'docs/handover/2026-09-10-delivery-intelligence-source-convergence.md'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/delivery-intelligence-admin/**'
      - 'services/integration-service/src/main/java/in/craves/integration/admin/deliveryintelligence/**'
      - 'services/integration-service/src/test/java/in/craves/integration/admin/deliveryintelligence/**'
      - 'services/integration-service/src/main/java/in/craves/integration/config/WebSecurityConfiguration.java'
      - 'services/integration-service/src/main/resources/db/migration/V115__razorpay_webhook_delivery_guard.sql'
      - 'services/integration-service/src/main/resources/db/migration/V116__shadowfax_hyperlocal_marketplace_contract.sql'
      - 'services/integration-service/src/main/resources/db/migration/V117__delivery_intelligence_admin_read_indexes.sql'
      - 'services/integration-service/src/main/resources/db/migration/V117__delivery_intelligence_admin_read_indexes.sql.conf'
      - 'scripts/apim/configure-delivery-intelligence-admin-apim.sh'
      - 'scripts/frontdoor/configure-delivery-intelligence-admin-route.sh'
      - 'scripts/release/verify-integration-flyway-history.sh'
      - '.github/workflows/delivery-intelligence-source-convergence-ci.yml'
      - 'docs/handover/2026-09-10-delivery-intelligence-source-convergence.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-intelligence-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify clean convergence scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          changed="$(git diff --name-only refs/remotes/origin/main...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^((apps/delivery-intelligence-admin/.*)|(services/integration-service/src/main/java/in/craves/integration/admin/deliveryintelligence/.*)|(services/integration-service/src/test/java/in/craves/integration/admin/deliveryintelligence/.*)|(services/integration-service/src/main/java/in/craves/integration/config/WebSecurityConfiguration\.java)|(services/integration-service/src/main/resources/db/migration/V115__razorpay_webhook_delivery_guard\.sql)|(services/integration-service/src/main/resources/db/migration/V117__delivery_intelligence_admin_read_indexes\.sql(\.conf)?)|(scripts/apim/configure-delivery-intelligence-admin-apim\.sh)|(scripts/frontdoor/configure-delivery-intelligence-admin-route\.sh)|(scripts/release/verify-integration-flyway-history\.sh)|(\.github/workflows/delivery-intelligence-source-convergence-ci\.yml)|(docs/handover/2026-09-10-delivery-intelligence-source-convergence\.md))$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'ERROR: source convergence includes unrelated files:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Generate deterministic lock candidate when absent
        working-directory: apps/delivery-intelligence-admin
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package-lock.json ]]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -s package-lock.json

      - name: Install locked dashboard dependencies
        working-directory: apps/delivery-intelligence-admin
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint dashboard
        working-directory: apps/delivery-intelligence-admin
        run: npm run lint

      - name: Type-check dashboard
        working-directory: apps/delivery-intelligence-admin
        run: npm run typecheck

      - name: Test dashboard
        working-directory: apps/delivery-intelligence-admin
        run: npm run test

      - name: Build production dashboard
        working-directory: apps/delivery-intelligence-admin
        env:
          CRAVES_API_BASE_URL: https://api.craves.in/api/v1
        run: npm run build

      - name: Verify build did not rewrite tracked source configuration
        working-directory: apps/delivery-intelligence-admin
        shell: bash
        run: git diff --exit-code -- tsconfig.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Integration Flyway history
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/verify-integration-flyway-history.sh
          grep -Fxq 'executeInTransaction=false' services/integration-service/src/main/resources/db/migration/V117__delivery_intelligence_admin_read_indexes.sql.conf
          grep -Fq 'CREATE INDEX CONCURRENTLY' services/integration-service/src/main/resources/db/migration/V117__delivery_intelligence_admin_read_indexes.sql

      - name: Verify Integration Service
        working-directory: services/integration-service
        run: mvn -B -ntp clean verify

      - name: Validate scripts and read-only privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/apim/configure-delivery-intelligence-admin-apim.sh
          bash -n scripts/frontdoor/configure-delivery-intelligence-admin-route.sh

          CONTROLLER='services/integration-service/src/main/java/in/craves/integration/admin/deliveryintelligence/AdminDeliveryIntelligenceController.java'
          SECURITY='services/integration-service/src/main/java/in/craves/integration/config/WebSecurityConfiguration.java'
          REPOSITORY='services/integration-service/src/main/java/in/craves/integration/admin/deliveryintelligence/DeliveryIntelligenceReadRepository.java'

          grep -Fq '@RequestMapping("/api/v1/admin/operations/delivery-intelligence")' "$CONTROLLER"
          grep -Fq '@GetMapping("/overview")' "$CONTROLLER"
          grep -Fq '@GetMapping("/orders/{reference}")' "$CONTROLLER"
          grep -Fq '.requestMatchers("/api/v1/admin/operations/delivery-intelligence/**").hasAnyRole(' "$SECURITY"
          grep -Fq '"ADMIN", "PLATFORM_ADMIN", "SUPPORT_ADMIN", "PAYMENTS_ADMIN", "OPERATIONS_ADMIN", "AUDIT_ADMIN"' "$SECURITY"
          grep -Fq 'INSERT INTO payment_schema.admin_investigation_audit' "$REPOSITORY"

          if grep -REn '@(Post|Put|Patch|Delete)Mapping' services/integration-service/src/main/java/in/craves/integration/admin/deliveryintelligence; then
            echo 'ERROR: Delivery Intelligence API contains a business-state mutation endpoint.' >&2
            exit 1
          fi

          if grep -REn '(raw_payload|webhook_signature|signature_hash|tracking_url|provider_metadata|client_secret|provider_api_key)' apps/delivery-intelligence-admin/src; then
            echo 'ERROR: Dashboard frontend references restricted provider payload, tracking or credential data.' >&2
            exit 1
          fi

          if grep -REn '(localStorage|sessionStorage|console\.(log|debug))' apps/delivery-intelligence-admin/src; then
            echo 'ERROR: Dashboard contains browser persistence or sensitive debug logging.' >&2
            exit 1
          fi

          echo 'Delivery Intelligence source, authorization, privacy and read-only gates passed.'

      - name: Upload generated lock candidate and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: delivery-intelligence-source-evidence
          path: |
            apps/delivery-intelligence-admin/package-lock.json
            apps/delivery-intelligence-admin/.next/BUILD_ID
          if-no-files-found: error
          retention-days: 30

  persist-reviewed-lockfile:
    needs: validate-source
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/delivery-intelligence-source-convergence-20260910'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/delivery-intelligence-source-convergence-20260910
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Persist lockfile only when newly generated
        working-directory: apps/delivery-intelligence-admin
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo 'Reviewed lockfile already exists; no branch write required.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          cd ../..
          git add apps/delivery-intelligence-admin/package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(delivery-intelligence): lock dashboard dependencies'
          git push origin HEAD:feature/delivery-intelligence-source-convergence-20260910
