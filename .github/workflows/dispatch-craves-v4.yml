name: Dispatch CRAVES v4 Android Build

on:
  workflow_dispatch:
  issues:
    types:
      - opened

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'TRIGGER CRAVES V4 ANDROID BUILD'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android build from android-build branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-build.yml',
              ref: 'android-build'
            });
