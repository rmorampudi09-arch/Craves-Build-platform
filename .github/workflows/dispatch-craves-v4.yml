name: Dispatch CRAVES v4 Android Build

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch pending Android build request
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = 153;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            if (issue.state !== 'open' || issue.title !== 'TRIGGER CRAVES V4 ANDROID BUILD') {
              core.notice('No pending CRAVES v4 Android build request.');
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-build.yml',
              ref: 'android-build'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
