name: Finalize Customer Mobile Fix

on:
  push:
    branches:
      - fix/customer-card-navigation-nearby-2026-08-21
    paths:
      - .github/workflows/finalize-customer-mobile-fix.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  LOGO_B64: 

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-card-navigation-nearby-2026-08-21
          fetch-depth: 0
      - name: Apply requested fixes
        run: python3 .github/customer-fix-apply.py
      - name: Install supplied Craves launcher logo
        shell: bash
        run: |
          printf '%s' "$LOGO_B64" | base64 -d > /tmp/craves-logo.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp /tmp/craves-logo.png "apps/mobile/android/app/src/main/res/mipmap-${d}/ic_launcher.png"
            cp /tmp/craves-logo.png "apps/mobile/android/app/src/main/res/mipmap-${d}/ic_launcher_round.png"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: TypeScript
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Lint
        working-directory: apps/mobile
        run: npm run lint
      - name: Mobile tests
        working-directory: apps/mobile
        run: npm test -- --runInBand
      - name: Order service compile
        working-directory: services/order-service
        run: mvn -q -DskipTests compile
      - name: Order service regression test
        working-directory: services/order-service
        run: mvn -q -Dtest=CatalogClientCartSnapshotTest test
      - name: Build debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Commit validated requested changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile services/order-service
          git commit -m "fix(mobile): apply requested customer UI navigation discovery and logo updates"
          git push origin HEAD:fix/customer-card-navigation-nearby-2026-08-21
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-customer-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
