name: Final Craves APK

on:
  push:
    branches:
      - fix/customer-card-navigation-nearby-2026-08-21
    paths:
      - .github/workflows/finalize-customer-mobile-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-craves-apk
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/customer-card-navigation-nearby-2026-08-21
          fetch-depth: 0

      - name: Record final build run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/final-craves-apk-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/final-craves-apk-run.txt
          git commit -m "chore: record final Craves APK run"
          git push origin HEAD:fix/customer-card-navigation-nearby-2026-08-21

      - name: Apply requested source fixes when needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "width: 132" apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx \
            && grep -q "CustomerKitchenMenuCard" apps/mobile/src/features/kitchenProfile/screens/CustomerKitchenProfileScreen.tsx \
            && grep -q "CustomerKitchenMenuCard" apps/mobile/src/features/kitchenProfile/screens/CustomerKitchenDishesScreen.tsx \
            && grep -q "getKitchenForVerifiedActiveMenuItem" services/order-service/src/main/java/in/craves/order/service/OrderService.java; then
            echo "Requested source fixes already committed; keeping them unchanged."
          else
            python3 .github/customer-fix-apply.py
          fi

      - name: Install supplied Craves launcher logo
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/craves-logo.b64 > /tmp/craves-logo.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp /tmp/craves-logo.png "apps/mobile/android/app/src/main/res/mipmap-${d}/ic_launcher.png"
            cp /tmp/craves-logo.png "apps/mobile/android/app/src/main/res/mipmap-${d}/ic_launcher_round.png"
          done
          test "$(stat -c%s /tmp/craves-logo.png)" -gt 10000

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: TypeScript validation
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Mobile lint
        working-directory: apps/mobile
        run: npm run lint

      - name: Mobile test suite
        working-directory: apps/mobile
        run: npm test -- --runInBand

      - name: Order service compile
        working-directory: services/order-service
        run: mvn -q -DskipTests compile

      - name: Order service regression test
        working-directory: services/order-service
        run: mvn -q -Dtest=CatalogClientCartSnapshotTest test

      - name: Build Android debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage final APK
        shell: bash
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/Craves-QA-2026-08-21.apk
          sha256sum dist/Craves-QA-2026-08-21.apk > dist/Craves-QA-2026-08-21.apk.sha256

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Craves-QA-APK-2026-08-21
          path: |
            dist/Craves-QA-2026-08-21.apk
            dist/Craves-QA-2026-08-21.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated source and launcher changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile services/order-service
          git commit -m "fix(mobile): finalize requested UI fixes and Craves launcher" || true
          git pull --rebase origin fix/customer-card-navigation-nearby-2026-08-21
          git push origin HEAD:fix/customer-card-navigation-nearby-2026-08-21
