name: Fix Craves Android Launcher - No APK

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/fix-craves-android-launcher-no-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Craves launcher resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          SIZE = 1024
          RED = (246, 46, 24, 255)
          WHITE = (255, 255, 255, 255)
          FONT_PATH = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          DENSITIES = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }

          def draw_craves_icon(round_icon: bool = False):
              image = Image.new('RGBA', (SIZE, SIZE), (0, 0, 0, 0) if round_icon else RED)
              draw = ImageDraw.Draw(image)
              if round_icon:
                  draw.ellipse((0, 0, SIZE - 1, SIZE - 1), fill=RED)

              font = ImageFont.truetype(FONT_PATH, 160)
              word = 'Craves'
              bbox = draw.textbbox((0, 0), word, font=font)
              word_width = bbox[2] - bbox[0]
              dot_diameter = 76
              gap = 18
              total_width = word_width + gap + dot_diameter
              x = (SIZE - total_width) / 2
              y = 405
              draw.text((x, y), word, font=font, fill=WHITE)

              dot_x = x + word_width + gap
              dot_y = y + 104
              draw.ellipse(
                  (dot_x, dot_y, dot_x + dot_diameter, dot_y + dot_diameter),
                  fill=WHITE,
              )

              cx = SIZE / 2
              bowl_width = 112
              bowl_height = 45
              bowl_y = 640
              draw.rounded_rectangle(
                  (cx - bowl_width / 2, bowl_y, cx + bowl_width / 2, bowl_y + 14),
                  radius=7,
                  fill=WHITE,
              )
              draw.polygon(
                  [
                      (cx - bowl_width / 2 + 8, bowl_y + 14),
                      (cx + bowl_width / 2 - 8, bowl_y + 14),
                      (cx + bowl_width / 2 - 25, bowl_y + bowl_height),
                      (cx - bowl_width / 2 + 25, bowl_y + bowl_height),
                  ],
                  fill=WHITE,
              )
              draw.rounded_rectangle(
                  (cx - 28, bowl_y + bowl_height, cx + 28, bowl_y + bowl_height + 10),
                  radius=5,
                  fill=WHITE,
              )
              for dx in (-28, 0, 28):
                  draw.line(
                      [
                          (cx + dx, bowl_y - 15),
                          (cx + dx - 8, bowl_y - 30),
                          (cx + dx + 5, bowl_y - 46),
                          (cx + dx, bowl_y - 62),
                      ],
                      fill=WHITE,
                      width=10,
                      joint='curve',
                  )
              return image

          square = draw_craves_icon(False)
          round_image = draw_craves_icon(True)

          source = Path('apps/mobile/assets/brand/craves-app-icon-1024.png')
          source.parent.mkdir(parents=True, exist_ok=True)
          square.save(source, format='PNG', optimize=True)

          res = Path('apps/mobile/android/app/src/main/res')
          for density, px in DENSITIES.items():
              target = res / f'mipmap-{density}'
              target.mkdir(parents=True, exist_ok=True)
              square.resize((px, px), Image.Resampling.LANCZOS).save(
                  target / 'craves_launcher.png', format='PNG', optimize=True
              )
              round_image.resize((px, px), Image.Resampling.LANCZOS).save(
                  target / 'craves_launcher_round.png', format='PNG', optimize=True
              )

          manifest_path = Path('apps/mobile/android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          manifest = manifest.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/craves_launcher"')
          manifest = manifest.replace('android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@mipmap/craves_launcher_round"')
          manifest_path.write_text(manifest)
          PY

      - name: Validate generated launcher assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          base = Path('apps/mobile/android/app/src/main/res')
          for density, px in expected.items():
              for name in ('craves_launcher.png', 'craves_launcher_round.png'):
                  path = base / f'mipmap-{density}' / name
                  if not path.exists():
                      raise SystemExit(f'Missing launcher asset: {path}')
                  with Image.open(path) as image:
                      if image.format != 'PNG':
                          raise SystemExit(f'{path} is not PNG')
                      if image.size != (px, px):
                          raise SystemExit(f'{path} has wrong size {image.size}, expected {(px, px)}')

          master = Path('apps/mobile/assets/brand/craves-app-icon-1024.png')
          with Image.open(master) as image:
              if image.size != (1024, 1024):
                  raise SystemExit(f'Master app icon has wrong size {image.size}')
              if image.convert('RGBA').getpixel((0, 0))[:3] != (246, 46, 24):
                  raise SystemExit('Master icon is not full-bleed Craves Flame Red')

          manifest = Path('apps/mobile/android/app/src/main/AndroidManifest.xml').read_text()
          if 'android:icon="@mipmap/craves_launcher"' not in manifest:
              raise SystemExit('Manifest is not using the Craves launcher icon')
          if 'android:roundIcon="@mipmap/craves_launcher_round"' not in manifest:
              raise SystemExit('Manifest is not using the Craves round launcher icon')
          print('Craves launcher resources validated.')
          PY
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Android release resources only
        working-directory: apps/mobile/android
        run: ./gradlew :app:processReleaseResources -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Commit validated launcher change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-craves-android-launcher-no-apk.yml
          git add \
            apps/mobile/assets/brand/craves-app-icon-1024.png \
            apps/mobile/android/app/src/main/AndroidManifest.xml \
            apps/mobile/android/app/src/main/res/mipmap-mdpi/craves_launcher.png \
            apps/mobile/android/app/src/main/res/mipmap-mdpi/craves_launcher_round.png \
            apps/mobile/android/app/src/main/res/mipmap-hdpi/craves_launcher.png \
            apps/mobile/android/app/src/main/res/mipmap-hdpi/craves_launcher_round.png \
            apps/mobile/android/app/src/main/res/mipmap-xhdpi/craves_launcher.png \
            apps/mobile/android/app/src/main/res/mipmap-xhdpi/craves_launcher_round.png \
            apps/mobile/android/app/src/main/res/mipmap-xxhdpi/craves_launcher.png \
            apps/mobile/android/app/src/main/res/mipmap-xxhdpi/craves_launcher_round.png \
            apps/mobile/android/app/src/main/res/mipmap-xxxhdpi/craves_launcher.png \
            apps/mobile/android/app/src/main/res/mipmap-xxxhdpi/craves_launcher_round.png
          git commit -m "fix(mobile): replace default Android launcher icon with Craves branding"
          git pull --rebase origin mobile-ui-rebuild-from-scratch
          git push origin HEAD:mobile-ui-rebuild-from-scratch
