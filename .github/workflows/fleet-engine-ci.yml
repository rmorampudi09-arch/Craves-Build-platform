name: Craves Fleet Engine

# Checks and builds services/fleet-engine (Java 21, Spring Boot; docs/riders/SCALE.md) and the travel-time model it ranks
# with (ml/fleet-eta; docs/riders/DISPATCH.md §2):
# - every engine test, including the wire contract it shares with integration-service
#   (contracts/proto/craves/fleet/v1/testdata) and the model's golden predictions. The tests start their own Redis servers:
#   one node, and a three-node cluster.
# - one pass of the benchmarks;
# - the two Java copies of the model's evaluator are identical;
# - the model's Python tests;
# - the container image.
# It deploys nothing.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/fleet-engine/**'
      - 'ml/fleet-eta/**'
      - 'services/integration-service/src/main/java/in/craves/integration/fleet/eta/**'
      - 'contracts/proto/craves/fleet/**'
      - 'scripts/release/verify-platform-copies.py'
      - '.github/workflows/fleet-engine-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'services/fleet-engine/**'
      - 'ml/fleet-eta/**'
      - 'services/integration-service/src/main/java/in/craves/integration/fleet/eta/**'
      - 'contracts/proto/craves/fleet/**'
      - 'scripts/release/verify-platform-copies.py'
      - '.github/workflows/fleet-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-engine-${{ github.ref }}
  # Pull requests only: every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/fleet-engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/fleet-engine/pom.xml

      - name: Install redis-server for the tests
        run: sudo apt-get update -q && sudo apt-get install -y -q redis-server

      - name: Test
        run: mvn -B -ntp verify

      - name: Benchmarks, one pass
        run: mvn -B -ntp test -Dfleet.bench=true -Dtest=EngineBenchmarkTest

      - name: The model's two Java copies are identical
        working-directory: .
        run: python3 scripts/release/verify-platform-copies.py

      - name: Build the image
        run: docker build -t "fleet-engine:${GITHUB_SHA}" .

  travel-time-model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml/fleet-eta

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ml/fleet-eta/requirements.txt

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Test
        run: python -m unittest discover -s tests -v
