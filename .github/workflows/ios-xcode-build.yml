name: CRAVES iOS Xcode Build

on:
  workflow_dispatch:
    inputs:
      build_signed_ipa:
        description: 'Build a signed IPA for iPhone/TestFlight after the simulator build passes'
        required: true
        default: false
        type: boolean
      export_method:
        description: 'Apple export method for the signed IPA'
        required: true
        default: development
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'api/apim-api/contracts/mobile-*.json'
      - '.github/workflows/ios-xcode-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-xcode-build-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBILE_DIR: apps/mobile
  IOS_DIR: apps/mobile/ios
  SCHEME: CravesMobile
  BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER || 'com.craves.mobile' }}

jobs:
  source-gates:
    name: Source gates
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci

      - name: TypeScript strict check
        working-directory: ${{ env.MOBILE_DIR }}
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run lint -- --max-warnings=0

      - name: Inject Firebase iOS plist
        shell: bash
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64}" ]]; then
            echo "IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is required." >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["IOS_DIR"], "GoogleService-Info.plist").write_bytes(
              base64.b64decode(os.environ["IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"])
          )
          PY

      - name: iOS release readiness guard
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run check:ios-release

      - name: APIM mobile contract coverage
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run check:p119

      - name: Observability audit
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run check:p120

      - name: Integration tests
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run test:integration

      - name: E2E model tests
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm run test:e2e

      - name: Full Jest suite
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm test -- --runInBand --silent

  simulator-xcode-build:
    name: Xcode simulator build
    runs-on: macos-26
    needs: source-gates
    timeout-minutes: 60

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked JavaScript dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci

      - name: Inject Firebase iOS plist
        shell: bash
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64}" ]]; then
            echo "IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is required." >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["IOS_DIR"], "GoogleService-Info.plist").write_bytes(
              base64.b64decode(os.environ["IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"])
          )
          PY
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "${IOS_DIR}/GoogleService-Info.plist"

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          bundle install
          cd ios
          if [[ -f Podfile.lock ]] && grep -q 'CravesMobileReleasePlaceholder' Podfile.lock; then
            echo "Removing placeholder Podfile.lock before CocoaPods resolves real iOS dependencies."
            rm Podfile.lock
          fi
          bundle exec pod install

      - name: Build unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(
            xcrun simctl list devices available --json |
              python3 -c 'import json, sys; data = json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")), ""))'
          )"
          if [[ -n "${simulator_udid}" ]]; then
            destination="platform=iOS Simulator,id=${simulator_udid}"
            echo "SIMULATOR_UDID=${simulator_udid}" >> "$GITHUB_ENV"
          else
            destination="generic/platform=iOS Simulator"
          fi
          echo "Using simulator destination: ${destination}"
          xcodebuild \
            -workspace "${IOS_DIR}/${SCHEME}.xcworkspace" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "${destination}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build
          app_path="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -type d -path "*Debug-iphonesimulator/*.app" | head -1)"
          if [[ -z "${app_path}" ]]; then
            echo "Simulator .app artifact was not produced." >&2
            exit 1
          fi
          echo "SIMULATOR_APP_PATH=${app_path}" >> "$GITHUB_ENV"
          ditto -c -k --keepParent "${app_path}" "$RUNNER_TEMP/CravesMobile-simulator-app.zip"

      - name: Install and launch simulator smoke
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SIMULATOR_UDID:-}" || -z "${SIMULATOR_APP_PATH:-}" ]]; then
            echo "An available iPhone simulator and built .app are required for launch smoke." >&2
            exit 1
          fi

          collect_evidence() {
            xcrun simctl io "${SIMULATOR_UDID}" screenshot "$RUNNER_TEMP/CravesMobile-simulator-final.png" || true
            xcrun simctl spawn "${SIMULATOR_UDID}" log show \
              --last 5m \
              --style compact \
              --predicate 'process == "CravesMobile"' \
              > "$RUNNER_TEMP/CravesMobile-simulator.log" || true
          }
          trap collect_evidence EXIT

          xcrun simctl boot "${SIMULATOR_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b

          (
            cd "${MOBILE_DIR}"
            nohup npm start -- --host 127.0.0.1 > "$RUNNER_TEMP/metro.log" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/metro.pid"
          )
          metro_ready=false
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"; then
              metro_ready=true
              break
            fi
            sleep 2
          done
          if [[ "${metro_ready}" != "true" ]]; then
            echo "Metro did not become ready for the Debug simulator app." >&2
            tail -200 "$RUNNER_TEMP/metro.log" || true
            exit 1
          fi

          curl -fsS \
            --max-time 240 \
            "http://127.0.0.1:8081/index.bundle?platform=ios&dev=true&minify=false&modulesOnly=false&runModule=true" \
            -o "$RUNNER_TEMP/CravesMobile-index.bundle"
          if [[ "$(wc -c < "$RUNNER_TEMP/CravesMobile-index.bundle")" -lt 100000 ]]; then
            echo "Metro produced an unexpectedly small iOS bundle." >&2
            exit 1
          fi

          built_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${SIMULATOR_APP_PATH}/Info.plist")"
          if [[ "${built_bundle_id}" != "${BUNDLE_IDENTIFIER}" ]]; then
            echo "Built bundle id ${built_bundle_id} does not match ${BUNDLE_IDENTIFIER}." >&2
            exit 1
          fi

          # Prove the app reaches its safe auth shell even when location is denied.
          xcrun simctl privacy "${SIMULATOR_UDID}" revoke location "${built_bundle_id}" || true
          xcrun simctl install "${SIMULATOR_UDID}" "${SIMULATOR_APP_PATH}"
          launch_output="$(xcrun simctl launch --terminate-running-process "${SIMULATOR_UDID}" "${built_bundle_id}")"
          echo "${launch_output}"
          app_pid="${launch_output##*: }"
          if [[ ! "${app_pid}" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine the launched CravesMobile process id." >&2
            exit 1
          fi

          sleep 20
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            echo "CravesMobile exited during initial simulator launch smoke." >&2
            exit 1
          fi

          collect_evidence
          if grep -Eiq 'com\.facebook\.react\.log:javascript.*\[(TypeError|ReferenceError|SyntaxError|Invariant Violation|Error:)' "$RUNNER_TEMP/CravesMobile-simulator.log"; then
            echo "CravesMobile emitted a fatal JavaScript runtime error during launch." >&2
            grep -Ei 'com\.facebook\.react\.log:javascript' "$RUNNER_TEMP/CravesMobile-simulator.log" | tail -50 >&2 || true
            exit 1
          fi
          xcrun simctl io "${SIMULATOR_UDID}" screenshot "$RUNNER_TEMP/CravesMobile-simulator-launched.png"
          cat > "$RUNNER_TEMP/verify-auth-shell.swift" <<'SWIFT'
          import AppKit
          import Darwin
          import Foundation
          import Vision

          guard CommandLine.arguments.count == 4 else {
            exit(2)
          }
          let screenshotPath = CommandLine.arguments[1]
          let expectedPrimary = CommandLine.arguments[2].lowercased()
          let expectedSecondary = CommandLine.arguments[3].lowercased()
          guard let image = NSImage(contentsOfFile: screenshotPath) else {
            fputs("Unable to read Simulator screenshot.\n", stderr)
            exit(2)
          }
          var proposedRect = NSRect(origin: .zero, size: image.size)
          guard let cgImage = image.cgImage(
            forProposedRect: &proposedRect,
            context: nil,
            hints: nil
          ) else {
            fputs("Unable to decode Simulator screenshot.\n", stderr)
            exit(2)
          }

          let request = VNRecognizeTextRequest()
          request.recognitionLevel = .accurate
          request.usesLanguageCorrection = true
          try VNImageRequestHandler(cgImage: cgImage).perform([request])
          let recognizedText = (request.results ?? [])
            .compactMap { $0.topCandidates(1).first?.string }
            .joined(separator: "\n")
          print(recognizedText)
          let normalizedText = recognizedText
            .lowercased()
            .split(whereSeparator: { $0.isWhitespace })
            .joined(separator: " ")

          guard normalizedText.contains(expectedPrimary),
                normalizedText.contains(expectedSecondary) else {
            fputs("Expected Craves screen text was not visible.\n", stderr)
            exit(1)
          }
          SWIFT
          swift "$RUNNER_TEMP/verify-auth-shell.swift" \
            "$RUNNER_TEMP/CravesMobile-simulator-launched.png" \
            "how would you like to use craves" \
            "continue as customer"

          location_launch_output="$(xcrun simctl launch --terminate-running-process \
            "${SIMULATOR_UDID}" \
            "${built_bundle_id}" \
            -CRAVES_E2E_LOCATION_DENIED YES)"
          echo "${location_launch_output}"
          app_pid="${location_launch_output##*: }"
          if [[ ! "${app_pid}" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine the denied-location CravesMobile process id." >&2
            exit 1
          fi
          sleep 20
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            echo "CravesMobile exited during denied-location fallback smoke." >&2
            exit 1
          fi
          collect_evidence
          if grep -Eiq 'com\.facebook\.react\.log:javascript.*\[(TypeError|ReferenceError|SyntaxError|Invariant Violation|Error:)' "$RUNNER_TEMP/CravesMobile-simulator.log"; then
            echo "CravesMobile emitted a fatal JavaScript runtime error during denied-location fallback smoke." >&2
            exit 1
          fi
          xcrun simctl io "${SIMULATOR_UDID}" screenshot "$RUNNER_TEMP/CravesMobile-simulator-location-denied.png"
          swift "$RUNNER_TEMP/verify-auth-shell.swift" \
            "$RUNNER_TEMP/CravesMobile-simulator-location-denied.png" \
            "allow location access to fill and map this delivery address" \
            "recipient name"

          payment_launch_output="$(xcrun simctl launch --terminate-running-process \
            "${SIMULATOR_UDID}" \
            "${built_bundle_id}" \
            -CRAVES_E2E_PAYMENT_UNAVAILABLE YES)"
          echo "${payment_launch_output}"
          app_pid="${payment_launch_output##*: }"
          if [[ ! "${app_pid}" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine the payment-safe-failure CravesMobile process id." >&2
            exit 1
          fi
          sleep 20
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            echo "CravesMobile exited during payment-safe-failure smoke." >&2
            exit 1
          fi
          collect_evidence
          if grep -Eiq 'com\.facebook\.react\.log:javascript.*\[(TypeError|ReferenceError|SyntaxError|Invariant Violation|Error:)' "$RUNNER_TEMP/CravesMobile-simulator.log"; then
            echo "CravesMobile emitted a fatal JavaScript runtime error during payment-safe-failure smoke." >&2
            exit 1
          fi
          if grep -Eiq 'rzp_live_|key_id[=:]' "$RUNNER_TEMP/CravesMobile-simulator.log"; then
            echo "Payment-safe-failure smoke exposed a live-key pattern." >&2
            exit 1
          fi
          xcrun simctl io "${SIMULATOR_UDID}" screenshot "$RUNNER_TEMP/CravesMobile-simulator-payment-unavailable.png"
          swift "$RUNNER_TEMP/verify-auth-shell.swift" \
            "$RUNNER_TEMP/CravesMobile-simulator-payment-unavailable.png" \
            "payment could not start" \
            "secure payment checkout is not available"

          customer_shell_launch_output="$(xcrun simctl launch --terminate-running-process \
            "${SIMULATOR_UDID}" \
            "${built_bundle_id}" \
            -CRAVES_E2E_CUSTOMER_SHELL YES)"
          echo "${customer_shell_launch_output}"
          app_pid="${customer_shell_launch_output##*: }"
          if [[ ! "${app_pid}" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine the customer-shell CravesMobile process id." >&2
            exit 1
          fi
          sleep 20
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            echo "CravesMobile exited during customer-shell smoke." >&2
            exit 1
          fi
          collect_evidence
          if grep -Eiq 'com\.facebook\.react\.log:javascript.*\[(TypeError|ReferenceError|SyntaxError|Invariant Violation|Error:)' "$RUNNER_TEMP/CravesMobile-simulator.log"; then
            echo "CravesMobile emitted a fatal JavaScript runtime error during customer-shell smoke." >&2
            exit 1
          fi
          xcrun simctl io "${SIMULATOR_UDID}" screenshot "$RUNNER_TEMP/CravesMobile-simulator-customer-shell.png"
          swift "$RUNNER_TEMP/verify-auth-shell.swift" \
            "$RUNNER_TEMP/CravesMobile-simulator-customer-shell.png" \
            "choose where to deliver" \
            "select a saved address"

          chef_shell_launch_output="$(xcrun simctl launch --terminate-running-process \
            "${SIMULATOR_UDID}" \
            "${built_bundle_id}" \
            -CRAVES_E2E_CHEF_SHELL YES)"
          echo "${chef_shell_launch_output}"
          app_pid="${chef_shell_launch_output##*: }"
          if [[ ! "${app_pid}" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine the chef-shell CravesMobile process id." >&2
            exit 1
          fi
          sleep 20
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            echo "CravesMobile exited during chef-shell smoke." >&2
            exit 1
          fi
          collect_evidence
          if grep -Eiq 'com\.facebook\.react\.log:javascript.*\[(TypeError|ReferenceError|SyntaxError|Invariant Violation|Error:)' "$RUNNER_TEMP/CravesMobile-simulator.log"; then
            echo "CravesMobile emitted a fatal JavaScript runtime error during chef-shell smoke." >&2
            exit 1
          fi
          if grep -Eiq 'rzp_live_|key_id[=:]' "$RUNNER_TEMP/CravesMobile-simulator.log"; then
            echo "Shell smoke exposed a live-key pattern." >&2
            exit 1
          fi
          xcrun simctl io "${SIMULATOR_UDID}" screenshot "$RUNNER_TEMP/CravesMobile-simulator-chef-shell.png"
          swift "$RUNNER_TEMP/verify-auth-shell.swift" \
            "$RUNNER_TEMP/CravesMobile-simulator-chef-shell.png" \
            "dashboard" \
            "orders overview"

          xcrun simctl openurl "${SIMULATOR_UDID}" "craves://"
          sleep 5
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            echo "CravesMobile exited after custom URL registration smoke." >&2
            exit 1
          fi
          xcrun simctl io "${SIMULATOR_UDID}" screenshot "$RUNNER_TEMP/CravesMobile-simulator-deeplink-registration.png"
          echo "Simulator install, launch, runtime-error scan, and custom URL registration smoke passed."

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CravesMobile-simulator-app
          path: ${{ runner.temp }}/CravesMobile-simulator-app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CravesMobile-simulator-smoke
          path: |
            ${{ runner.temp }}/CravesMobile-simulator-*.png
            ${{ runner.temp }}/CravesMobile-simulator.log
            ${{ runner.temp }}/metro.log
          if-no-files-found: warn
          retention-days: 14

  signed-ipa:
    name: Signed iPhone IPA
    runs-on: macos-26
    needs: simulator-xcode-build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_ipa }}
    timeout-minutes: 60

    steps:
      - name: Guard branch-only signing attempt
        shell: bash
        run: |
          set -euo pipefail
          candidate_ref="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${candidate_ref}" == "main" || "${candidate_ref}" == "production" ]]; then
            echo "Signed IPA evidence must never run from main or production." >&2
            exit 1
          fi
          if grep -Eiq '^[[:space:]]*(xcrun[[:space:]]+(altool|notarytool)|fastlane[[:space:]]+(pilot|deliver))' .github/workflows/ios-xcode-build.yml; then
            echo "Distribution tooling is forbidden in the branch-only signed IPA evidence lane." >&2
            exit 1
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked JavaScript dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: npm ci

      - name: Inject Firebase iOS plist
        shell: bash
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64}" ]]; then
            echo "IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret is required." >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["IOS_DIR"], "GoogleService-Info.plist").write_bytes(
              base64.b64decode(os.environ["IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64"])
          )
          PY

      - name: Install CocoaPods dependencies
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          bundle install
          cd ios
          if [[ -f Podfile.lock ]] && grep -q 'CravesMobileReleasePlaceholder' Podfile.lock; then
            echo "Removing placeholder Podfile.lock before CocoaPods resolves real iOS dependencies."
            rm Podfile.lock
          fi
          bundle exec pod install

      - name: Install Apple signing material
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for required in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID KEYCHAIN_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "${required} secret is required for signed IPA builds." >&2
              exit 1
            fi
          done

          signing_dir="$RUNNER_TEMP/signing"
          mkdir -p "${signing_dir}"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          signing_dir = Path(os.environ["RUNNER_TEMP"], "signing")
          signing_dir.mkdir(parents=True, exist_ok=True)
          (signing_dir / "ios_distribution.p12").write_bytes(
              base64.b64decode(os.environ["IOS_CERTIFICATE_P12_BASE64"])
          )
          (signing_dir / "profile.mobileprovision").write_bytes(
              base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE_BASE64"])
          )
          PY

          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security import "${signing_dir}/ios_distribution.p12" \
            -k build.keychain \
            -P "${IOS_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            build.keychain
          security default-keychain -s build.keychain
          security list-keychain -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "${signing_dir}/profile.mobileprovision" > "${signing_dir}/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${signing_dir}/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${signing_dir}/profile.plist")"
          profile_team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "${signing_dir}/profile.plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "${signing_dir}/profile.plist")"
          if [[ "${profile_team_id}" != "${IOS_TEAM_ID}" ]]; then
            echo "Provisioning profile team does not match IOS_TEAM_ID." >&2
            exit 1
          fi
          if [[ "${application_identifier}" != "${IOS_TEAM_ID}.${BUNDLE_IDENTIFIER}" ]]; then
            echo "Provisioning profile application identifier does not match the expected bundle identifier." >&2
            exit 1
          fi
          cp "${signing_dir}/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
          {
            echo "PROFILE_NAME=${profile_name}"
            echo "PROFILE_UUID=${profile_uuid}"
          } >> "$GITHUB_ENV"

      - name: Archive signed app
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "${IOS_DIR}/${SCHEME}.xcworkspace" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/${SCHEME}.xcarchive" \
            DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_IDENTIFIER}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_NAME}" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export IPA
        shell: bash
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "${export_options}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_IDENTIFIER}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/${SCHEME}.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "${export_options}"

      - name: Verify signed IPA and generate evidence
        shell: bash
        run: |
          set -euo pipefail
          ipa_path="$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -type f -name '*.ipa' | head -1)"
          if [[ -z "${ipa_path}" ]]; then
            echo "Development-signed IPA was not produced." >&2
            exit 1
          fi
          verify_dir="$RUNNER_TEMP/ipa-verify"
          mkdir -p "${verify_dir}"
          unzip -q "${ipa_path}" -d "${verify_dir}"
          app_path="$(find "${verify_dir}/Payload" -maxdepth 1 -type d -name '*.app' | head -1)"
          if [[ -z "${app_path}" ]]; then
            echo "IPA does not contain a Payload app." >&2
            exit 1
          fi
          built_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")"
          if [[ "${built_bundle_id}" != "${BUNDLE_IDENTIFIER}" ]]; then
            echo "Signed IPA bundle id ${built_bundle_id} does not match ${BUNDLE_IDENTIFIER}." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          shasum -a 256 "${ipa_path}" > "$RUNNER_TEMP/ipa/SHA256SUMS.txt"
          dsym_path="$RUNNER_TEMP/${SCHEME}.xcarchive/dSYMs"
          if [[ -d "${dsym_path}" ]]; then
            ditto -c -k --keepParent "${dsym_path}" "$RUNNER_TEMP/ipa/${SCHEME}-dSYMs.zip"
          fi
          echo "Development-signed IPA verified; no distribution step is present."

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CravesMobile-${{ inputs.export_method || 'development' }}-ipa
          path: |
            ${{ runner.temp }}/ipa/*.ipa
            ${{ runner.temp }}/ipa/SHA256SUMS.txt
            ${{ runner.temp }}/ipa/*-dSYMs.zip
          if-no-files-found: error
          retention-days: 14
