name: Materialize approved landing reference assets

on:
  push:
    branches:
      - fix/customer-web-reference-assets-local
    paths:
      - .github/workflows/materialize-approved-landing-reference-assets.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: fix/customer-web-reference-assets-local
          fetch-depth: 0

      - name: Download exact approved reference PNGs and verify hashes
        shell: bash
        run: |
          set -euo pipefail

          TARGET='apps/customer-web-next/public/landing/reference'
          mkdir -p "$TARGET"

          fetch_and_verify() {
            local name="$1"
            local url="$2"
            local expected="$3"
            local path="$TARGET/$name"

            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 --retry-all-errors \
              --output "$path" "$url"

            local actual
            actual=$(sha256sum "$path" | awk '{print $1}')
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: $name SHA-256 mismatch. Expected $expected, got $actual" >&2
              exit 1
            fi

            local signature
            signature=$(head -c 8 "$path" | od -An -tx1 | tr -d ' \n')
            if [[ "$signature" != '89504e470d0a1a0a' ]]; then
              echo "ERROR: $name is not the approved PNG payload." >&2
              exit 1
            fi

            echo "Verified $name: $actual"
          }

          fetch_and_verify \
            'hero-reference.png' \
            'https://at.adobe.com/sCJTp0U56VIdktuf' \
            '51d8f9f7e8fa852fcf0db35f1b52a6b8303e0ea869fb890855cb35156fa68655'

          fetch_and_verify \
            'how-craves-works-reference.png' \
            'https://at.adobe.com/DsGV8UngvcQ0I481' \
            '3e149fda7da24782a129bacdad7d652aae07358e90fd15182ccdf9730aff4796'

          fetch_and_verify \
            'why-craves-reference.png' \
            'https://at.adobe.com/ki9XZY31rq8p8f4v' \
            '94592a5ac7a5ed5d4466e8ab6104bae0a062f6fb870eafb786ee36692d56f400'

          fetch_and_verify \
            'home-chefs-app-reference.png' \
            'https://at.adobe.com/prYGO5Muu6mmivrI' \
            'b3331ae6d53b85ba5face0383b82e25420527e208fcedee36c04a12eb19aa9bd'

      - name: Commit exact approved PNGs to the hotfix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/customer-web-next/public/landing/reference/*.png
          if git diff --cached --quiet; then
            echo 'Approved reference PNGs are already committed.'
            exit 0
          fi
          git commit -m 'fix(landing): vendor exact approved reference PNGs'
          git push origin HEAD:fix/customer-web-reference-assets-local
