name: CRAVES Mobile APK Build

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-apk-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Configure production API runtime
        working-directory: apps/mobile
        run: cp .env.example .env

      # A React Native debug variant expects Metro and does not package the JS bundle.
      # For device testing we intentionally build the release variant so the JavaScript
      # bundle/assets are embedded, while signing it with the repository's debug test key.
      # This remains a TESTING APK; production release signing is still external/secret-backed.
      - name: Build standalone Android testing APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          CRAVES_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/app/debug.keystore
          CRAVES_ANDROID_KEYSTORE_PASSWORD: android
          CRAVES_ANDROID_KEY_ALIAS: androiddebugkey
          CRAVES_ANDROID_KEY_PASSWORD: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify standalone APK and embedded JavaScript bundle
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index\.android\.bundle$'

      - name: Verify APK signature
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-mobile-standalone-testing-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
