name: CRAVES Mobile ARM64 Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-arm64-test-apk.yml

permissions:
  contents: read

concurrency:
  group: mobile-arm64-test-apk
  cancel-in-progress: true

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Configure production APIM runtime
        working-directory: apps/mobile
        run: |
          cat > .env <<'EOF'
          CRAVES_ENVIRONMENT=production
          CRAVES_API_BASE_URL=https://api.craves.in
          EOF

      - name: Validate Firebase Android config
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          test -s android/app/google-services.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'android/app/google-services.json';
          const json = JSON.parse(fs.readFileSync(path, 'utf8'));
          const clients = Array.isArray(json.client) ? json.client : [];
          const client = clients.find(
            item => item?.client_info?.android_client_info?.package_name === 'com.cravesapp',
          );
          if (!client) {
            throw new Error('google-services.json does not contain com.cravesapp');
          }
          if (!client?.client_info?.mobilesdk_app_id) {
            throw new Error('Firebase Android app id is missing');
          }
          if (!Array.isArray(client.api_key) || !client.api_key[0]?.current_key) {
            throw new Error('Firebase Android API key is missing');
          }
          console.log('Firebase Android config validated for com.cravesapp.');
          NODE

      - name: Build installable ARM64 bundled APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          CRAVES_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/mobile/android/app/debug.keystore
          CRAVES_ANDROID_KEYSTORE_PASSWORD: android
          CRAVES_ANDROID_KEY_ALIAS: androiddebugkey
          CRAVES_ANDROID_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify standalone APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          mkdir -p build/arm64-test
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"

          unzip -l "$apk" > build/arm64-test/apk-contents.txt

          # A standalone release-style RN APK must contain the JS bundle.
          grep -q 'assets/index.android.bundle' build/arm64-test/apk-contents.txt

          # ARM64 only.
          grep -q 'lib/arm64-v8a/' build/arm64-test/apk-contents.txt
          if grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/' build/arm64-test/apk-contents.txt; then
            echo 'APK contains non-arm64 native libraries.' >&2
            exit 1
          fi

          # Verify APK signing.
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk" | tee build/arm64-test/signature-verification.txt

          cp "$apk" build/arm64-test/craves-mobile-arm64-standalone.apk

          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'abi=arm64-v8a\n'
            printf 'build_type=release-style-internal-test\n'
            printf 'javascript_bundle=embedded\n'
            printf 'firebase_config=repository-google-services-json\n'
            printf 'api_base_url=https://api.craves.in\n'
            printf 'signing=existing-debug-key-for-internal-installation\n'
          } > build/arm64-test/build-metadata.txt

      - name: Upload ARM64 standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-mobile-arm64-standalone-apk
          path: |
            apps/mobile/build/arm64-test/craves-mobile-arm64-standalone.apk
            apps/mobile/build/arm64-test/build-metadata.txt
            apps/mobile/build/arm64-test/signature-verification.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup runtime file
        if: always()
        working-directory: apps/mobile
        run: rm -f .env
