name: CRAVES Mobile ARM64 Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-arm64-test-apk.yml

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Configure production APIM runtime
        working-directory: apps/mobile
        run: |
          cat > .env <<'EOF'
          CRAVES_ENVIRONMENT=production
          CRAVES_API_BASE_URL=https://api.craves.in
          EOF

      - name: Configure Firebase Android app
        working-directory: apps/mobile
        env:
          CRAVES_MOBILE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.CRAVES_MOBILE_GOOGLE_SERVICES_JSON_B64 }}
          MOBILE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          CRAVES_MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.CRAVES_MOBILE_GOOGLE_SERVICES_JSON }}
          MOBILE_GOOGLE_SERVICES_JSON: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          mkdir -p build/arm64-test
          mode=placeholder

          b64="${CRAVES_MOBILE_GOOGLE_SERVICES_JSON_B64:-}"
          [ -n "$b64" ] || b64="${MOBILE_GOOGLE_SERVICES_JSON_B64:-}"
          [ -n "$b64" ] || b64="${GOOGLE_SERVICES_JSON_B64:-}"

          raw="${CRAVES_MOBILE_GOOGLE_SERVICES_JSON:-}"
          [ -n "$raw" ] || raw="${MOBILE_GOOGLE_SERVICES_JSON:-}"
          [ -n "$raw" ] || raw="${GOOGLE_SERVICES_JSON:-}"

          if [ -n "$b64" ]; then
            printf '%s' "$b64" | base64 --decode > android/app/google-services.json
            mode=repository-secret-base64
          elif [ -n "$raw" ]; then
            printf '%s' "$raw" > android/app/google-services.json
            mode=repository-secret-json
          else
            cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "201887934076",
              "project_id": "cravesapp-dev",
              "storage_bucket": "cravesapp-dev.invalid"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:201887934076:android:0000000000000000",
                "android_client_info": {"package_name": "com.cravesapp"}
              },
              "api_key": [{"current_key": "arm64-test-placeholder-not-a-runtime-key"}]
            }],
            "configuration_version": "1"
          }
          JSON
          fi

          printf 'firebase_config=%s\n' "$mode" | tee build/arm64-test/build-metadata.txt

      - name: Build ARM64 debug APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify APK architecture and package
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"

          unzip -l "$apk" > build/arm64-test/apk-contents.txt
          grep -q 'lib/arm64-v8a/' build/arm64-test/apk-contents.txt

          if grep -Eq 'lib/(x86|x86_64|armeabi-v7a)/' build/arm64-test/apk-contents.txt; then
            echo 'APK contains non-arm64 native libraries.' >&2
            exit 1
          fi

          cp "$apk" build/arm64-test/craves-mobile-arm64-debug.apk
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'abi=arm64-v8a\n'
            printf 'api_base_url=https://api.craves.in\n'
          } >> build/arm64-test/build-metadata.txt

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-mobile-arm64-test-apk
          path: |
            apps/mobile/build/arm64-test/craves-mobile-arm64-debug.apk
            apps/mobile/build/arm64-test/build-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup runtime files
        if: always()
        working-directory: apps/mobile
        run: rm -f .env android/app/google-services.json
