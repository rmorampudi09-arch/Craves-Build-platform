name: CRAVES Mobile Chef Image Edit Repair Fix

on:
  push:
    branches: [mobile-ui-rebuild-from-scratch]
    paths: [.github/workflows/mobile-chef-image-edit-repair-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0
      - name: Apply corrected existing patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/mobile-chef-image-edit-repair.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          embedded = textwrap.dedent(workflow[start:end])
          exec(compile(embedded, 'embedded-chef-image-patch', 'exec'))

          source = Path('apps/mobile/src/features/chefMenu/screens/ChefEditMenuItemScreen.tsx')
          text = source.read_text()
          text = text.replace('name="camera"', 'name="chef"', 1)
          text = text.replace('name="close"', 'name="trash"', 1)
          source.write_text(text)
          PY
      - name: Verify TypeScript and lint
        working-directory: apps/mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
      - name: Commit source and remove repair workflows
        run: |
          git config user.name 'craves-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-chef-image-edit-repair.yml
          git rm .github/workflows/mobile-chef-image-edit-repair-fix.yml
          git add apps/mobile/src/features/chefMenu/screens/ChefEditMenuItemScreen.tsx
          git commit -m 'Complete Chef menu primary image replacement'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
