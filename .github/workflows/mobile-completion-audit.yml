name: CRAVES Mobile Completion Audit

on:
  push:
    branches: [mobile-ui-rebuild-from-scratch]
    paths: [.github/workflows/mobile-completion-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0
      - name: Audit stale and disabled mobile actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/mobile/src')
          files = sorted([*root.rglob('*.ts'), *root.rglob('*.tsx')])
          groups = {
              'STALE_COPY': re.compile(r'unavailable right now|not available yet|not available right now|not implemented|placeholder|\bTODO\b', re.I),
              'REORDER': re.compile(r'reorder|order again', re.I),
              'NOTIFICATIONS': re.compile(r'onPressNotifications|notification.*unavailable|\bbell\b', re.I),
              'SUPPORT': re.compile(r'support|help center|contact us', re.I),
              'DISABLED': re.compile(r'disabled=|accessibilityState=.*disabled', re.I),
          }
          for label, pattern in groups.items():
              print(f'=== {label} ===')
              count = 0
              for path in files:
                  try:
                      lines = path.read_text().splitlines()
                  except UnicodeDecodeError:
                      continue
                  for number, line in enumerate(lines, 1):
                      if pattern.search(line):
                          print(f'{path}:{number}:{line.strip()}')
                          count += 1
                          if label == 'DISABLED' and count >= 250:
                              break
                  if label == 'DISABLED' and count >= 250:
                      break
              print(f'COUNT={count}')

          print('=== ICON_CONTAINERS_USING_WHITE ===')
          style_name = re.compile(r'^\s*([A-Za-z0-9_]*(?:icon|Icon|badge|Badge|headerButton|Action)[A-Za-z0-9_]*)\s*:\s*\{')
          white = re.compile(r'backgroundColor:\s*colors\.white')
          count = 0
          for path in files:
              lines = path.read_text().splitlines()
              for i, line in enumerate(lines):
                  match = style_name.search(line)
                  if not match:
                      continue
                  block = '\n'.join(lines[i:i+18])
                  if white.search(block):
                      print(f'{path}:{i+1}:{match.group(1)}')
                      count += 1
          print(f'COUNT={count}')
          PY
      - name: Remove audit workflow
        run: |
          git config user.name 'craves-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-completion-audit.yml
          git commit -m 'Remove temporary mobile completion audit'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
