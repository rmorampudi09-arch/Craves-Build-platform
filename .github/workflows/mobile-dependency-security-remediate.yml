name: CRAVES Mobile Dependency Security Remediation

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-dependency-security-remediate.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Pin patched nanoid across the mobile dependency graph
        working-directory: apps/mobile
        run: |
          npm pkg set overrides.nanoid=3.3.17
          npm install --ignore-scripts

      - name: Prove clean reproducible install
        working-directory: apps/mobile
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts

      - name: Verify nanoid high advisory is gone
        working-directory: apps/mobile
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > /tmp/audit.txt 2>&1
          audit_exit=$?
          set -e
          cat /tmp/audit.txt
          if grep -q 'GHSA-2v37-7h3g-55p8' /tmp/audit.txt; then
            echo 'nanoid high-severity advisory remains after remediation.' >&2
            exit 1
          fi
          if ! grep -q 'GHSA-w3rx-r6r6-pgpr' /tmp/audit.txt || ! grep -q 'GHSA-5p2g-fcmc-qvqq' /tmp/audit.txt; then
            echo 'Expected external image-size advisory set changed; stop for review.' >&2
            exit 1
          fi
          echo "Residual audit exit: ${audit_exit}; only the explicitly classified upstream image-size blocker may remain high."

      - name: Guard scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^apps/mobile/(package\.json|package-lock\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed during dependency remediation:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit patched dependency graph
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package.json apps/mobile/package-lock.json
          git commit -m 'Patch mobile nanoid security advisory'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
