name: CRAVES Mobile Favorites P1A CI

on:
  push:
    branches:
      - 'feature/favorites-p1a-mobile-reliability-*'
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-favorites-p1a-ci.yml'
  pull_request:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-favorites-p1a-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-favorites-p1a:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: TypeScript regression gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            mobile-ui-rebuild-from-scratch:refs/remotes/origin/mobile-ui-rebuild-from-scratch

          candidate_root="$GITHUB_WORKSPACE/apps/mobile"
          base_root="/tmp/craves-mobile-base"
          rm -rf "$base_root"
          git worktree add --detach "$base_root" origin/mobile-ui-rebuild-from-scratch
          ln -s "$candidate_root/node_modules" "$base_root/apps/mobile/node_modules"

          set +e
          (
            cd "$base_root/apps/mobile"
            npx tsc --noEmit --pretty false
          ) > /tmp/base-tsc.log 2>&1
          base_status=$?

          (
            cd "$candidate_root"
            npx tsc --noEmit --pretty false
          ) > /tmp/candidate-tsc.log 2>&1
          candidate_status=$?
          set -e

          echo '--- mobile integration baseline TypeScript diagnostics ---'
          cat /tmp/base-tsc.log || true
          echo '--- P1A candidate TypeScript diagnostics ---'
          cat /tmp/candidate-tsc.log || true

          grep -E '^src/.*error TS[0-9]+:' /tmp/base-tsc.log | sort -u > /tmp/base-tsc-errors.txt || true
          grep -E '^src/.*error TS[0-9]+:' /tmp/candidate-tsc.log | sort -u > /tmp/candidate-tsc-errors.txt || true
          comm -13 /tmp/base-tsc-errors.txt /tmp/candidate-tsc-errors.txt > /tmp/new-tsc-errors.txt

          if [[ -s /tmp/new-tsc-errors.txt ]]; then
            echo 'ERROR: P1A introduces new TypeScript diagnostics:' >&2
            cat /tmp/new-tsc-errors.txt >&2
            exit 1
          fi

          if [[ "$base_status" -ne 0 ]]; then
            echo 'NOTICE: The mobile integration base already contains TypeScript debt; P1A introduced no additional TypeScript diagnostics.'
          elif [[ "$candidate_status" -ne 0 ]]; then
            echo 'ERROR: Candidate TypeScript check failed even though the base is clean.' >&2
            exit 1
          else
            echo 'TypeScript strict check passed with a clean base and candidate.'
          fi

          git worktree remove --force "$base_root"

      - name: ESLint
        working-directory: apps/mobile
        run: npm run lint -- --max-warnings=0

      - name: Favorites unit and contract tests
        working-directory: apps/mobile
        run: |
          npm test -- --runInBand --runTestsByPath \
            src/features/favorites/customerFavoritesActiveCart.test.ts \
            src/features/favorites/customerFavoritesContract.test.ts \
            src/features/favorites/offline/customerFavoritesOfflineQueue.test.ts \
            src/features/favorites/query/customerFavoritesOptimisticState.test.ts

      - name: Production Android JavaScript bundle
        working-directory: apps/mobile
        run: |
          rm -rf build/favorites-p1a-bundle
          mkdir -p build/favorites-p1a-bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/favorites-p1a-bundle/index.android.bundle \
            --assets-dest build/favorites-p1a-bundle/assets
          test -s build/favorites-p1a-bundle/index.android.bundle

      - name: Enforce mobile-only P1A scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            mobile-ui-rebuild-from-scratch:refs/remotes/origin/mobile-ui-rebuild-from-scratch
          changed="$(git diff --name-only origin/mobile-ui-rebuild-from-scratch...HEAD)"
          printf '%s\n' "$changed"

          disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(apps/mobile/|\.github/workflows/mobile-favorites-p1a-ci\.yml$)' || true)"
          if [[ -n "$disallowed" ]]; then
            echo 'ERROR: P1A must remain mobile-only. Disallowed paths:' >&2
            printf '%s\n' "$disallowed" >&2
            exit 1
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(services/|infra/|openapi/|apps/api/)'; then
            echo 'ERROR: Backend/APIM/infrastructure changes are not allowed in P1A.' >&2
            exit 1
          fi

          echo 'P1A mobile-only scope guard passed.'
