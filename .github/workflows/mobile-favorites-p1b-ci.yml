name: CRAVES Mobile Favorites P1B CI

on:
  push:
    branches:
      - 'feature/favorites-p1b-mobile-saved-feed-*'
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-favorites-p1b-ci.yml'
  pull_request:
    branches:
      - feature/favorites-p1a-mobile-reliability-20260821
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-favorites-p1b-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-favorites-p1b:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: TypeScript regression gate against P1A
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            feature/favorites-p1a-mobile-reliability-20260821:refs/remotes/origin/feature/favorites-p1a-mobile-reliability-20260821

          candidate_root="$GITHUB_WORKSPACE/apps/mobile"
          base_root="/tmp/craves-mobile-p1a-base"
          rm -rf "$base_root"
          git worktree add --detach "$base_root" origin/feature/favorites-p1a-mobile-reliability-20260821
          ln -s "$candidate_root/node_modules" "$base_root/apps/mobile/node_modules"

          set +e
          (cd "$base_root/apps/mobile" && npx tsc --noEmit --pretty false) > /tmp/base-tsc.log 2>&1
          base_status=$?
          (cd "$candidate_root" && npx tsc --noEmit --pretty false) > /tmp/candidate-tsc.log 2>&1
          candidate_status=$?
          set -e

          echo '--- P1A baseline TypeScript diagnostics ---'
          cat /tmp/base-tsc.log || true
          echo '--- P1B candidate TypeScript diagnostics ---'
          cat /tmp/candidate-tsc.log || true

          grep -E '^src/.*error TS[0-9]+:' /tmp/base-tsc.log | sort -u > /tmp/base-tsc-errors.txt || true
          grep -E '^src/.*error TS[0-9]+:' /tmp/candidate-tsc.log | sort -u > /tmp/candidate-tsc-errors.txt || true
          comm -13 /tmp/base-tsc-errors.txt /tmp/candidate-tsc-errors.txt > /tmp/new-tsc-errors.txt

          if [[ -s /tmp/new-tsc-errors.txt ]]; then
            echo 'ERROR: P1B introduces new TypeScript diagnostics:' >&2
            cat /tmp/new-tsc-errors.txt >&2
            exit 1
          fi

          if [[ "$base_status" -eq 0 && "$candidate_status" -ne 0 ]]; then
            echo 'ERROR: P1B candidate TypeScript check failed against a clean P1A base.' >&2
            exit 1
          fi

          echo 'P1B TypeScript regression gate passed.'
          git worktree remove --force "$base_root"

      - name: ESLint
        working-directory: apps/mobile
        run: npm run lint -- --max-warnings=0

      - name: Favorites P1A + P1B tests
        working-directory: apps/mobile
        run: |
          npm test -- --runInBand --runTestsByPath \
            src/features/favorites/customerFavoritesActiveCart.test.ts \
            src/features/favorites/customerFavoritesContract.test.ts \
            src/features/favorites/offline/customerFavoritesOfflineQueue.test.ts \
            src/features/favorites/query/customerFavoritesOptimisticState.test.ts \
            src/features/favorites/api/savedCatalogApi.test.ts \
            src/features/favorites/presentation/savedCatalogPresentation.test.ts

      - name: Production Android JavaScript bundle
        working-directory: apps/mobile
        run: |
          rm -rf build/favorites-p1b-bundle
          mkdir -p build/favorites-p1b-bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/favorites-p1b-bundle/index.android.bundle \
            --assets-dest build/favorites-p1b-bundle/assets
          test -s build/favorites-p1b-bundle/index.android.bundle

      - name: Enforce mobile-only P1B scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            feature/favorites-p1a-mobile-reliability-20260821:refs/remotes/origin/feature/favorites-p1a-mobile-reliability-20260821
          changed="$(git diff --name-only origin/feature/favorites-p1a-mobile-reliability-20260821...HEAD)"
          printf '%s\n' "$changed"

          disallowed="$(printf '%s\n' "$changed" | grep -Ev '^(apps/mobile/|\.github/workflows/mobile-favorites-p1b-ci\.yml$)' || true)"
          if [[ -n "$disallowed" ]]; then
            echo 'ERROR: P1B mobile slice contains disallowed paths:' >&2
            printf '%s\n' "$disallowed" >&2
            exit 1
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(services/|infra/|openapi/|apps/api/)'; then
            echo 'ERROR: Backend/APIM/infrastructure changes are not allowed in the P1B mobile slice.' >&2
            exit 1
          fi

          echo 'P1B mobile-only scope guard passed.'

      - name: Package P1B mobile source changes
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/Craves_Favorites_2_0_P1B_Mobile_Source_Package"
          rm -rf "$package_root"
          mkdir -p "$package_root"

          git diff --name-only origin/feature/favorites-p1a-mobile-reliability-20260821...HEAD \
            | while IFS= read -r path; do
                [[ -n "$path" && -f "$path" ]] || continue
                mkdir -p "$package_root/$(dirname "$path")"
                cp "$path" "$package_root/$path"
              done

          cat > "$package_root/SOURCE_PACKAGE_README.txt" <<'EOF'
          CRAVES Favorites 2.0 P1B Mobile Enriched Saved
          Base: feature/favorites-p1a-mobile-reliability-20260821
          Source only. Backend Catalog P1B and live APIM/runtime certification remain separate release gates.
          EOF

          (cd "$RUNNER_TEMP" && zip -qr Craves_Favorites_2_0_P1B_Mobile_Source_Package.zip Craves_Favorites_2_0_P1B_Mobile_Source_Package)
          test -s "$RUNNER_TEMP/Craves_Favorites_2_0_P1B_Mobile_Source_Package.zip"

      - name: Upload P1B mobile source package
        uses: actions/upload-artifact@v4
        with:
          name: Craves_Favorites_2_0_P1B_Mobile_Source_Package
          path: ${{ runner.temp }}/Craves_Favorites_2_0_P1B_Mobile_Source_Package.zip
          if-no-files-found: error
          retention-days: 30
