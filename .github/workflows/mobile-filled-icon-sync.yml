name: CRAVES Mobile Filled Icon Sync

on:
  push:
    branches: [mobile-ui-rebuild-from-scratch]
    paths: [.github/workflows/mobile-filled-icon-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0
      - name: Convert shared app icons to filled glyphs with icon surface
        run: |
          cat > apps/mobile/src/shared/components/Icon.tsx <<'EOF'
          import React from 'react';
          import {StyleSheet, View} from 'react-native';
          import MaterialDesignIcons from '@react-native-vector-icons/material-design-icons';
          import {colors, iconSize} from '../../design/tokens';

          export type IconName =
            | 'account'
            | 'chef'
            | 'home'
            | 'orders'
            | 'analytics'
            | 'cart'
            | 'search'
            | 'wifi-off'
            | 'star'
            | 'ticket'
            | 'phone'
            | 'mail'
            | 'lock'
            | 'eye'
            | 'eye-off'
            | 'chevron-right'
            | 'chevron'
            | 'shield'
            | 'arrow-left'
            | 'check'
            | 'location'
            | 'bell'
            | 'heart'
            | 'clock'
            | 'trash'
            | 'delivery';

          interface Props {
            name: IconName;
            size?: number;
            color?: string;
            /** Bottom/menu bars opt out; normal app icons use the requested #F1F5F9 surface. */
            surface?: boolean;
          }

          const GLYPHS: Record<IconName, string> = {
            account: 'account',
            chef: 'chef-hat',
            home: 'home',
            orders: 'clipboard-text',
            analytics: 'chart-bar',
            cart: 'cart',
            search: 'magnify',
            'wifi-off': 'wifi-off',
            star: 'star',
            ticket: 'ticket-confirmation',
            phone: 'phone',
            mail: 'email',
            lock: 'lock',
            eye: 'eye',
            'eye-off': 'eye-off',
            'chevron-right': 'chevron-right',
            chevron: 'chevron-right',
            shield: 'shield-check',
            'arrow-left': 'arrow-left',
            check: 'check',
            location: 'map-marker',
            bell: 'bell',
            heart: 'heart',
            clock: 'clock',
            trash: 'trash-can',
            delivery: 'truck-delivery',
          };

          export function Icon({
            name,
            size = iconSize.md,
            color = colors.espressoBrown,
            surface = true,
          }: Props) {
            const glyphSize = surface ? Math.max(14, Math.round(size * 0.74)) : size;
            if (!surface) {
              return (
                <MaterialDesignIcons
                  accessibilityElementsHidden
                  color={color}
                  name={GLYPHS[name] as never}
                  size={glyphSize}
                />
              );
            }
            return (
              <View
                accessibilityElementsHidden
                style={[
                  styles.surface,
                  {width: size, height: size, borderRadius: Math.max(6, size / 2)},
                ]}>
                <MaterialDesignIcons
                  color={color}
                  name={GLYPHS[name] as never}
                  size={glyphSize}
                />
              </View>
            );
          }

          const styles = StyleSheet.create({
            surface: {
              alignItems: 'center',
              justifyContent: 'center',
              backgroundColor: colors.iconSurface,
            },
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          for path in [
              'apps/mobile/src/app/navigation/CustomerRootNavigator.tsx',
              'apps/mobile/src/app/navigation/ChefRootNavigator.tsx',
          ]:
              p = Path(path)
              text = p.read_text()
              # Tab/menu bar icons are explicitly excluded from the icon-background rule.
              text = text.replace(' color={color} size={size} />', ' color={color} size={size} surface={false} />')
              p.write_text(text)
          PY
      - name: Validate shared icon migration
        working-directory: apps/mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'craves-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-filled-icon-sync.yml
          git add apps/mobile/src/shared/components/Icon.tsx apps/mobile/src/app/navigation/CustomerRootNavigator.tsx apps/mobile/src/app/navigation/ChefRootNavigator.tsx
          git commit -m 'Apply filled icon and icon-surface rule'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
