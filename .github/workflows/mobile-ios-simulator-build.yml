name: Mobile iOS Simulator Build

# Proves the app builds for iOS without an Apple account: a Release build for the iOS Simulator,
# JS bundle included, no code signing. A real-iPhone / TestFlight build needs signing secrets (later step).
on:
  workflow_dispatch:
  push:
    branches:
      - feat/chef-audit-look
    paths:
      - apps/mobile/**
      - .github/workflows/mobile-ios-simulator-build.yml

permissions:
  contents: read

concurrency:
  group: mobile-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up Ruby and CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Configure production API endpoint
        run: |
          set -euo pipefail
          cp .env.example .env
          grep -qx 'CRAVES_API_BASE_URL=https://api.craves.in' .env

      - name: Install pods
        working-directory: apps/mobile/ios
        env:
          RCT_NEW_ARCH_ENABLED: '1'
          NO_FLIPPER: '1'
        run: bundle exec pod install --repo-update

      - name: Build for the iOS Simulator (Release, unsigned)
        working-directory: apps/mobile/ios
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          xcodebuild \
            -workspace CravesMobile.xcworkspace \
            -scheme CravesMobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log | grep -E 'error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)|\*\* ' || true
          grep -q 'BUILD SUCCEEDED' xcodebuild.log

      - name: Show build errors
        if: failure()
        working-directory: apps/mobile/ios
        run: |
          grep -n -B2 -A6 'error:' xcodebuild.log | head -200 || true
          tail -80 xcodebuild.log || true

      - name: Check the app bundle has the JS bundle
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphonesimulator/CravesMobile.app
          test -d "$APP"
          test -s "$APP/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: Zip the simulator app
        working-directory: apps/mobile/ios/build/Build/Products/Release-iphonesimulator
        run: ditto -c -k --keepParent CravesMobile.app CravesMobile-simulator.zip

      - name: Upload the simulator app
        uses: actions/upload-artifact@v4
        with:
          name: CravesMobile-ios-simulator
          path: apps/mobile/ios/build/Build/Products/Release-iphonesimulator/CravesMobile-simulator.zip
          retention-days: 14

      - name: Upload Podfile.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-Podfile-lock
          path: apps/mobile/ios/Podfile.lock
          if-no-files-found: ignore
