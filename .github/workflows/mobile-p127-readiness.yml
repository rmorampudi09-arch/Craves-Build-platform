name: CRAVES Mobile P127 Production Readiness

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-p127-readiness.yml
      - .github/scripts/mobile-p127-readiness-check.mjs
      - .github/scripts/mobile-p127-dependency-audit-check.mjs
      - apps/mobile/tsconfig.json
      - apps/mobile/android/**
      - apps/mobile/ios/CravesMobile/Info.plist
      - apps/mobile/jest.setup.js
      - apps/mobile/__tests__/App.test.tsx
      - apps/mobile/__tests__/e2e/**
      - apps/mobile/__tests__/LifecyclePrimitives.test.tsx
      - apps/mobile/src/app/navigation/**
      - apps/mobile/src/features/cart/screens/CustomerCartScreen.tsx
      - apps/mobile/src/features/customerAddresses/**
      - apps/mobile/src/features/payment/**
      - apps/mobile/src/types/react-native-razorpay.d.ts
      - apps/mobile/scripts/p119-apim-contract-coverage-check.mjs
      - apps/mobile/package.json
      - apps/mobile/package-lock.json
      - api/apim-api/contracts/mobile-production.v1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout P127 branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java for Android configuration validation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Production dependency vulnerability scan
        id: audit
        continue-on-error: true
        working-directory: apps/mobile
        run: |
          mkdir -p build/p127-readiness
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee build/p127-readiness/npm-audit.txt

      - name: Classify production dependency audit result
        id: auditclassification
        if: always()
        working-directory: apps/mobile
        env:
          P127_NPM_AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: node ../../.github/scripts/mobile-p127-dependency-audit-check.mjs build/p127-readiness/npm-audit.txt

      - name: Verify backend source remains unchanged
        id: backendguard
        continue-on-error: true
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 0f4e166edaba8c115853441bf362f2226da87903...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(services/|openapi/|infra/|apps/api/)'; then
            echo 'Backend/APIM/infrastructure source changed since the pre-Razorpay mobile baseline.' >&2
            exit 1
          fi
          echo 'Backend/APIM/infrastructure source guard passed.'

      - name: Razorpay production runtime static gate
        id: paymentruntime
        continue-on-error: true
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./apps/mobile/package.json');
          const deps = pkg.dependencies || {};
          if (deps['react-native-razorpay'] !== '3.0.0') {
            throw new Error('react-native-razorpay must stay exactly pinned to 3.0.0 for this validated phase.');
          }
          for (const legacy of ['cashfree-pg-api-contract', 'react-native-cashfree-pg-sdk']) {
            if (deps[legacy]) throw new Error(`Legacy Cashfree dependency remains: ${legacy}`);
          }
          NODE
          if grep -RniE 'cashfree-pg-api-contract|react-native-cashfree-pg-sdk|CFPaymentGatewayService|CFSession' \
            apps/mobile/src apps/mobile/package.json; then
            echo 'Legacy Cashfree runtime code remains in production mobile source.' >&2
            exit 1
          fi
          grep -q "react-native-razorpay" apps/mobile/src/features/payment/gateway/razorpayGateway.ts
          grep -q "providerSignature" apps/mobile/src/features/payment/api/paymentApi.ts
          grep -q "pendingPaymentAttemptStore" apps/mobile/src/features/cart/screens/CustomerCartScreen.tsx
          echo 'Razorpay runtime static gate passed.'

      - name: iOS Razorpay UPI intent configuration gate
        id: iosrazorpay
        continue-on-error: true
        run: |
          set -euo pipefail
          plist=apps/mobile/ios/CravesMobile/Info.plist
          grep -q '<key>LSApplicationQueriesSchemes</key>' "$plist"
          for scheme in tez phonepe paytmmp bhim amazonpay; do
            grep -q "<string>${scheme}</string>" "$plist"
          done
          echo 'iOS Razorpay UPI intent configuration is present.'

      - name: TypeScript strict check
        id: typecheck
        continue-on-error: true
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: ESLint
        id: lint
        continue-on-error: true
        working-directory: apps/mobile
        run: npm run lint -- --max-warnings=0

      - name: Full Jest regression and open-handle hygiene
        id: jest
        continue-on-error: true
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 180s npm test -- --runInBand --detectOpenHandles 2>&1 | tee "$log_file"
          if grep -E 'Jest did not exit|Jest has detected the following|not wrapped in act' "$log_file"; then
            echo 'P127 Jest hygiene gate found an open-handle or React act warning.' >&2
            exit 1
          fi

      - name: Dedicated integration regression and open-handle hygiene
        id: integration
        continue-on-error: true
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          timeout 120s npm run test:integration -- --detectOpenHandles 2>&1 | tee "$log_file"
          if grep -E 'Jest did not exit|Jest has detected the following|not wrapped in act' "$log_file"; then
            echo 'P127 integration hygiene gate found an open-handle or React act warning.' >&2
            exit 1
          fi

      - name: Dedicated critical E2E regression
        id: e2e
        continue-on-error: true
        working-directory: apps/mobile
        run: npm run test:e2e

      - name: P119 APIM contract static guard
        id: p119
        continue-on-error: true
        working-directory: apps/mobile
        run: npm run check:p119

      - name: P120 observability static guard
        id: p120
        continue-on-error: true
        working-directory: apps/mobile
        run: npm run check:p120

      - name: P127 source hygiene, secret, and release-config audit
        id: p127static
        continue-on-error: true
        run: node .github/scripts/mobile-p127-readiness-check.mjs

      - name: Production Android JavaScript bundle
        id: bundle
        continue-on-error: true
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: |
          rm -rf build/p127-readiness-bundle
          mkdir -p build/p127-readiness-bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/p127-readiness-bundle/index.android.bundle \
            --assets-dest build/p127-readiness-bundle/assets
          test -s build/p127-readiness-bundle/index.android.bundle

      - name: Android release-configuration validation without artifact build
        id: androidconfig
        continue-on-error: true
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          cd android
          ./gradlew :app:signingReport --no-daemon

      - name: Android native debug assembly with Razorpay autolinking
        id: androidnative
        continue-on-error: true
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cp .env.example .env
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "craves-p127-native-ci",
              "storage_bucket": "craves-p127-native-ci.invalid"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:100000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.cravesapp"}
              },
              "api_key": [{"current_key": "p127-ci-placeholder-not-a-runtime-key"}]
            }],
            "configuration_version": "1"
          }
          JSON
          trap 'rm -f .env android/app/google-services.json' EXIT
          cd android
          ./gradlew :app:assembleDebug --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Final P127 automated readiness gate
        if: always()
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          JEST: ${{ steps.jest.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          P119: ${{ steps.p119.outcome }}
          P120: ${{ steps.p120.outcome }}
          P127_STATIC: ${{ steps.p127static.outcome }}
          PAYMENT_RUNTIME: ${{ steps.paymentruntime.outcome }}
          IOS_RAZORPAY: ${{ steps.iosrazorpay.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
          ANDROID_CONFIG: ${{ steps.androidconfig.outcome }}
          ANDROID_NATIVE: ${{ steps.androidnative.outcome }}
          BACKEND_GUARD: ${{ steps.backendguard.outcome }}
          DEPENDENCY_AUDIT_CLASSIFICATION: ${{ steps.auditclassification.outcome }}
          RAW_DEPENDENCY_AUDIT: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          failures=0
          for gate in TYPECHECK LINT JEST INTEGRATION E2E P119 P120 P127_STATIC PAYMENT_RUNTIME IOS_RAZORPAY BUNDLE ANDROID_CONFIG ANDROID_NATIVE BACKEND_GUARD DEPENDENCY_AUDIT_CLASSIFICATION; do
            result="${!gate}"
            printf '%-32s %s\n' "$gate" "$result"
            if [ "$result" != 'success' ]; then
              failures=$((failures + 1))
            fi
          done
          printf '%-32s %s\n' RAW_DEPENDENCY_AUDIT "$RAW_DEPENDENCY_AUDIT"
          if [ "$failures" -ne 0 ]; then
            echo "P127 automated readiness gate failed: $failures required check(s) are not green." >&2
            exit 1
          fi
          echo 'P127 automated readiness gate passed. Raw dependency audit outcome is retained separately for explicit release-risk review.'
