name: CRAVES Mobile Phase 1 Bootstrap

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-phase1-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout clean rebuild branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scaffold React Native 0.85.3 from scratch
        shell: bash
        run: |
          set -euo pipefail
          test ! -e apps/mobile
          mkdir -p /tmp/craves-bootstrap
          cd /tmp/craves-bootstrap
          npx --yes @react-native-community/cli@latest init CravesMobile --version 0.85.3 --skip-install
          mkdir -p "$GITHUB_WORKSPACE/apps/mobile"
          rsync -a --exclude '.git' CravesMobile/ "$GITHUB_WORKSPACE/apps/mobile/"

      - name: Configure package identity
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          sed -i 's/com\.cravesmobile/com.cravesapp/g' android/app/build.gradle || true
          find android/app/src -type f \( -name '*.kt' -o -name '*.java' \) -print0 | xargs -0 sed -i 's/com\.cravesmobile/com.cravesapp/g' || true

      - name: Install base dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd apps/mobile
          npm install
          npm install @react-navigation/native @react-navigation/native-stack @react-navigation/bottom-tabs react-native-screens react-native-safe-area-context react-native-gesture-handler react-native-reanimated @reduxjs/toolkit react-redux @tanstack/react-query axios react-hook-form zod @hookform/resolvers @react-native-async-storage/async-storage @react-native-firebase/app @react-native-firebase/auth react-native-svg @react-native-vector-icons/material-design-icons lottie-react-native @shopify/flash-list react-native-config

      - name: Install Expo SDK 56 and SecureStore in bare React Native
        shell: bash
        env:
          CI: '1'
        run: |
          set -euo pipefail
          cd apps/mobile
          npm install expo@~56.0.12
          printf 'y\n' | npx --yes install-expo-modules@latest
          npx expo install expo-secure-store

      - name: Commit clean native foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile
          git commit -m 'Create fresh React Native 0.85.3 mobile foundation'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
