name: CRAVES Mobile Implementation CI

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - apps/mobile/**
      - .github/workflows/mobile-phase1-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mobile-code:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout mobile implementation
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: TypeScript strict check
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: apps/mobile
        run: npm run lint -- --max-warnings=0

      - name: Jest
        working-directory: apps/mobile
        run: npm test -- --runInBand

      - name: Production JavaScript bundle
        working-directory: apps/mobile
        run: |
          rm -rf build/implementation-bundle
          mkdir -p build/implementation-bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/implementation-bundle/index.android.bundle \
            --assets-dest build/implementation-bundle/assets
          test -s build/implementation-bundle/index.android.bundle

      - name: Verify backend source remains unchanged
        run: |
          set -euo pipefail
          # Immutable production-sync boundary captured before any Aug 16 mobile parity work.
          baseline="06747a43628d70ff5927732118108c4526c17bf0"
          changed="$(git diff --name-only "${baseline}"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -E '^(services/|openapi/|infra/|apps/api/)'; then
            echo 'Backend/APIM/infrastructure source changed since the immutable pre-production-sync mobile baseline.' >&2
            exit 1
          fi
          echo 'Backend/APIM/infrastructure source guard passed.'
