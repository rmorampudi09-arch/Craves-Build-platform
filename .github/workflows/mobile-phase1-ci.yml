name: CRAVES Mobile Implementation CI

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - apps/mobile/**
      - api/apim-api/contracts/mobile-production.v1.json
      - api/apim-api/contracts/mobile-subscriptions.v1.json
      - api/apim-api/contracts/mobile-catalog-presentation.v1.json
      - api/apim-api/contracts/mobile-main-published.v1.json
      - api/apim-api/contracts/mobile-main-source-only.v1.json
      - .github/workflows/mobile-phase1-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-mobile-code:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout mobile implementation
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: TypeScript strict check
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: apps/mobile
        run: npm run lint -- --max-warnings=0

      - name: Jest
        working-directory: apps/mobile
        run: npm test -- --runInBand

      - name: Production JavaScript bundle
        working-directory: apps/mobile
        run: |
          rm -rf build/implementation-bundle
          mkdir -p build/implementation-bundle
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output build/implementation-bundle/index.android.bundle \
            --assets-dest build/implementation-bundle/assets
          test -s build/implementation-bundle/index.android.bundle

      - name: Verify backend source remains unchanged
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          merge_base="$(git merge-base HEAD refs/remotes/origin/main)"
          touched="$(git diff --name-only "$merge_base"...HEAD -- services/ openapi/ infra/ apps/api/)"
          violations=""
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if ! git diff --quiet refs/remotes/origin/main -- "$path"; then
              violations+="$path"
\n'
            fi
          done <<< "$touched"
          if [[ -n "$violations" ]]; then
            printf '%s' "$violations"
            echo 'Mobile branch still differs from main in protected backend/APIM/infrastructure paths.' >&2
            exit 1
          fi
          echo 'Protected backend/APIM/infrastructure paths are unchanged or restored to current main.'
