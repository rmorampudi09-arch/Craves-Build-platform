name: CRAVES Mobile Razorpay Migration

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-phase1-deps.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply guarded mobile source migration
        working-directory: apps/mobile
        run: node scripts/migrate-production-razorpay.mjs

      - name: Replace Cashfree native dependencies with Razorpay
        working-directory: apps/mobile
        run: |
          npm uninstall cashfree-pg-api-contract react-native-cashfree-pg-sdk --ignore-scripts --legacy-peer-deps
          npm install react-native-razorpay@3.0.0 --save-exact --ignore-scripts --legacy-peer-deps

      - name: Guard backend source
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(services/|openapi/|infra/|apps/api/)'; then
            echo 'Backend/infrastructure source changed unexpectedly.' >&2
            exit 1
          fi

      - name: Verify migration diff is mobile-contract scoped
        run: |
          set -euo pipefail
          git diff --name-only
          unexpected="$(git diff --name-only | grep -Ev '^(apps/mobile/|api/apim-api/contracts/mobile-production\.v1\.json$)' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed during Razorpay migration:' >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Commit synchronized Razorpay mobile integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/mobile api/apim-api/contracts/mobile-production.v1.json
          if git diff --cached --quiet; then
            echo 'Razorpay mobile migration is already synchronized.'
            exit 0
          fi
          git commit -m 'Integrate Razorpay mobile checkout runtime'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
