name: CRAVES Mobile Phase 1 Dependency Resolution

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-phase1-deps.yml

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install and synchronize current dependencies
        working-directory: apps/mobile
        run: npm install --ignore-scripts

      - name: Align Expo SDK 56 package versions
        working-directory: apps/mobile
        run: npx expo install --fix

      - name: Resolve Expo modules core for SecureStore
        working-directory: apps/mobile
        run: npx expo install expo-modules-core

      - name: Guard backend source
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(services/|openapi/|infra/|apps/api/)'; then
            echo 'Backend/infrastructure source changed unexpectedly.' >&2
            exit 1
          fi

      - name: Commit resolved mobile dependency set
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package.json apps/mobile/package-lock.json
          if git diff --cached --quiet; then
            echo 'Mobile dependency lockfile is already synchronized.'
            exit 0
          fi
          git commit -m 'Synchronize mobile dependency lockfile'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
