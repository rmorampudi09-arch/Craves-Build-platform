name: CRAVES Mobile Production Discovery Smoke

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-production-discovery-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout mobile branch
        uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0

      - name: Record smoke run ID
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > .github/mobile-production-discovery-smoke-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/mobile-production-discovery-smoke-run.txt
          git commit -m "chore(mobile): record production discovery smoke run"
          git push origin HEAD:mobile-ui-rebuild-from-scratch

      - name: Probe production catalog routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.craves.in'
          LAT='17.3850'
          LON='78.4867'

          probe() {
            name="$1"
            url="$2"
            body="/tmp/${name}.json"
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)"
            printf '%s HTTP %s\n' "$name" "$code"
            head -c 1000 "$body" 2>/dev/null || true
            printf '\n---\n'
            printf '%s' "$code" > "/tmp/${name}.status"
          }

          probe discovery-kitchens "$BASE/api/v1/discovery/kitchens?latitude=$LAT&longitude=$LON&radiusMeters=10000&page=0&size=20"
          probe discovery-menu-items "$BASE/api/v1/discovery/menu-items?latitude=$LAT&longitude=$LON&radiusMeters=10000&page=0&size=20"
          probe catalog-kitchens "$BASE/api/v1/catalog/kitchens?latitude=$LAT&longitude=$LON&radiusKm=10"
          probe health "$BASE/actuator/health"

          python3 - <<'PY'
          from pathlib import Path
          import json

          names = ['discovery-kitchens', 'discovery-menu-items', 'catalog-kitchens', 'health']
          statuses = {name: Path(f'/tmp/{name}.status').read_text().strip() for name in names}
          print('STATUSES', statuses)

          for name in ['discovery-kitchens', 'discovery-menu-items', 'catalog-kitchens']:
              if statuses[name] != '200':
                  raise SystemExit(f'{name} returned HTTP {statuses[name]}')
              body = json.loads(Path(f'/tmp/{name}.json').read_text())
              expected = {
                  'discovery-kitchens': ['latitude','longitude','radiusMeters','page','kitchens'],
                  'discovery-menu-items': ['latitude','longitude','radiusMeters','page','menuItems'],
                  'catalog-kitchens': ['kitchens'],
              }[name]
              missing = [key for key in expected if key not in body]
              if missing:
                  raise SystemExit(f'{name} missing response keys {missing}: {body}')
          print('Production discovery contract smoke passed.')
          PY
