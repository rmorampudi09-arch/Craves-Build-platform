name: One-shot remove mobile sticky category shadow

on:
  push:
    branches:
      - fix/mobile-sticky-category-shadowless-2026-08-20
    paths:
      - .github/workflows/mobile-remove-sticky-category-shadow-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-sticky-category-shadowless-2026-08-20

      - name: Remove only pinned category elevation shadow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx')
          text = path.read_text()
          old = """  pinnedCategoryWrap: {\n    position: 'absolute',\n    top: 0,\n    left: 0,\n    right: 0,\n    zIndex: 30,\n    elevation: 30,\n    backgroundColor: colors.surfaceBase,\n  },"""
          new = """  pinnedCategoryWrap: {\n    position: 'absolute',\n    top: 0,\n    left: 0,\n    right: 0,\n    zIndex: 30,\n    backgroundColor: colors.surfaceBase,\n  },"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one pinned category style block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify only intended source line changed
        shell: bash
        run: |
          git diff -- apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx
          test "$(git diff --numstat -- apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx | awk '{print $1}')" = "0"
          test "$(git diff --numstat -- apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx | awk '{print $2}')" = "1"
          ! grep -A8 "pinnedCategoryWrap:" apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx | grep -q "elevation:"

      - name: Remove one-shot workflow and commit source-only fix
        shell: bash
        run: |
          rm .github/workflows/mobile-remove-sticky-category-shadow-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src/features/home/screens/CustomerHomeScreen.tsx .github/workflows/mobile-remove-sticky-category-shadow-once.yml
          git commit -m "fix(mobile): remove sticky category rail shadow"
          git push origin HEAD:fix/mobile-sticky-category-shadowless-2026-08-20
