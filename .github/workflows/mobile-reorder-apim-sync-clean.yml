name: CRAVES Mobile Reorder APIM Clean Sync

on:
  push:
    branches: [mobile-ui-rebuild-from-scratch]
    paths: [.github/workflows/mobile-reorder-apim-sync-clean.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0
      - name: Apply reorder patch and deduplicate APIM ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, textwrap
          workflow = Path('.github/workflows/mobile-reorder-apim-sync-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'mobile-reorder-clean', 'exec'))

          # Favorites are already owned by mobile-subscriptions.v1.json. Keep a single
          # authoritative manifest entry for each source method; only Reorder is new here.
          p = Path('api/apim-api/contracts/mobile-production.v1.json')
          data = json.loads(p.read_text())
          duplicate_ids = {'favorites.list', 'favorites.save', 'favorites.remove'}
          data['actions'] = [action for action in data['actions'] if action.get('id') not in duplicate_ids]
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Validate TypeScript ESLint and P119
        working-directory: apps/mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
          npm run check:p119
      - name: Commit source and remove all temporary sync workflows
        run: |
          git config user.name 'craves-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-reorder-apim-sync.yml
          git rm .github/workflows/mobile-reorder-apim-sync-fix.yml
          git rm .github/workflows/mobile-reorder-apim-sync-final.yml
          git rm .github/workflows/mobile-reorder-apim-sync-clean.yml
          git add apps/mobile/src api/apim-api/contracts/mobile-production.v1.json
          git commit -m 'Enable atomic customer reorder and refresh APIM inventory'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
