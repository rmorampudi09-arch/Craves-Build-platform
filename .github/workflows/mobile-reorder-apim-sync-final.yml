name: CRAVES Mobile Reorder APIM Final Sync

on:
  push:
    branches: [mobile-ui-rebuild-from-scratch]
    paths: [.github/workflows/mobile-reorder-apim-sync-final.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0
      - name: Apply validated reorder/APIM patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/mobile-reorder-apim-sync-fix.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          embedded = textwrap.dedent(workflow[start:end])
          exec(compile(embedded, 'mobile-reorder-apim-final', 'exec'))
          PY
      - name: Validate TypeScript ESLint and P119
        working-directory: apps/mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
          npm run check:p119
      - name: Commit final source and clean temporary workflows
        run: |
          git config user.name 'craves-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-reorder-apim-sync.yml
          git rm .github/workflows/mobile-reorder-apim-sync-fix.yml
          git rm .github/workflows/mobile-reorder-apim-sync-final.yml
          git add apps/mobile/src api/apim-api/contracts/mobile-production.v1.json
          git commit -m 'Enable atomic customer reorder and refresh APIM inventory'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
