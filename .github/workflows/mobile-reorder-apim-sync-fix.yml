name: CRAVES Mobile Reorder APIM Sync Fix

on:
  push:
    branches: [mobile-ui-rebuild-from-scratch]
    paths: [.github/workflows/mobile-reorder-apim-sync-fix.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0
      - name: Apply reorder patch and remove obsolete blocker helper
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/mobile-reorder-apim-sync.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          embedded = textwrap.dedent(workflow[start:end])
          exec(compile(embedded, 'mobile-reorder-apim-sync', 'exec'))

          p = Path('apps/mobile/src/features/customerOrders/components/CustomerOrderCard.tsx')
          text = p.read_text()
          blocks = [
          '''interface UnavailableActionProps {
            label: string;
            primary?: boolean;
            hint: string;
          }

          ''',
          '''function UnavailableAction({
            label,
            primary = false,
            hint,
          }: UnavailableActionProps) {
            return (
              <View
                accessibilityRole="button"
                accessibilityLabel={label}
                accessibilityHint={hint}
                accessibilityState={{disabled: true}}
                style={[
                  styles.action,
                  styles.unavailableAction,
                  primary && styles.actionPrimary,
                ]}>
                <Text style={[styles.actionText, primary && styles.actionTextPrimary]}>
                  {label}
                </Text>
              </View>
            );
          }

          ''',
          ]
          for block in blocks:
              normalized = textwrap.dedent(block)
              if normalized not in text:
                  raise SystemExit('Expected obsolete reorder helper block not found')
              text = text.replace(normalized, '', 1)
          text = text.replace("  unavailableAction: {opacity: 0.48},\n", '', 1)
          text = text.replace("  capabilityNote: {\n    marginTop: spacing.sm,\n    color: colors.textSecondary,\n    fontSize: typography.tiny,\n    textAlign: 'center',\n  },\n", '', 1)
          p.write_text(text)
          PY
      - name: Validate TypeScript ESLint and P119
        working-directory: apps/mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
          npm run test:p119-apim-contract
      - name: Commit final reorder/APIM source
        run: |
          git config user.name 'craves-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-reorder-apim-sync.yml
          git rm .github/workflows/mobile-reorder-apim-sync-fix.yml
          git add apps/mobile/src api/apim-api/contracts/mobile-production.v1.json
          git commit -m 'Enable atomic customer reorder and refresh APIM inventory'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
