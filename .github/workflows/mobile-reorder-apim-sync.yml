name: CRAVES Mobile Reorder APIM Sync

on:
  push:
    branches: [mobile-ui-rebuild-from-scratch]
    paths: [.github/workflows/mobile-reorder-apim-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-ui-rebuild-from-scratch
          fetch-depth: 0
      - name: Wire atomic reorder and refresh APIM inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:200]}')
              p.write_text(text.replace(old, new, 1))

          # Cart API + queued mutation.
          path = 'apps/mobile/src/features/cart/api/cartApi.ts'
          replace(path,
              "  async removeItem(cartItemId: string): Promise<CartSnapshot> {\n    requireUuid(cartItemId, 'CART_INVALID_LINE_ID', 'This cart item could not be removed.');\n    return requireCartSnapshot(await httpClient.delete<unknown>(`/api/v1/cart/items/${cartItemId}`));\n  },",
              "  async removeItem(cartItemId: string): Promise<CartSnapshot> {\n    requireUuid(cartItemId, 'CART_INVALID_LINE_ID', 'This cart item could not be removed.');\n    return requireCartSnapshot(await httpClient.delete<unknown>(`/api/v1/cart/items/${cartItemId}`));\n  },\n  async reorder(orderId: string): Promise<CartSnapshot> {\n    requireUuid(orderId, 'CART_INVALID_ORDER_ID', 'This order could not be reordered.');\n    return requireCartSnapshot(\n      await httpClient.post<unknown>(`/api/v1/cart/reorder/${encodeURIComponent(orderId)}`),\n    );\n  },")

          path = 'apps/mobile/src/features/cart/state/cartMutations.ts'
          replace(path,
              "export interface RemoveCartItemCommand {\n  lineId: string;\n}\n",
              "export interface RemoveCartItemCommand {\n  lineId: string;\n}\n\nexport interface ReorderCartCommand {\n  orderId: string;\n}\n")
          replace(path,
              "export function addCartItem(command: AddCartItemCommand): CartMutationThunk {",
              "export function reorderCart(command: ReorderCartCommand): CartMutationThunk {\n  return async (dispatch, getState) => {\n    const key = 'cart:reorder';\n    if (isPendingMutation(getState(), key)) {\n      return {status: 'SKIPPED_DUPLICATE'};\n    }\n    const requestId = nextRequestId();\n    dispatch(cartActions.mutationStarted({key, requestId, scope: 'CART'}));\n    return enqueueMutation(async () => {\n      try {\n        const snapshot = await cartApi.reorder(command.orderId);\n        return markMutationSucceeded(dispatch, key, requestId, snapshot);\n      } catch (error) {\n        return markMutationFailed(dispatch, key, requestId, toAppApiError(error));\n      }\n    });\n  };\n}\n\nexport function addCartItem(command: AddCartItemCommand): CartMutationThunk {")

          # Order card: real Reorder action instead of fail-closed placeholder.
          path = 'apps/mobile/src/features/customerOrders/components/CustomerOrderCard.tsx'
          replace(path,
              "import {getProductionCustomerOrderMutationDecision} from '../domain/customerOrderActionEligibility';\n",
              "")
          replace(path,
              "interface Props {\n  order: CustomerOrder;\n}\n",
              "interface Props {\n  order: CustomerOrder;\n  onReorder: (order: CustomerOrder) => void;\n  reorderPending?: boolean;\n}\n")
          replace(path,
              "export function CustomerOrderCard({order}: Props) {",
              "export function CustomerOrderCard({order, onReorder, reorderPending = false}: Props) {")
          replace(path,
              "  const reorderDecision = getProductionCustomerOrderMutationDecision('REORDER');\n  const reorderUnavailableMessage =\n    reorderDecision.kind === 'BLOCKED'\n      ? reorderDecision.message\n      : 'Reorder requires authoritative revalidation before cart mutation.';\n",
              "")
          replace(path,
              "        {referenceAction === 'REORDER' ? (\n          <UnavailableAction\n            label=\"Reorder\"\n            hint={reorderUnavailableMessage}\n          />\n        ) : null}",
              "        {referenceAction === 'REORDER' ? (\n          <CardAction\n            label={reorderPending ? 'Preparing…' : 'Reorder'}\n            onPress={() => { if (!reorderPending) onReorder(order); }}\n          />\n        ) : null}")
          replace(path,
              "\n      {referenceAction === 'REORDER' ? (\n        <Text style={styles.capabilityNote}>{reorderUnavailableMessage}</Text>\n      ) : null}",
              "")

          # Orders screen: confirm destructive cart replacement, call atomic endpoint, then open Cart.
          path = 'apps/mobile/src/features/customerOrders/screens/CustomerOrdersScreen.tsx'
          replace(path,
              "  ActivityIndicator,\n  FlatList,",
              "  ActivityIndicator,\n  Alert,\n  FlatList,")
          replace(path,
              "import {useCustomerBottomNavScroll} from '../../../app/navigation/CustomerBottomNavController';",
              "import {useCustomerBottomNavScroll} from '../../../app/navigation/CustomerBottomNavController';\nimport {useAppDispatch, useAppSelector} from '../../../app/store/hooks';")
          replace(path,
              "import {CustomerEmptyState} from '../../customerEmptyStates/components/CustomerEmptyState';",
              "import {reorderCart} from '../../cart/state/cartMutations';\nimport {CustomerEmptyState} from '../../customerEmptyStates/components/CustomerEmptyState';")
          replace(path,
              "  const bottomNavScroll = useCustomerBottomNavScroll();\n  const ordersQuery = useCustomerOrdersQuery();",
              "  const dispatch = useAppDispatch();\n  const cartSnapshot = useAppSelector(state => state.cart.snapshot);\n  const bottomNavScroll = useCustomerBottomNavScroll();\n  const ordersQuery = useCustomerOrdersQuery();")
          replace(path,
              "  const [capabilityMessage, setCapabilityMessage] = useState<string | null>(null);",
              "  const [capabilityMessage, setCapabilityMessage] = useState<string | null>(null);\n  const [reorderingOrderId, setReorderingOrderId] = useState<string | null>(null);")
          replace(path,
              "  const openDiscovery = useCallback(() => {",
              "  const reorder = useCallback(async (order: CustomerOrder) => {\n    if (reorderingOrderId) return;\n    setCapabilityMessage(null);\n    setReorderingOrderId(order.id);\n    try {\n      const outcome = await dispatch(reorderCart({orderId: order.id}));\n      if (outcome.status === 'FAILED') {\n        setCapabilityMessage(outcome.error.message);\n        return;\n      }\n      if (outcome.status === 'APPLIED') {\n        navigation.navigate('CustomerCart');\n      }\n    } finally {\n      setReorderingOrderId(null);\n    }\n  }, [dispatch, navigation, reorderingOrderId]);\n\n  const confirmReorder = useCallback((order: CustomerOrder) => {\n    if (cartSnapshot?.lines.length) {\n      Alert.alert(\n        'Replace current cart?',\n        'Reorder will replace your current cart after Craves verifies every dish is still available.',\n        [\n          {text: 'Keep cart', style: 'cancel'},\n          {text: 'Replace & reorder', style: 'destructive', onPress: () => { reorder(order).catch(() => undefined); }},\n        ],\n      );\n      return;\n    }\n    reorder(order).catch(() => undefined);\n  }, [cartSnapshot?.lines.length, reorder]);\n\n  const openDiscovery = useCallback(() => {")
          replace(path,
              "        renderItem={({item}) => <CustomerOrderCard order={item} />}",
              "        renderItem={({item}) => (\n          <CustomerOrderCard\n            order={item}\n            onReorder={confirmReorder}\n            reorderPending={reorderingOrderId === item.id}\n          />\n        )}")

          # APIM production inventory: favorites + atomic reorder.
          p = Path('api/apim-api/contracts/mobile-production.v1.json')
          data = json.loads(p.read_text())
          actions = data['actions']
          existing = {a['id'] for a in actions}
          additions = [
            {"id":"cart.reorder","source":"src/features/cart/api/cartApi.ts","method":"POST","path":"/api/v1/cart/reorder/{orderId}","auth":"bearer","requestModel":"none","responseModel":"CartSnapshot","requestValidator":"requireUuid(orderId)","responseValidator":"requireCartSnapshot; server validates every historical dish before transactional cart replacement"},
            {"id":"favorites.list","source":"src/features/favorites/api/customerFavoritesApi.ts","method":"GET","path":"/api/v1/customer/favorites","auth":"bearer","requestModel":"none","responseModel":"CustomerFavorite[]","requestValidator":"authenticated customer","responseValidator":"favoriteSchema[] max 200"},
            {"id":"favorites.save","source":"src/features/favorites/api/customerFavoritesApi.ts","method":"PUT","path":"/api/v1/customer/favorites/{menuItemId}","auth":"bearer","requestModel":"none","responseModel":"CustomerFavorite","requestValidator":"requireMenuItemId","responseValidator":"favoriteSchema"},
            {"id":"favorites.remove","source":"src/features/favorites/api/customerFavoritesApi.ts","method":"DELETE","path":"/api/v1/customer/favorites/{menuItemId}","auth":"bearer","requestModel":"none","responseModel":"void","requestValidator":"requireMenuItemId","responseValidator":"void"},
          ]
          actions.extend(a for a in additions if a['id'] not in existing)
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Validate mobile and P119 contract
        working-directory: apps/mobile
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --max-warnings=0
          npm run test:p119-apim-contract
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'craves-mobile-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/mobile-reorder-apim-sync.yml
          git add apps/mobile/src api/apim-api/contracts/mobile-production.v1.json
          git commit -m 'Enable atomic customer reorder and refresh APIM inventory'
          git push origin HEAD:mobile-ui-rebuild-from-scratch
