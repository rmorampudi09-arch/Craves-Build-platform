name: CRAVES Mobile Startup Fix APK

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-startup-fix-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact fixed source
        uses: actions/checkout@v4
        with:
          ref: e9e51c67bfea0a86865e7009d36b8a64431faf58
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: TypeScript strict check
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: apps/mobile
        run: npm run lint -- --max-warnings=0

      - name: Full Jest regression
        working-directory: apps/mobile
        run: npm test -- --runInBand

      - name: Build standalone arm64 release-mode APK
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Test-sign and verify standalone APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/Craves-Test-Standalone-arm64-fixed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/Craves-Test-Standalone-arm64-fixed.apk

      - name: Record APK checksum
        working-directory: apps/mobile/android
        run: |
          sha256sum app/build/outputs/apk/release/Craves-Test-Standalone-arm64-fixed.apk \
            | tee app/build/outputs/apk/release/Craves-Test-Standalone-arm64-fixed.apk.sha256

      - name: Upload fixed standalone test APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-startup-fixed-arm64-e9e51c67
          path: |
            apps/mobile/android/app/build/outputs/apk/release/Craves-Test-Standalone-arm64-fixed.apk
            apps/mobile/android/app/build/outputs/apk/release/Craves-Test-Standalone-arm64-fixed.apk.sha256
          if-no-files-found: error
          retention-days: 7
