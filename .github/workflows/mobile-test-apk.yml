name: CRAVES Mobile Test APK

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-test-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact test source
        uses: actions/checkout@v4
        with:
          ref: 8d02c31b4e07c3165b89c086944e6a37b6004e41
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build standalone arm64 release-mode APK
        working-directory: apps/mobile
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Test-sign standalone APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/craves-test-standalone-arm64.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks app/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            app/build/outputs/apk/release/craves-test-standalone-arm64.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/craves-test-standalone-arm64.apk

      - name: Record APK checksum
        working-directory: apps/mobile/android
        run: sha256sum app/build/outputs/apk/release/craves-test-standalone-arm64.apk | tee app/build/outputs/apk/release/craves-test-standalone-arm64.apk.sha256

      - name: Upload standalone test APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-test-standalone-arm64-8d02c31
          path: |
            apps/mobile/android/app/build/outputs/apk/release/craves-test-standalone-arm64.apk
            apps/mobile/android/app/build/outputs/apk/release/craves-test-standalone-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 7
