name: CRAVES Mobile Test APK

on:
  push:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/mobile-test-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact test source
        uses: actions/checkout@v4
        with:
          ref: 8d02c31b4e07c3165b89c086944e6a37b6004e41
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Build installable arm64 Android debug APK
        working-directory: apps/mobile
        env:
          NODE_ENV: development
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Record APK checksum
        working-directory: apps/mobile/android
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-test-apk-arm64-8d02c31
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
