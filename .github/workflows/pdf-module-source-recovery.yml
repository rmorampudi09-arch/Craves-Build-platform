name: PDF source recovery (not module acceptance)

on:
  push:
    branches: [feature/backend-pdf-documents-20260911]
    paths:
      - pdf-module-import.zip
      - scripts/documents/recover_pdf_source.py
      - scripts/documents/test_recover_pdf_source.py
      - .github/workflows/pdf-module-source-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-source-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recovery-tests:
    name: Recovery safety tests only
    if: github.repository == 'rmorampudi09-arch/Craves-Build-platform' && github.ref == 'refs/heads/feature/backend-pdf-documents-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_present: ${{ steps.package.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test recovery utility
        run: python3 -m unittest discover -s scripts/documents -p test_recover_pdf_source.py -v
      - name: Detect source package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if test -f pdf-module-import.zip; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '### Awaiting source ZIP' >> "$GITHUB_STEP_SUMMARY"
            echo 'Recovery utility tests passed. The PDF implementation has NOT been imported, validated, deployed or accepted. Upload pdf-module-import.zip to this feature branch to start source recovery.' >> "$GITHUB_STEP_SUMMARY"
          fi

  import-source:
    name: Recover source onto PDF branch only
    needs: recovery-tests
    if: needs.recovery-tests.outputs.package_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import bounded package without executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/documents/recover_pdf_source.py \
            --archive pdf-module-import.zip --root . \
            --report "$RUNNER_TEMP/pdf-source-recovery-report.json" --apply
          mkdir -p docs/evidence/pdf-source-recovery
          cp "$RUNNER_TEMP/pdf-source-recovery-report.json" docs/evidence/pdf-source-recovery/source-manifest.json
      - name: Stage only recovered source paths
        shell: bash
        env:
          REPORT_PATH: ${{ runner.temp }}/pdf-source-recovery-report.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT_PATH']).read_text())
          paths = [entry['path'] for entry in report['files']]
          for start in range(0, len(paths), 100):
              subprocess.run(['git', 'add', '--', *paths[start:start + 100]], check=True)
          PY
          git add -- docs/evidence/pdf-source-recovery/source-manifest.json
          git rm -- pdf-module-import.zip
          git diff --cached --check
      - name: Publish only to the same feature branch, without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH='feature/backend-pdf-documents-20260911'
          test "$GITHUB_REF" = "refs/heads/$BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          CURRENT_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$CURRENT_SHA" = "$EXPECTED_SHA" || { echo 'Branch advanced; no source was pushed. Rerun from the new head.'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pdf): recover delivered source package for validation'
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:refs/heads/$BRANCH"
          {
            echo '### Source recovered; not production accepted'
            echo "Commit: $(git rev-parse HEAD)"
            echo 'No package code was executed. No main merge, Azure operation, payment, email or delivery action was performed.'
            echo 'Next: inspect recovered sources, apply the final browser/APIM fixes and CI workflow, then run complete backend/PostgreSQL/web validation before merge.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source manifest only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-source-recovery-manifest
          path: ${{ runner.temp }}/pdf-source-recovery-report.json
          retention-days: 7
          if-no-files-found: ignore
