name: Customer Fix Implementation
on:
  push:
    branches:
      - fix/customer-card-navigation-nearby-2026-08-21
    paths:
      - .github/workflows/probe-customer-fix.yml
permissions:
  contents: write
jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/customer-card-navigation-nearby-2026-08-21
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply targeted source changes
        run: python3 .github/customer-fix-apply.py
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: TypeScript validation
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Mobile lint
        working-directory: apps/mobile
        run: npm run lint
      - name: Mobile test suite
        working-directory: apps/mobile
        run: npm test -- --runInBand
      - name: Order service compile
        working-directory: services/order-service
        run: mvn -q -DskipTests compile
      - name: Order service regression test
        working-directory: services/order-service
        run: mvn -q -Dtest=CatalogClientCartSnapshotTest test
      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/probe-customer-fix.yml
          git rm .github/workflows/customer-card-navigation-nearby-fix.yml
          git rm .github/customer-fix-apply.py
          git rm .github/customer-fix-run.txt
          git add apps/mobile services/order-service
          git commit -m "fix(mobile): align customer cards and stabilize cart navigation discovery"
          git push origin HEAD:fix/customer-card-navigation-nearby-2026-08-21
