name: Refund Safety CI
on:
  pull_request:
    paths:
      - 'services/integration-service/**'
      - 'scripts/refund/**'
      - 'docs/refunds/**'
      - 'azure-pipelines-refund-production-*.yml'
      - '.github/workflows/refund-safety-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refund-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: craves_refund_test
          POSTGRES_USER: refund_ci
          POSTGRES_PASSWORD: refund_ci_disposable_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REFUND_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/craves_refund_test
      REFUND_TEST_DB_USER: refund_ci
      REFUND_TEST_DB_PASSWORD: refund_ci_disposable_only
      CRAVES_REFUND_DISPOSABLE_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/integration-service/pom.xml
      - name: Refund protocol and disposable PostgreSQL persistence/upgrade tests
        run: >-
          mvn -B -ntp -f services/integration-service/pom.xml
          -Dtest=RazorpayRefundClientTest,RefundExecutionWorkerTest,RefundProductionReadinessServiceTest,RefundProductionApprovalDefaultsTest,RefundDispatchDatabaseTest,RefundMigrationDatabaseTest,RefundRequestServiceTest,RefundStatusEventFactoryTest,RefundEventValidatorTest,RefundWorkflowPropertiesTest
          clean verify
      - name: Require all refund tests without skips
        run: python3 scripts/refund/verify-refund-safety-evidence.py
      - name: Guarded refund release planner tests
        run: python3 -m unittest discover -s scripts/refund -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-safety-evidence-${{ github.sha }}
          path: |
            services/integration-service/target/surefire-reports
            target/refund-safety/test-results.json
          if-no-files-found: error
          retention-days: 14
