name: Craves Rider APK

# Builds the rider app (com.cravesapp.rider) as a signed release APK for phone testing: ARM only, R8 on, versionCode =
# the run number (see docs/riders/RELEASE.md). A live run from main also builds the Play bundle (craves-rider-aab).
# Every run compares the APK size with the last main build and warns above 5%.
# Mock builds use demo data and never call Firebase or the Craves API. Live builds sign in with the MSG91 phone OTP
# (auth-service), then Firebase, and call CRAVES_API_BASE_URL; they need RIDER_GOOGLE_SERVICES_JSON.
# Which one: a manual run picks api_mode (default live, the APK riders install; live builds run only from main);
# pull requests use the repo variable CRAVES_RIDER_API_MODE (mock when unset). The mode is in the APK's name and the
# PR comment. A mock build is its own app, com.cravesapp.rider.demo named "Craves Rider Demo", installed beside the real
# one, so it can never replace or pass for the rider app; a check below fails a live APK that isn't com.cravesapp.rider.
# Optional secrets: RIDER_GOOGLE_SERVICES_JSON (real Firebase config for the rider app),
# RIDER_KEYSTORE_BASE64 + RIDER_KEYSTORE_PASSWORD + RIDER_KEY_ALIAS (a fixed signing key).

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/rider-apk.yml'
  workflow_dispatch:
    inputs:
      api_mode:
        description: 'Rider API: mock (demo data) or live (Firebase sign-in and the Craves API)'
        type: choice
        options:
          - live
          - mock
        default: live

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  # A mock and a live build of the same branch can run side by side.
  group: rider-apk-${{ github.ref }}-${{ inputs.api_mode || 'pr' }}
  cancel-in-progress: true

jobs:
  build-rider-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            apps/mobile/android/**/*.gradle*
            apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Rider checks (types and tests)
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx jest src/features/rider src/app/rider --ci

      - name: Keep rider permissions out of the customer app
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'POST_NOTIFICATIONS|android.permission.VIBRATE|FOREGROUND_SERVICE|WAKE_LOCK|RECEIVE_BOOT_COMPLETED' android/app/src/main/AndroidManifest.xml; then
            echo 'ERROR: rider-only permissions belong in android/app/src/rider/AndroidManifest.xml' >&2
            exit 1
          fi

      - name: Rider version in step (build.gradle and riderConfig.ts)
        shell: bash
        run: |
          set -euo pipefail
          # Native code (versionName, sent with a refreshed FCM token) and JS (RIDER_APP_VERSION, compared with
          # minAppVersion) must report the same version to the server.
          native=$(awk '/^[[:space:]]*rider[[:space:]]*[{]/ {rider = 1} rider && /^[[:space:]]*versionName[[:space:]]+"/ {gsub(/"/, "", $2); print $2; exit}' android/app/build.gradle)
          js=$(sed -nE "s/^export const RIDER_APP_VERSION = '([^']+)';$/\1/p" src/features/rider/riderConfig.ts)
          if [[ -z "$native" || "$native" != "$js" ]]; then
            echo "ERROR: the rider versionName in android/app/build.gradle ('$native') and RIDER_APP_VERSION in src/features/rider/riderConfig.ts ('$js') must match." >&2
            exit 1
          fi
          echo "Rider version: $native"

      - name: API mode
        id: mode
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.api_mode }}
          VARIABLE_MODE: ${{ vars.CRAVES_RIDER_API_MODE }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Manual runs: the api_mode input. Pull requests have no input: the repo variable, else mock.
          mode="${INPUT_MODE:-${VARIABLE_MODE:-mock}}"
          case "$mode" in
            mock|live) ;;
            *) echo "ERROR: api mode must be mock or live, got '$mode' (check the CRAVES_RIDER_API_MODE variable)" >&2; exit 1 ;;
          esac
          # The APK riders install talks to production, so it is built only from main (AGENTS.md: deploy only main).
          if [[ "$mode" == live && "$EVENT" == workflow_dispatch && "$REF" != refs/heads/main ]]; then
            echo "ERROR: build live APKs from main (this run is on $REF); pick mock to try a branch." >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Rider API mode: $mode"

      - name: Firebase config for the rider app
        shell: bash
        env:
          RIDER_GOOGLE_SERVICES_JSON: ${{ secrets.RIDER_GOOGLE_SERVICES_JSON }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          target=android/app/src/rider/google-services.json
          if [[ "$MODE" == live && -z "${RIDER_GOOGLE_SERVICES_JSON:-}" ]]; then
            echo 'ERROR: a live build needs the RIDER_GOOGLE_SERVICES_JSON secret; phone sign-in cannot work with the placeholder.' >&2
            exit 1
          fi
          if [[ "$MODE" == live ]]; then
            printf '%s' "$RIDER_GOOGLE_SERVICES_JSON" > "$target"
            echo 'Using the real rider Firebase config.'
          else
            # Placeholder so the Gradle plugin can run, for the demo app's own package; demo sign-in never calls Firebase.
            cat > "$target" <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "craves-rider-demo", "storage_bucket": "craves-rider-demo.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.cravesapp.rider.demo"}},
              "oauth_client": [],
              "api_key": [{"current_key": "demo-placeholder-not-a-key"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
            echo 'Demo build: the placeholder Firebase config for com.cravesapp.rider.demo.'
          fi

      - name: App settings
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          printf 'CRAVES_ENVIRONMENT=production\nCRAVES_API_BASE_URL=https://api.craves.in\nCRAVES_RIDER_API_MODE=%s\n' "$MODE" > .env
          echo "CRAVES_RIDER_API_MODE=$MODE"

      - name: Restore the pilot signing key
        id: key-cache
        uses: actions/cache@v4
        with:
          path: apps/mobile/android/app/rider-pilot.keystore
          key: rider-pilot-keystore-v1

      - name: Prepare the signing key
        shell: bash
        env:
          RIDER_KEYSTORE_BASE64: ${{ secrets.RIDER_KEYSTORE_BASE64 }}
          RIDER_KEYSTORE_PASSWORD: ${{ secrets.RIDER_KEYSTORE_PASSWORD }}
          RIDER_KEY_ALIAS: ${{ secrets.RIDER_KEY_ALIAS }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          keystore="$PWD/android/app/rider-pilot.keystore"
          password="${RIDER_KEYSTORE_PASSWORD:-craves-rider-pilot}"
          if [[ "$MODE" == live && -z "${RIDER_KEYSTORE_BASE64:-}" ]]; then
            # The phone binding uses ANDROID_ID, which changes with the signing key: live builds need the one fixed key.
            echo 'ERROR: a live build needs the RIDER_KEYSTORE_BASE64 secret (the fixed rider signing key).' >&2
            exit 1
          fi
          if [[ -n "${RIDER_KEYSTORE_BASE64:-}" ]]; then
            # Outside the cached path, so the real key never goes into the Actions cache.
            keystore="$RUNNER_TEMP/rider-release.keystore"
            printf '%s' "$RIDER_KEYSTORE_BASE64" | base64 -d > "$keystore"
          elif [[ ! -f "$keystore" ]]; then
            # A cached throwaway key for pilot builds; set the secrets for a permanent one before the Play Store.
            keytool -genkeypair -v -keystore "$keystore" -storetype PKCS12 -alias rider -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$password" -keypass "$password" -dname "CN=Craves Rider Pilot, O=Craves, C=IN"
          fi
          {
            echo "CRAVES_ANDROID_KEYSTORE_PATH=$keystore"
            echo "CRAVES_ANDROID_KEYSTORE_PASSWORD=$password"
            echo "CRAVES_ANDROID_KEY_ALIAS=${RIDER_KEY_ALIAS:-rider}"
            echo "CRAVES_ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build the rider APK (ARM phones only, R8 on) and run the native unit tests
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
          MODE: ${{ steps.mode.outputs.mode }}
          PLAY_BUNDLE: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.mode.outputs.mode == 'live' }}
        run: |
          set -euo pipefail
          cd android
          # cravesRiderMinify and cravesVersionCode are read only by android/app/build.gradle for this build.
          # R8 compatibility mode (not full mode) for the first R8 builds; switch after a clean phone pass.
          # testRiderReleaseUnitTest: the trip outbox's rules (src/testRider), on the JVM; a failure stops the APK.
          # A live build from main also makes the Play bundle (P2-07), from the same R8 output and key.
          tasks=(assembleRiderRelease testRiderReleaseUnitTest)
          if [[ "$PLAY_BUNDLE" == true ]]; then tasks+=(bundleRiderRelease); fi
          # A mock build is the separate demo app (cravesRiderDemo: com.cravesapp.rider.demo, "Craves Rider Demo").
          ./gradlew "${tasks[@]}" -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -PcravesRiderDemo="$([[ "$MODE" == mock ]] && echo true || echo false)" \
            -PcravesRiderMinify=true -PcravesVersionCode="$RUN_NUMBER" -Pandroid.enableR8.fullMode=false \
            --no-daemon --stacktrace 2>&1 | tee ../rider-build.log

      - name: Name the APK
        id: apk
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          name="craves-rider-${MODE}-$(git rev-parse --short HEAD).apk"
          cp android/app/build/outputs/apk/rider/release/app-rider-release.apk "$name"
          # R8's map from renamed to real class names, to read a crash stack trace from this build.
          cp android/app/build/outputs/mapping/riderRelease/mapping.txt "${name%.apk}-mapping.txt"
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "mapping=${name%.apk}-mapping.txt" >> "$GITHUB_OUTPUT"

      - name: Check the APK (signed, ARM only, R8, version code)
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.name }}
          RUN_NUMBER: ${{ github.run_number }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "$tools/apksigner" verify "$APK"
          code="$("$tools/aapt2" dump badging "$APK" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")"
          [[ "$code" == "$RUN_NUMBER" ]] || { echo "ERROR: versionCode is '$code', expected $RUN_NUMBER" >&2; exit 1; }
          # The rider app is only ever a live build; a demo build is only ever the separate demo app.
          package="$("$tools/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          expected=com.cravesapp.rider; [[ "$MODE" == mock ]] && expected=com.cravesapp.rider.demo
          [[ "$package" == "$expected" ]] || { echo "ERROR: a $MODE APK is '$package', expected $expected" >&2; exit 1; }
          abis="$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')"
          [[ "$abis" == "arm64-v8a armeabi-v7a " ]] || { echo "ERROR: native code for: $abis" >&2; exit 1; }
          test -s "${APK%.apk}-mapping.txt" || { echo 'ERROR: no R8 mapping: R8 did not run' >&2; exit 1; }
          echo "Signed; $package; versionCode $code; native code for $abis; R8 mapping present."

      - name: Name and check the Play bundle (signed, ARM only)
        id: aab
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.mode.outputs.mode == 'live'
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          name="${APK%.apk}.aab"
          cp android/app/build/outputs/bundle/riderRelease/app-rider-release.aab "$name"
          # Captured first: grep -q closing the pipe early would fail the step under pipefail.
          signed="$(jarsigner -verify "$name")"
          grep -q 'jar verified' <<<"$signed" || { echo "ERROR: the bundle is not signed: $signed" >&2; exit 1; }
          abis="$(unzip -Z1 "$name" | sed -n 's#^base/lib/\([^/]*\)/.*#\1#p' | sort -u | tr '\n' ' ')"
          [[ "$abis" == "arm64-v8a armeabi-v7a " ]] || { echo "ERROR: native code for: $abis" >&2; exit 1; }
          ls -lh "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Restore the last main APK size
        uses: actions/cache/restore@v4
        with:
          path: apps/mobile/rider-apk-size-main.txt
          key: rider-apk-size-main-${{ github.run_id }}
          restore-keys: rider-apk-size-main-

      - name: Compare the APK size with the last main build (warn above 5%)
        id: size
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          size=$(stat -c %s "$APK")
          mb=$(awk -v b="$size" 'BEGIN {printf "%.1f", b / 1048576}')
          note="APK ${mb} MB."
          if [[ -s rider-apk-size-main.txt ]]; then
            base=$(cat rider-apk-size-main.txt)
            change=$(awk -v s="$size" -v b="$base" 'BEGIN {printf "%+.1f", (s - b) * 100 / b}')
            note="APK ${mb} MB, ${change}% on the last main build."
            if (( size * 100 > base * 105 )); then
              echo "::warning title=Rider APK grew more than 5%::$APK is $size bytes, ${change}% on the last main build ($base bytes). Look for a new dependency, asset or ABI."
              note="$note **More than 5%: check what grew.**"
            fi
          else
            note="$note No main build size yet: run the workflow on main to set it."
          fi
          echo "$note"
          echo "note=$note" >> "$GITHUB_OUTPUT"
          echo "$size" > rider-apk-size-main.txt

      - name: Keep this size as the main baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: apps/mobile/rider-apk-size-main.txt
          key: rider-apk-size-main-${{ github.run_id }}

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: craves-rider-apk
          path: |
            apps/mobile/${{ steps.apk.outputs.name }}
            apps/mobile/${{ steps.apk.outputs.mapping }}
          retention-days: 14

      - name: Upload the Play bundle
        if: steps.aab.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: craves-rider-aab
          path: |
            apps/mobile/${{ steps.aab.outputs.name }}
            apps/mobile/${{ steps.apk.outputs.mapping }}
          retention-days: 14

      - name: Comment the result on the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ job.status }}
          APK: ${{ steps.apk.outputs.name }}
          MODE: ${{ steps.mode.outputs.mode }}
          SIZE: ${{ steps.size.outputs.note }}
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (process.env.OUTCOME === 'success') {
              const mode = process.env.MODE === 'live' ? '**live** (Firebase sign-in, real Craves API)' : '**mock** (demo data, no sign-in or API calls)';
              body = `Rider APK built: **${process.env.APK}** (versionCode ${context.runNumber}), API mode ${mode}. Download it from the "craves-rider-apk" artifact on [this run](${run}) (kept 14 days). ${process.env.SIZE || ''}`.trim();
            } else {
              let tail = '(no Gradle log: an earlier step failed; see the run)';
              try {
                tail = fs.readFileSync('apps/mobile/rider-build.log', 'utf8').split('\n').slice(-80).join('\n');
              } catch {}
              body = `Rider APK build (${process.env.MODE || 'mode not set'}) **${process.env.OUTCOME}**: [run](${run}).\n\n<details><summary>Last 80 lines of the Gradle log</summary>\n\n\`\`\`\n${tail}\n\`\`\`\n</details>`;
            }
            await github.rest.issues.createComment({...context.repo, issue_number: context.payload.pull_request.number, body});
