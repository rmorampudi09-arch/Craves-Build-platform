name: Run customer mobile UI fixes PR

on:
  pull_request:
    branches:
      - mobile-ui-rebuild-from-scratch
    paths:
      - .github/workflows/apply-customer-mobile-ui-fixes-2026-08-21.yml
      - .github/workflows/run-customer-mobile-ui-fixes-pr.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/customer-mobile-ui-navigation-2026-08-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Apply source changes from reviewed one-shot workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/apply-customer-mobile-ui-fixes-2026-08-21.yml').read_text()
          section = workflow.split('      - name: Apply focused source changes', 1)[1]
          script = section.split('        run: |\n', 1)[1].split('\n      - name: Validate targeted tests', 1)[0]
          Path('/tmp/apply-customer-fixes.sh').write_text(textwrap.dedent(script))
          PY
          bash /tmp/apply-customer-fixes.sh

      - name: Keep availability fallback lint-safe
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/src/shared/menuAvailability.ts')
          text = path.read_text()
          old = "hash = (Math.imul(hash, 31) + itemId.charCodeAt(index)) >>> 0;"
          new = "hash = (hash * 31 + itemId.charCodeAt(index)) % 2147483647;"
          if old not in text:
            raise SystemExit('Expected availability hash line was not generated.')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate targeted tests
        working-directory: apps/mobile
        run: npm test -- --runInBand src/shared/menuAvailability.test.ts src/app/navigation/customerTabs.test.ts

      - name: Lint changed mobile source
        working-directory: apps/mobile
        run: npx eslint src/shared/menuAvailability.ts src/shared/menuAvailability.test.ts src/app/navigation/CustomerBottomNavController.tsx src/app/navigation/CustomerRootNavigator.tsx src/app/navigation/customerTabs.ts src/app/navigation/customerTabs.test.ts src/features/chefDiscovery/screens/DiscoverHomeChefsScreen.tsx src/features/kitchenProfile/screens/CustomerKitchenProfileScreen.tsx src/features/home/screens/CustomerHomeScreen.tsx --max-warnings=0

      - name: Check TypeScript allowing only known pre-existing profile-test errors
        working-directory: apps/mobile
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc.log
          if [ "$status" -ne 0 ]; then
            unexpected="$(grep 'error TS' /tmp/tsc.log | grep -v 'src/features/customerProfile/customerProfileUiModel.test.ts(58,14)' | grep -v 'src/features/customerProfile/customerProfileUiModel.test.ts(62,45)' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected TypeScript errors detected:" >&2
              echo "$unexpected" >&2
              exit 1
            fi
          fi

      - name: Commit requested fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/src
          git commit -m "fix(mobile): align customer cards search navigation and cart startup"
          git push origin HEAD:fix/customer-mobile-ui-navigation-2026-08-21
