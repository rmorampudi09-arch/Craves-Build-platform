name: CRAVES Support Assistant Source CI

on:
  push:
    branches:
      - feature/support-assistant-source-convergence-20260910
    paths:
      - 'services/support-assistant-service/**'
      - '.github/workflows/support-assistant-source-ci.yml'
      - '.github/workflows/backend-completion-ci.yml'
      - 'docs/handover/2026-09-10-support-assistant-source-convergence.md'
  pull_request:
    branches:
      - main
    paths:
      - 'services/support-assistant-service/**'
      - '.github/workflows/support-assistant-source-ci.yml'
      - '.github/workflows/backend-completion-ci.yml'
      - 'docs/handover/2026-09-10-support-assistant-source-convergence.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-assistant-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify isolated source scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          changed="$(git diff --name-only refs/remotes/origin/main...HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^((services/support-assistant-service/.*)|(\.github/workflows/support-assistant-source-ci\.yml)|(\.github/workflows/backend-completion-ci\.yml)|(docs/handover/2026-09-10-support-assistant-source-convergence\.md))$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'ERROR: support-assistant candidate contains unrelated source changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/support-assistant-service/pom.xml

      - name: Maven clean verify
        working-directory: services/support-assistant-service
        run: mvn -B -ntp clean verify

      - name: Validate repository and Docker safety
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/scan-secret-material.sh services/support-assistant-service
          bash scripts/release/validate-dockerfiles.sh services/support-assistant-service
          python scripts/release/validate-flyway-migrations.py

      - name: Verify fail-closed AI and privacy invariants
        shell: bash
        run: |
          set -euo pipefail
          ROOT='services/support-assistant-service'
          APP="$ROOT/src/main/resources/application.yml"
          CLIENT="$ROOT/src/main/java/in/craves/supportassistant/ai/AzureFoundryResponsesClient.java"
          CONTEXT="$ROOT/src/main/java/in/craves/supportassistant/context/SupportContextGateway.java"
          PROMPT="$ROOT/src/main/java/in/craves/supportassistant/ai/SupportPromptBuilder.java"
          SERVICE="$ROOT/src/main/java/in/craves/supportassistant/service/SupportAssistantService.java"
          SECURITY="$ROOT/src/main/java/in/craves/supportassistant/config/SecurityConfig.java"
          MIGRATION="$ROOT/src/main/resources/db/migration/V1__support_assistant_foundation.sql"

          grep -Fq 'enabled: ${CRAVES_SUPPORT_AI_ENABLED:false}' "$APP"
          grep -Fq 'token-scope: ${CRAVES_SUPPORT_AI_TOKEN_SCOPE:https://cognitiveservices.azure.com/.default}' "$APP"
          grep -Fq 'allowed-hosts: ${CRAVES_SUPPORT_DOWNSTREAM_ALLOWED_HOSTS:api.craves.in}' "$APP"
          grep -Fq 'https://cognitiveservices.azure.com/.default' "$CLIENT"
          grep -Fq 'https://ai.azure.com/.default' "$CLIENT"
          grep -Fq '.openai.azure.com' "$CLIENT"
          grep -Fq '.services.ai.azure.com' "$CLIENT"
          grep -Fq 'HttpClient.Redirect.NEVER' "$CLIENT"
          grep -Fq 'payload.put("store", false)' "$CLIENT"
          grep -Fq 'max_output_tokens' "$CLIENT"
          grep -Fq 'HttpClient.Redirect.NEVER' "$CONTEXT"
          grep -Fq 'getAllowedHosts()' "$CONTEXT"
          grep -Fq 'uri.getUserInfo()' "$CONTEXT"
          grep -Fq 'This model has no mutation authority' "$PROMPT"
          grep -Fq 'sha256(question)' "$SERVICE"
          grep -Fq '.requestMatchers("/actuator/health", "/actuator/health/**").permitAll()' "$SECURITY"
          grep -Fq 'never raw user prompts or model answers' "$MIGRATION"

          if grep -REn '(AZURE_OPENAI_API_KEY|api-key[[:space:]]*:|api_key[[:space:]]*=)' \
            "$ROOT/src/main" "$ROOT/Dockerfile"; then
            echo 'ERROR: model API-key authentication is present; managed identity is required.' >&2
            exit 1
          fi

          if grep -REn '(tools[[:space:]]*[=:]|function_call|computer_use|web_search)' "$ROOT/src/main/java"; then
            echo 'ERROR: support model tool/action capability is present.' >&2
            exit 1
          fi

          if grep -REn '(log\.(info|debug|warn|error|trace)\([^\n]*(message|question|answer|authorization)|System\.out|printStackTrace)' \
            "$ROOT/src/main/java"; then
            echo 'ERROR: support source may log raw prompt, answer or authorization data.' >&2
            exit 1
          fi

          if grep -REn '(raw_prompt|raw_question|model_answer|response_text)[[:space:]]' "$ROOT/src/main/resources/db/migration"; then
            echo 'ERROR: support schema attempts to persist raw conversational content.' >&2
            exit 1
          fi

          echo 'Support Assistant fail-closed, managed-identity, privacy and no-tool invariants passed.'

      - name: Upload tested JAR and reports
        uses: actions/upload-artifact@v4
        with:
          name: craves-support-assistant-source-candidate
          path: |
            services/support-assistant-service/target/support-assistant-service-*.jar
            services/support-assistant-service/target/surefire-reports/**
          if-no-files-found: error
          retention-days: 14
