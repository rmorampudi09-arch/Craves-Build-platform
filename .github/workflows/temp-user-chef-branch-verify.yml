name: Temporary User Chef Branch Verify

on:
  push:
    branches:
      - web-ui-rebuild-from-scratch
    paths:
      - 'services/user-chef-service/**'
      - '.github/workflows/temp-user-chef-branch-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-chef-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/user-chef-service/pom.xml
      - run: mvn -B -ntp clean verify
