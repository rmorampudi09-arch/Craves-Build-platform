trigger:
  branches:
    include:
      - web-ui-rebuild-from-scratch
  paths:
    include:
      - apps/customer-web-next/**

pr: none

variables:
  azureServiceConnection: Craves-Dev-Service-Connection
  subscriptionId: 4f897b61-9b52-44b4-8cf1-bdac281cc1aa
  resourceGroup: rg-craves-prodlow-centralindia
  keyVaultName: kvcravesprodlowl3ing6
  firebaseServiceAccountSecret: craves-auth-firebase-service-account-json-base64
  acrName: cravesprodlowacr82121
  containerAppName: ca-craves-web-ui-test
  productionContainerAppName: ca-craves-web-prodlow
  appPath: apps/customer-web-next
  imageRepository: craves/customer-web-next
  apiBaseUrl: https://api.craves.in/api/v1
  testFqdn: ca-craves-web-ui-test.happysand-aedc7165.centralindia.azurecontainerapps.io

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: NodeTool@0
    displayName: Use Node.js 24
    inputs:
      versionSpec: 24.x

  - task: AzureCLI@2
    displayName: Resolve Firebase Web config from Key Vault
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        EXPECTED_SUBSCRIPTION='$(subscriptionId)'
        VAULT='$(keyVaultName)'
        SERVICE_ACCOUNT_SECRET='$(firebaseServiceAccountSecret)'

        az account set --subscription "$EXPECTED_SUBSCRIPTION"
        ACTIVE_SUBSCRIPTION=$(az account show --query id -o tsv --only-show-errors)
        [[ "$ACTIVE_SUBSCRIPTION" == "$EXPECTED_SUBSCRIPTION" ]] || {
          echo "ERROR: Azure service connection is on unexpected subscription $ACTIVE_SUBSCRIPTION." >&2
          exit 2
        }

        WORK_DIR=$(mktemp -d)
        trap 'rm -rf "$WORK_DIR"' EXIT

        SA_VALUE=$(az keyvault secret show \
          --vault-name "$VAULT" \
          --name "$SERVICE_ACCOUNT_SECRET" \
          --query value \
          -o tsv \
          --only-show-errors)

        [[ -n "$SA_VALUE" ]] || {
          echo "ERROR: $SERVICE_ACCOUNT_SECRET is empty in $VAULT." >&2
          exit 2
        }

        SA_JSON="$WORK_DIR/firebase-service-account.json"
        if printf '%s' "$SA_VALUE" | base64 --decode > "$SA_JSON" 2>/dev/null && jq -e . "$SA_JSON" >/dev/null 2>&1; then
          :
        else
          printf '%s' "$SA_VALUE" > "$SA_JSON"
          jq -e . "$SA_JSON" >/dev/null 2>&1 || {
            echo "ERROR: $SERVICE_ACCOUNT_SECRET is neither valid base64 JSON nor raw JSON." >&2
            exit 2
          }
        fi
        chmod 600 "$SA_JSON"

        PROJECT_ID=$(jq -r '.project_id // empty' "$SA_JSON")
        CLIENT_EMAIL=$(jq -r '.client_email // empty' "$SA_JSON")
        PRIVATE_KEY=$(jq -r '.private_key // empty' "$SA_JSON")

        [[ -n "$PROJECT_ID" && -n "$CLIENT_EMAIL" && -n "$PRIVATE_KEY" ]] || {
          echo 'ERROR: Firebase service-account JSON is missing project_id, client_email, or private_key.' >&2
          exit 2
        }

        PRIVATE_KEY_FILE="$WORK_DIR/firebase-private-key.pem"
        printf '%s' "$PRIVATE_KEY" > "$PRIVATE_KEY_FILE"
        chmod 600 "$PRIVATE_KEY_FILE"

        b64url() {
          openssl base64 -A | tr '+/' '-_' | tr -d '='
        }

        NOW=$(date +%s)
        EXP=$((NOW + 3600))
        JWT_HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
        JWT_CLAIMS=$(jq -nc \
          --arg iss "$CLIENT_EMAIL" \
          --arg scope 'https://www.googleapis.com/auth/firebase.readonly' \
          --arg aud 'https://oauth2.googleapis.com/token' \
          --argjson iat "$NOW" \
          --argjson exp "$EXP" \
          '{iss:$iss,scope:$scope,aud:$aud,iat:$iat,exp:$exp}')
        JWT_PAYLOAD=$(printf '%s' "$JWT_CLAIMS" | b64url)
        JWT_UNSIGNED="$JWT_HEADER.$JWT_PAYLOAD"
        JWT_SIGNATURE=$(printf '%s' "$JWT_UNSIGNED" | \
          openssl dgst -sha256 -sign "$PRIVATE_KEY_FILE" -binary | b64url)
        JWT_ASSERTION="$JWT_UNSIGNED.$JWT_SIGNATURE"

        TOKEN_RESPONSE=$(curl -fsS \
          -X POST \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer' \
          --data-urlencode "assertion=$JWT_ASSERTION" \
          'https://oauth2.googleapis.com/token')

        ACCESS_TOKEN=$(jq -r '.access_token // empty' <<<"$TOKEN_RESPONSE")
        [[ -n "$ACCESS_TOKEN" ]] || {
          echo 'ERROR: Could not obtain a Google OAuth access token from the Firebase service account.' >&2
          exit 2
        }

        WEB_APPS=$(curl -fsS \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          "https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/webApps")

        ACTIVE_COUNT=$(jq '[.apps // [] | .[] | select((.state // "ACTIVE") == "ACTIVE")] | length' <<<"$WEB_APPS")
        WEB_APP_NAME=''

        if [[ "$ACTIVE_COUNT" == '1' ]]; then
          WEB_APP_NAME=$(jq -r '.apps[] | select((.state // "ACTIVE") == "ACTIVE") | .name' <<<"$WEB_APPS")
        else
          mapfile -t CRAVES_DOMAIN_MATCHES < <(
            jq -r '[
              .apps // []
              | .[]
              | select((.state // "ACTIVE") == "ACTIVE")
              | select(any(.appUrls[]?; contains("craves.in")))
              | .name
            ] | unique | .[]' <<<"$WEB_APPS"
          )

          if [[ ${#CRAVES_DOMAIN_MATCHES[@]} -eq 1 ]]; then
            WEB_APP_NAME="${CRAVES_DOMAIN_MATCHES[0]}"
          fi
        fi

        if [[ -z "$WEB_APP_NAME" ]]; then
          echo "ERROR: Could not safely choose one Firebase Web App for project $PROJECT_ID." >&2
          echo 'Available active Web Apps:' >&2
          jq -r '.apps[]? | select((.state // "ACTIVE") == "ACTIVE") | "  displayName=\(.displayName // "") appId=\(.appId // "") urls=\((.appUrls // []) | join(","))"' <<<"$WEB_APPS" >&2
          exit 2
        fi

        FIREBASE_CONFIG=$(curl -fsS \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          "https://firebase.googleapis.com/v1beta1/$WEB_APP_NAME/config")

        CONFIG_PROJECT_ID=$(jq -r '.projectId // empty' <<<"$FIREBASE_CONFIG")
        [[ "$CONFIG_PROJECT_ID" == "$PROJECT_ID" ]] || {
          echo "ERROR: Firebase Web config project mismatch. Expected $PROJECT_ID, got $CONFIG_PROJECT_ID." >&2
          exit 2
        }

        export_config() {
          local variable_name="$1"
          local json_field="$2"
          local value
          value=$(jq -r ".${json_field} // empty" <<<"$FIREBASE_CONFIG")
          [[ -n "$value" ]] || {
            echo "ERROR: Firebase Web config is missing $json_field." >&2
            exit 2
          }
          printf '##vso[task.setvariable variable=%s;issecret=true]%s\n' "$variable_name" "$value"
        }

        export_config NEXT_PUBLIC_FIREBASE_API_KEY apiKey
        export_config NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN authDomain
        export_config NEXT_PUBLIC_FIREBASE_PROJECT_ID projectId
        export_config NEXT_PUBLIC_FIREBASE_APP_ID appId
        export_config NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID messagingSenderId
        export_config NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET storageBucket

        echo "Firebase Web configuration resolved from existing Key Vault service account for project $PROJECT_ID."

  - bash: |
      set -euo pipefail

      [[ '$(Build.SourceBranch)' == 'refs/heads/web-ui-rebuild-from-scratch' ]] || {
        echo 'ERROR: This pipeline may only deploy web-ui-rebuild-from-scratch.' >&2
        exit 2
      }

      npm ci --no-audit --no-fund
      npm run lint
      npm run typecheck
      npm run test
      npm run build
    displayName: Verify Web Next UI
    workingDirectory: $(Build.SourcesDirectory)/$(appPath)
    env:
      CRAVES_API_BASE_URL: $(apiBaseUrl)
      NEXT_PUBLIC_FIREBASE_API_KEY: $(NEXT_PUBLIC_FIREBASE_API_KEY)
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: $(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: $(NEXT_PUBLIC_FIREBASE_PROJECT_ID)
      NEXT_PUBLIC_FIREBASE_APP_ID: $(NEXT_PUBLIC_FIREBASE_APP_ID)
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: $(NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: $(NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)
      NEXT_PUBLIC_RAZORPAY_MODE: sandbox
      NEXT_PUBLIC_CRAVES_ALLOW_CATALOG_FALLBACK: 'false'

  - task: AzureCLI@2
    displayName: Build image, configure test app, deploy and verify
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        EXPECTED_SUBSCRIPTION='$(subscriptionId)'
        RG='$(resourceGroup)'
        ACR='$(acrName)'
        APP='$(containerAppName)'
        PROD_APP='$(productionContainerAppName)'
        APP_PATH='$(Build.SourcesDirectory)/$(appPath)'
        IMAGE_REPOSITORY='$(imageRepository)'
        API_BASE_URL='$(apiBaseUrl)'
        EXPECTED_FQDN='$(testFqdn)'

        [[ "$APP" == 'ca-craves-web-ui-test' ]] || {
          echo "ERROR: Unexpected deployment target: $APP" >&2
          exit 2
        }
        [[ "$APP" != "$PROD_APP" ]] || {
          echo 'ERROR: Production Container App deployment is blocked by this pipeline.' >&2
          exit 2
        }
        [[ '$(Build.SourceBranch)' == 'refs/heads/web-ui-rebuild-from-scratch' ]] || {
          echo 'ERROR: Unexpected source branch.' >&2
          exit 2
        }

        az account set --subscription "$EXPECTED_SUBSCRIPTION"
        ACTIVE_SUBSCRIPTION=$(az account show --query id -o tsv --only-show-errors)
        [[ "$ACTIVE_SUBSCRIPTION" == "$EXPECTED_SUBSCRIPTION" ]] || {
          echo "ERROR: Unexpected Azure subscription $ACTIVE_SUBSCRIPTION." >&2
          exit 2
        }

        az containerapp show \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$APP" \
          -o none \
          --only-show-errors || {
            echo "ERROR: Test Container App $APP does not exist. Production will not be used as a fallback." >&2
            exit 2
          }

        CURRENT_FQDN=$(az containerapp show \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$APP" \
          --query properties.configuration.ingress.fqdn \
          -o tsv \
          --only-show-errors)

        [[ "$CURRENT_FQDN" == "$EXPECTED_FQDN" ]] || {
          echo "ERROR: Test Container App FQDN does not match the approved test target." >&2
          exit 2
        }

        LOGIN_SERVER=$(az acr show \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$ACR" \
          --query loginServer \
          -o tsv \
          --only-show-errors)

        TAG="ui-test-$(Build.BuildId)-$(Build.SourceVersion)"
        IMAGE="$LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"

        echo "Building isolated Web Next test image: $IMAGE"
        az acr login --name "$ACR" --only-show-errors

        docker build \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$NEXT_PUBLIC_FIREBASE_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$NEXT_PUBLIC_FIREBASE_PROJECT_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$NEXT_PUBLIC_FIREBASE_APP_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET" \
          --build-arg NEXT_PUBLIC_RAZORPAY_MODE=sandbox \
          --build-arg NEXT_PUBLIC_CRAVES_ALLOW_CATALOG_FALLBACK=false \
          --label org.opencontainers.image.revision='$(Build.SourceVersion)' \
          -t "$IMAGE" \
          "$APP_PATH"

        docker push "$IMAGE"

        az containerapp identity assign \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$APP" \
          --system-assigned \
          -o none \
          --only-show-errors

        PRINCIPAL_ID=$(az containerapp show \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$APP" \
          --query identity.principalId \
          -o tsv \
          --only-show-errors)

        ACR_ID=$(az acr show \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$ACR" \
          --query id \
          -o tsv \
          --only-show-errors)

        ACR_PULL_COUNT=$(az role assignment list \
          --assignee "$PRINCIPAL_ID" \
          --scope "$ACR_ID" \
          --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
          -o tsv \
          --only-show-errors || printf '0')

        if [[ "$ACR_PULL_COUNT" == '0' ]]; then
          echo 'Granting AcrPull to the isolated test Container App identity.'
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --assignee-principal-type ServicePrincipal \
            --role AcrPull \
            --scope "$ACR_ID" \
            -o none \
            --only-show-errors
        fi

        az containerapp registry set \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$APP" \
          --server "$LOGIN_SERVER" \
          --identity system \
          -o none \
          --only-show-errors

        PROD_ENV_JSON=$(az containerapp show \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$PROD_APP" \
          --query properties.template.containers[0].env \
          -o json \
          --only-show-errors)

        MAPS_CLIENT_ID=$(jq -r '[.[]? | select(.name=="AZURE_MAPS_CLIENT_ID") | .value][0] // empty' <<<"$PROD_ENV_JSON")
        MAPS_ENDPOINT=$(jq -r '[.[]? | select(.name=="AZURE_MAPS_ENDPOINT") | .value][0] // empty' <<<"$PROD_ENV_JSON")

        ENV_ARGS=(
          "CRAVES_API_BASE_URL=$API_BASE_URL"
          'NEXT_PUBLIC_RAZORPAY_MODE=sandbox'
          'NEXT_PUBLIC_CRAVES_ALLOW_CATALOG_FALLBACK=false'
          "CRAVES_BUILD_SHA=$(Build.SourceVersion)"
        )
        [[ -n "$MAPS_CLIENT_ID" ]] && ENV_ARGS+=("AZURE_MAPS_CLIENT_ID=$MAPS_CLIENT_ID")
        [[ -n "$MAPS_ENDPOINT" ]] && ENV_ARGS+=("AZURE_MAPS_ENDPOINT=$MAPS_ENDPOINT")

        az containerapp ingress update \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$APP" \
          --type external \
          --target-port 3000 \
          --allow-insecure false \
          -o none \
          --only-show-errors

        az containerapp update \
          --subscription "$EXPECTED_SUBSCRIPTION" \
          --resource-group "$RG" \
          --name "$APP" \
          --image "$IMAGE" \
          --min-replicas 1 \
          --max-replicas 1 \
          --set-env-vars "${ENV_ARGS[@]}" \
          -o none \
          --only-show-errors

        for ATTEMPT in $(seq 1 30); do
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$EXPECTED_FQDN/" || true)
          if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
            echo "UI test deployment is live: https://$EXPECTED_FQDN/"
            echo "Image: $IMAGE"
            exit 0
          fi
          echo "Waiting for UI test revision readiness ($ATTEMPT/30, HTTP $STATUS)..."
          sleep 10
        done

        echo 'ERROR: UI test Container App did not become ready. Production was never targeted.' >&2
        exit 2
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: $(NEXT_PUBLIC_FIREBASE_API_KEY)
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: $(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: $(NEXT_PUBLIC_FIREBASE_PROJECT_ID)
      NEXT_PUBLIC_FIREBASE_APP_ID: $(NEXT_PUBLIC_FIREBASE_APP_ID)
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: $(NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: $(NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)
