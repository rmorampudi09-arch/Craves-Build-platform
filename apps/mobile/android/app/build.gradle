apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is empty.
    // cliFile = file(../rn-cli.config.js)

    /* Variants */
    //   The list of variants that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    debuggableVariants = ["customerDebug", "customerDebugOptimized", "riderDebug", "riderDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * Rider CI only: .github/workflows/rider-apk.yml runs assembleRiderRelease with -PcravesRiderMinify=true (R8, and every
 * language in the Play bundle) and -PcravesVersionCode=<run number>. Nothing else passes them, so the customer build is unchanged.
 */
def cravesRiderMinify = project.findProperty('cravesRiderMinify')?.toString() == 'true'
def cravesVersionCode = project.findProperty('cravesVersionCode')?.toString()
/**
 * Rider CI, mock (demo data) builds only: -PcravesRiderDemo=true makes the demo its own app, com.cravesapp.rider.demo named
 * "Craves Rider Demo", installed beside the real one, so a demo APK can never replace or pass for the rider app.
 */
def cravesRiderDemo = project.findProperty('cravesRiderDemo')?.toString() == 'true'

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def rnfbAndroidSdk = new groovy.json.JsonSlurper()
    .parse(file('../../node_modules/@react-native-firebase/app/package.json')).sdkVersions.android

/**
 * Release signing is intentionally external to source. P127 only prepares a
 * fail-closed configuration boundary; P128/secure CI must inject all four
 * values before producing the final signed APK/AAB.
 */
def releaseStoreFile = System.getenv('CRAVES_ANDROID_KEYSTORE_PATH') ?: project.findProperty('CRAVES_ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('CRAVES_ANDROID_KEYSTORE_PASSWORD') ?: project.findProperty('CRAVES_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('CRAVES_ANDROID_KEY_ALIAS') ?: project.findProperty('CRAVES_ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CRAVES_ANDROID_KEY_PASSWORD') ?: project.findProperty('CRAVES_ANDROID_KEY_PASSWORD')
def hasReleaseSigningConfig = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.toString().trim().isEmpty() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cravesapp"
    defaultConfig {
        applicationId "com.cravesapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        buildConfig true
    }
    // A rider Play bundle keeps every language: RiderText shows the language the rider picked in the app (P2-08), and Play
    // would deliver only the phone's. Rider CI builds only (cravesRiderMinify), so the customer bundle keeps its splits.
    bundle {
        language {
            enableSplit = !cravesRiderMinify
        }
    }
    // One codebase, two apps: the customer app keeps com.cravesapp; the rider app installs side by side.
    flavorDimensions "app"
    productFlavors {
        customer {
            dimension "app"
            applicationId "com.cravesapp"
            buildConfigField "String", "CRAVES_APP", "\"customer\""
        }
        rider {
            dimension "app"
            applicationId "com.cravesapp.rider"
            if (cravesRiderDemo) {
                applicationIdSuffix ".demo"
            }
            // The launcher name (src/rider/AndroidManifest.xml).
            manifestPlaceholders += [riderLabel: cravesRiderDemo ? "Craves Rider Demo" : "@string/app_name"]
            // Keep in step with RIDER_APP_VERSION in src/features/rider/riderConfig.ts; rider-apk.yml fails the build otherwise.
            versionName "1.3.1"
            buildConfigField "String", "CRAVES_APP", "\"rider\""
            // react-native-config looks up BuildConfig by applicationId unless told the namespace.
            resValue "string", "build_config_package", "com.cravesapp"
            if (cravesVersionCode != null) {
                // Each CI build installs over the last one (and Play needs a higher code for every upload).
                versionCode cravesVersionCode.toInteger()
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigningConfig) {
            release {
                storeFile file(releaseStoreFile.toString())
                storePassword releaseStorePassword.toString()
                keyAlias releaseKeyAlias.toString()
                keyPassword releaseKeyPassword.toString()
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds || cravesRiderMinify
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Rider app only (android/app/src/rider): the online service and offer pushes. Never the customer flavor or src/main.
    riderImplementation("com.google.android.gms:play-services-location:21.3.0")
    // The Firebase BOM @react-native-firebase/app uses, so both resolve one set of Firebase libraries.
    riderImplementation(platform("com.google.firebase:firebase-bom:${rnfbAndroidSdk.firebase}"))
    riderImplementation("com.google.firebase:firebase-messaging")
    // The sign-in code from its SMS (RiderSmsCodeModule, SMS User Consent API). Already in the APK through Firebase Auth;
    // declared so rider code compiles against it. Gradle keeps the newer version Firebase Auth asks for.
    riderImplementation("com.google.android.gms:play-services-auth-api-phone:18.0.1")
    // The selfie face check (RiderDeviceModule.checkFace). The bundled model works offline from the first selfie; the
    // Play services one would download first, and a check that can't run lets the selfie through.
    riderImplementation("com.google.mlkit:face-detection:16.1.7")
    // Tests only, never in the APK: the native trip outbox's rules (src/testRider, RiderOutboxCoreTest).
    testRiderImplementation("junit:junit:4.13.2")
}
