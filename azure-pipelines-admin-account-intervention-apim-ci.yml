trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - script: |
      set -euo pipefail
      bash -n scripts/apim/configure-admin-account-intervention-apim.sh
      bash -n scripts/apim/status-admin-account-intervention-apim.sh
      bash -n scripts/apim/rollback-admin-account-intervention-apim.sh
      POLICY='infra/apim/admin-account-intervention/authenticated-policy.xml'
      CONFIG='scripts/apim/configure-admin-account-intervention-apim.sh'
      grep -q 'CONFIRM_APIM_WRITE' "$CONFIG"
      grep -q 'post-admin-account-suspend' "$CONFIG"
      grep -q 'post-admin-account-reactivate' "$CONFIG"
      grep -q 'set-backend-service base-url=' "$POLICY"
      grep -q 'Bearer' "$POLICY"
      grep -q 'no-store' "$POLICY"
      if grep -En 'set-backend-service[[:space:]]+backend-id=|set-header name="Authorization"' "$POLICY"; then
        echo 'ERROR: Unsafe APIM policy behavior detected.' >&2
        exit 1
      fi
      echo 'Admin account intervention APIM static gates passed.'
    displayName: Verify APIM safety and syntax
