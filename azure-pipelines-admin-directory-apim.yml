trigger: none
pr: none

parameters:
  - name: confirmApimWrite
    type: boolean
    default: false
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: apimName
    type: string
    default: apim-craves-prodlow-l3ing6
  - name: userChefContainerAppName
    type: string
    default: ca-craves-user-chef-service-prod

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false

  - script: |
      set -euo pipefail
      chmod +x scripts/apim/configure-admin-directory-apim.sh
      bash -n scripts/apim/configure-admin-directory-apim.sh
    displayName: Validate admin directory APIM script

  - task: AzureCLI@2
    displayName: Configure admin directory APIM operations
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/configure-admin-directory-apim.sh
    env:
      RG: ${{ parameters.resourceGroupName }}
      APIM: ${{ parameters.apimName }}
      USER_CHEF_APP: ${{ parameters.userChefContainerAppName }}
      CONFIRM_APIM_WRITE: ${{ parameters.confirmApimWrite }}
