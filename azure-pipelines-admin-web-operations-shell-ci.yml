trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      cd apps/customer-web-next
      npm install --ignore-scripts
      npm run typecheck
      npm run test
    displayName: Typecheck and test admin shell
  - script: |
      set -euo pipefail
      grep -q "roles.includes('ADMIN')" apps/customer-web-next/src/lib/admin-session-contract.ts
      if grep -REn '(localStorage|sessionStorage|console\.(log|debug)|phoneNumber|email)' \
        apps/customer-web-next/src/app/admin \
        apps/customer-web-next/src/app/api/admin \
        apps/customer-web-next/src/components/admin-operations-shell.tsx; then
        echo 'ERROR: Admin shell exposes private data, browser token storage or debug logging.' >&2
        exit 1
      fi
      echo 'Admin shell role and privacy gates passed.'
    displayName: Verify admin shell safety gates
