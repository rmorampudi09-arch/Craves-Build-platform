trigger: none
pr: none

parameters:
  - name: resourceGroup
    type: string
    default: ''
  - name: acrName
    type: string
    default: ''
  - name: containerAppName
    type: string
    default: ''
  - name: confirmIsolatedDiagnosticTargets
    displayName: Confirm app, resource group and registry are existing isolated test resources
    type: boolean
    default: false
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: apps/api-test-dashboard
  imageRepository: craves/api-test-dashboard
  azureServiceConnection: $(AZURE_SERVICE_CONNECTION)
  apimBaseUrl: https://api.craves.in

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  # This source-only step runs before AzureCLI task authentication or any build/push.
  - script: |
      set -euo pipefail
      echo '##vso[task.setvariable variable=diagnosticTargetsValidated]false'
      bash scripts/release/validate-diagnostic-target.sh
      echo '##vso[task.setvariable variable=diagnosticTargetsValidated]true'
    displayName: Require explicit isolated diagnostic destinations
    env:
      DIAGNOSTIC_RESOURCE_GROUP: '${{ parameters.resourceGroup }}'
      DIAGNOSTIC_CONTAINER_APP: '${{ parameters.containerAppName }}'
      DIAGNOSTIC_REGISTRY: '${{ parameters.acrName }}'
      CONFIRM_ISOLATED_DIAGNOSTIC_TARGETS: '${{ parameters.confirmIsolatedDiagnosticTargets }}'
      DIAGNOSTIC_IMAGE_TAG: '${{ parameters.imageTag }}'

  - task: AzureCLI@2
    displayName: Build and push API test dashboard image
    env:
      DIAGNOSTIC_RESOURCE_GROUP: '${{ parameters.resourceGroup }}'
      DIAGNOSTIC_CONTAINER_APP: '${{ parameters.containerAppName }}'
      DIAGNOSTIC_REGISTRY: '${{ parameters.acrName }}'
      CONFIRM_ISOLATED_DIAGNOSTIC_TARGETS: '${{ parameters.confirmIsolatedDiagnosticTargets }}'
      DIAGNOSTIC_IMAGE_TAG: '${{ parameters.imageTag }}'
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        bash scripts/release/validate-diagnostic-target.sh

        ACR_LOGIN_SERVER=$(az acr show \
          --name "${{ parameters.acrName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --query loginServer \
          -o tsv)

        IMAGE="${ACR_LOGIN_SERVER}/$(imageRepository):${DIAGNOSTIC_IMAGE_TAG}"
        echo "Building ${IMAGE}"

        az acr login --name "${{ parameters.acrName }}"

        docker build \
          -f "$(modulePath)/Dockerfile" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$(NEXT_PUBLIC_FIREBASE_API_KEY)" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$(NEXT_PUBLIC_FIREBASE_PROJECT_ID)" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$(NEXT_PUBLIC_FIREBASE_APP_ID)" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$(NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$(NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)" \
          --build-arg NEXT_PUBLIC_APIM_BASE_URL="$(apimBaseUrl)" \
          -t "${IMAGE}" \
          "$(modulePath)"

        docker push "${IMAGE}"

  - task: AzureCLI@2
    displayName: Deploy API test dashboard to existing web Container App
    env:
      DIAGNOSTIC_RESOURCE_GROUP: '${{ parameters.resourceGroup }}'
      DIAGNOSTIC_CONTAINER_APP: '${{ parameters.containerAppName }}'
      DIAGNOSTIC_REGISTRY: '${{ parameters.acrName }}'
      CONFIRM_ISOLATED_DIAGNOSTIC_TARGETS: '${{ parameters.confirmIsolatedDiagnosticTargets }}'
      DIAGNOSTIC_IMAGE_TAG: '${{ parameters.imageTag }}'
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        bash scripts/release/validate-diagnostic-target.sh

        ACR_LOGIN_SERVER=$(az acr show \
          --name "${{ parameters.acrName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --query loginServer \
          -o tsv)

        IMAGE="${ACR_LOGIN_SERVER}/$(imageRepository):${DIAGNOSTIC_IMAGE_TAG}"
        echo "Deploying ${IMAGE} to ${{ parameters.containerAppName }}"

        az containerapp ingress update \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --type external \
          --target-port 3000 \
          --transport auto \
          -o table

        az containerapp update \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --image "${IMAGE}" \
          --set-env-vars \
            NODE_ENV=production \
            PORT=3000 \
            NEXT_PUBLIC_FIREBASE_API_KEY="$(NEXT_PUBLIC_FIREBASE_API_KEY)" \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)" \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID="$(NEXT_PUBLIC_FIREBASE_PROJECT_ID)" \
            NEXT_PUBLIC_FIREBASE_APP_ID="$(NEXT_PUBLIC_FIREBASE_APP_ID)" \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$(NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)" \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$(NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)" \
            NEXT_PUBLIC_APIM_BASE_URL="$(apimBaseUrl)" \
          -o table

        WEB_FQDN=$(az containerapp ingress show \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --query fqdn \
          -o tsv)

        echo ""
        echo "Craves API Test Dashboard URL: https://${WEB_FQDN}"
        echo "Firebase Authorized domain must include: ${WEB_FQDN}"

  - task: AzureCLI@2
    displayName: Show latest web app logs
    condition: and(always(), eq(variables['diagnosticTargetsValidated'], 'true'))
    env:
      DIAGNOSTIC_RESOURCE_GROUP: '${{ parameters.resourceGroup }}'
      DIAGNOSTIC_CONTAINER_APP: '${{ parameters.containerAppName }}'
      DIAGNOSTIC_REGISTRY: '${{ parameters.acrName }}'
      CONFIRM_ISOLATED_DIAGNOSTIC_TARGETS: '${{ parameters.confirmIsolatedDiagnosticTargets }}'
      DIAGNOSTIC_IMAGE_TAG: '${{ parameters.imageTag }}'
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        bash scripts/release/validate-diagnostic-target.sh
        az containerapp logs show \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --tail 120 || true
