trigger: none
pr: none

parameters:
  - name: resourceGroupName
    displayName: Azure resource group
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    displayName: Azure Container Registry name
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    displayName: Auth Service Container App name
    type: string
    default: ca-craves-auth-service-prodlow
  - name: imageTag
    displayName: Image tag (must equal the full reviewed source SHA)
    type: string
    default: $(Build.SourceVersion)
  - name: academyPublication
    displayName: Guarded Academy-only curriculum publication
    type: boolean
    default: false
  - name: expectedReleaseSha
    displayName: Exact reviewed commit for this release
    type: string
    default: NOT_SELECTED
  - name: academyBaselineSourceSha
    displayName: Source of the last accepted Auth runtime (must match the baseline image)
    type: string
    default: 6691aa2ff663e51a257407b9b1f4b5b7b4ba87d5
  - name: academyExpectedCurrentImage
    displayName: Expected current Auth image; refuse an unexpectedly newer baseline
    type: string
    default: cravesprodlowacr82121.azurecr.io/craves/auth-service@sha256:ffdeb9a3fabc532a4b0bcd6baeff36b5b11188a036d7e353f5a7317150606070

variables:
  modulePath: services/auth-service
  imageRepository: craves/auth-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: false

  - ${{ if eq(parameters.academyPublication, true) }}:
    - bash: |
        set -euo pipefail
        python3 scripts/academy/verify-curriculum.py --git
        python3 scripts/academy/test-release-guard.py
        python3 scripts/academy/release-guard.py source --baseline "$ACADEMY_BASELINE_SOURCE"
        test "$ACADEMY_EXPECTED_SOURCE" = "$(git rev-parse HEAD)"
        test "$TARGET_RG" = rg-craves-prodlow-centralindia
        test "$TARGET_ACR" = cravesprodlowacr82121
        test "$TARGET_APP" = ca-craves-auth-service-prodlow
      displayName: Verify Academy source, exact commit and fixed target
      env:
        ACADEMY_BASELINE_SOURCE: ${{ parameters.academyBaselineSourceSha }}
        ACADEMY_EXPECTED_SOURCE: ${{ parameters.expectedReleaseSha }}
        TARGET_RG: ${{ parameters.resourceGroupName }}
        TARGET_ACR: ${{ parameters.acrName }}
        TARGET_APP: ${{ parameters.containerAppName }}

  - bash: bash scripts/release/verify-reviewed-service-source.sh
    displayName: Verify exact reviewed checkout and image tag
    env:
      EXPECTED_RELEASE_SHA: ${{ parameters.expectedReleaseSha }}
      REQUESTED_IMAGE_TAG: ${{ parameters.imageTag }}

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail
      cd $(modulePath)
      mvn -B -ntp clean verify
    displayName: Maven build and tests

  - ${{ if eq(parameters.academyPublication, true) }}:
    - task: AzureCLI@2
      displayName: Read-only Academy runtime and backup preflight
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          set +x
          python3 scripts/academy/release-guard.py preflight --baseline "$ACADEMY_BASELINE_SOURCE" --evidence "$(Build.ArtifactStagingDirectory)/academy-release"
          DEPLOY_PREFLIGHT_ONLY=true bash scripts/release/deploy-single-service-preserve-runtime.sh \
            rg-craves-prodlow-centralindia ca-craves-auth-service-prodlow "$ACADEMY_EXPECTED_IMAGE" auth
      env:
        ACADEMY_BASELINE_SOURCE: ${{ parameters.academyBaselineSourceSha }}
        ACADEMY_EXPECTED_SOURCE: ${{ parameters.expectedReleaseSha }}
        ACADEMY_EXPECTED_IMAGE: ${{ parameters.academyExpectedCurrentImage }}

  - task: AzureCLI@2
    displayName: Build and push immutable Auth image
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x
        bash scripts/release/verify-reviewed-service-source.sh
        ACR='${{ parameters.acrName }}'
        TAG="$REQUESTED_IMAGE_TAG"
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        az acr login --name "$ACR" --only-show-errors
        docker build --pull --label "org.opencontainers.image.revision=$EXPECTED_RELEASE_SHA" -t "$IMAGE" "$(modulePath)"
        LOCAL_IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')
        docker push "$IMAGE"
        PINNED_IMAGE=$(bash scripts/release/resolve-reviewed-service-image.sh "$ACR" "$(imageRepository)" "$LOCAL_IMAGE_ID")
        echo "##vso[task.setvariable variable=REVIEWED_SERVICE_IMAGE;isReadOnly=true]$PINNED_IMAGE"
        echo "Reviewed image pushed: $PINNED_IMAGE source=$EXPECTED_RELEASE_SHA"
    env:
      EXPECTED_RELEASE_SHA: ${{ parameters.expectedReleaseSha }}
      REQUESTED_IMAGE_TAG: ${{ parameters.imageTag }}
      ACADEMY_PUBLICATION: ${{ parameters.academyPublication }}

  - task: AzureCLI@2
    displayName: Deploy Auth image without changing runtime configuration
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        bash scripts/release/verify-reviewed-service-source.sh
        set +x
        RG='${{ parameters.resourceGroupName }}'
        APP='${{ parameters.containerAppName }}'
        IMAGE="$REVIEWED_SERVICE_IMAGE"
        if [[ "$ACADEMY_PUBLICATION" == True || "$ACADEMY_PUBLICATION" == true ]]; then
          # Recheck the baseline immediately before the image mutation.
          python3 scripts/academy/release-guard.py preflight --baseline "$ACADEMY_BASELINE_SOURCE" --evidence "$(Build.ArtifactStagingDirectory)/academy-release"
        fi
        echo 'Auth Container App readiness window: 1500 seconds (150 x 10s).'
        READY_ATTEMPTS=150 READY_SLEEP_SECONDS=10 \
        bash scripts/release/deploy-single-service-preserve-runtime.sh "$RG" "$APP" "$IMAGE" auth
        if [[ "$ACADEMY_PUBLICATION" == True || "$ACADEMY_PUBLICATION" == true ]]; then
          ACADEMY_EXPECTED_IMAGE="$IMAGE" python3 scripts/academy/release-guard.py postflight \
            --baseline "$ACADEMY_BASELINE_SOURCE" --evidence "$(Build.ArtifactStagingDirectory)/academy-release"
        fi
    env:
      EXPECTED_RELEASE_SHA: ${{ parameters.expectedReleaseSha }}
      REQUESTED_IMAGE_TAG: ${{ parameters.imageTag }}
      REVIEWED_SERVICE_IMAGE: $(REVIEWED_SERVICE_IMAGE)
      REQUIRE_REVIEWED_DIGEST: 'true'
      ACADEMY_PUBLICATION: ${{ parameters.academyPublication }}
      ACADEMY_BASELINE_SOURCE: ${{ parameters.academyBaselineSourceSha }}
      ACADEMY_EXPECTED_SOURCE: ${{ parameters.expectedReleaseSha }}
      ACADEMY_EXPECTED_IMAGE: ${{ parameters.academyExpectedCurrentImage }}

  - ${{ if eq(parameters.academyPublication, true) }}:
    - task: PublishPipelineArtifact@1
      condition: always()
      displayName: Publish sanitized Academy release evidence
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/academy-release
        artifact: academy-release-evidence
