trigger: none
pr: none

parameters:
  - name: confirmation
    type: string
    default: NOT_APPROVED
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: authContainerAppName
    type: string
    default: ca-craves-auth-service-prodlow
  - name: userChefContainerAppName
    type: string
    default: ca-craves-user-chef-service-prodlow
  - name: catalogContainerAppName
    type: string
    default: ca-craves-catalog-service-prodlow
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: subscriptionContainerAppName
    type: string
    default: ca-craves-subscription-service-prodlow
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: notificationContainerAppName
    type: string
    default: ca-craves-notification-service-prodlow

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Return Redis security controls to disabled state
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        if [[ '${{ parameters.confirmation }}' != 'APPROVE_REDIS_SECURITY_ROLLBACK' ]]; then
          echo 'Explicit Redis security rollback confirmation is required.' >&2
          exit 1
        fi

        RG='${{ parameters.resourceGroupName }}'
        AUTH='${{ parameters.authContainerAppName }}'
        apps=(
          "$AUTH"
          '${{ parameters.userChefContainerAppName }}'
          '${{ parameters.catalogContainerAppName }}'
          '${{ parameters.orderContainerAppName }}'
          '${{ parameters.subscriptionContainerAppName }}'
          '${{ parameters.integrationContainerAppName }}'
          '${{ parameters.notificationContainerAppName }}'
        )

        az containerapp update \
          --resource-group "$RG" \
          --name "$AUTH" \
          --set-env-vars CRAVES_AUTH_RATE_LIMIT_ENABLED=false \
          --output none

        for app in "${apps[@]}"; do
          az containerapp update \
            --resource-group "$RG" \
            --name "$app" \
            --set-env-vars CRAVES_TOKEN_REVOCATION_ENABLED=false \
            --output none
        done

        az containerapp update \
          --resource-group "$RG" \
          --name "$AUTH" \
          --set-env-vars CRAVES_TOKEN_REVOCATION_PUBLISHER_ENABLED=false \
          --output none

        echo 'Redis rate limiting, revocation consumers and publisher are disabled.'
        echo 'Auth identities, refresh-session revocations, outbox rows, Redis TTL keys and audit evidence were preserved.'
        echo 'No Redis resource, secret, key or database was deleted.'
