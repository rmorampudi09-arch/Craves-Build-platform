trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - bash: |
      set -euo pipefail
      cd services/integration-service
      mvn -B -ntp -DskipTests=false verify
    displayName: Verify Integration Service Cashfree hardening

  - task: NodeTool@0
    displayName: Use Node.js 24
    inputs:
      versionSpec: 24.x

  - bash: |
      set -euo pipefail
      cd apps/customer-web-next
      npm ci --no-audit --no-fund
      npm run lint
      npm run typecheck
      npm run test
    displayName: Verify Cashfree customer-web contracts and legal routes

  - bash: |
      set -euo pipefail
      properties=services/integration-service/src/main/java/in/craves/integration/config/PaymentProviderProperties.java
      inbox=services/integration-service/src/main/java/in/craves/integration/payment/CashfreeWebhookInboxService.java
      dispatcher=services/integration-service/src/main/java/in/craves/integration/payment/CashfreeWebhookDispatcher.java
      verifier=services/integration-service/src/main/java/in/craves/integration/payment/CashfreeWebhookProviderVerifier.java
      safety=services/integration-service/src/main/java/in/craves/integration/payment/CashfreeRequestSafety.java
      checkout=services/integration-service/src/main/java/in/craves/integration/service/PaymentService.java
      subscription=services/integration-service/src/main/java/in/craves/integration/subscription/SubscriptionPaymentService.java
      activation=azure-pipelines-cashfree-production-activation.yml

      grep -Fq '${CRAVES_CASHFREE_PRODUCTION_ACTIVATION_APPROVED:false}' "$properties"
      grep -Fq '${CRAVES_CASHFREE_PRODUCTION_PAYMENT_EXECUTION_ENABLED:false}' "$properties"
      grep -Fq 'worker-enabled: ${CRAVES_CASHFREE_WEBHOOK_WORKER_ENABLED:false}' \
        services/integration-service/src/main/resources/application.yml
      grep -Fq 'FOR UPDATE SKIP LOCKED' "$inbox"
      grep -Fq 'providerVerifier.verifySuccessfulPayment(payload);' "$dispatcher"
      grep -Fq '/pg/orders/{orderId}/payments/{paymentId}' "$verifier"

      grep -Fq '.header("x-idempotency-key", checkout.id().toString())' "$checkout"
      grep -Fq 'CashfreeRequestSafety.normalizeIndianPhone' "$checkout"
      grep -Fq 'CashfreeRequestSafety.safeReturnUrl' "$checkout"
      grep -Fq 'CashfreeRequestSafety.requireCreateOrderResponse' "$checkout"
      grep -Fq 'CashfreeRequestSafety.requireMoney' "$checkout"
      grep -Fq 'paidTransition' "$checkout"

      grep -Fq 'CashfreeRequestSafety.normalizeIndianPhone' "$subscription"
      grep -Fq 'CashfreeRequestSafety.safeReturnUrl' "$subscription"
      grep -Fq 'CashfreeRequestSafety.requireCreateOrderResponse' "$subscription"
      grep -Fq 'Customer phone must be a valid 10-digit Indian mobile number' "$safety"
      grep -Fq 'Payment return URL must use the configured Craves domain' "$safety"

      test -f apps/customer-web-next/src/app/contact/page.tsx
      test -f apps/customer-web-next/src/app/terms/page.tsx
      test -f apps/customer-web-next/src/app/refunds-cancellations/page.tsx
      test -f apps/customer-web-next/src/app/privacy/page.tsx
      test -f apps/customer-web-next/src/app/security/page.tsx
      test -f apps/customer-web-next/src/app/api/readiness/cashfree/route.ts
      grep -Fq 'data-craves-policy-status={policyStatus}' \
        apps/customer-web-next/src/components/legal/PublicPolicyPage.tsx
      grep -Fq 'cashfreeMode === "production"' \
        apps/customer-web-next/src/app/api/readiness/cashfree/route.ts
      grep -Fq "'/api/readiness/cashfree'" <(sed 's/"/\x27/g' "$activation") || \
        grep -Fq '/api/readiness/cashfree' "$activation"
      grep -Fq 'Customer web is not built in Cashfree production mode.' "$activation"
      grep -Fq 'data-craves-policy-status=\"approved\"' "$activation"
    displayName: Verify production payment, customer-web and policy safety guards
