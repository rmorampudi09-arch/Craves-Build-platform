trigger: none
pr: none

parameters:
  - name: confirmDisableCashfreeProduction
    type: boolean
    default: false

variables:
  resourceGroup: rg-craves-prodlow-centralindia
  containerApp: ca-craves-integration-service-pr

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none

  - ${{ if eq(parameters.confirmDisableCashfreeProduction, true) }}:
    - task: AzureCLI@2
      displayName: Disable Cashfree production execution
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az containerapp update -g '$(resourceGroup)' -n '$(containerApp)' \
            --set-env-vars \
              CRAVES_CASHFREE_PRODUCTION_PAYMENT_EXECUTION_ENABLED=false \
              CRAVES_CASHFREE_WEBHOOK_WORKER_ENABLED=false \
              CRAVES_REFUND_PROVIDER_EXECUTION_ENABLED=false \
              CRAVES_REFUND_RECONCILIATION_ENABLED=false >/dev/null
          values="$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query 'properties.template.containers[0].env' -o json)"
          for name in CRAVES_CASHFREE_PRODUCTION_PAYMENT_EXECUTION_ENABLED CRAVES_CASHFREE_WEBHOOK_WORKER_ENABLED CRAVES_REFUND_PROVIDER_EXECUTION_ENABLED CRAVES_REFUND_RECONCILIATION_ENABLED; do
            value="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .value' <<<"$values" | tail -1)"
            [[ "$value" == 'false' ]] || { echo "$name did not return to false." >&2; exit 2; }
          done

  - ${{ if ne(parameters.confirmDisableCashfreeProduction, true) }}:
    - bash: |
        echo 'confirmDisableCashfreeProduction must be true.' >&2
        exit 2
      displayName: Block unconfirmed Cashfree rollback
