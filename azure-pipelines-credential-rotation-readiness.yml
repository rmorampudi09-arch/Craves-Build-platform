trigger: none
pr: none

parameters:
  - name: resourceGroupName
    displayName: Existing resource group
    type: string
    default: rg-craves-prodlow-centralindia
  - name: keyVaultName
    displayName: Existing Key Vault
    type: string
    default: kvcravesprodlowl3ing6
  - name: storageAccountName
    displayName: Existing Storage account
    type: string
    default: stcravesprodlowl3ing6
  - name: postgresServerName
    displayName: Existing PostgreSQL Flexible Server
    type: string
    default: pg-craves-prodlow-l3ing6

pool:
  vmImage: ubuntu-latest

stages:
  - stage: CredentialRotationReadiness
    displayName: Read-only credential rotation readiness
    jobs:
      - job: VerifyReadiness
        displayName: Verify identities, RBAC, health and secret bindings
        steps:
          - checkout: self
            persistCredentials: false
            fetchDepth: 1

          - task: AzureCLI@2
            displayName: Inspect rotation readiness without mutation
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                set +x

                OUTPUT_DIR='$(Build.ArtifactStagingDirectory)/credential-rotation-readiness'
                STATUS_FILE='$(Agent.TempDirectory)/credential-rotation-readiness-status.txt'
                mkdir -p "$OUTPUT_DIR"
                chmod +x scripts/release/verify-credential-rotation-readiness.sh

                set +e
                scripts/release/verify-credential-rotation-readiness.sh \
                  '${{ parameters.resourceGroupName }}' \
                  '${{ parameters.keyVaultName }}' \
                  '${{ parameters.storageAccountName }}' \
                  '${{ parameters.postgresServerName }}' \
                  'config/production/azure-resource-inventory.json' \
                  "$OUTPUT_DIR"
                RC=$?
                set -e

                printf '%s\n' "$RC" >"$STATUS_FILE"
                echo 'Read-only inspection completed; publishing sanitized readiness evidence.'
                exit 0

          - task: PublishPipelineArtifact@1
            displayName: Publish sanitized rotation-readiness evidence
            condition: always()
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/credential-rotation-readiness
              artifact: credential-rotation-readiness

          - bash: |
              set -euo pipefail
              STATUS_FILE='$(Agent.TempDirectory)/credential-rotation-readiness-status.txt'
              [[ -f "$STATUS_FILE" ]] || {
                echo 'ERROR: rotation-readiness status file is missing.' >&2
                exit 1
              }
              RC=$(cat "$STATUS_FILE")
              if [[ "$RC" != '0' ]]; then
                echo 'ERROR: credential rotation is not ready. Download the sanitized artifact and resolve its blockers before any rotation.' >&2
                exit "$RC"
              fi
              echo 'Credential rotation preflight passed with zero blockers.'
              echo 'No Azure resource, secret value, Container App revision, Storage key, or PostgreSQL password was changed.'
            displayName: Enforce zero-blocker rotation gate
            condition: always()
