trigger: none
pr: none
parameters:
  - name: confirmConfigureCustomerAddresses
    type: boolean
    default: false
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - script: |
      set -euo pipefail
      CONFIRM='${{ parameters.confirmConfigureCustomerAddresses }}'
      [[ "${CONFIRM,,}" == 'true' ]] || { echo 'ERROR: confirmConfigureCustomerAddresses must be true.' >&2; exit 1; }
    displayName: Confirm customer address APIM change
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/configure-customer-addresses-apim.sh
    displayName: Configure customer address APIM operations
