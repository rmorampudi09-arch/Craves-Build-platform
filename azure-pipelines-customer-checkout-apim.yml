trigger: none
pr: none

parameters:
  - name: confirmConfigureCustomerCheckout
    type: boolean
    default: false
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: apimServiceName
    type: string
    default: apim-craves-prodlow-l3ing6
  - name: orderServiceContainerApp
    type: string
    default: ca-craves-order-service-prodlow

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  expectedSubscriptionId: 4f897b61-9b52-44b4-8cf1-bdac281cc1aa

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - script: |
      set -euo pipefail
      CONFIRM='${{ parameters.confirmConfigureCustomerCheckout }}'
      [[ "${CONFIRM,,}" == 'true' ]] || {
        echo 'ERROR: confirmConfigureCustomerCheckout must be true.' >&2
        exit 1
      }
      bash -n scripts/apim/configure-customer-checkout-apim.sh
      python3 - <<'PY'
      import xml.etree.ElementTree as ET
      ET.parse('infra/apim/customer-checkout/customer-checkout-policy.xml')
      print('Customer checkout APIM policy XML is valid.')
      PY
    displayName: Confirm and validate customer checkout APIM change

  - task: AzureCLI@2
    displayName: Configure and verify customer checkout APIM operations
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az account set --subscription '$(expectedSubscriptionId)'
        ACTIVE_SUBSCRIPTION_ID=$(az account show --query id -o tsv --only-show-errors)
        [[ "$ACTIVE_SUBSCRIPTION_ID" == '$(expectedSubscriptionId)' ]] || {
          echo "ERROR: Azure CLI is using subscription $ACTIVE_SUBSCRIPTION_ID instead of $(expectedSubscriptionId)." >&2
          exit 3
        }

        chmod +x scripts/apim/configure-customer-checkout-apim.sh
        RG='${{ parameters.resourceGroupName }}' \
        APIM='${{ parameters.apimServiceName }}' \
        ORDER_APP='${{ parameters.orderServiceContainerApp }}' \
        scripts/apim/configure-customer-checkout-apim.sh
