trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection

steps:
  - checkout: self
    persistCredentials: false
    fetchDepth: 1

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: NodeTool@0
    displayName: Use Node.js 24
    inputs:
      versionSpec: '24.x'

  - script: |
      set -euo pipefail
      chmod +x scripts/release/*.sh
      scripts/release/verify-seven-service-deployment-contracts.sh
    displayName: Verify seven-service deployment contracts

  - script: |
      set -euo pipefail
      services=(
        auth-service
        user-chef-service
        catalog-service
        order-service
        subscription-service
        integration-service
        notification-service
      )
      for service in "${services[@]}"; do
        echo "=== Maven verify: ${service} ==="
        (cd "services/${service}" && mvn -B -ntp clean verify)
      done
    displayName: Maven verify seven Java backend services

  - script: |
      set -euo pipefail
      scripts/release/scan-secret-material.sh .
      scripts/release/validate-dockerfiles.sh .
      python3 scripts/release/validate-flyway-migrations.py
      scripts/release/validate-apim-assets.sh .
      scripts/release/validate-rollback-readiness.sh .
    displayName: Validate release source, schemas, APIM and rollback safety

  - script: |
      set -euo pipefail
      npm --prefix apps/customer-web-next ci
      npm --prefix apps/customer-web-next run verify
    displayName: Validate customer web experience build
