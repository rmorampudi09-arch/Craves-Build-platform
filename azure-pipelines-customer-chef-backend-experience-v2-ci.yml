trigger: none
pr: none

parameters:
  - name: enforceBackendOnlyDiff
    type: boolean
    default: true

pool:
  vmImage: ubuntu-latest

jobs:
  - job: backend_scope_guard
    displayName: Backend-only release scope guard
    steps:
      - checkout: self
        fetchDepth: 0
      - ${{ if eq(parameters.enforceBackendOnlyDiff, true) }}:
        - bash: |
            set -euo pipefail
            git fetch origin main --depth=1
            CHANGED=$(git diff --name-only origin/main...HEAD)
            printf '%s\n' "$CHANGED"
            FORBIDDEN=$(printf '%s\n' "$CHANGED" | grep -E '^(apps/|mobile/|ios/|android/)' || true)
            if [[ -n "$FORBIDDEN" ]]; then
              echo 'ERROR: Backend-only release contains application/frontend/mobile paths:' >&2
              printf '%s\n' "$FORBIDDEN" >&2
              exit 1
            fi
            echo 'Backend-only scope guard passed.'
          displayName: Reject application frontend or mobile changes
      - ${{ if ne(parameters.enforceBackendOnlyDiff, true) }}:
        - bash: echo 'Backend-only diff guard disabled by explicit pipeline parameter.'
          displayName: Backend-only diff guard explicitly disabled

  - job: auth_verify
    displayName: Auth Service Java 21 verify
    steps:
      - checkout: self
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '21', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - bash: |
          set -euo pipefail
          cd services/auth-service
          mvn -B -ntp clean verify
        displayName: Maven clean verify

  - job: user_chef_verify
    displayName: User-Chef Service Java 21 verify
    steps:
      - checkout: self
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '21', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - bash: |
          set -euo pipefail
          cd services/user-chef-service
          mvn -B -ntp clean verify
        displayName: Maven clean verify

  - job: catalog_verify
    displayName: Catalog Service Java 21 verify
    steps:
      - checkout: self
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '21', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - bash: |
          set -euo pipefail
          cd services/catalog-service
          mvn -B -ntp clean verify
        displayName: Maven clean verify

  - job: order_verify
    displayName: Order Service Java 21 verify
    steps:
      - checkout: self
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '21', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - bash: |
          set -euo pipefail
          cd services/order-service
          mvn -B -ntp clean verify
        displayName: Maven clean verify

  - job: subscription_verify
    displayName: Subscription Service Java 21 verify
    steps:
      - checkout: self
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '21', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - bash: |
          set -euo pipefail
          cd services/subscription-service
          mvn -B -ntp clean verify
        displayName: Maven clean verify

  - job: integration_verify
    displayName: Integration Service Java 21 verify
    steps:
      - checkout: self
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '21', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - bash: |
          set -euo pipefail
          cd services/integration-service
          mvn -B -ntp clean verify
        displayName: Maven clean verify

  - job: notification_verify
    displayName: Notification Service Java 21 verify
    steps:
      - checkout: self
      - task: JavaToolInstaller@0
        inputs: { versionSpec: '21', jdkArchitectureOption: x64, jdkSourceOption: PreInstalled }
      - bash: |
          set -euo pipefail
          cd services/notification-service
          mvn -B -ntp clean verify
        displayName: Maven clean verify

  - job: release_artifact_validation
    displayName: Flyway, APIM and API contract validation
    steps:
      - checkout: self
      - bash: |
          set -euo pipefail
          for script in \
            scripts/apim/configure-order-history-v2-apim.sh \
            scripts/apim/rollback-order-history-v2-apim.sh \
            scripts/apim/configure-notification-inbox-v2-apim.sh \
            scripts/apim/rollback-notification-inbox-v2-apim.sh \
            scripts/apim/configure-kitchen-schedule-v1-apim.sh \
            scripts/apim/rollback-kitchen-schedule-v1-apim.sh \
            scripts/apim/configure-support-cases-v1-apim.sh \
            scripts/apim/rollback-support-cases-v1-apim.sh \
            scripts/apim/configure-chef-financial-v1-apim.sh \
            scripts/apim/rollback-chef-financial-v1-apim.sh \
            scripts/apim/configure-chef-menu-bulk-availability-v1-apim.sh \
            scripts/apim/rollback-chef-menu-bulk-availability-v1-apim.sh \
            scripts/apim/configure-customer-cart-apim.sh \
            scripts/apim/rollback-customer-cart-preflight-v1-apim.sh \
            scripts/apim/configure-apim-platform-baseline.sh \
            scripts/apim/rollback-apim-platform-baseline.sh \
            scripts/release/verify-catalog-order-internal-secret-binding.sh; do
            bash -n "$script"
            echo "bash -n PASS: $script"
          done
        displayName: Validate release Bash syntax
      - bash: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          files = [
              Path('infra/apim/order-history-v2/order-history-policy.xml'),
              Path('infra/apim/notification-inbox-v2/notification-inbox-policy.xml'),
              Path('infra/apim/kitchen-schedule-v1/public-availability-policy.xml'),
              Path('infra/apim/support-cases-v1/support-case-policy.xml'),
              Path('infra/apim/chef-financial-v1/chef-financial-policy.xml'),
              Path('infra/apim/chef-menu-bulk-availability-v1/bulk-availability-policy.xml'),
              Path('infra/apim/customer-cart/customer-cart-policy.xml'),
              Path('infra/apim/platform-baseline/craves-correlation-inbound.xml'),
              Path('infra/apim/platform-baseline/craves-security-outbound.xml'),
              Path('infra/apim/platform-baseline/craves-json-body-guard.xml'),
          ]
          for path in files:
              ET.parse(path)
              print(f'XML PASS: {path}')
          PY
        displayName: Parse APIM policy and fragment XML
      - bash: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          services = [
              'auth-service', 'user-chef-service', 'catalog-service', 'order-service',
              'subscription-service', 'integration-service', 'notification-service',
          ]
          failed = False
          for service in services:
              migration_dir = Path('services') / service / 'src/main/resources/db/migration'
              versions = {}
              for path in sorted(migration_dir.glob('V*__*.sql')):
                  match = re.match(r'V([^_]+)__', path.name)
                  if not match:
                      continue
                  versions.setdefault(match.group(1), []).append(path.name)
              duplicates = {v: names for v, names in versions.items() if len(names) > 1}
              if duplicates:
                  failed = True
                  print(f'ERROR: duplicate Flyway versions in {service}: {duplicates}', file=sys.stderr)
              else:
                  print(f'Flyway version uniqueness PASS: {service}')
          if failed:
              raise SystemExit(1)
          PY
        displayName: Reject duplicate Flyway versions
      - bash: |
          set -euo pipefail
          for policy in \
            infra/apim/order-history-v2/order-history-policy.xml \
            infra/apim/notification-inbox-v2/notification-inbox-policy.xml \
            infra/apim/support-cases-v1/support-case-policy.xml \
            infra/apim/chef-financial-v1/chef-financial-policy.xml \
            infra/apim/chef-menu-bulk-availability-v1/bulk-availability-policy.xml \
            infra/apim/customer-cart/customer-cart-policy.xml; do
            grep -q 'Authorization' "$policy"
            grep -q 'X-Correlation-ID' "$policy"
            grep -q 'no-store' "$policy"
          done
          grep -q 'X-Correlation-ID' infra/apim/kitchen-schedule-v1/public-availability-policy.xml
          grep -q 'no-store' infra/apim/kitchen-schedule-v1/public-availability-policy.xml
          grep -q 'validate-content' infra/apim/chef-menu-bulk-availability-v1/bulk-availability-policy.xml
          grep -q 'rate-limit-by-key' scripts/apim/configure-apim-platform-baseline.sh
          grep -q 'If-Match' scripts/apim/configure-apim-platform-baseline.sh
          grep -q 'CRAVES_INTERNAL_SERVICE_SECRET' services/catalog-service/src/main/resources/application.yml
          grep -q 'CRAVES_INTERNAL_SERVICE_SECRET' services/order-service/src/main/resources/application.yml
          grep -q '/api/v1/chef/earnings' openapi/chef-financial-v1.yaml
          grep -q '/api/v1/kitchens/me/menu-items/availability' openapi/chef-menu-bulk-availability-v1.yaml
          grep -q '/api/v1/cart/preflight' openapi/customer-cart-preflight-v1.yaml
          grep -q 'bearerAuth' openapi/chef-financial-v1.yaml
          grep -q 'bearerAuth' openapi/chef-menu-bulk-availability-v1.yaml
          grep -q 'bearerAuth' openapi/customer-cart-preflight-v1.yaml
          echo 'APIM security, correlation, body guard, internal-access and OpenAPI assertions passed.'
        displayName: Assert APIM, internal access and OpenAPI guards
