# Provider-neutral live check of the location BFF. Ola Maps wiring is inspected by
# azure-pipelines-customer-location-ola-maps.yml (operation=inspect).
trigger: none
pr: none

parameters:
  - name: baseUrl
    type: string
    default: https://craves.in

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - script: |
      set -euo pipefail
      bash -n scripts/release/customer-location-runtime-smoke.sh
    displayName: Validate location smoke script

  - script: |
      set -euo pipefail
      chmod +x scripts/release/customer-location-runtime-smoke.sh
      CRAVES_BASE_URL='${{ parameters.baseUrl }}' \
        scripts/release/customer-location-runtime-smoke.sh
    displayName: Run live Craves location smoke (reverse geocode, search, static map)
