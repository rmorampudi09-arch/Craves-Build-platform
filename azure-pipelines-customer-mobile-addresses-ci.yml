trigger: none
pr: none
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      cd apps/mobile
      npm ci --ignore-scripts --no-audit --no-fund
      npx --no-install tsc --noEmit
      npm test -- --runInBand --runTestsByPath \
        src/features/customerAddresses/customerAddresses.test.ts \
        src/features/customerAddresses/customerAddressEditor.test.ts \
        src/features/customerShell/customerShell.test.ts \
        src/features/cart/cartAddressSelection.test.ts
    displayName: Typecheck current React Native app and test address flows
