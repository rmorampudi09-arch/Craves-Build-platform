trigger: none
pr: none

parameters:
  - name: targetEnvironment
    type: string
    default: SANDBOX
    values:
      - SANDBOX
      - PRODUCTION
  - name: enableProvider
    type: boolean
    default: false
  - name: confirmProductionSwitch
    type: boolean
    default: false
  - name: confirmDirectIntracityContractVerified
    type: boolean
    default: false
  - name: confirmCredentialModelVerified
    type: boolean
    default: false
  - name: confirmServiceabilitySchemaVerified
    type: boolean
    default: false
  - name: confirmQuoteSchemaVerified
    type: boolean
    default: false
  - name: confirmCreateSchemaVerified
    type: boolean
    default: false
  - name: confirmCancelSchemaVerified
    type: boolean
    default: false
  - name: confirmTrackSchemaVerified
    type: boolean
    default: false
  - name: confirmHyderabadServiceabilityVerified
    type: boolean
    default: false
  - name: confirmWebhookContractVerified
    type: boolean
    default: false
  - name: confirmCreateReconciliationVerified
    type: boolean
    default: false
  - name: contractVersion
    type: string
    default: replace-before-run
  - name: providerBaseUrl
    type: string
    default: https://replace-before-run.invalid
  - name: authSecretName
    type: string
    default: delhivery-api-token
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: AzureCLI@2
    displayName: Apply fail-closed Delhivery environment state
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        RG='${{ parameters.resourceGroupName }}'
        APP='${{ parameters.integrationContainerAppName }}'
        environment='${{ parameters.targetEnvironment }}'
        enable_raw='${{ parameters.enableProvider }}'
        enable="${enable_raw,,}"
        confirm_raw='${{ parameters.confirmProductionSwitch }}'
        confirm="${confirm_raw,,}"
        contract_confirm_raw='${{ parameters.confirmDirectIntracityContractVerified }}'
        contract_confirm="${contract_confirm_raw,,}"
        credential_confirm_raw='${{ parameters.confirmCredentialModelVerified }}'
        credential_confirm="${credential_confirm_raw,,}"
        serviceability_confirm_raw='${{ parameters.confirmServiceabilitySchemaVerified }}'
        serviceability_confirm="${serviceability_confirm_raw,,}"
        quote_confirm_raw='${{ parameters.confirmQuoteSchemaVerified }}'
        quote_confirm="${quote_confirm_raw,,}"
        create_confirm_raw='${{ parameters.confirmCreateSchemaVerified }}'
        create_confirm="${create_confirm_raw,,}"
        cancel_confirm_raw='${{ parameters.confirmCancelSchemaVerified }}'
        cancel_confirm="${cancel_confirm_raw,,}"
        track_confirm_raw='${{ parameters.confirmTrackSchemaVerified }}'
        track_confirm="${track_confirm_raw,,}"
        hyderabad_confirm_raw='${{ parameters.confirmHyderabadServiceabilityVerified }}'
        hyderabad_confirm="${hyderabad_confirm_raw,,}"
        webhook_confirm_raw='${{ parameters.confirmWebhookContractVerified }}'
        webhook_confirm="${webhook_confirm_raw,,}"
        reconciliation_confirm_raw='${{ parameters.confirmCreateReconciliationVerified }}'
        reconciliation_confirm="${reconciliation_confirm_raw,,}"
        contract_version='${{ parameters.contractVersion }}'
        base_url='${{ parameters.providerBaseUrl }}'
        secret_name='${{ parameters.authSecretName }}'
        app_yml='services/integration-service/src/main/resources/application.yml'
        adapter_dir='services/integration-service/src/main/java/in/craves/integration/delivery/delhivery'

        fail() { echo "ERROR: $*" >&2; exit 2; }

        wait_ready() {
          local latest ready
          latest="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv --only-show-errors)"
          for _ in $(seq 1 60); do
            ready="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv --only-show-errors 2>/dev/null || true)"
            [[ "$ready" == "$latest" ]] && return 0
            sleep 10
          done
          fail 'Integration Service revision did not become ready.'
        }

        [[ "$environment" == 'SANDBOX' || "$environment" == 'PRODUCTION' ]] || fail 'targetEnvironment must be SANDBOX or PRODUCTION.'
        for pair in \
          "enableProvider:$enable" \
          "confirmProductionSwitch:$confirm" \
          "confirmDirectIntracityContractVerified:$contract_confirm" \
          "confirmCredentialModelVerified:$credential_confirm" \
          "confirmServiceabilitySchemaVerified:$serviceability_confirm" \
          "confirmQuoteSchemaVerified:$quote_confirm" \
          "confirmCreateSchemaVerified:$create_confirm" \
          "confirmCancelSchemaVerified:$cancel_confirm" \
          "confirmTrackSchemaVerified:$track_confirm" \
          "confirmHyderabadServiceabilityVerified:$hyderabad_confirm" \
          "confirmWebhookContractVerified:$webhook_confirm" \
          "confirmCreateReconciliationVerified:$reconciliation_confirm"
        do
          name="${pair%%:*}"
          value="${pair#*:}"
          [[ "$value" == 'true' || "$value" == 'false' ]] || fail "$name must resolve to true or false."
        done

        runtime_config_present=false
        if grep -Fq 'DELHIVERY_API_ENABLED' "$app_yml" && grep -Fq 'DELHIVERY_API_ENVIRONMENT' "$app_yml"; then
          runtime_config_present=true
        fi
        adapter_present=false
        if [[ -d "$adapter_dir" ]] && find "$adapter_dir" -type f -name '*.java' -print -quit | grep -q .; then
          adapter_present=true
        fi

        # The public Delhivery API catalogue covers parcel journeys, not the Direct Intracity rider
        # booking product. A portal token or parcel adapter must never satisfy these gates.
        if [[ "$enable" == 'true' || "$environment" == 'PRODUCTION' ]]; then
          [[ "$contract_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_CONTRACT_NOT_VERIFIED: vendor-issued transaction contract is required.'
          [[ "$credential_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_CREDENTIAL_MODEL_NOT_VERIFIED: prove the credential is scoped to Direct Intracity.'
          [[ "$serviceability_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_SERVICEABILITY_SCHEMA_NOT_VERIFIED: coordinate serviceability contract is required.'
          [[ "$quote_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_QUOTE_SCHEMA_NOT_VERIFIED: amount, currency, availability and ETA semantics are required.'
          [[ "$create_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_CREATE_SCHEMA_NOT_VERIFIED: rider-order create contract is required.'
          [[ "$cancel_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_CANCEL_SCHEMA_NOT_VERIFIED: cancellation contract is required.'
          [[ "$track_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_TRACK_SCHEMA_NOT_VERIFIED: status and rider-location contract is required.'
          [[ "$hyderabad_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_HYDERABAD_NOT_VERIFIED: written Hyderabad quick-delivery coverage is required.'
          [[ "$webhook_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_WEBHOOK_NOT_VERIFIED: callback payload and authentication contract are required.'
          [[ "$reconciliation_confirm" == 'true' ]] || fail 'DIRECT_INTRACITY_CREATE_RECONCILIATION_NOT_VERIFIED: deterministic uncertain-create recovery is required.'
          [[ -n "$contract_version" && "$contract_version" != 'replace-before-run' ]] || fail 'A reviewed Direct Intracity contractVersion is required.'
          [[ "$adapter_present" == 'true' ]] || fail 'DIRECT_INTRACITY_ADAPTER_NOT_IMPLEMENTED: Delhivery Direct Intracity Spring adapter is not implemented.'
          [[ "$runtime_config_present" == 'true' ]] || fail 'DIRECT_INTRACITY_RUNTIME_NOT_IMPLEMENTED: Delhivery Direct Intracity runtime configuration is not implemented.'
          [[ "$base_url" == https://* && "$base_url" != *replace-before-run.invalid* ]] || fail 'Delhivery vendor-issued intracity HTTPS base URL is required.'
          [[ "$environment" != 'PRODUCTION' || "$confirm" == 'true' ]] || fail 'PRODUCTION requires confirmProductionSwitch=true.'
          lower="${base_url,,}"
          [[ "$environment" != 'PRODUCTION' || ( "$lower" != *test* && "$lower" != *sandbox* && "$lower" != *stage* ) ]] || fail 'Delhivery production cannot use a test/stage/sandbox host.'
          secrets="$(az containerapp secret list -g "$RG" -n "$APP" --query '[].name' -o tsv --only-show-errors)"
          grep -qx "$secret_name" <<<"$secrets" || fail "Missing Container App secret $secret_name."
        fi

        db_url="$(az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_URL']|[0].value" -o tsv --only-show-errors)"
        db_user="$(az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_USERNAME']|[0].value" -o tsv --only-show-errors)"
        db_secret_url="$(az containerapp secret list -g "$RG" -n "$APP" --query "[?name=='kv-db-password']|[0].keyVaultUrl" -o tsv --only-show-errors)"
        [[ "$db_url" == jdbc:postgresql://* && -n "$db_user" && "$db_secret_url" == https://*.vault.azure.net/secrets/* ]] || fail 'Integration database binding is incomplete.'
        vault_name="$(cut -d. -f1 <<<"${db_secret_url#https://}")"
        db_secret_name="${db_secret_url##*/}"
        db_password="$(az keyvault secret show --vault-name "$vault_name" --name "$db_secret_name" --query value -o tsv --only-show-errors)"
        export PGPASSWORD="$db_password" PGUSER="$db_user"
        DB="${db_url#jdbc:}"

        if [[ "$enable" == 'false' ]]; then
          psql "$DB" -v ON_ERROR_STOP=1 -c "UPDATE delivery_schema.delivery_provider SET is_active=FALSE, updated_at=now() WHERE provider_id='delhivery';" >/dev/null
          az containerapp update -g "$RG" -n "$APP" \
            --set-env-vars \
              DELHIVERY_API_ENVIRONMENT="$environment" \
              DELHIVERY_PRODUCTION_ACTIVATION_APPROVED=false \
              DELHIVERY_API_ENABLED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CONTRACT_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CREDENTIAL_MODEL_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_SERVICEABILITY_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_QUOTE_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CREATE_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CANCEL_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_TRACK_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_WEBHOOK_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CREATE_RECONCILIATION_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_HYDERABAD_SERVICEABILITY_VERIFIED=false \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
          az containerapp update -g "$RG" -n "$APP" \
            --remove-env-vars CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CONTRACT_VERSION >/dev/null
          wait_ready
        else
          approved=false
          [[ "$environment" == 'PRODUCTION' ]] && approved=true
          az containerapp update -g "$RG" -n "$APP" \
            --set-env-vars \
              DELHIVERY_API_ENVIRONMENT="$environment" \
              DELHIVERY_PRODUCTION_ACTIVATION_APPROVED="$approved" \
              DELHIVERY_API_BASE_URL="$base_url" \
              DELHIVERY_API_AUTH_TOKEN="secretref:${secret_name}" \
              DELHIVERY_API_ENABLED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CONTRACT_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CONTRACT_VERSION="$contract_version" \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CREDENTIAL_MODEL_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_SERVICEABILITY_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_QUOTE_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CREATE_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CANCEL_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_TRACK_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_WEBHOOK_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_CREATE_RECONCILIATION_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_DELHIVERY_HYDERABAD_SERVICEABILITY_VERIFIED=true \
              CRAVES_DELIVERY_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED=true \
              CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=true \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
          wait_ready
          psql "$DB" -v ON_ERROR_STOP=1 -c "UPDATE delivery_schema.delivery_provider SET is_active=TRUE, updated_at=now() WHERE provider_id='delhivery';" >/dev/null
          [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE provider_id='delhivery' AND is_active=TRUE;")" == '1' ]] || fail 'Delhivery provider catalog activation failed.'
          az containerapp update -g "$RG" -n "$APP" --set-env-vars CRAVES_DELIVERY_COMMAND_ENABLED=true >/dev/null
          wait_ready
        fi

        if [[ "$enable" == 'false' ]]; then
          [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE provider_id='delhivery' AND is_active=TRUE;")" == '0' ]] || fail 'Delhivery provider catalog is not fail-closed.'
          active_provider_count="$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE is_active=TRUE;")"
          if [[ "$active_provider_count" == '0' ]]; then
            az containerapp update -g "$RG" -n "$APP" --set-env-vars CRAVES_DELIVERY_COMMAND_ENABLED=false >/dev/null
            wait_ready
          else
            echo "INFO: $active_provider_count other provider(s) remain active; global delivery worker remains unchanged."
          fi
        fi

        env_json="$(az containerapp show -g "$RG" -n "$APP" --query 'properties.template.containers[0].env' -o json --only-show-errors)"
        value() { jq -r --arg name "$1" '.[] | select(.name == $name) | (.value // "")' <<<"$env_json" | tail -1; }
        [[ "$(value DELHIVERY_API_ENVIRONMENT)" == "$environment" ]] || fail 'Delhivery environment verification failed.'
        [[ "$(value DELHIVERY_API_ENABLED)" == "$enable" ]] || fail 'Delhivery enabled-state verification failed.'

        unset db_password PGPASSWORD PGUSER
        echo '============================================================'
        echo 'DELHIVERY DELIVERY PROVIDER SWITCH: PASS'
        echo "Environment: $environment"
        echo "Provider enabled: $enable"
        [[ "$enable" == 'false' ]] && echo 'Mode: SIMPLE_SANDBOX / FAIL_CLOSED'
        echo "Spring adapter detected: $adapter_present"
        echo "Spring runtime configuration detected: $runtime_config_present"
        echo '============================================================'
