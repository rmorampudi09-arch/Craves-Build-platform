trigger: none
pr: none

parameters:
  - name: targetEnvironment
    type: string
    default: SANDBOX
    values:
      - SANDBOX
      - PRODUCTION
  - name: enableProvider
    type: boolean
    default: false
  - name: activationStage
    type: string
    default: downstream
    values:
      - downstream
      - provider_create
  - name: confirmProductionActivation
    type: boolean
    default: false
  - name: providerBaseUrl
    type: string
    default: https://robotapitest-in.borzodelivery.com/api/business/1.8
  - name: callbackUrl
    type: string
    default: https://replace-before-run.invalid
  - name: expectedQueueActiveCount
    type: number
    default: 0
  - name: expectedQueueDeadLetterCount
    type: number
    default: 0

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  resourceGroup: rg-craves-prodlow-centralindia
  containerApp: ca-craves-integration-service-pr
  orderContainerApp: ca-craves-order-service-prodlow
  serviceBusNamespace: sb-craves-prodlow-l3ing6
  deliveryQueue: delivery-command

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: AzureCLI@2
    displayName: Apply guarded Borzo environment switch
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        environment='${{ parameters.targetEnvironment }}'
        enable_raw='${{ parameters.enableProvider }}'
        enable="${enable_raw,,}"
        stage='${{ parameters.activationStage }}'
        confirm_raw='${{ parameters.confirmProductionActivation }}'
        confirm="${confirm_raw,,}"
        base_url='${{ parameters.providerBaseUrl }}'
        callback_url='${{ parameters.callbackUrl }}'
        app_yml='services/integration-service/src/main/resources/application.yml'

        fail() {
          echo "ERROR: $*" >&2
          exit 2
        }

        [[ "$environment" == 'SANDBOX' || "$environment" == 'PRODUCTION' ]] || fail 'targetEnvironment must be SANDBOX or PRODUCTION.'
        [[ "$enable" == 'true' || "$enable" == 'false' ]] || fail 'enableProvider must resolve to true or false.'

        grep -Fq 'enabled: ${BORZO_API_ENABLED:false}' "$app_yml" || fail 'BORZO_API_ENABLED is not fail-closed in application.yml.'
        grep -Fq 'environment: ${BORZO_API_ENVIRONMENT:SANDBOX}' "$app_yml" || fail 'BORZO_API_ENVIRONMENT does not default to SANDBOX.'
        grep -Fq 'production-activation-approved: ${BORZO_PRODUCTION_ACTIVATION_APPROVED:false}' "$app_yml" || fail 'BORZO production approval does not default to false.'

        if [[ "$environment" == 'PRODUCTION' ]]; then
          [[ "$confirm" == 'true' ]] || fail 'Production switch requires confirmProductionActivation=true.'
          [[ "$base_url" == https://* ]] || fail 'Production provider base URL must use HTTPS.'
          [[ "$callback_url" == https://* ]] || fail 'Production callback URL must use HTTPS.'
          [[ "$base_url" != *replace-before-run.invalid* ]] || fail 'Replace the production provider base URL placeholder.'
          [[ "$callback_url" != *replace-before-run.invalid* ]] || fail 'Replace the production callback URL placeholder.'
          [[ "$base_url" != *test* && "$base_url" != *sandbox* ]] || fail 'Production activation cannot use a test or sandbox host.'

          if [[ "$enable" == 'true' ]]; then
            [[ "$stage" == 'provider_create' ]] || fail 'PRODUCTION with enableProvider=true requires activationStage=provider_create.'
          else
            [[ "$stage" == 'downstream' ]] || fail 'PRODUCTION with enableProvider=false requires activationStage=downstream.'
          fi
        fi

        if [[ "$environment" == 'SANDBOX' && "$enable" == 'true' ]]; then
          [[ "$base_url" == https://* ]] || fail 'Sandbox provider base URL must use HTTPS.'
          [[ "$callback_url" == https://* ]] || fail 'Sandbox callback URL must use HTTPS.'
          [[ "$base_url" == *test* || "$base_url" == *sandbox* || "$base_url" == *robotapitest* ]] || fail 'Full sandbox activation must use a recognizable sandbox/test provider host.'
          [[ "$callback_url" != *replace-before-run.invalid* ]] || fail 'Full sandbox activation requires a real callback URL.'
        fi

        requires_secrets=false
        if [[ "$environment" == 'PRODUCTION' || "$enable" == 'true' ]]; then
          requires_secrets=true
        fi

        if [[ "$requires_secrets" == 'true' ]]; then
          secrets="$(az containerapp secret list -g '$(resourceGroup)' -n '$(containerApp)' --query '[].name' -o tsv)"
          grep -qx 'borzo-api-auth-token' <<<"$secrets" || fail 'Missing Container App secret borzo-api-auth-token.'
          grep -qx 'borzo-callback-token' <<<"$secrets" || fail 'Missing Container App secret borzo-callback-token.'
        fi

        if [[ "$environment" == 'PRODUCTION' && "$stage" == 'provider_create' ]]; then
          active="$(az servicebus queue show -g '$(resourceGroup)' --namespace-name '$(serviceBusNamespace)' -n '$(deliveryQueue)' --query countDetails.activeMessageCount -o tsv)"
          dead="$(az servicebus queue show -g '$(resourceGroup)' --namespace-name '$(serviceBusNamespace)' -n '$(deliveryQueue)' --query countDetails.deadLetterMessageCount -o tsv)"
          [[ "$active" == '${{ parameters.expectedQueueActiveCount }}' ]] || fail "Unexpected delivery queue active count: $active"
          [[ "$dead" == '${{ parameters.expectedQueueDeadLetterCount }}' ]] || fail "Unexpected delivery queue DLQ count: $dead"
        fi

        if [[ "$environment" == 'SANDBOX' ]]; then
          if [[ "$enable" == 'false' ]]; then
            az containerapp update -g '$(resourceGroup)' -n '$(containerApp)' \
              --set-env-vars \
                BORZO_API_ENVIRONMENT=SANDBOX \
                BORZO_PRODUCTION_ACTIVATION_APPROVED=false \
                BORZO_API_ENABLED=false \
                CRAVES_DELIVERY_COMMAND_ENABLED=false \
                CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
          else
            az containerapp update -g '$(resourceGroup)' -n '$(containerApp)' \
              --set-env-vars \
                BORZO_API_ENVIRONMENT=SANDBOX \
                BORZO_PRODUCTION_ACTIVATION_APPROVED=false \
                BORZO_API_BASE_URL="$base_url" \
                BORZO_CALLBACK_URL="$callback_url" \
                BORZO_API_AUTH_TOKEN=secretref:borzo-api-auth-token \
                BORZO_CALLBACK_TOKEN=secretref:borzo-callback-token \
                BORZO_API_ENABLED=true \
                CRAVES_DELIVERY_RECONCILIATION_ENABLED=true \
                CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED=true \
                CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED=true \
                CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=true \
                CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true \
                CRAVES_DELIVERY_COMMAND_ENABLED=true >/dev/null
          fi
        elif [[ "$stage" == 'downstream' ]]; then
          az containerapp update -g '$(resourceGroup)' -n '$(containerApp)' \
            --set-env-vars \
              BORZO_API_ENVIRONMENT=PRODUCTION \
              BORZO_PRODUCTION_ACTIVATION_APPROVED=true \
              BORZO_API_BASE_URL="$base_url" \
              BORZO_CALLBACK_URL="$callback_url" \
              BORZO_API_AUTH_TOKEN=secretref:borzo-api-auth-token \
              BORZO_CALLBACK_TOKEN=secretref:borzo-callback-token \
              BORZO_API_ENABLED=false \
              CRAVES_DELIVERY_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED=true \
              CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=true \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
        else
          env_json="$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query 'properties.template.containers[0].env' -o json)"
          current() { jq -r --arg name "$1" '.[] | select(.name == $name) | (.value // .secretRef // "")' <<<"$env_json" | tail -1; }

          for name in CRAVES_DELIVERY_RECONCILIATION_ENABLED CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED; do
            [[ "$(current "$name")" == 'true' ]] || fail "$name must already be true before provider_create."
          done
          [[ "$(current BORZO_API_ENVIRONMENT)" == 'PRODUCTION' ]] || fail 'Borzo environment is not PRODUCTION.'
          [[ "$(current BORZO_PRODUCTION_ACTIVATION_APPROVED)" == 'true' ]] || fail 'Borzo production approval flag is not true.'

          az containerapp update -g '$(resourceGroup)' -n '$(containerApp)' \
            --set-env-vars \
              BORZO_API_ENABLED=true \
              CRAVES_DELIVERY_COMMAND_ENABLED=true \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
        fi

        latest="$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query properties.latestRevisionName -o tsv)"
        active_revision=''
        provisioning=''
        replicas='0'
        for _ in $(seq 1 60); do
          active_revision="$(az containerapp revision show -g '$(resourceGroup)' -n '$(containerApp)' --revision "$latest" --query properties.active -o tsv 2>/dev/null || true)"
          provisioning="$(az containerapp revision show -g '$(resourceGroup)' -n '$(containerApp)' --revision "$latest" --query properties.provisioningState -o tsv 2>/dev/null || true)"
          replicas="$(az containerapp revision show -g '$(resourceGroup)' -n '$(containerApp)' --revision "$latest" --query properties.replicas -o tsv 2>/dev/null || echo 0)"
          [[ "$active_revision" == 'true' && "$provisioning" == 'Provisioned' && "$replicas" -ge 1 ]] && break
          sleep 10
        done
        [[ "$active_revision" == 'true' && "$provisioning" == 'Provisioned' && "$replicas" -ge 1 ]] || fail 'New Integration Service revision did not become active and provisioned.'

        values="$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query 'properties.template.containers[0].env' -o json)"
        value() { jq -r --arg name "$1" '.[] | select(.name == $name) | .value' <<<"$values" | tail -1; }
        [[ "$(value BORZO_API_ENVIRONMENT)" == "$environment" ]] || fail 'Borzo environment verification failed.'
        [[ "$(value BORZO_API_ENABLED)" == "$enable" ]] || fail 'Borzo enabled-state verification failed.'

        if [[ "$enable" == 'true' ]]; then
          az containerapp update -g '$(resourceGroup)' -n '$(orderContainerApp)' \
            --set-env-vars \
              CRAVES_DOMAIN_EVENT_OUTBOX_ENABLED=true \
              CRAVES_DOMAIN_EVENT_SERVICE_BUS_ENABLED=true >/dev/null

          order_latest="$(az containerapp show -g '$(resourceGroup)' -n '$(orderContainerApp)' --query properties.latestRevisionName -o tsv)"
          order_ready=''
          for _ in $(seq 1 60); do
            order_ready="$(az containerapp show -g '$(resourceGroup)' -n '$(orderContainerApp)' --query properties.latestReadyRevisionName -o tsv 2>/dev/null || true)"
            [[ "$order_ready" == "$order_latest" ]] && break
            sleep 10
          done
          [[ "$order_ready" == "$order_latest" ]] || fail 'Order Service publisher revision did not become ready.'
        fi

        db_url="$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_URL']|[0].value" -o tsv)"
        db_user="$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_USERNAME']|[0].value" -o tsv)"
        db_secret_url="$(az containerapp secret list -g '$(resourceGroup)' -n '$(containerApp)' --query "[?name=='kv-db-password']|[0].keyVaultUrl" -o tsv)"
        [[ "$db_url" == jdbc:postgresql://* && -n "$db_user" && "$db_secret_url" == https://*.vault.azure.net/secrets/* ]] || fail 'Integration database binding is incomplete.'
        vault_name="$(cut -d. -f1 <<<"${db_secret_url#https://}")"
        secret_name="${db_secret_url##*/}"
        db_password="$(az keyvault secret show --vault-name "$vault_name" --name "$secret_name" --query value -o tsv)"
        [[ -n "$db_password" ]] || fail 'Integration database password could not be resolved.'
        PGPASSWORD="$db_password" PGUSER="$db_user" psql "${db_url#jdbc:}" -v ON_ERROR_STOP=1 \
          -c "UPDATE delivery_schema.delivery_provider SET is_active = $enable, updated_at = now() WHERE provider_id = 'borzo';" >/dev/null
        unset db_password PGPASSWORD

        provider_active="$(PGPASSWORD="$(az keyvault secret show --vault-name "$vault_name" --name "$secret_name" --query value -o tsv)" PGUSER="$db_user" psql "${db_url#jdbc:}" -Atc "SELECT is_active FROM delivery_schema.delivery_provider WHERE provider_id = 'borzo';")"
        [[ "$provider_active" == "${enable:0:1}" ]] || fail 'Borzo database activation-state verification failed.'

        echo '============================================================'
        echo 'BORZO DELIVERY PROVIDER SWITCH: PASS'
        echo "Environment: $environment"
        echo "Provider enabled: $enable"
        if [[ "$environment" == 'SANDBOX' && "$enable" == 'false' ]]; then
          echo 'Mode: SIMPLE_SANDBOX'
        elif [[ "$environment" == 'SANDBOX' ]]; then
          echo 'Mode: FULL_SANDBOX'
        else
          echo "Mode: PRODUCTION_${stage^^}"
        fi
        echo '============================================================'
