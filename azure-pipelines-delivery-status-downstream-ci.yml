trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail
      cd services/order-service
      mvn -B clean verify
    displayName: Compile and test Order Service delivery consumer

  - script: |
      set -euo pipefail
      cd services/notification-service
      mvn -B clean verify
    displayName: Verify Notification Service compatibility

  - script: |
      set -euo pipefail
      for schema in contracts/events/*.schema.json; do
        echo "Validating $schema"
        python3 -m json.tool "$schema" >/dev/null
      done
    displayName: Validate all domain-event schema JSON files

  - script: |
      set -euo pipefail
      grep -F 'enabled: ${CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED:false}' \
        services/order-service/src/main/resources/application.yml
      grep -F 'CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED=false' \
        azure-pipelines-order-service.yml
      grep -F 'CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=false' \
        azure-pipelines-integration-service.yml
      grep -F 'BORZO_API_ENABLED=false' \
        azure-pipelines-integration-service.yml
      grep -F 'does not replace the commercial order status' \
        services/order-service/src/main/resources/db/migration/V9__delivery_status_consumer.sql
    displayName: Verify fail-closed delivery controls
