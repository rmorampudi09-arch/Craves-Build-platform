trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail
      cd services/order-service
      mvn -B clean verify
    displayName: Compile and test Order Service delivery projection

  - script: |
      set -euo pipefail
      cd services/integration-service
      mvn -B clean verify
    displayName: Compile and test Integration multi-provider delivery capability

  - script: |
      set -euo pipefail
      cd services/notification-service
      mvn -B clean verify
    displayName: Verify Notification Service compatibility

  - script: |
      set -euo pipefail
      for schema in contracts/events/*.schema.json; do
        echo "Validating $schema"
        python3 -m json.tool "$schema" >/dev/null
      done
      python3 -m json.tool contracts/openapi/order-delivery-status-v1.openapi.json >/dev/null
      python3 -m json.tool contracts/openapi/chef-delivery-status-v1.openapi.json >/dev/null
    displayName: Validate delivery event and OpenAPI JSON contracts

  - script: |
      set -euo pipefail
      bash -n scripts/release/upgrade-order-delivery-stream-filter-v3.sh
      bash -n scripts/release/rollback-order-delivery-stream-filter-v3.sh
      bash -n scripts/release/activate-order-delivery-live-location-v1.sh
      bash -n scripts/release/rollback-order-delivery-live-location-v1.sh
      bash -n scripts/apim/configure-chef-order-read-apim.sh
      bash -n scripts/apim/rollback-chef-delivery-status-apim.sh
    displayName: Validate delivery telemetry release scripts

  - script: |
      set -euo pipefail

      grep -F 'enabled: ${CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED:false}' \
        services/order-service/src/main/resources/application.yml

      grep -F 'status-publisher-enabled: ${CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED:false}' \
        services/integration-service/src/main/resources/application.yml

      grep -F 'enabled: ${BORZO_API_ENABLED:false}' \
        services/integration-service/src/main/resources/application.yml

      grep -F 'CRAVES_DELIVERY_LIVE_LOCATION_EXPOSURE_ENABLED:false' \
        services/order-service/src/main/java/in/craves/order/config/DeliveryTelemetryViewProperties.java

      test -f services/order-service/src/main/resources/db/migration/V17__delivery_telemetry_projection.sql
      test -f services/order-service/src/main/resources/db/migration/V18__delivery_provider_exact_eta.sql
      test -f services/integration-service/src/main/resources/db/migration/V112__delivery_telemetry_projection.sql
      test -f services/integration-service/src/main/resources/db/migration/V113__delivery_provider_exact_eta.sql

      test -f services/integration-service/src/main/java/in/craves/integration/delivery/provider/DeliveryProviderCapabilityRegistry.java
      test -f services/integration-service/src/main/java/in/craves/integration/delivery/borzo/BorzoDeliveryTelemetryExtractor.java
      test -f services/integration-service/src/main/java/in/craves/integration/delivery/shiprocket/ShiprocketDeliveryTelemetryExtractor.java

      grep -F 'DELIVERY_TELEMETRY_UPDATED' contracts/events/delivery-telemetry-updated-v1.schema.json
      grep -F '"1.1"' contracts/events/delivery-telemetry-updated-v1.schema.json
      grep -F 'trackingExperience' contracts/openapi/order-delivery-status-v1.openapi.json
      grep -F 'trackingExperience' contracts/openapi/chef-delivery-status-v1.openapi.json
      grep -F 'DELIVERY_TELEMETRY_UPDATED' scripts/release/upgrade-order-delivery-stream-filter-v3.sh
      grep -F 'get-my-chef-order-delivery-status' scripts/apim/configure-chef-order-read-apim.sh

      grep -F 'must never be used as a provider ranking table' \
        services/integration-service/src/main/java/in/craves/integration/delivery/provider/DeliveryProviderCapabilityRegistry.java
      grep -F 'PRIVATE_CONTRACT_REQUIRED' \
        services/integration-service/src/main/java/in/craves/integration/delivery/provider/DeliveryProviderCapabilityRegistry.java

      grep -F 'scripts/release/deploy-single-service-preserve-runtime.sh' \
        azure-pipelines-order-service.yml

      grep -F 'scripts/release/deploy-single-service-preserve-runtime.sh' \
        azure-pipelines-integration-service.yml

      if grep -En -- '--set-env-vars|--replace-env-vars|containerapp secret set' \
        azure-pipelines-order-service.yml \
        azure-pipelines-integration-service.yml; then
        echo 'ERROR: Routine Order/Integration deployment must preserve runtime configuration and Key Vault bindings.' >&2
        exit 1
      fi

      echo 'SUCCESS: Multi-provider delivery capability remains fail-closed where contracts are unverified and routine deployments preserve live runtime state.'
    displayName: Verify provider-neutral capability, fail-closed contracts and runtime preservation
