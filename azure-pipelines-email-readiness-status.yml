# Read-only device-acceptance probe. This branch-specific file can run in the
# existing audit pipeline without changing that pipeline's default branch.
trigger: none
pr: none
parameters:
  - name: action
    displayName: Device acceptance action
    type: string
    default: inspect
    values:
      - inspect
      - release-cart
      - inspect-cart-policy
      - publish-cart-routes
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
    persistCredentials: false
    fetchDepth: 1
  - ${{ if eq(parameters.action, 'inspect') }}:
      - task: AzureCLI@2
        displayName: Read cart dependencies and live revision, without secrets or writes
        inputs:
          azureSubscription: Craves-Dev-Service-Connection
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            set +x
            python3 scripts/release/device-cart-readiness.py
  - ${{ if eq(parameters.action, 'release-cart') }}:
      - template: pipelines/device-cart-release-steps.yml
  - ${{ if eq(parameters.action, 'inspect-cart-policy') }}:
      - task: AzureCLI@2
        displayName: Inspect owned cart policy structure without values or writes
        inputs:
          azureSubscription: Craves-Dev-Service-Connection
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            set +x
            python3 scripts/apim/inspect-device-cart-policy.py
  - ${{ if eq(parameters.action, 'publish-cart-routes') }}:
      - task: AzureCLI@2
        displayName: Verify pinned healthy Order image and finish owned cart routes
        inputs:
          azureSubscription: Craves-Dev-Service-Connection
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            set +x
            python3 -m unittest discover -s scripts/apim/tests -p 'test_device_safe_cart_routes.py'
            python3 scripts/apim/device-safe-cart-routes.py --expected-image cravesprodlowacr82121.azurecr.io/craves/order-service:device-cart-e1cf04e0537e2eaf32f1c494142dd52a3e3bafa0 --apply
