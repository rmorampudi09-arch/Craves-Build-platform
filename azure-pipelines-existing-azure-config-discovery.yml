trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Discover and sanitize existing Azure configuration
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        INVENTORY='config/production/azure-resource-inventory.json'
        RAW='$(Agent.TempDirectory)/craves-existing-config-raw-$(Build.BuildId)'
        SAFE='$(Build.ArtifactStagingDirectory)/azure-existing-config-safe'
        REPORT="$SAFE/azure-existing-config-report.md"
        SNAPSHOT="$SAFE/azure-existing-config-redacted.json"
        fail() { echo "ERROR: $*" >&2; exit 1; }

        command -v jq >/dev/null || fail 'jq is required on the pipeline agent'
        command -v python3 >/dev/null || fail 'python3 is required on the pipeline agent'
        [[ -f "$INVENTORY" ]] || fail "Azure resource inventory is missing: $INVENTORY"
        jq -e '.schemaVersion == 1 and (.containerApps | length == 7)' "$INVENTORY" >/dev/null \
          || fail 'Azure resource inventory is malformed'

        rm -rf "$RAW" "$SAFE"
        mkdir -p "$RAW/apps" "$RAW/keyvaults" "$SAFE"
        trap 'rm -rf "$RAW"' EXIT

        RG=$(jq -r '.resourceGroup' "$INVENTORY")
        az group show --name "$RG" \
          --query '{name:name,location:location,id:id}' -o json >"$RAW/resource-group.json"

        az resource list --resource-group "$RG" \
          --query '[].{name:name,type:type,location:location,id:id}' -o json >"$RAW/resources.json"

        while IFS=$'\t' read -r SERVICE_KEY APP_NAME; do
          echo "Inspecting Container App metadata: $SERVICE_KEY -> $APP_NAME"
          az containerapp show --resource-group "$RG" --name "$APP_NAME" -o json \
            >"$RAW/apps/${SERVICE_KEY}-app.json"
          az containerapp secret list --resource-group "$RG" --name "$APP_NAME" \
            --query '[].{name:name,keyVaultUrl:keyVaultUrl,identity:identity}' -o json \
            >"$RAW/apps/${SERVICE_KEY}-secrets.json" 2>/dev/null \
            || printf '[]' >"$RAW/apps/${SERVICE_KEY}-secrets.json"
        done < <(jq -r '.containerApps | to_entries[] | [.key, .value] | @tsv' "$INVENTORY")

        az keyvault list --resource-group "$RG" \
          --query '[].{name:name,vaultUri:properties.vaultUri,enableRbacAuthorization:properties.enableRbacAuthorization}' \
          -o json >"$RAW/keyvaults.json" 2>/dev/null || printf '[]' >"$RAW/keyvaults.json"

        while IFS= read -r VAULT_NAME; do
          [[ -n "$VAULT_NAME" ]] || continue
          SAFE_NAME=$(printf '%s' "$VAULT_NAME" | tr -c 'A-Za-z0-9._-' '_')
          az keyvault secret list --vault-name "$VAULT_NAME" \
            --query '[].{name:name,enabled:attributes.enabled,expires:attributes.expires}' -o json \
            >"$RAW/keyvaults/${SAFE_NAME}-secret-metadata.json" 2>/dev/null \
            || printf '[]' >"$RAW/keyvaults/${SAFE_NAME}-secret-metadata.json"
        done < <(jq -r '.[].name' "$RAW/keyvaults.json")

        az postgres flexible-server list --resource-group "$RG" \
          --query '[].{name:name,fullyQualifiedDomainName:fullyQualifiedDomainName,version:version,state:state,location:location}' \
          -o json >"$RAW/postgres-servers.json" 2>/dev/null || printf '[]' >"$RAW/postgres-servers.json"

        az redis list --resource-group "$RG" \
          --query '[].{name:name,hostName:hostName,sslPort:sslPort,sku:sku.name,provisioningState:provisioningState}' \
          -o json >"$RAW/redis.json" 2>/dev/null || printf '[]' >"$RAW/redis.json"

        az storage account list --resource-group "$RG" \
          --query '[].{name:name,primaryBlobEndpoint:primaryEndpoints.blob,kind:kind,sku:sku.name}' \
          -o json >"$RAW/storage.json" 2>/dev/null || printf '[]' >"$RAW/storage.json"

        SERVICE_BUS=$(jq -r '.serviceBusNamespace' "$INVENTORY")
        az servicebus topic list --resource-group "$RG" --namespace-name "$SERVICE_BUS" \
          --query '[].{name:name,status:status}' -o json >"$RAW/servicebus-topics.json" 2>/dev/null \
          || printf '[]' >"$RAW/servicebus-topics.json"

        APIM=$(jq -r '.apiManagement' "$INVENTORY")
        az apim api list --resource-group "$RG" --service-name "$APIM" \
          --query '[].{name:name,path:path,protocols:protocols}' -o json >"$RAW/apim-apis.json" 2>/dev/null \
          || printf '[]' >"$RAW/apim-apis.json"

        python3 - "$INVENTORY" "$RAW" "$REPORT" "$SNAPSHOT" <<'PY'
        import json
        import re
        import sys
        from pathlib import Path
        from urllib.parse import urlsplit

        inventory_path, raw_path, report_path, snapshot_path = map(Path, sys.argv[1:])
        inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
        raw = raw_path

        sensitive_name = re.compile(
            r'(PASSWORD|SECRET|TOKEN|PRIVATE|PEM|CREDENTIAL|ACCESS[_-]?KEY|CONNECTION[_-]?STRING|SERVICE[_-]?ACCOUNT|SAS|CLIENT[_-]?KEY|ACCOUNT[_-]?KEY|STORAGE_ENDPOINT)',
            re.IGNORECASE,
        )
        dangerous_value = re.compile(
            r'(AccountKey=|SharedAccessSignature=|SharedAccessKey=|accesskey=|-----BEGIN [A-Z ]*PRIVATE KEY-----)',
            re.IGNORECASE,
        )
        safe_exact = {
            'CRAVES_ENVIRONMENT',
            'CRAVES_JWT_ALLOW_GENERATED_LOCAL_KEYS',
            'CRAVES_JWT_AUDIENCE',
            'CRAVES_JWT_ISSUER',
            'FIREBASE_PROJECT_ID',
            'SPRING_DATASOURCE_URL',
            'SPRING_DATASOURCE_USERNAME',
            'SPRING_PROFILES_ACTIVE',
            'SERVER_PORT',
            'SPRING_FLYWAY_TABLE',
            'CRAVES_STORAGE_DOCUMENTS_CONTAINER',
            'CRAVES_STORAGE_MEDIA_CONTAINER',
            'CRAVES_DOMAIN_EVENTS_TOPIC_NAME',
            'CRAVES_DOMAIN_EVENT_ENABLED_TYPES',
            'CRAVES_REFUND_STATUS_SUBSCRIPTION',
            'CRAVES_SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE',
            'SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE',
            'SERVICE_BUS_CHEF_ACCEPTED_SUBSCRIPTION',
            'SERVICE_BUS_DELIVERY_COMMAND_QUEUE',
            'SERVICE_BUS_REFUND_REQUESTED_SUBSCRIPTION',
            'SERVICE_BUS_TOPIC_NAME',
            'PAYMENT_PROVIDER_API_VERSION',
            'PAYMENT_PROVIDER_ENVIRONMENT',
            'CRAVES_CASHFREE_SANDBOX_REFUND_SIMULATION_STATUS',
            'FORCE_RESTART',
        }
        safe_suffixes = (
            '_ENABLED',
            '_APPROVED',
            '_BASE_URL',
            '_WEBHOOK_URL',
            '_BATCH_SIZE',
            '_FIXED_DELAY_MS',
            '_MAX_ATTEMPTS',
            '_RETRY_BASE_DELAY_SECONDS',
            '_RADIUS_KM',
            '_QUEUE',
            '_SUBSCRIPTION',
            '_TOPIC_NAME',
            '_CONTAINER',
        )

        def load(path: Path, default):
            try:
                return json.loads(path.read_text(encoding='utf-8'))
            except Exception:
                return default

        def is_safe_plaintext(name: str, value: str) -> bool:
            if not value or sensitive_name.search(name) or dangerous_value.search(value):
                return False
            if name == 'SPRING_DATASOURCE_URL':
                return value.startswith('jdbc:postgresql://') and 'password=' not in value.lower()
            if name.endswith(('_BASE_URL', '_WEBHOOK_URL')):
                try:
                    parsed = urlsplit(value)
                    return parsed.scheme == 'https' and bool(parsed.netloc) and not parsed.username and not parsed.password
                except Exception:
                    return False
            return name in safe_exact or name.endswith(safe_suffixes)

        def safe_env(env):
            name = str(env.get('name') or '')
            secret_ref = str(env.get('secretRef') or '')
            value = '' if env.get('value') is None else str(env.get('value'))
            if secret_ref:
                return {'name': name, 'binding': 'secretRef', 'safeValue': secret_ref}
            if is_safe_plaintext(name, value):
                return {'name': name, 'binding': 'value', 'safeValue': value}
            return {'name': name, 'binding': 'plaintext-redacted', 'safeValue': '<redacted>'}

        snapshot = {
            'schemaVersion': 2,
            'resourceGroup': inventory['resourceGroup'],
            'note': 'Sanitized discovery only. Raw Azure responses are never published.',
            'containerApps': {},
            'keyVaults': load(raw / 'keyvaults.json', []),
            'postgresServers': load(raw / 'postgres-servers.json', []),
            'redis': load(raw / 'redis.json', []),
            'storage': load(raw / 'storage.json', []),
            'serviceBusTopics': load(raw / 'servicebus-topics.json', []),
            'apimApis': load(raw / 'apim-apis.json', []),
        }

        for service_key, app_name in inventory['containerApps'].items():
            app = load(raw / 'apps' / f'{service_key}-app.json', {})
            secrets = load(raw / 'apps' / f'{service_key}-secrets.json', [])
            container = ((app.get('properties') or {}).get('template') or {}).get('containers') or []
            first = container[0] if container else {}
            env = [safe_env(item) for item in (first.get('env') or [])]
            snapshot['containerApps'][service_key] = {
                'name': app_name,
                'runningStatus': (app.get('properties') or {}).get('runningStatus'),
                'latestRevisionName': (app.get('properties') or {}).get('latestRevisionName'),
                'latestReadyRevisionName': (app.get('properties') or {}).get('latestReadyRevisionName'),
                'fqdn': (((app.get('properties') or {}).get('configuration') or {}).get('ingress') or {}).get('fqdn'),
                'image': first.get('image'),
                'environment': sorted(env, key=lambda item: item['name']),
                'secrets': sorted(secrets, key=lambda item: str(item.get('name') or '')),
            }

        snapshot_path.write_text(json.dumps(snapshot, indent=2, sort_keys=True), encoding='utf-8')

        lines = [
            '# Craves existing Azure configuration discovery',
            '',
            '> Sanitized metadata only. Raw Container App responses and plaintext credentials are never published.',
            '',
            f"- Resource group: `{snapshot['resourceGroup']}`",
            '- Azure changes performed: **none**',
            '',
            '## Container Apps',
            '',
        ]

        for service_key, app in snapshot['containerApps'].items():
            lines.extend([
                f"### {service_key}: `{app['name']}`",
                '',
                f"- Running status: `{app.get('runningStatus') or 'Unknown'}`",
                f"- Latest revision: `{app.get('latestRevisionName') or 'Unknown'}`",
                f"- Latest ready revision: `{app.get('latestReadyRevisionName') or 'Unknown'}`",
                f"- FQDN: `{app.get('fqdn') or 'Not configured'}`",
                f"- Image: `{app.get('image') or 'Unknown'}`",
                '',
                '| Environment name | Binding | Sanitized value/reference |',
                '|---|---|---|',
            ])
            for env in app['environment']:
                safe_value = env['safeValue'].replace('|', '\\|').replace('\n', ' ')
                lines.append(f"| `{env['name']}` | `{env['binding']}` | `{safe_value}` |")
            if not app['environment']:
                lines.append('| _none_ |  |  |')
            lines.extend(['', '| Container App secret name | Backing |', '|---|---|'])
            for secret in app['secrets']:
                name = secret.get('name') or 'Unknown'
                key_vault_url = secret.get('keyVaultUrl') or ''
                backing = f"Key Vault reference: {key_vault_url}" if key_vault_url else 'Container App managed secret; value unavailable'
                lines.append(f"| `{name}` | `{backing}` |")
            if not app['secrets']:
                lines.append('| _none or list permission unavailable_ |  |')
            lines.append('')

        sections = (
            ('Key Vaults', 'keyVaults', lambda item: f"`{item.get('name')}` — `{item.get('vaultUri')}` — RBAC `{item.get('enableRbacAuthorization')}`"),
            ('PostgreSQL Flexible Servers', 'postgresServers', lambda item: f"`{item.get('name')}` — `{item.get('fullyQualifiedDomainName')}` — state `{item.get('state')}` — PostgreSQL `{item.get('version')}`"),
            ('Redis', 'redis', lambda item: f"`{item.get('name')}` — `{item.get('hostName')}:{item.get('sslPort')}` — SKU `{item.get('sku')}` — state `{item.get('provisioningState')}`"),
            ('Storage', 'storage', lambda item: f"`{item.get('name')}` — blob endpoint `{item.get('primaryBlobEndpoint')}` — `{item.get('sku')}`"),
            ('Service Bus topics', 'serviceBusTopics', lambda item: f"`{item.get('name')}` — status `{item.get('status')}`"),
            ('APIM APIs', 'apimApis', lambda item: f"`{item.get('name')}` — path `{item.get('path')}` — protocols `{item.get('protocols')}`"),
        )
        for title, key, render in sections:
            lines.extend([f'## {title}', ''])
            items = snapshot[key]
            if items:
                lines.extend(f'- {render(item)}' for item in items)
            else:
                lines.append('- None discovered or list permission unavailable.')
            lines.append('')

        lines.extend([
            '## Security boundary',
            '',
            '- Raw Azure responses were stored only under the temporary agent directory.',
            '- The temporary raw directory is deleted automatically.',
            '- Only this report and the schema-version-2 sanitized snapshot are published.',
            '- Container App managed secret values are not retrievable and are never requested.',
            '',
        ])
        report_path.write_text('\n'.join(lines), encoding='utf-8')
        PY

        jq -e '.schemaVersion == 2 and (.containerApps | length == 7)' "$SNAPSHOT" >/dev/null \
          || fail 'Sanitized discovery snapshot validation failed'
        grep -q 'Sanitized metadata only' "$REPORT" \
          || fail 'Sanitized report marker is missing'

        python3 - "$SAFE" <<'PY'
        import re
        import sys
        from pathlib import Path

        root = Path(sys.argv[1])
        forbidden = {
            'Azure Storage account key': re.compile(r'AccountKey=', re.IGNORECASE),
            'Azure shared-access key': re.compile(r'SharedAccessKey=', re.IGNORECASE),
            'Azure shared-access signature': re.compile(r'SharedAccessSignature=', re.IGNORECASE),
            'ACS access key': re.compile(r'accesskey=', re.IGNORECASE),
            'private key material': re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----'),
        }
        for path in root.rglob('*'):
            if not path.is_file():
                continue
            text = path.read_text(encoding='utf-8', errors='replace')
            for label, pattern in forbidden.items():
                if pattern.search(text):
                    raise SystemExit(f'ERROR: {label} detected in publishable artifact {path.name}')
        print('Artifact secret scanner passed.')
        PY

        rm -rf "$RAW"
        trap - EXIT

        echo 'SUCCESS: Existing Azure configuration was discovered and sanitized.'
        echo 'Only the sanitized report and snapshot will be published.'
        echo 'No Azure resource, Container App setting, Key Vault entry, or Azure DevOps variable was changed.'

  - task: PublishPipelineArtifact@1
    displayName: Publish sanitized existing Azure configuration report
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/azure-existing-config-safe
      artifact: azure-existing-config-sanitized
