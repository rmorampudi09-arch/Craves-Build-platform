trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Discover existing Azure configuration without exposing secrets
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        INVENTORY='config/production/azure-resource-inventory.json'
        WORK='$(Build.ArtifactStagingDirectory)/azure-existing-config'
        REPORT="$WORK/azure-existing-config-report.md"
        SNAPSHOT="$WORK/azure-existing-config-redacted.json"
        fail() { echo "ERROR: $*" >&2; exit 1; }

        command -v jq >/dev/null || fail 'jq is required on the pipeline agent'
        command -v python3 >/dev/null || fail 'python3 is required on the pipeline agent'
        [[ -f "$INVENTORY" ]] || fail "Azure resource inventory is missing: $INVENTORY"
        jq -e '.schemaVersion == 1 and (.containerApps | length == 7)' "$INVENTORY" >/dev/null \
          || fail 'Azure resource inventory is malformed'

        mkdir -p "$WORK/apps" "$WORK/keyvaults"
        RG=$(jq -r '.resourceGroup' "$INVENTORY")
        az account show -o json >"$WORK/account.json"
        az group show --name "$RG" -o json >"$WORK/resource-group.json"
        az resource list --resource-group "$RG" \
          --query '[].{name:name,type:type,location:location,id:id}' -o json >"$WORK/resources.json"

        while IFS=$'\t' read -r SERVICE_KEY APP_NAME; do
          echo "Inspecting Container App metadata: $SERVICE_KEY -> $APP_NAME"
          az containerapp show --resource-group "$RG" --name "$APP_NAME" -o json \
            >"$WORK/apps/${SERVICE_KEY}-app.json"
          az containerapp secret list --resource-group "$RG" --name "$APP_NAME" \
            --query '[].{name:name,keyVaultUrl:keyVaultUrl,identity:identity}' -o json \
            >"$WORK/apps/${SERVICE_KEY}-secrets.json" 2>/dev/null \
            || printf '[]' >"$WORK/apps/${SERVICE_KEY}-secrets.json"
        done < <(jq -r '.containerApps | to_entries[] | [.key, .value] | @tsv' "$INVENTORY")

        az keyvault list --resource-group "$RG" \
          --query '[].{name:name,vaultUri:properties.vaultUri,enableRbacAuthorization:properties.enableRbacAuthorization}' \
          -o json >"$WORK/keyvaults.json" 2>/dev/null || printf '[]' >"$WORK/keyvaults.json"

        while IFS= read -r VAULT_NAME; do
          [[ -n "$VAULT_NAME" ]] || continue
          SAFE_NAME=$(printf '%s' "$VAULT_NAME" | tr -c 'A-Za-z0-9._-' '_')
          az keyvault secret list --vault-name "$VAULT_NAME" \
            --query '[].{name:name,enabled:attributes.enabled,expires:attributes.expires}' -o json \
            >"$WORK/keyvaults/${SAFE_NAME}-secret-metadata.json" 2>/dev/null \
            || printf '[]' >"$WORK/keyvaults/${SAFE_NAME}-secret-metadata.json"
        done < <(jq -r '.[].name' "$WORK/keyvaults.json")

        az postgres flexible-server list --resource-group "$RG" \
          --query '[].{name:name,fullyQualifiedDomainName:fullyQualifiedDomainName,version:version,state:state,location:location}' \
          -o json >"$WORK/postgres-servers.json" 2>/dev/null || printf '[]' >"$WORK/postgres-servers.json"

        az redis list --resource-group "$RG" \
          --query '[].{name:name,hostName:hostName,sslPort:sslPort,sku:sku.name,provisioningState:provisioningState}' \
          -o json >"$WORK/redis.json" 2>/dev/null || printf '[]' >"$WORK/redis.json"

        az storage account list --resource-group "$RG" \
          --query '[].{name:name,primaryBlobEndpoint:primaryEndpoints.blob,kind:kind,sku:sku.name}' \
          -o json >"$WORK/storage.json" 2>/dev/null || printf '[]' >"$WORK/storage.json"

        SERVICE_BUS=$(jq -r '.serviceBusNamespace' "$INVENTORY")
        az servicebus topic list --resource-group "$RG" --namespace-name "$SERVICE_BUS" \
          --query '[].{name:name,status:status}' -o json >"$WORK/servicebus-topics.json" 2>/dev/null \
          || printf '[]' >"$WORK/servicebus-topics.json"

        APIM=$(jq -r '.apiManagement' "$INVENTORY")
        az apim api list --resource-group "$RG" --service-name "$APIM" \
          --query '[].{name:name,path:path,protocols:protocols}' -o json >"$WORK/apim-apis.json" 2>/dev/null \
          || printf '[]' >"$WORK/apim-apis.json"

        python3 - "$INVENTORY" "$WORK" "$REPORT" "$SNAPSHOT" <<'PY'
        import json
        import re
        import sys
        from pathlib import Path

        inventory_path, work_path, report_path, snapshot_path = map(Path, sys.argv[1:])
        inventory = json.loads(inventory_path.read_text(encoding='utf-8'))
        work = work_path

        sensitive_pattern = re.compile(
            r'(PASSWORD|SECRET|TOKEN|PRIVATE|PEM|CREDENTIAL|ACCESS[_-]?KEY|CONNECTION[_-]?STRING|SERVICE[_-]?ACCOUNT|SAS|CLIENT[_-]?KEY)',
            re.IGNORECASE,
        )

        def load(path: Path, default):
            try:
                return json.loads(path.read_text(encoding='utf-8'))
            except Exception:
                return default

        def safe_env(env):
            name = str(env.get('name') or '')
            secret_ref = str(env.get('secretRef') or '')
            value = env.get('value')
            if secret_ref:
                return {'name': name, 'binding': 'secretRef', 'safeValue': secret_ref}
            if sensitive_pattern.search(name):
                return {'name': name, 'binding': 'plaintext-redacted', 'safeValue': '<redacted>'}
            return {'name': name, 'binding': 'value', 'safeValue': '' if value is None else str(value)}

        snapshot = {
            'schemaVersion': 1,
            'resourceGroup': inventory['resourceGroup'],
            'note': 'Redacted discovery only. No secret values are included.',
            'containerApps': {},
            'keyVaults': load(work / 'keyvaults.json', []),
            'postgresServers': load(work / 'postgres-servers.json', []),
            'redis': load(work / 'redis.json', []),
            'storage': load(work / 'storage.json', []),
            'serviceBusTopics': load(work / 'servicebus-topics.json', []),
            'apimApis': load(work / 'apim-apis.json', []),
        }

        for service_key, app_name in inventory['containerApps'].items():
            app = load(work / 'apps' / f'{service_key}-app.json', {})
            secrets = load(work / 'apps' / f'{service_key}-secrets.json', [])
            container = ((app.get('properties') or {}).get('template') or {}).get('containers') or []
            first = container[0] if container else {}
            env = [safe_env(item) for item in (first.get('env') or [])]
            snapshot['containerApps'][service_key] = {
                'name': app_name,
                'runningStatus': (app.get('properties') or {}).get('runningStatus'),
                'latestRevisionName': (app.get('properties') or {}).get('latestRevisionName'),
                'latestReadyRevisionName': (app.get('properties') or {}).get('latestReadyRevisionName'),
                'fqdn': (((app.get('properties') or {}).get('configuration') or {}).get('ingress') or {}).get('fqdn'),
                'image': first.get('image'),
                'environment': sorted(env, key=lambda item: item['name']),
                'secrets': sorted(secrets, key=lambda item: str(item.get('name') or '')),
            }

        snapshot_path.write_text(json.dumps(snapshot, indent=2, sort_keys=True), encoding='utf-8')

        lines = [
            '# Craves existing Azure configuration discovery',
            '',
            '> This report is redacted. It contains no Container App secret values, Key Vault secret values, passwords, private keys, tokens, or provider credentials.',
            '',
            f"- Resource group: `{snapshot['resourceGroup']}`",
            '- Azure changes performed: **none**',
            '',
            '## Important limitation',
            '',
            'Azure Container Apps exposes secret names and Key Vault references, but it does not return the value of a Container App managed secret. Managed secret values must be reused by reference, replaced deliberately, or recovered from their original Key Vault/source.',
            '',
            '## Container Apps',
            '',
        ]

        for service_key, app in snapshot['containerApps'].items():
            lines.extend([
                f"### {service_key}: `{app['name']}`",
                '',
                f"- Running status: `{app.get('runningStatus') or 'Unknown'}`",
                f"- Latest revision: `{app.get('latestRevisionName') or 'Unknown'}`",
                f"- Latest ready revision: `{app.get('latestReadyRevisionName') or 'Unknown'}`",
                f"- FQDN: `{app.get('fqdn') or 'Not configured'}`",
                f"- Image: `{app.get('image') or 'Unknown'}`",
                '',
                '| Environment name | Binding | Safe value/reference |',
                '|---|---|---|',
            ])
            for env in app['environment']:
                safe_value = env['safeValue'].replace('|', '\\|').replace('\n', ' ')
                lines.append(f"| `{env['name']}` | `{env['binding']}` | `{safe_value}` |")
            if not app['environment']:
                lines.append('| _none_ |  |  |')
            lines.extend(['', '| Container App secret name | Backing |', '|---|---|'])
            for secret in app['secrets']:
                name = secret.get('name') or 'Unknown'
                key_vault_url = secret.get('keyVaultUrl') or ''
                backing = f"Key Vault: {key_vault_url}" if key_vault_url else 'Container App managed secret; value not retrievable'
                lines.append(f"| `{name}` | `{backing}` |")
            if not app['secrets']:
                lines.append('| _none or list permission unavailable_ |  |')
            lines.append('')

        lines.extend(['## Key Vaults', ''])
        for vault in snapshot['keyVaults']:
            lines.append(f"- `{vault.get('name')}` — `{vault.get('vaultUri')}` — RBAC: `{vault.get('enableRbacAuthorization')}`")
            metadata_file = work / 'keyvaults' / (re.sub(r'[^A-Za-z0-9._-]', '_', str(vault.get('name') or '')) + '-secret-metadata.json')
            metadata = load(metadata_file, [])
            if metadata:
                lines.append('  - Readable secret names: ' + ', '.join(f"`{item.get('name')}`" for item in metadata))
            else:
                lines.append('  - Secret names unavailable or none exist; values were not requested.')
        if not snapshot['keyVaults']:
            lines.append('- No Key Vault was discovered in the resource group.')

        lines.extend(['', '## PostgreSQL Flexible Servers', ''])
        for item in snapshot['postgresServers']:
            lines.append(f"- `{item.get('name')}` — `{item.get('fullyQualifiedDomainName')}` — state `{item.get('state')}` — PostgreSQL `{item.get('version')}`")
        if not snapshot['postgresServers']:
            lines.append('- None discovered or list permission unavailable.')

        lines.extend(['', '## Redis', ''])
        for item in snapshot['redis']:
            lines.append(f"- `{item.get('name')}` — `{item.get('hostName')}:{item.get('sslPort')}` — SKU `{item.get('sku')}` — state `{item.get('provisioningState')}`")
        if not snapshot['redis']:
            lines.append('- None discovered or list permission unavailable.')

        lines.extend(['', '## Storage', ''])
        for item in snapshot['storage']:
            lines.append(f"- `{item.get('name')}` — blob endpoint `{item.get('primaryBlobEndpoint')}` — `{item.get('sku')}`")
        if not snapshot['storage']:
            lines.append('- None discovered or list permission unavailable.')

        lines.extend(['', '## Service Bus topics', ''])
        for item in snapshot['serviceBusTopics']:
            lines.append(f"- `{item.get('name')}` — status `{item.get('status')}`")
        if not snapshot['serviceBusTopics']:
            lines.append('- None discovered or list permission unavailable.')

        lines.extend(['', '## APIM APIs', ''])
        for item in snapshot['apimApis']:
            lines.append(f"- `{item.get('name')}` — path `{item.get('path')}` — protocols `{item.get('protocols')}`")
        if not snapshot['apimApis']:
            lines.append('- None discovered or list permission unavailable.')

        lines.extend([
            '',
            '## Next decision',
            '',
            '1. Reuse existing Container App secret references where they are valid.',
            '2. Link Azure DevOps variable groups directly to Key Vault for retrievable secrets.',
            '3. Rotate and replace only secrets that exist solely as unrecoverable Container App managed values.',
            '4. Do not print or export secret values into pipeline logs or downloadable artifacts.',
            '',
        ])
        report_path.write_text('\n'.join(lines), encoding='utf-8')
        PY

        jq -e '.schemaVersion == 1 and (.containerApps | length == 7)' "$SNAPSHOT" >/dev/null \
          || fail 'Redacted discovery snapshot validation failed'
        grep -q 'This report is redacted' "$REPORT" \
          || fail 'Redacted report marker is missing'

        echo 'SUCCESS: Existing Azure configuration was discovered and redacted.'
        echo 'No secret values were requested, printed, copied, or published.'
        echo 'No Azure resource, Container App setting, Key Vault entry, or Azure DevOps variable was changed.'

  - task: PublishPipelineArtifact@1
    displayName: Publish redacted existing Azure configuration report
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/azure-existing-config
      artifact: azure-existing-config-redacted
