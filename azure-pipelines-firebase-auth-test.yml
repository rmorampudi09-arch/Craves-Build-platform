trigger: none
pr: none

parameters:
  - name: resourceGroup
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-web-prodlow
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: apps/api-test-dashboard
  imageRepository: craves/api-test-dashboard
  azureServiceConnection: $(AZURE_SERVICE_CONNECTION)
  dashboardBaseUrl: https://ca-craves-web-prodlow.happysand-aedc7165.centralindia.azurecontainerapps.io

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Build and push Craves API Test Dashboard image
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        python3 - <<'PY'
        from pathlib import Path
        page = Path("apps/api-test-dashboard/app/page.tsx")
        text = page.read_text()
        old_profile = '''const DEFAULT_PROFILE_PAYLOAD = `{\n  "displayName": "Raviteja Test Customer",\n  "email": "raviteja.test@example.com"\n}`;'''
        new_profile = '''const DEFAULT_PROFILE_PAYLOAD = `{\n  "displayName": "Raviteja Test Customer",\n  "contactPhoneNumber": "+918019166645",\n  "email": "raviteja.test@example.com"\n}`;'''
        old_address = '''const DEFAULT_ADDRESS_PAYLOAD = `{\n  "label": "Home",\n  "line1": "Test address line 1",\n  "line2": "Test address line 2",\n  "city": "Hyderabad",\n  "state": "Telangana",\n  "postalCode": "500001",\n  "latitude": 17.385,\n  "longitude": 78.4867,\n  "isDefault": true\n}`;'''
        new_address = '''const DEFAULT_ADDRESS_PAYLOAD = `{\n  "label": "Home",\n  "contactPhoneNumber": "+918019166645",\n  "addressLine1": "Test address line 1",\n  "addressLine2": "Test address line 2",\n  "city": "Hyderabad",\n  "state": "Telangana",\n  "postalCode": "500001",\n  "latitude": 17.385,\n  "longitude": 78.4867,\n  "isDefault": true\n}`;'''
        if old_profile not in text:
          raise SystemExit("Expected old profile payload block was not found")
        if old_address not in text:
          raise SystemExit("Expected old address payload block was not found")
        text = text.replace(old_profile, new_profile).replace(old_address, new_address)
        page.write_text(text)
        print("Patched dashboard default customer payloads for current backend validation fields.")
        PY

        ACR_LOGIN_SERVER=$(az acr show \
          --name "${{ parameters.acrName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --query loginServer \
          -o tsv)

        IMAGE="${ACR_LOGIN_SERVER}/$(imageRepository):${{ parameters.imageTag }}"
        echo "Building ${IMAGE}"

        az acr login --name "${{ parameters.acrName }}"

        docker build \
          -f "$(modulePath)/Dockerfile" \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$(NEXT_PUBLIC_FIREBASE_API_KEY)" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)" \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="$(NEXT_PUBLIC_FIREBASE_PROJECT_ID)" \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$(NEXT_PUBLIC_FIREBASE_APP_ID)" \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$(NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)" \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$(NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)" \
          --build-arg NEXT_PUBLIC_APIM_BASE_URL="$(dashboardBaseUrl)" \
          -t "${IMAGE}" \
          "$(modulePath)"

        docker push "${IMAGE}"

  - task: AzureCLI@2
    displayName: Deploy Craves API Test Dashboard to existing web Container App
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        ACR_LOGIN_SERVER=$(az acr show \
          --name "${{ parameters.acrName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --query loginServer \
          -o tsv)

        IMAGE="${ACR_LOGIN_SERVER}/$(imageRepository):${{ parameters.imageTag }}"
        echo "Deploying ${IMAGE} to ${{ parameters.containerAppName }}"

        az containerapp ingress update \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --type external \
          --target-port 3000 \
          --transport auto \
          -o table

        az containerapp update \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --image "${IMAGE}" \
          --set-env-vars \
            NODE_ENV=production \
            PORT=3000 \
            NEXT_PUBLIC_FIREBASE_API_KEY="$(NEXT_PUBLIC_FIREBASE_API_KEY)" \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="$(NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN)" \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID="$(NEXT_PUBLIC_FIREBASE_PROJECT_ID)" \
            NEXT_PUBLIC_FIREBASE_APP_ID="$(NEXT_PUBLIC_FIREBASE_APP_ID)" \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="$(NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET)" \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$(NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)" \
            NEXT_PUBLIC_APIM_BASE_URL="$(dashboardBaseUrl)" \
          -o table

        WEB_FQDN=$(az containerapp ingress show \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --query fqdn \
          -o tsv)

        echo ""
        echo "Craves API Test Dashboard URL: https://${WEB_FQDN}"
        echo "Firebase Authorized domain must include: ${WEB_FQDN}"
        echo "Dashboard same-origin API proxy is enabled for /api/v1/* routes."

  - task: AzureCLI@2
    displayName: Show latest web app logs
    condition: always()
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az containerapp logs show \
          --name "${{ parameters.containerAppName }}" \
          --resource-group "${{ parameters.resourceGroup }}" \
          --tail 120 || true
