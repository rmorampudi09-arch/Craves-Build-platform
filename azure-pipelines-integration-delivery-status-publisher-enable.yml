trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: serviceBusNamespace
    type: string
    default: sb-craves-prodlow-l3ing6
  - name: serviceBusFullyQualifiedNamespace
    type: string
    default: sb-craves-prodlow-l3ing6.servicebus.windows.net
  - name: topicName
    type: string
    default: craves-domain-events
  - name: orderSubscriptionName
    type: string
    default: order-service-delivery-status-changed
  - name: orderSubscriptionRuleName
    type: string
    default: delivery-status-changed-only

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Verify dependencies and enable DELIVERY_STATUS_CHANGED publisher
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        INTEGRATION_APP='${{ parameters.integrationContainerAppName }}'
        ORDER_APP='${{ parameters.orderContainerAppName }}'
        NS='${{ parameters.serviceBusNamespace }}'
        FQNS='${{ parameters.serviceBusFullyQualifiedNamespace }}'
        TOPIC='${{ parameters.topicName }}'
        ORDER_SUB='${{ parameters.orderSubscriptionName }}'
        ORDER_RULE='${{ parameters.orderSubscriptionRuleName }}'

        if [[ "$FQNS" != "$NS.servicebus.windows.net" ]]; then
          echo "ERROR: Fully-qualified namespace must be $NS.servicebus.windows.net"
          exit 1
        fi

        read_env() {
          local app="$1"
          local name="$2"
          az containerapp show \
            --resource-group "$RG" \
            --name "$app" \
            --query "properties.template.containers[0].env[?name=='$name'].value | [0]" \
            --output tsv
        }

        require_true() {
          local label="$1"
          local value="$2"
          if [[ "${value,,}" != "true" ]]; then
            echo "ERROR: $label must be true. Current value: ${value:-<empty>}"
            exit 1
          fi
        }

        require_false_or_empty() {
          local label="$1"
          local value="$2"
          if [[ -n "$value" && "${value,,}" != "false" ]]; then
            echo "ERROR: $label must be false or absent. Current value: $value"
            exit 1
          fi
        }

        az servicebus topic subscription show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --name "$ORDER_SUB" \
          --output none

        FILTER_TYPE=$(az servicebus topic subscription rule show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --subscription-name "$ORDER_SUB" \
          --name "$ORDER_RULE" \
          --query filterType \
          --output tsv)
        FILTER_EXPRESSION=$(az servicebus topic subscription rule show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --subscription-name "$ORDER_SUB" \
          --name "$ORDER_RULE" \
          --query sqlFilter.sqlExpression \
          --output tsv)

        if [[ "$FILTER_TYPE" != "SqlFilter" || "$FILTER_EXPRESSION" != *"DELIVERY_STATUS_CHANGED"* ]]; then
          echo "ERROR: Order delivery-status subscription filter is not approved."
          echo "Filter type: $FILTER_TYPE"
          echo "Expression: $FILTER_EXPRESSION"
          exit 1
        fi

        ORDER_DLQ_COUNT=$(az servicebus topic subscription show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --name "$ORDER_SUB" \
          --query countDetails.deadLetterMessageCount \
          --output tsv)
        if [[ "${ORDER_DLQ_COUNT:-0}" != "0" ]]; then
          echo "ERROR: Order delivery-status subscription DLQ must be empty before publisher activation."
          exit 1
        fi

        require_true "Order delivery status consumer" "$(read_env "$ORDER_APP" CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED)"
        require_false_or_empty "Integration delivery command" "$(read_env "$INTEGRATION_APP" CRAVES_DELIVERY_COMMAND_ENABLED)"
        require_false_or_empty "Integration create reconciliation" "$(read_env "$INTEGRATION_APP" CRAVES_DELIVERY_RECONCILIATION_ENABLED)"
        require_false_or_empty "Integration webhook processing" "$(read_env "$INTEGRATION_APP" CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED)"
        require_false_or_empty "Integration tracking reconciliation" "$(read_env "$INTEGRATION_APP" CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED)"
        require_false_or_empty "Borzo API" "$(read_env "$INTEGRATION_APP" BORZO_API_ENABLED)"

        CURRENT_PUBLISHER=$(read_env "$INTEGRATION_APP" CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED)
        PRINCIPAL_ID=$(az containerapp show \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --query identity.principalId \
          --output tsv)
        if [[ -z "$PRINCIPAL_ID" || "$PRINCIPAL_ID" == "null" ]]; then
          echo "ERROR: Integration Container App has no system-assigned managed identity."
          exit 1
        fi

        NAMESPACE_SCOPE=$(az servicebus namespace show \
          --resource-group "$RG" --name "$NS" --query id --output tsv)
        TOPIC_SCOPE=$(az servicebus topic show \
          --resource-group "$RG" --namespace-name "$NS" --name "$TOPIC" \
          --query id --output tsv)
        SENDER_COUNT=$(az role assignment list \
          --assignee-object-id "$PRINCIPAL_ID" \
          --all \
          --query "[?roleDefinitionName=='Azure Service Bus Data Sender' && (scope=='$NAMESPACE_SCOPE' || scope=='$TOPIC_SCOPE')] | length(@)" \
          --output tsv)
        if [[ "${SENDER_COUNT:-0}" == "0" ]]; then
          echo "ERROR: Integration managed identity is missing Azure Service Bus Data Sender."
          echo "PRINCIPAL_ID=$PRINCIPAL_ID"
          echo "Grant the role once with an authorized Azure account, then rerun."
          exit 2
        fi

        if [[ "${CURRENT_PUBLISHER,,}" == "true" ]]; then
          echo "SUCCESS: Delivery status publisher is already enabled and all safety checks passed."
          exit 0
        fi

        PREVIOUS_LATEST=$(az containerapp show \
          --resource-group "$RG" --name "$INTEGRATION_APP" \
          --query properties.latestRevisionName --output tsv)

        az containerapp update \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --set-env-vars \
            CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=true \
            CRAVES_DELIVERY_COMMAND_ENABLED=false \
            CRAVES_DELIVERY_RECONCILIATION_ENABLED=false \
            CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED=false \
            CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED=false \
            BORZO_API_ENABLED=false \
            SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE="$FQNS" \
            SERVICE_BUS_TOPIC_NAME="$TOPIC" \
          --output none

        for ATTEMPT in $(seq 1 60); do
          APP_JSON=$(az containerapp show --resource-group "$RG" --name "$INTEGRATION_APP" -o json)
          LATEST=$(jq -r '.properties.latestRevisionName // ""' <<<"$APP_JSON")
          READY=$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$APP_JSON")
          RUNNING=$(jq -r '.properties.runningStatus // ""' <<<"$APP_JSON")
          PUBLISHER=$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED")][0].value // ""
          ' <<<"$APP_JSON")
          HEALTH=$(az containerapp revision show \
            --resource-group "$RG" --name "$INTEGRATION_APP" --revision "$LATEST" \
            --query properties.healthState --output tsv 2>/dev/null || true)

          echo "Attempt $ATTEMPT/60: latest=$LATEST ready=$READY health=$HEALTH running=$RUNNING statusPublisher=$PUBLISHER"
          if [[ "$LATEST" != "$PREVIOUS_LATEST" \
                && "$LATEST" == "$READY" \
                && "$HEALTH" == "Healthy" \
                && "$RUNNING" == "Running" \
                && "${PUBLISHER,,}" == "true" ]]; then
            echo "SUCCESS: DELIVERY_STATUS_CHANGED publisher enabled. Provider execution remains disabled."
            exit 0
          fi
          sleep 10
        done

        echo "ERROR: Delivery status publisher revision did not become healthy within 10 minutes."
        exit 1
