trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: services/integration-service
  imageRepository: craves/integration-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      echo "Build ID: $(Build.BuildId)"
      echo "Source commit: $(Build.SourceVersion)"
      echo "Source branch: $(Build.SourceBranch)"
    displayName: Show immutable build identity

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      cd $(modulePath)
      mvn -B clean package
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Build and push image to ACR
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"

        az acr login --name "$ACR"
        docker build -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"

        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Deploy and verify healthy Container App revision
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"

        CURRENT_IMAGE=$(az containerapp show \
          --name "$APP" \
          --resource-group "$RG" \
          --query "properties.template.containers[0].image" \
          -o tsv)

        echo "Current image: $CURRENT_IMAGE"
        echo "Target image:  $IMAGE"

        if [[ "$CURRENT_IMAGE" == "$IMAGE" ]]; then
          echo "ERROR: The target image tag is already configured on the Container App."
          echo "Start a completely new pipeline run from main instead of rerunning an old run."
          exit 1
        fi

        PREVIOUS_LATEST=$(az containerapp show \
          --name "$APP" \
          --resource-group "$RG" \
          --query "properties.latestRevisionName" \
          -o tsv)

        echo "Revision before deployment: $PREVIOUS_LATEST"

        az containerapp update \
          --name "$APP" \
          --resource-group "$RG" \
          --image "$IMAGE" \
          --set-env-vars \
            CRAVES_DELIVERY_COMMAND_ENABLED=false \
            CRAVES_DELIVERY_RECONCILIATION_ENABLED=false \
            CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true \
            BORZO_API_ENABLED=false \
          -o none

        echo "Waiting for a new healthy fail-closed revision..."

        for ATTEMPT in $(seq 1 60); do
          APP_JSON=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            -o json)

          LATEST_REVISION=$(jq -r '.properties.latestRevisionName // ""' <<<"$APP_JSON")
          READY_REVISION=$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$APP_JSON")
          RUNNING_STATUS=$(jq -r '.properties.runningStatus // ""' <<<"$APP_JSON")

          DELIVERY_ENABLED=$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "CRAVES_DELIVERY_COMMAND_ENABLED")][0].value // ""
          ' <<<"$APP_JSON")
          RECONCILIATION_ENABLED=$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "CRAVES_DELIVERY_RECONCILIATION_ENABLED")][0].value // ""
          ' <<<"$APP_JSON")
          INTELLIGENCE_ENABLED=$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "CRAVES_DELIVERY_INTELLIGENCE_ENABLED")][0].value // ""
          ' <<<"$APP_JSON")
          BORZO_ENABLED=$(jq -r '
            [.properties.template.containers[0].env[]?
             | select(.name == "BORZO_API_ENABLED")][0].value // ""
          ' <<<"$APP_JSON")

          LATEST_IMAGE=""
          HEALTH_STATE=""
          if [[ -n "$LATEST_REVISION" ]]; then
            LATEST_IMAGE=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$LATEST_REVISION" \
              --query "properties.template.containers[0].image" \
              -o tsv 2>/dev/null || true)

            HEALTH_STATE=$(az containerapp revision show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$LATEST_REVISION" \
              --query "properties.healthState" \
              -o tsv 2>/dev/null || true)
          fi

          echo "Attempt $ATTEMPT/60: latest=$LATEST_REVISION ready=$READY_REVISION health=$HEALTH_STATE running=$RUNNING_STATUS delivery=$DELIVERY_ENABLED reconciliation=$RECONCILIATION_ENABLED intelligence=$INTELLIGENCE_ENABLED borzo=$BORZO_ENABLED image=$LATEST_IMAGE"

          if [[ "$LATEST_REVISION" != "$PREVIOUS_LATEST" \
                && "$LATEST_REVISION" == "$READY_REVISION" \
                && "$LATEST_IMAGE" == "$IMAGE" \
                && "$HEALTH_STATE" == "Healthy" \
                && "$RUNNING_STATUS" == "Running" \
                && "${DELIVERY_ENABLED,,}" == "false" \
                && "${RECONCILIATION_ENABLED,,}" == "false" \
                && "${INTELLIGENCE_ENABLED,,}" == "true" \
                && "${BORZO_ENABLED,,}" == "false" ]]; then
            echo "SUCCESS: New Container App revision is healthy, ready, and fail-closed."
            az containerapp show \
              --name "$APP" \
              --resource-group "$RG" \
              --query "{name:name,runningStatus:properties.runningStatus,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,image:properties.template.containers[0].image}" \
              -o table
            exit 0
          fi

          sleep 10
        done

        echo "ERROR: The new Container App revision did not become healthy and fail-closed within 10 minutes."
        az containerapp revision list \
          --name "$APP" \
          --resource-group "$RG" \
          --query "[].{revision:name,active:properties.active,health:properties.healthState,replicas:properties.replicas}" \
          -o table || true
        exit 1
