trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: userChefContainerAppName
    type: string
    default: ca-craves-user-chef-service-prod
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: services/order-service
  imageRepository: craves/order-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled
  - script: |
      set -euo pipefail
      cd $(modulePath)
      mvn -B -ntp clean verify
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Build and push immutable Order image
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'; TAG='${{ parameters.imageTag }}'; IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        az acr login --name "$ACR"
        docker build --pull -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Verify shared Key Vault and User-Chef dependencies
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'; ORDER_APP='${{ parameters.containerAppName }}'; USER_CHEF_APP='${{ parameters.userChefContainerAppName }}'; SHARED_SECRET='craves-internal-service-secret'
        fail() { echo "ERROR: $*" >&2; exit 1; }
        ORDER_URI=$(az containerapp secret list -g "$RG" -n "$ORDER_APP" --query "[?name=='$SHARED_SECRET']|[0].keyVaultUrl" -o tsv)
        USER_CHEF_URI=$(az containerapp secret list -g "$RG" -n "$USER_CHEF_APP" --query "[?name=='$SHARED_SECRET']|[0].keyVaultUrl" -o tsv)
        ORDER_IDENTITY=$(az containerapp secret list -g "$RG" -n "$ORDER_APP" --query "[?name=='$SHARED_SECRET']|[0].identity" -o tsv)
        USER_CHEF_IDENTITY=$(az containerapp secret list -g "$RG" -n "$USER_CHEF_APP" --query "[?name=='$SHARED_SECRET']|[0].identity" -o tsv)
        ORDER_REF=$(az containerapp show -g "$RG" -n "$ORDER_APP" --query "properties.template.containers[0].env[?name=='CRAVES_INTERNAL_SERVICE_SECRET']|[0].secretRef" -o tsv)
        USER_CHEF_REF=$(az containerapp show -g "$RG" -n "$USER_CHEF_APP" --query "properties.template.containers[0].env[?name=='CRAVES_INTERNAL_SERVICE_SECRET']|[0].secretRef" -o tsv)
        [[ -n "$ORDER_URI" && "$ORDER_URI" == "$USER_CHEF_URI" ]] || fail 'Order and User-Chef must share one version-pinned Key Vault secret.'
        [[ "$ORDER_IDENTITY" == 'system' && "$USER_CHEF_IDENTITY" == 'system' ]] || fail 'Shared Key Vault references must use system-assigned identities.'
        [[ "$ORDER_REF" == "$SHARED_SECRET" && "$USER_CHEF_REF" == "$SHARED_SECRET" ]] || fail 'Shared internal-secret environment references are inconsistent.'
        case "$ORDER_URI" in https://*.vault.azure.net/secrets/*/*) ;; *) fail 'Shared Key Vault URI is not version-pinned.' ;; esac
        USER_CHEF_JSON=$(az containerapp show -g "$RG" -n "$USER_CHEF_APP" -o json)
        USER_CHEF_FQDN=$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$USER_CHEF_JSON")
        USER_CHEF_LATEST=$(jq -r '.properties.latestRevisionName // ""' <<<"$USER_CHEF_JSON"); USER_CHEF_READY=$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$USER_CHEF_JSON"); USER_CHEF_RUNNING=$(jq -r '.properties.runningStatus // ""' <<<"$USER_CHEF_JSON")
        [[ -n "$USER_CHEF_FQDN" && "$USER_CHEF_LATEST" == "$USER_CHEF_READY" && "$USER_CHEF_RUNNING" == 'Running' ]] || fail 'User-Chef Service is not ready.'
        curl --fail --silent --show-error --max-time 30 "https://$USER_CHEF_FQDN/actuator/health" | jq -e '.status == "UP"' >/dev/null
        echo "##vso[task.setvariable variable=USER_CHEF_INTERNAL_BASE_URL]https://$USER_CHEF_FQDN"
        echo 'Shared Key Vault and User-Chef dependencies verified.'

  - task: AzureCLI@2
    displayName: Store Order database and JWT secrets
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x
        RG='${{ parameters.resourceGroupName }}'; APP='${{ parameters.containerAppName }}'
        DB_PASSWORD='$(POSTGRES_BUSINESS_DB_PASSWORD)'; JWT_PEM='$(CRAVES_JWT_VERIFICATION_PEM_BASE64)'
        require_value() { local name="$1" value="$2"; [[ -n "$value" && "$value" != "\$($name)" ]] || { echo "ERROR: Secure pipeline variable $name is missing." >&2; exit 1; }; }
        require_value POSTGRES_BUSINESS_DB_PASSWORD "$DB_PASSWORD"
        require_value CRAVES_JWT_VERIFICATION_PEM_BASE64 "$JWT_PEM"
        az containerapp secret set -g "$RG" -n "$APP" --secrets db-password="$DB_PASSWORD" jwt-verify-pem="$JWT_PEM" -o none
        echo 'Order database and JWT secrets stored; values were not printed.'

  - task: AzureCLI@2
    displayName: Deploy and verify fail-closed Order revision
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'; ACR='${{ parameters.acrName }}'; APP='${{ parameters.containerAppName }}'; TAG='${{ parameters.imageTag }}'; IMAGE_REPOSITORY='$(imageRepository)'; USER_CHEF_URL='$(USER_CHEF_INTERNAL_BASE_URL)'
        [[ "$USER_CHEF_URL" == https://* ]] || { echo 'ERROR: User-Chef internal URL was not resolved.' >&2; exit 1; }
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv); IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        BEFORE=$(az containerapp show -g "$RG" -n "$APP" -o json); PREVIOUS_REVISION=$(jq -r '.properties.latestRevisionName // ""' <<<"$BEFORE"); PREVIOUS_IMAGE=$(jq -r '.properties.template.containers[0].image // ""' <<<"$BEFORE")
        [[ -n "$PREVIOUS_REVISION" && -n "$PREVIOUS_IMAGE" && "$PREVIOUS_IMAGE" != "$IMAGE" ]] || { echo 'ERROR: Order deployment state or image tag is invalid.' >&2; exit 1; }
        az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" --set-env-vars \
          SPRING_PROFILES_ACTIVE=prod \
          SPRING_DATASOURCE_URL='$(POSTGRES_BUSINESS_DB_URL)' \
          SPRING_DATASOURCE_USERNAME='$(POSTGRES_BUSINESS_DB_USER)' \
          SPRING_DATASOURCE_PASSWORD=secretref:db-password \
          CRAVES_JWT_VERIFICATION_PEM_BASE64=secretref:jwt-verify-pem \
          CRAVES_JWT_ISSUER='https://api.craves.in/auth' \
          CRAVES_JWT_AUDIENCE=craves-api \
          CRAVES_USER_CHEF_INTERNAL_BASE_URL="$USER_CHEF_URL" \
          CRAVES_INTERNAL_SERVICE_SECRET=secretref:craves-internal-service-secret \
          CRAVES_LAUNCH_POLICY_ENFORCEMENT_ENABLED=false \
          CRAVES_NOTIFICATION_DIRECT_DISPATCH_ENABLED=false \
          CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_ENABLED=false \
          CRAVES_CHEF_ACCEPTANCE_WORKER_ENABLED=false \
          CRAVES_REFUND_STATUS_CONSUMER_ENABLED=false \
          CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED=false \
          CRAVES_SUBSCRIPTION_ORDER_CONSUMER_ENABLED=false \
          CRAVES_SUBSCRIPTION_ORDER_CALLBACK_WORKER_ENABLED=false \
          CRAVES_DOMAIN_EVENT_OUTBOX_ENABLED=false \
          CRAVES_DOMAIN_EVENT_SERVICE_BUS_ENABLED=false \
          CRAVES_TOKEN_REVOCATION_ENABLED=false \
          --no-wait -o none
        REQUIRED_FALSE=(CRAVES_LAUNCH_POLICY_ENFORCEMENT_ENABLED CRAVES_NOTIFICATION_DIRECT_DISPATCH_ENABLED CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_ENABLED CRAVES_CHEF_ACCEPTANCE_WORKER_ENABLED CRAVES_REFUND_STATUS_CONSUMER_ENABLED CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED CRAVES_SUBSCRIPTION_ORDER_CONSUMER_ENABLED CRAVES_SUBSCRIPTION_ORDER_CALLBACK_WORKER_ENABLED CRAVES_DOMAIN_EVENT_OUTBOX_ENABLED CRAVES_DOMAIN_EVENT_SERVICE_BUS_ENABLED CRAVES_TOKEN_REVOCATION_ENABLED)
        for attempt in $(seq 1 60); do
          JSON=$(az containerapp show -g "$RG" -n "$APP" -o json); LATEST=$(jq -r '.properties.latestRevisionName // ""' <<<"$JSON"); READY=$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$JSON"); RUNNING=$(jq -r '.properties.runningStatus // ""' <<<"$JSON")
          LATEST_IMAGE=''; HEALTH=''; if [[ -n "$LATEST" ]]; then LATEST_IMAGE=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST" --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true); HEALTH=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST" --query properties.healthState -o tsv 2>/dev/null || true); fi
          FLAGS_OK=true; for name in "${REQUIRED_FALSE[@]}"; do value=$(jq -r --arg name "$name" '[.properties.template.containers[0].env[]? | select(.name == $name)][0].value // ""' <<<"$JSON"); [[ "${value,,}" == 'false' ]] || FLAGS_OK=false; done
          ref() { jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name)][0].secretRef // ""' <<<"$JSON"; }
          DB_REF=$(ref SPRING_DATASOURCE_PASSWORD); JWT_REF=$(ref CRAVES_JWT_VERIFICATION_PEM_BASE64); INTERNAL_REF=$(ref CRAVES_INTERNAL_SERVICE_SECRET); ACTUAL_USER_CHEF=$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "CRAVES_USER_CHEF_INTERNAL_BASE_URL")][0].value // ""' <<<"$JSON")
          echo "Attempt $attempt/60 latest=$LATEST ready=$READY running=$RUNNING health=$HEALTH image=$LATEST_IMAGE flagsOk=$FLAGS_OK dbRef=$DB_REF jwtRef=$JWT_REF internalRef=$INTERNAL_REF userChef=$ACTUAL_USER_CHEF"
          if [[ "$LATEST" != "$PREVIOUS_REVISION" && "$LATEST" == "$READY" && "$RUNNING" == 'Running' && "$HEALTH" == 'Healthy' && "$LATEST_IMAGE" == "$IMAGE" && "$FLAGS_OK" == true && "$DB_REF" == 'db-password' && "$JWT_REF" == 'jwt-verify-pem' && "$INTERNAL_REF" == 'craves-internal-service-secret' && "$ACTUAL_USER_CHEF" == "$USER_CHEF_URL" ]]; then
            FQDN=$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$JSON")
            [[ -n "$FQDN" ]] || { echo 'ERROR: Order FQDN is missing.' >&2; exit 1; }
            PUBLIC_HEALTH_OK=false
            for health_attempt in $(seq 1 18); do
              HEALTH_BODY=$(mktemp)
              HTTP_CODE=$(curl --silent --show-error --max-time 30 --output "$HEALTH_BODY" --write-out '%{http_code}' "https://$FQDN/actuator/health" || true)
              if [[ "$HTTP_CODE" == '200' ]] && jq -e '.status == "UP"' "$HEALTH_BODY" >/dev/null 2>&1; then
                PUBLIC_HEALTH_OK=true
                rm -f "$HEALTH_BODY"
                break
              fi
              echo "Public Order health attempt $health_attempt/18 returned HTTP ${HTTP_CODE:-curl-error}; waiting for ingress/readiness propagation."
              rm -f "$HEALTH_BODY"
              sleep 10
            done
            if [[ "$PUBLIC_HEALTH_OK" != true ]]; then
              az containerapp logs show -g "$RG" -n "$APP" --revision "$LATEST" --type console --tail 200 --format text || true
              echo 'ERROR: Order revision is healthy in Azure but its public health endpoint did not become ready within 3 minutes.' >&2
              exit 1
            fi
            echo "SUCCESS: Order revision $LATEST is healthy, secret-bound and all launch workers/consumers are fail-closed. Rollback image: $PREVIOUS_IMAGE"
            exit 0
          fi
          [[ "$HEALTH" != 'Unhealthy' && "$RUNNING" != 'Failed' ]] || { az containerapp logs show -g "$RG" -n "$APP" --revision "$LATEST" --type console --tail 200 --format text || true; exit 1; }
          sleep 10
        done
        echo 'ERROR: Order revision did not become healthy and fail-closed within 10 minutes.' >&2
        exit 1
