trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: services/order-service
  imageRepository: craves/order-service
  userChefContainerAppName: ca-craves-user-chef-service-prod
  userChefInternalBaseUrl: https://ca-craves-user-chef-service-prod.happysand-aedc7165.centralindia.azurecontainerapps.io

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      cd $(modulePath)
      mvn -B clean package
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Build and push image to ACR
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        az acr login --name "$ACR"
        docker build -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Verify shared Key Vault secret reference before deployment
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ORDER_APP='${{ parameters.containerAppName }}'
        USER_CHEF_APP='$(userChefContainerAppName)'
        SECRET_NAME='craves-internal-service-secret'

        fail() {
          echo "ERROR: $*" >&2
          exit 1
        }

        ORDER_URI=$(az containerapp secret list \
          --resource-group "$RG" \
          --name "$ORDER_APP" \
          --query "[?name=='$SECRET_NAME'] | [0].keyVaultUrl" \
          -o tsv)
        USER_CHEF_URI=$(az containerapp secret list \
          --resource-group "$RG" \
          --name "$USER_CHEF_APP" \
          --query "[?name=='$SECRET_NAME'] | [0].keyVaultUrl" \
          -o tsv)
        ORDER_SECRET_IDENTITY=$(az containerapp secret list \
          --resource-group "$RG" \
          --name "$ORDER_APP" \
          --query "[?name=='$SECRET_NAME'] | [0].identity" \
          -o tsv)
        USER_CHEF_SECRET_IDENTITY=$(az containerapp secret list \
          --resource-group "$RG" \
          --name "$USER_CHEF_APP" \
          --query "[?name=='$SECRET_NAME'] | [0].identity" \
          -o tsv)
        ORDER_PRINCIPAL_ID=$(az containerapp show \
          --resource-group "$RG" \
          --name "$ORDER_APP" \
          --query identity.principalId \
          -o tsv)
        USER_CHEF_PRINCIPAL_ID=$(az containerapp show \
          --resource-group "$RG" \
          --name "$USER_CHEF_APP" \
          --query identity.principalId \
          -o tsv)
        ORDER_ENV_SECRET_REF=$(az containerapp show \
          --resource-group "$RG" \
          --name "$ORDER_APP" \
          --query "properties.template.containers[0].env[?name=='CRAVES_INTERNAL_SERVICE_SECRET'] | [0].secretRef" \
          -o tsv)
        USER_CHEF_ENV_SECRET_REF=$(az containerapp show \
          --resource-group "$RG" \
          --name "$USER_CHEF_APP" \
          --query "properties.template.containers[0].env[?name=='CRAVES_INTERNAL_SERVICE_SECRET'] | [0].secretRef" \
          -o tsv)

        [ -n "$ORDER_URI" ] || fail "$ORDER_APP does not have a Key Vault-backed $SECRET_NAME secret."
        [ -n "$USER_CHEF_URI" ] || fail "$USER_CHEF_APP does not have a Key Vault-backed $SECRET_NAME secret."
        [ "$ORDER_URI" = "$USER_CHEF_URI" ] || fail "Order and User-Chef reference different Key Vault secret versions."
        [ "$ORDER_SECRET_IDENTITY" = "system" ] || fail "$ORDER_APP secret does not use the system-assigned identity."
        [ "$USER_CHEF_SECRET_IDENTITY" = "system" ] || fail "$USER_CHEF_APP secret does not use the system-assigned identity."
        [ -n "$ORDER_PRINCIPAL_ID" ] || fail "$ORDER_APP has no system-assigned managed identity."
        [ -n "$USER_CHEF_PRINCIPAL_ID" ] || fail "$USER_CHEF_APP has no system-assigned managed identity."
        [ "$ORDER_ENV_SECRET_REF" = "$SECRET_NAME" ] || fail "$ORDER_APP environment variable is not linked to $SECRET_NAME."
        [ "$USER_CHEF_ENV_SECRET_REF" = "$SECRET_NAME" ] || fail "$USER_CHEF_APP environment variable is not linked to $SECRET_NAME."

        case "$ORDER_URI" in
          https://*.vault.azure.net/secrets/*/*) ;;
          *) fail "The shared Key Vault URI is not pinned to a specific secret version." ;;
        esac

        echo "Shared Key Vault reference verified for Order and User-Chef."
        echo "Secret URI: $ORDER_URI"

  - task: AzureCLI@2
    displayName: Deploy and verify Container App revision
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        USER_CHEF_INTERNAL_BASE_URL='$(userChefInternalBaseUrl)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"

        az containerapp update \
          --name "$APP" \
          --resource-group "$RG" \
          --image "$IMAGE" \
          --set-env-vars \
            CRAVES_USER_CHEF_INTERNAL_BASE_URL="$USER_CHEF_INTERNAL_BASE_URL" \
            CRAVES_INTERNAL_SERVICE_SECRET=secretref:craves-internal-service-secret \
          -o none

        echo "Waiting for the new Order Service revision to become ready..."
        for attempt in $(seq 1 36); do
          LATEST=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query properties.latestRevisionName \
            -o tsv)
          READY=$(az containerapp show \
            --name "$APP" \
            --resource-group "$RG" \
            --query properties.latestReadyRevisionName \
            -o tsv)

          HEALTH=$(az containerapp revision show \
            --name "$APP" \
            --resource-group "$RG" \
            --revision "$LATEST" \
            --query properties.healthState \
            -o tsv 2>/dev/null || true)
          RUNNING=$(az containerapp revision show \
            --name "$APP" \
            --resource-group "$RG" \
            --revision "$LATEST" \
            --query properties.runningState \
            -o tsv 2>/dev/null || true)

          echo "Attempt $attempt/36: latest=$LATEST ready=$READY health=$HEALTH running=$RUNNING"

          if [ "$LATEST" = "$READY" ] && [ "$HEALTH" = "Healthy" ] && [[ "$RUNNING" == Running* ]]; then
            echo "Order Service revision is healthy."
            az containerapp show \
              --name "$APP" \
              --resource-group "$RG" \
              --query "{name:name,latestRevision:properties.latestRevisionName,latestReadyRevision:properties.latestReadyRevisionName,runningStatus:properties.runningStatus,internalConfig:properties.template.containers[0].env[?name=='CRAVES_USER_CHEF_INTERNAL_BASE_URL' || name=='CRAVES_INTERNAL_SERVICE_SECRET'].{name:name,value:value,secretRef:secretRef}}" \
              -o json
            exit 0
          fi

          if [ "$HEALTH" = "Unhealthy" ] || [ "$RUNNING" = "Failed" ]; then
            echo "Order Service revision became unhealthy." >&2
            az containerapp logs show \
              --name "$APP" \
              --resource-group "$RG" \
              --revision "$LATEST" \
              --type console \
              --tail 100 \
              --format text || true
            exit 1
          fi

          sleep 10
        done

        echo "Timed out waiting for a healthy Order Service revision." >&2
        az containerapp revision list \
          --name "$APP" \
          --resource-group "$RG" \
          --all \
          --query "[].{revision:name,active:properties.active,health:properties.healthState,running:properties.runningState,image:properties.template.containers[0].image}" \
          -o table || true
        exit 1

  - task: AzureCLI@2
    displayName: Reverify shared Key Vault reference after deployment
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ORDER_APP='${{ parameters.containerAppName }}'
        USER_CHEF_APP='$(userChefContainerAppName)'
        SECRET_NAME='craves-internal-service-secret'

        ORDER_URI=$(az containerapp secret list \
          --resource-group "$RG" \
          --name "$ORDER_APP" \
          --query "[?name=='$SECRET_NAME'] | [0].keyVaultUrl" \
          -o tsv)
        USER_CHEF_URI=$(az containerapp secret list \
          --resource-group "$RG" \
          --name "$USER_CHEF_APP" \
          --query "[?name=='$SECRET_NAME'] | [0].keyVaultUrl" \
          -o tsv)
        ORDER_ENV_SECRET_REF=$(az containerapp show \
          --resource-group "$RG" \
          --name "$ORDER_APP" \
          --query "properties.template.containers[0].env[?name=='CRAVES_INTERNAL_SERVICE_SECRET'] | [0].secretRef" \
          -o tsv)

        [ -n "$ORDER_URI" ] || { echo "ERROR: Order Key Vault reference is missing after deployment." >&2; exit 1; }
        [ "$ORDER_URI" = "$USER_CHEF_URI" ] || { echo "ERROR: Shared Key Vault references diverged after deployment." >&2; exit 1; }
        [ "$ORDER_ENV_SECRET_REF" = "$SECRET_NAME" ] || { echo "ERROR: Order environment secret reference changed during deployment." >&2; exit 1; }

        echo "Post-deployment Key Vault reference verification passed."
        echo "Secret URI: $ORDER_URI"
