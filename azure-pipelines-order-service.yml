trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesrm09prodlow6bf632
  - name: containerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  AZURE_SERVICE_CONNECTION: Craves-RMORAMPUDI09-Service-Connection
  modulePath: services/order-service
  imageRepository: craves/order-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail
      cd $(modulePath)
      mvn -B -ntp clean verify
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Build and push immutable Order image
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$TAG"
        az acr login --name "$ACR" --only-show-errors
        docker build --pull -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Deploy Order image without changing runtime configuration
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        TAG='${{ parameters.imageTag }}'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$TAG"

        # Craves prod-low has documented healthy Container App revisions taking
        # more than ten minutes to converge. Preserve fail-fast terminal-state
        # checks but use the proven bounded 25-minute observation window.
        echo 'Order Container App readiness window: 1500 seconds (150 x 10s).'
        # Order runs with two plain app secrets set by the finance and referral activations; the release
        # leaves them as they are (the helper still refuses any other non Key Vault secret).
        ALLOW_PLAIN_SECRET_REFS='finance-internal referral-source-hmac' \
        READY_ATTEMPTS=150 \
        READY_SLEEP_SECONDS=10 \
        bash scripts/release/deploy-single-service-preserve-runtime.sh \
          "$RG" \
          "$APP" \
          "$IMAGE" \
          order
