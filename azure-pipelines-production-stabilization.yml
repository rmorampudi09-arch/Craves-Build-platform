trigger:
  branches:
    include:
      - main
  paths:
    include:
      - azure-pipelines-production-stabilization.yml
pr: none

schedules:
  - cron: "*/5 * * * *"
    displayName: Temporary Delivery Intelligence runtime diagnosis
    branches:
      include:
        - main
    always: true

variables:
  subscriptionId: 4f897b61-9b52-44b4-8cf1-bdac281cc1aa
  resourceGroup: rg-craves-prodlow-centralindia
  containerAppEnvironmentName: cae-craves-prodlow-l3ing6
  customerWebAppName: ca-craves-web-prodlow
  customerWebAppFqdn: ca-craves-web-prodlow.happysand-aedc7165.centralindia.azurecontainerapps.io
  customerWebStaticIp: 4.187.245.188
  customerWebCertificateName: craves-web-tls
  keyVaultName: kvcravesprodlowl3ing6
  customerApexHostname: craves.in
  customerWwwHostname: www.craves.in
  customerDomainVerificationId: 8CBF8092F604318F13145F6181237B80D12FD1336F3F37C199AA8D7099FF5DF1
  frontDoorProfileName: afd-craves-prodlow
  frontDoorEndpointHostname: craves-prodlow-4f897b61-d4e6bvhscdbzbgbv.z01.azurefd.net
  apimHostname: api.craves.in
  apimExpectedCname: apim-craves-prodlow-l3ing6.azure-api.net
  rollbackWwwHostname: lemon-bay-06f924610.7.azurestaticapps.net
  certMinRemainingDays: 30
  deliveryIntegrationApp: ca-craves-integration-service-pr
  deliveryDashboardApp: ca-craves-delivery-intel-prodlow
  authApp: ca-craves-auth-service-prodlow
  apimService: apim-craves-prodlow-l3ing6
  deliveryAdminApiId: craves-admin-operational-investigations-v1

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - bash: |
      set -euo pipefail
      packages=()
      command -v dig >/dev/null 2>&1 || packages+=(dnsutils)
      command -v jq >/dev/null 2>&1 || packages+=(jq)
      command -v shellcheck >/dev/null 2>&1 || packages+=(shellcheck)
      if [[ ${#packages[@]} -gt 0 ]]; then
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
      fi

      bash -n infra/operations/production-stabilization/check-production.sh
      shellcheck infra/operations/production-stabilization/check-production.sh
    displayName: Validate stabilization script

  - task: AzureCLI@2
    displayName: Verify Craves production stabilization state
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x

        export SUBSCRIPTION_ID='$(subscriptionId)'
        export RESOURCE_GROUP='$(resourceGroup)'
        export CONTAINER_APP_ENVIRONMENT_NAME='$(containerAppEnvironmentName)'
        export CUSTOMER_WEB_APP_NAME='$(customerWebAppName)'
        export CUSTOMER_WEB_APP_FQDN='$(customerWebAppFqdn)'
        export CUSTOMER_WEB_STATIC_IP='$(customerWebStaticIp)'
        export CUSTOMER_WEB_CERTIFICATE_NAME='$(customerWebCertificateName)'
        export KEY_VAULT_NAME='$(keyVaultName)'
        export CUSTOMER_APEX_HOSTNAME='$(customerApexHostname)'
        export CUSTOMER_WWW_HOSTNAME='$(customerWwwHostname)'
        export CUSTOMER_DOMAIN_VERIFICATION_ID='$(customerDomainVerificationId)'
        export FRONT_DOOR_PROFILE_NAME='$(frontDoorProfileName)'
        export FRONT_DOOR_ENDPOINT_HOSTNAME='$(frontDoorEndpointHostname)'
        export APIM_HOSTNAME='$(apimHostname)'
        export APIM_EXPECTED_CNAME='$(apimExpectedCname)'
        export ROLLBACK_WWW_HOSTNAME='$(rollbackWwwHostname)'
        export CERT_MIN_REMAINING_DAYS='$(certMinRemainingDays)'

        bash infra/operations/production-stabilization/check-production.sh

  - task: AzureCLI@2
    displayName: Diagnose Delivery Intelligence HTTP 400 path
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x

        RG='$(resourceGroup)'
        INTEGRATION='$(deliveryIntegrationApp)'
        DASHBOARD='$(deliveryDashboardApp)'
        AUTH='$(authApp)'
        APIM='$(apimService)'
        API_ID='$(deliveryAdminApiId)'

        get_app() {
          az containerapp show -g "$RG" -n "$1" -o json --only-show-errors
        }
        env_value() {
          local json="$1" name="$2"
          jq -r --arg name "$name" '[.properties.template.containers[0].env[]? | select(.name==$name)][0] | (.value // (if .secretRef then "secretref:" + .secretRef else "" end) // "")' <<<"$json"
        }
        probe() {
          local url="$1"
          curl -sS --max-time 25 -o /tmp/di-body -w '%{http_code}' "$url" 2>/dev/null || printf '000'
        }

        IJ="$(get_app "$INTEGRATION")"
        DJ="$(get_app "$DASHBOARD")"
        AJ="$(get_app "$AUTH")"

        IFQDN="$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$IJ")"
        DFQDN="$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$DJ")"
        IREV="$(jq -r '.properties.latestRevisionName // ""' <<<"$IJ")"
        IREADY="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$IJ")"
        DREV="$(jq -r '.properties.latestRevisionName // ""' <<<"$DJ")"
        DREADY="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$DJ")"
        IIMAGE="$(jq -r '.properties.template.containers[0].image // ""' <<<"$IJ")"
        DIMAGE="$(jq -r '.properties.template.containers[0].image // ""' <<<"$DJ")"
        DBASE="$(env_value "$DJ" CRAVES_API_BASE_URL)"
        IISS="$(env_value "$IJ" CRAVES_JWT_ISSUER)"
        IAUD="$(env_value "$IJ" CRAVES_JWT_AUDIENCE)"
        AISS="$(env_value "$AJ" CRAVES_JWT_ISSUER)"
        AAUD="$(env_value "$AJ" CRAVES_JWT_AUDIENCE)"

        API_JSON="$(az apim api show -g "$RG" --service-name "$APIM" --api-id "$API_ID" -o json --only-show-errors 2>/dev/null || echo '{}')"
        APATH="$(jq -r '.path // "MISSING"' <<<"$API_JSON")"
        ASVC="$(jq -r '.serviceUrl // "MISSING"' <<<"$API_JSON")"
        OP_JSON="$(az apim api operation show -g "$RG" --service-name "$APIM" --api-id "$API_ID" --operation-id get-admin-delivery-intelligence-overview -o json --only-show-errors 2>/dev/null || echo '{}')"
        OTEMPLATE="$(jq -r '.urlTemplate // "MISSING"' <<<"$OP_JSON")"

        SUB="$(az account show --query id -o tsv)"
        POLICY_URL="https://management.azure.com/subscriptions/${SUB}/resourceGroups/${RG}/providers/Microsoft.ApiManagement/service/${APIM}/apis/${API_ID}/operations/get-admin-delivery-intelligence-overview/policies/policy?api-version=2022-08-01"
        POLICY="$(az rest --method get --url "$POLICY_URL" --query properties.value -o tsv 2>/dev/null || true)"
        PBACKEND="$(grep -oE 'base-url="[^"]+"' <<<"$POLICY" | head -1 | sed 's/base-url="//;s/"$//' || true)"

        H_INT="$(probe "https://${IFQDN}/actuator/health")"
        U_INT="$(probe "https://${IFQDN}/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35")"
        U_APIM="$(probe 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35')"
        H_DASH="$(probe "https://${DFQDN}/delivery-intelligence/api/health")"
        U_DASH="$(probe "https://${DFQDN}/delivery-intelligence/api/delivery-intelligence/overview?hours=24&limit=35")"
        H_FD="$(probe 'https://admin.craves.in/delivery-intelligence/api/health')"
        U_FD="$(probe 'https://admin.craves.in/delivery-intelligence/api/delivery-intelligence/overview?hours=24&limit=35')"

        DIAG="$(jq -cn \
          --arg integrationRevision "$IREV" --arg integrationReady "$IREADY" --arg integrationImage "$IIMAGE" \
          --arg dashboardRevision "$DREV" --arg dashboardReady "$DREADY" --arg dashboardImage "$DIMAGE" \
          --arg dashboardApiBase "$DBASE" --arg integrationIssuer "$IISS" --arg integrationAudience "$IAUD" \
          --arg authIssuer "$AISS" --arg authAudience "$AAUD" --arg apimPath "$APATH" --arg apimServiceUrl "$ASVC" \
          --arg apimTemplate "$OTEMPLATE" --arg policyBackend "$PBACKEND" \
          --arg integrationHealth "$H_INT" --arg integrationUnauth "$U_INT" --arg apimUnauth "$U_APIM" \
          --arg dashboardHealth "$H_DASH" --arg dashboardUnauth "$U_DASH" --arg frontDoorHealth "$H_FD" --arg frontDoorUnauth "$U_FD" \
          '{integration:{revision:$integrationRevision,ready:$integrationReady,image:$integrationImage,issuer:$integrationIssuer,audience:$integrationAudience,health:$integrationHealth,unauthOverview:$integrationUnauth},dashboard:{revision:$dashboardRevision,ready:$dashboardReady,image:$dashboardImage,apiBase:$dashboardApiBase,health:$dashboardHealth,unauthOverview:$dashboardUnauth},auth:{issuer:$authIssuer,audience:$authAudience},apim:{path:$apimPath,serviceUrl:$apimServiceUrl,operationTemplate:$apimTemplate,policyBackend:$policyBackend,unauthOverview:$apimUnauth},frontDoor:{health:$frontDoorHealth,unauthOverview:$frontDoorUnauth}}')"

        echo "##vso[task.logissue type=warning]DELIVERY_INTELLIGENCE_DIAG=${DIAG}"
        echo "$DIAG" | jq .

        [[ "$IREV" == "$IREADY" ]] || { echo '##vso[task.logissue type=error]Delivery Intelligence diagnosis: Integration latest revision is not ready.'; exit 1; }
        [[ "$DREV" == "$DREADY" ]] || { echo '##vso[task.logissue type=error]Delivery Intelligence diagnosis: Dashboard latest revision is not ready.'; exit 1; }
