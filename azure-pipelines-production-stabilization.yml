trigger: none
pr: none

schedules:
  - cron: "* * * * *"
    displayName: Temporary Delivery Intelligence image-only deployment
    branches:
      include:
        - main
    always: true

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  resourceGroup: rg-craves-prodlow-centralindia
  acrName: cravesprodlowacr82121
  integrationAppName: ca-craves-integration-service-pr
  imageRepository: craves/integration-service
  modulePath: services/integration-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - bash: |
      set -Eeuo pipefail
      bash scripts/release/verify-integration-flyway-history.sh
      cd '$(modulePath)'
      mvn -B -ntp clean verify
    displayName: Verify Integration source and tests

  - task: AzureCLI@2
    displayName: Build if needed and deploy image only
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x
        RG='$(resourceGroup)'
        APP='$(integrationAppName)'
        ACR='$(acrName)'
        REPO='$(imageRepository)'
        LOGIN="$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)"

        # Reuse the immutable image produced by failed build 38869 if it reached ACR;
        # otherwise build the same tested Integration source from this run.
        if az acr repository show-tags --name "$ACR" --repository "$REPO" --query "[?@=='38869'] | [0]" -o tsv --only-show-errors | grep -qx '38869'; then
          IMAGE="${LOGIN}/${REPO}:38869"
          echo "Reusing previously built immutable image $IMAGE"
        else
          IMAGE="${LOGIN}/${REPO}:$(Build.BuildId)"
          az acr login --name "$ACR" --only-show-errors
          docker build --pull -t "$IMAGE" '$(modulePath)'
          docker push "$IMAGE"
        fi

        BEFORE="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors)"
        BEFORE_ENV_HASH="$(jq -c '.properties.template.containers[0].env | sort_by(.name)' <<<"$BEFORE" | sha256sum | awk '{print $1}')"
        BEFORE_SECRET_HASH="$(az containerapp secret list -g "$RG" -n "$APP" -o json --only-show-errors | jq -c '[.[] | {name,keyVaultUrl,identity}] | sort_by(.name)' | sha256sum | awk '{print $1}')"
        BEFORE_READY="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$BEFORE")"

        az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" --no-wait --only-show-errors >/dev/null

        READY=false
        TARGET_REV=''
        for attempt in $(seq 1 150); do
          APP_JSON="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors 2>/dev/null || true)"
          LATEST="$(jq -r '.properties.latestRevisionName // ""' <<<"${APP_JSON:-{}}")"
          READY_REV="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"${APP_JSON:-{}}")"
          if [[ -n "$LATEST" ]]; then
            REV_JSON="$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST" -o json --only-show-errors 2>/dev/null || true)"
            REV_IMAGE="$(jq -r '.properties.template.containers[0].image // ""' <<<"${REV_JSON:-{}}")"
            PROVISIONING="$(jq -r '.properties.provisioningState // ""' <<<"${REV_JSON:-{}}")"
            HEALTH="$(jq -r '.properties.healthState // ""' <<<"${REV_JSON:-{}}")"
            ACTIVE="$(jq -r '.properties.active // false' <<<"${REV_JSON:-{}}")"
            if [[ "$REV_IMAGE" == "$IMAGE" && "$PROVISIONING" == 'Provisioned' && "$HEALTH" == 'Healthy' && "$ACTIVE" == 'true' && "$READY_REV" == "$LATEST" ]]; then
              READY=true
              TARGET_REV="$LATEST"
              break
            fi
            if [[ "$REV_IMAGE" == "$IMAGE" && ( "$PROVISIONING" == 'Failed' || "$HEALTH" == 'Unhealthy' ) ]]; then
              echo "ERROR: target revision failed provisioning: $LATEST" >&2
              exit 1
            fi
          fi
          sleep 10
        done
        [[ "$READY" == true ]] || { echo 'ERROR: target Integration image did not become ready.' >&2; exit 1; }

        AFTER="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors)"
        AFTER_ENV_HASH="$(jq -c '.properties.template.containers[0].env | sort_by(.name)' <<<"$AFTER" | sha256sum | awk '{print $1}')"
        AFTER_SECRET_HASH="$(az containerapp secret list -g "$RG" -n "$APP" -o json --only-show-errors | jq -c '[.[] | {name,keyVaultUrl,identity}] | sort_by(.name)' | sha256sum | awk '{print $1}')"
        FQDN="$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$AFTER")"
        ISSUER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_ISSUER")][0].value // ""' <<<"$AFTER")"
        AUDIENCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_AUDIENCE")][0].value // ""' <<<"$AFTER")"

        [[ "$BEFORE_ENV_HASH" == "$AFTER_ENV_HASH" ]] || { echo 'ERROR: unrelated environment changed during image-only deployment.' >&2; exit 1; }
        [[ "$BEFORE_SECRET_HASH" == "$AFTER_SECRET_HASH" ]] || { echo 'ERROR: secret references changed during image-only deployment.' >&2; exit 1; }
        [[ "$ISSUER" == 'https://api.craves.in/auth' && "$AUDIENCE" == 'craves-api' ]] || { echo 'ERROR: JWT runtime alignment changed.' >&2; exit 1; }

        READINESS="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "https://${FQDN}/actuator/health/readiness" || true)"
        UNSIGNED="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=0&limit=25&sort=desc&offset=0&attentionOffset=0' || true)"
        [[ "$READINESS" == '200' ]] || { echo "ERROR: readiness=$READINESS" >&2; exit 1; }
        [[ "$UNSIGNED" == '401' ]] || { echo "ERROR: APIM unsigned boundary=$UNSIGNED" >&2; exit 1; }

        echo "PASS: image-only Delivery Intelligence backend deployment complete previous=$BEFORE_READY revision=$TARGET_REV image=$IMAGE"
