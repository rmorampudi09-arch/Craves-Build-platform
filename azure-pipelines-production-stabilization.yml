trigger:
  branches:
    include:
      - main
  paths:
    include:
      - azure-pipelines-production-stabilization.yml
pr: none

schedules:
  - cron: "*/5 * * * *"
    displayName: Temporary Delivery Intelligence backend deployment
    branches:
      include:
        - main
    always: true

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  resourceGroup: rg-craves-prodlow-centralindia
  acrName: cravesprodlowacr82121
  integrationAppName: ca-craves-integration-service-pr
  imageRepository: craves/integration-service
  modulePath: services/integration-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - bash: |
      set -Eeuo pipefail
      bash scripts/release/verify-integration-flyway-history.sh
      cd '$(modulePath)'
      mvn -B -ntp clean verify
    displayName: Verify Integration source and tests

  - task: AzureCLI@2
    displayName: Build and push immutable Integration image
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x
        ACR='$(acrName)'
        LOGIN="$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)"
        IMAGE="${LOGIN}/$(imageRepository):$(Build.BuildId)"
        az acr login --name "$ACR" --only-show-errors
        docker build --pull -t "$IMAGE" '$(modulePath)'
        docker push "$IMAGE"
        echo "##vso[task.setvariable variable=DELIVERY_INTELLIGENCE_IMAGE]$IMAGE"
        echo "Built immutable Integration image: $IMAGE"

  - task: AzureCLI@2
    displayName: Deploy Integration without changing runtime configuration
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x
        RG='$(resourceGroup)'
        APP='$(integrationAppName)'
        IMAGE='$(DELIVERY_INTELLIGENCE_IMAGE)'

        BEFORE="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors)"
        BEFORE_ENV_HASH="$(jq -c '.properties.template.containers[0].env | sort_by(.name)' <<<"$BEFORE" | sha256sum | awk '{print $1}')"
        BEFORE_SECRETS_HASH="$(jq -c '[.properties.configuration.secrets[]? | {name:name,keyVaultUrl:keyVaultUrl,identity:identity}] | sort_by(.name)' <<<"$BEFORE" | sha256sum | awk '{print $1}')"
        BEFORE_REV="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$BEFORE")"

        READY_ATTEMPTS=150 READY_SLEEP_SECONDS=10 \
          bash scripts/release/deploy-single-service-preserve-runtime.sh \
            "$RG" "$APP" "$IMAGE" integration

        AFTER="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors)"
        AFTER_ENV_HASH="$(jq -c '.properties.template.containers[0].env | sort_by(.name)' <<<"$AFTER" | sha256sum | awk '{print $1}')"
        AFTER_SECRETS_HASH="$(jq -c '[.properties.configuration.secrets[]? | {name:name,keyVaultUrl:keyVaultUrl,identity:identity}] | sort_by(.name)' <<<"$AFTER" | sha256sum | awk '{print $1}')"
        AFTER_REV="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$AFTER")"
        AFTER_IMAGE="$(jq -r '.properties.template.containers[0].image // ""' <<<"$AFTER")"
        ISSUER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_ISSUER")][0].value // ""' <<<"$AFTER")"
        AUDIENCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_AUDIENCE")][0].value // ""' <<<"$AFTER")"
        FQDN="$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$AFTER")"

        [[ "$AFTER_IMAGE" == "$IMAGE" ]] || { echo 'ERROR: deployed Integration image does not match build.' >&2; exit 1; }
        [[ "$AFTER_ENV_HASH" == "$BEFORE_ENV_HASH" ]] || { echo 'ERROR: Integration environment changed during image-only deployment.' >&2; exit 1; }
        [[ "$AFTER_SECRETS_HASH" == "$BEFORE_SECRETS_HASH" ]] || { echo 'ERROR: Integration secret references changed during image-only deployment.' >&2; exit 1; }
        [[ "$ISSUER" == 'https://api.craves.in/auth' ]] || { echo 'ERROR: JWT issuer drift detected after deploy.' >&2; exit 1; }
        [[ "$AUDIENCE" == 'craves-api' ]] || { echo 'ERROR: JWT audience drift detected after deploy.' >&2; exit 1; }

        READINESS="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "https://${FQDN}/actuator/health/readiness" || true)"
        APIM_UNSIGNED="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=0&limit=25&sort=desc&offset=0&attentionOffset=0' || true)"
        [[ "$READINESS" == '200' ]] || { echo "ERROR: Integration readiness returned HTTP $READINESS." >&2; exit 1; }
        [[ "$APIM_UNSIGNED" == '401' ]] || { echo "ERROR: APIM Delivery Intelligence boundary returned HTTP $APIM_UNSIGNED instead of 401." >&2; exit 1; }

        echo "PASS: Delivery Intelligence backend deployed. revision=$AFTER_REV previous=$BEFORE_REV image=$IMAGE readiness=$READINESS apimUnsigned=$APIM_UNSIGNED"
