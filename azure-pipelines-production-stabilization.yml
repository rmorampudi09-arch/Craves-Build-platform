trigger: none
pr: none

schedules:
  - cron: "*/5 * * * *"
    displayName: Temporary Delivery Intelligence minimal JWT repair
    branches:
      include:
        - main
    always: true

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  resourceGroup: rg-craves-prodlow-centralindia
  integrationApp: ca-craves-integration-service-pr
  evidenceBranch: ops/delivery-intelligence-repair-evidence

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    persistCredentials: true

  - task: AzureCLI@2
    displayName: Apply minimal Delivery Intelligence JWT repair
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x

        RG='$(resourceGroup)'
        APP='$(integrationApp)'
        EXPECTED_ISSUER='https://api.craves.in/auth'
        EXPECTED_AUDIENCE='craves-api'
        EVIDENCE='docs/runtime-evidence/delivery-intelligence-minimal-repair.json'

        BEFORE="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors)"
        BEFORE_IMAGE="$(jq -r '.properties.template.containers[0].image // ""' <<<"$BEFORE")"
        BEFORE_READY="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$BEFORE")"
        BEFORE_OTHER_ENV_HASH="$(jq -c '[.properties.template.containers[0].env[]? | select(.name != "CRAVES_JWT_ISSUER" and .name != "CRAVES_JWT_AUDIENCE")] | sort_by(.name)' <<<"$BEFORE" | sha256sum | awk '{print $1}')"

        az containerapp update -g "$RG" -n "$APP" \
          --set-env-vars \
            "CRAVES_JWT_ISSUER=${EXPECTED_ISSUER}" \
            "CRAVES_JWT_AUDIENCE=${EXPECTED_AUDIENCE}" \
          --only-show-errors >/dev/null

        READY=false
        for attempt in $(seq 1 150); do
          CURRENT="$(az containerapp show -g "$RG" -n "$APP" -o json --only-show-errors)"
          LATEST="$(jq -r '.properties.latestRevisionName // ""' <<<"$CURRENT")"
          READY_REV="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$CURRENT")"
          RUNNING="$(jq -r '.properties.runningStatus // ""' <<<"$CURRENT")"
          if [[ -n "$LATEST" && "$LATEST" == "$READY_REV" && "$RUNNING" == 'Running' ]]; then
            READY=true
            break
          fi
          sleep 10
        done
        [[ "$READY" == true ]] || { echo 'ERROR: repaired Integration revision did not become ready.' >&2; exit 1; }

        AFTER="$CURRENT"
        AFTER_IMAGE="$(jq -r '.properties.template.containers[0].image // ""' <<<"$AFTER")"
        AFTER_READY="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$AFTER")"
        AFTER_ISSUER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_ISSUER")][0].value // ""' <<<"$AFTER")"
        AFTER_AUDIENCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_AUDIENCE")][0].value // ""' <<<"$AFTER")"
        AFTER_OTHER_ENV_HASH="$(jq -c '[.properties.template.containers[0].env[]? | select(.name != "CRAVES_JWT_ISSUER" and .name != "CRAVES_JWT_AUDIENCE")] | sort_by(.name)' <<<"$AFTER" | sha256sum | awk '{print $1}')"
        FQDN="$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$AFTER")"

        [[ "$AFTER_IMAGE" == "$BEFORE_IMAGE" ]] || { echo 'ERROR: Integration image changed unexpectedly.' >&2; exit 1; }
        [[ "$AFTER_OTHER_ENV_HASH" == "$BEFORE_OTHER_ENV_HASH" ]] || { echo 'ERROR: unrelated Integration environment changed.' >&2; exit 1; }
        [[ "$AFTER_ISSUER" == "$EXPECTED_ISSUER" ]] || { echo 'ERROR: issuer repair did not persist.' >&2; exit 1; }
        [[ "$AFTER_AUDIENCE" == "$EXPECTED_AUDIENCE" ]] || { echo 'ERROR: audience repair did not persist.' >&2; exit 1; }

        HEALTH="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "https://${FQDN}/actuator/health" || true)"
        APIM_UNAUTH="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35' || true)"

        mkdir -p "$(dirname "$EVIDENCE")"
        jq -n \
          --arg repairedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg beforeRevision "$BEFORE_READY" --arg afterRevision "$AFTER_READY" \
          --arg image "$AFTER_IMAGE" --arg issuer "$AFTER_ISSUER" --arg audience "$AFTER_AUDIENCE" \
          --arg environmentHashBefore "$BEFORE_OTHER_ENV_HASH" --arg environmentHashAfter "$AFTER_OTHER_ENV_HASH" \
          --arg health "$HEALTH" --arg apimUnauth "$APIM_UNAUTH" \
          '{repairedAt:$repairedAt,integration:{beforeRevision:$beforeRevision,afterRevision:$afterRevision,image:$image,jwt:{issuer:$issuer,audience:$audience},unrelatedEnvironmentHashBefore:$environmentHashBefore,unrelatedEnvironmentHashAfter:$environmentHashAfter,health:$health},apim:{unauthenticatedOverview:$apimUnauth},result:{issuerRepaired:($issuer=="https://api.craves.in/auth"),audienceRepaired:($audience=="craves-api"),imagePreserved:($image!=""),unrelatedEnvironmentPreserved:($environmentHashBefore==$environmentHashAfter)}}' > "$EVIDENCE"
        cat "$EVIDENCE"

  - bash: |
      set -Eeuo pipefail
      EVIDENCE='docs/runtime-evidence/delivery-intelligence-minimal-repair.json'
      BRANCH='$(evidenceBranch)'
      git config user.name 'Craves Azure Runtime Bot'
      git config user.email 'runtime-bot@craves.in'
      git checkout -B "$BRANCH"
      git add "$EVIDENCE"
      git commit -m 'ops(delivery-intelligence): capture minimal JWT repair evidence'
      git push --force origin "HEAD:refs/heads/${BRANCH}"
    displayName: Persist minimal repair evidence
