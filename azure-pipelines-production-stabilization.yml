trigger: none
pr: none

schedules:
  - cron: "*/5 * * * *"
    displayName: Temporary Delivery Intelligence post-repair inspection
    branches:
      include:
        - main
    always: true

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  resourceGroup: rg-craves-prodlow-centralindia
  integrationApp: ca-craves-integration-service-pr
  authApp: ca-craves-auth-service-prodlow
  evidenceBranch: ops/delivery-intelligence-repair-evidence

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1
    persistCredentials: true

  - task: AzureCLI@2
    displayName: Inspect current Integration JWT runtime
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x

        RG='$(resourceGroup)'
        INTEGRATION='$(integrationApp)'
        AUTH='$(authApp)'
        EVIDENCE='docs/runtime-evidence/delivery-intelligence-post-repair.json'

        IJ="$(az containerapp show -g "$RG" -n "$INTEGRATION" -o json --only-show-errors)"
        AJ="$(az containerapp show -g "$RG" -n "$AUTH" -o json --only-show-errors)"

        value() {
          local json="$1" name="$2"
          jq -r --arg n "$name" '[.properties.template.containers[0].env[]? | select(.name==$n)][0].value // ""' <<<"$json"
        }
        ref() {
          local json="$1" name="$2"
          jq -r --arg n "$name" '[.properties.template.containers[0].env[]? | select(.name==$n)][0].secretRef // ""' <<<"$json"
        }
        probe() {
          local body status
          body="$(mktemp)"
          status="$(curl -sS --max-time 30 -o "$body" -w '%{http_code}' "$1" || true)"
          printf '%s' "$status"
          rm -f "$body"
        }

        IFQDN="$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$IJ")"
        mkdir -p "$(dirname "$EVIDENCE")"
        jq -n \
          --arg collectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --arg integrationRevision "$(jq -r '.properties.latestRevisionName // ""' <<<"$IJ")" \
          --arg integrationReady "$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$IJ")" \
          --arg integrationRunning "$(jq -r '.properties.runningStatus // ""' <<<"$IJ")" \
          --arg integrationImage "$(jq -r '.properties.template.containers[0].image // ""' <<<"$IJ")" \
          --arg integrationIssuer "$(value "$IJ" CRAVES_JWT_ISSUER)" \
          --arg integrationAudience "$(value "$IJ" CRAVES_JWT_AUDIENCE)" \
          --arg integrationVerifyRef "$(ref "$IJ" CRAVES_JWT_VERIFICATION_PEM_BASE64)" \
          --arg authIssuer "$(value "$AJ" CRAVES_JWT_ISSUER)" \
          --arg authAudience "$(value "$AJ" CRAVES_JWT_AUDIENCE)" \
          --arg health "$(probe "https://${IFQDN}/actuator/health")" \
          --arg unauthDirect "$(probe "https://${IFQDN}/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35")" \
          --arg unauthApim "$(probe 'https://api.craves.in/api/v1/admin/operations/delivery-intelligence/overview?hours=24&limit=35')" \
          '{collectedAt:$collectedAt,integration:{revision:$integrationRevision,readyRevision:$integrationReady,runningStatus:$integrationRunning,image:$integrationImage,jwt:{issuer:$integrationIssuer,audience:$integrationAudience,verificationSecretRef:$integrationVerifyRef},health:$health,unauthenticatedDirectOverview:$unauthDirect},auth:{jwt:{issuer:$authIssuer,audience:$authAudience}},apim:{unauthenticatedOverview:$unauthApim},parity:{issuer:($integrationIssuer==$authIssuer and $integrationIssuer!=""),audience:($integrationAudience==$authAudience and $integrationAudience!="")}}' > "$EVIDENCE"
        cat "$EVIDENCE"

  - bash: |
      set -Eeuo pipefail
      EVIDENCE='docs/runtime-evidence/delivery-intelligence-post-repair.json'
      BRANCH='$(evidenceBranch)'
      git config user.name 'Craves Azure Runtime Bot'
      git config user.email 'runtime-bot@craves.in'
      git checkout -B "$BRANCH"
      git add "$EVIDENCE"
      git commit -m 'ops(delivery-intelligence): capture post-repair production state'
      git push --force origin "HEAD:refs/heads/${BRANCH}"
    displayName: Persist post-repair evidence
