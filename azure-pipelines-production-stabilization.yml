trigger: none
pr: none

schedules:
  - cron: "0 */6 * * *"
    displayName: Every 6 hours production stabilization verification
    branches:
      include:
        - main
    always: true

# The rebuilt production environment (Azure subscription 1, "kmqgfy"), as every pipeline that targets it.
variables:
  AZURE_SERVICE_CONNECTION: Craves-RMORAMPUDI09-Service-Connection
  subscriptionId: 721906c9-4a72-4606-830b-d3e7ace093ff
  resourceGroup: rg-craves-prodlow-centralindia
  containerAppEnvironmentName: cae-craves-prodlow-kmqgfy
  customerWebAppName: ca-craves-web-prodlow
  customerWebAppFqdn: ca-craves-web-prodlow.yellowdesert-9c7110ab.centralindia.azurecontainerapps.io
  customerWebStaticIp: 20.235.225.35
  customerApexHostname: craves.in
  customerWwwHostname: www.craves.in
  frontDoorProfileName: afd-craves-prodlow
  frontDoorEndpointHostname: craves-prodlow-721906c9-cfb3dyb2b7hnhee2.z02.azurefd.net
  apiHostname: api.craves.in
  adminHostname: admin.craves.in
  certMinRemainingDays: 30
  integrationAppName: ca-craves-integration-service-pr

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    fetchDepth: 1

  - bash: |
      set -euo pipefail
      packages=()
      command -v dig >/dev/null 2>&1 || packages+=(dnsutils)
      command -v jq >/dev/null 2>&1 || packages+=(jq)
      command -v shellcheck >/dev/null 2>&1 || packages+=(shellcheck)
      if [[ ${#packages[@]} -gt 0 ]]; then
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
      fi

      bash -n infra/operations/production-stabilization/check-production.sh
      shellcheck infra/operations/production-stabilization/check-production.sh
    displayName: Validate stabilization script

  - task: AzureCLI@2
    displayName: Verify Craves production stabilization state
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x

        export SUBSCRIPTION_ID='$(subscriptionId)'
        export RESOURCE_GROUP='$(resourceGroup)'
        export CONTAINER_APP_ENVIRONMENT_NAME='$(containerAppEnvironmentName)'
        export CUSTOMER_WEB_APP_NAME='$(customerWebAppName)'
        export CUSTOMER_WEB_APP_FQDN='$(customerWebAppFqdn)'
        export CUSTOMER_WEB_STATIC_IP='$(customerWebStaticIp)'
        export CUSTOMER_APEX_HOSTNAME='$(customerApexHostname)'
        export CUSTOMER_WWW_HOSTNAME='$(customerWwwHostname)'
        export FRONT_DOOR_PROFILE_NAME='$(frontDoorProfileName)'
        export FRONT_DOOR_ENDPOINT_HOSTNAME='$(frontDoorEndpointHostname)'
        export API_HOSTNAME='$(apiHostname)'
        export ADMIN_HOSTNAME='$(adminHostname)'
        export CERT_MIN_REMAINING_DAYS='$(certMinRemainingDays)'

        bash infra/operations/production-stabilization/check-production.sh

  - task: AzureCLI@2
    displayName: Verify Integration JWT runtime alignment
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      inlineScript: |
        set -Eeuo pipefail
        set +x

        JSON="$(az containerapp show -g '$(resourceGroup)' -n '$(integrationAppName)' -o json --only-show-errors)"
        ISSUER="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_ISSUER")][0].value // ""' <<<"$JSON")"
        AUDIENCE="$(jq -r '[.properties.template.containers[0].env[]? | select(.name=="CRAVES_JWT_AUDIENCE")][0].value // ""' <<<"$JSON")"
        LATEST="$(jq -r '.properties.latestRevisionName // ""' <<<"$JSON")"
        READY="$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$JSON")"

        [[ "$LATEST" == "$READY" && -n "$READY" ]] || {
          echo "ERROR: Integration latest revision is not the ready revision (latest=$LATEST ready=$READY)." >&2
          exit 1
        }
        [[ "$ISSUER" == 'https://api.craves.in/auth' ]] || {
          echo 'ERROR: Integration CRAVES_JWT_ISSUER drift detected.' >&2
          exit 1
        }
        [[ "$AUDIENCE" == 'craves-api' ]] || {
          echo 'ERROR: Integration CRAVES_JWT_AUDIENCE drift detected.' >&2
          exit 1
        }

        echo "PASS: Integration JWT runtime alignment is healthy on revision $READY."
