trigger: none
pr: none

parameters:
  - name: targetEnvironment
    type: string
    default: SANDBOX
    values: [SANDBOX, PRODUCTION]
  - name: confirmProductionConfiguration
    type: string
    default: ''

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  resourceGroup: rg-craves-prodlow-centralindia
  containerApp: ca-craves-integration-service-pr

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none
  - task: AzureCLI@2
    displayName: Configure Razorpay and keep Cashfree traffic disabled
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -Eeuo pipefail
        set +x

        environment='${{ parameters.targetEnvironment }}'
        confirmation='${{ parameters.confirmProductionConfiguration }}'
        [[ "$environment" == SANDBOX || "$environment" == PRODUCTION ]] || {
          echo 'Invalid environment.' >&2
          exit 2
        }
        if [[ "$environment" == PRODUCTION && "$confirmation" != 'CONFIGURE_RAZORPAY_PRODUCTION' ]]; then
          echo 'PRODUCTION requires exact confirmation CONFIGURE_RAZORPAY_PRODUCTION.' >&2
          exit 2
        fi

        suffix=sandbox
        approved=false
        order_api=true
        if [[ "$environment" == PRODUCTION ]]; then
          suffix=production
          approved=true
          order_api=false
        fi

        key_id="razorpay-${suffix}-key-id"
        key_secret="razorpay-${suffix}-key-secret"
        webhook_secret="razorpay-${suffix}-webhook-secret"
        secrets=$(az containerapp secret list -g '$(resourceGroup)' -n '$(containerApp)' --query '[].name' -o tsv --only-show-errors)
        for secret in "$key_id" "$key_secret" "$webhook_secret"; do
          grep -qx "$secret" <<<"$secrets" || {
            echo "Missing Container App secret reference $secret." >&2
            exit 2
          }
        done

        webhook_url='https://api.craves.in/api/v1/payments/webhooks/razorpay'
        az containerapp update -g '$(resourceGroup)' -n '$(containerApp)' \
          --remove-env-vars PAYMENT_PROVIDER_CLIENT_ID PAYMENT_PROVIDER_CLIENT_KEY \
          --set-env-vars \
          PAYMENT_PROVIDER_NAME=RAZORPAY \
          RAZORPAY_API_ENABLED=true \
          RAZORPAY_ENVIRONMENT="$environment" \
          RAZORPAY_PRODUCTION_ACTIVATION_APPROVED="$approved" \
          RAZORPAY_PRODUCTION_PAYMENT_EXECUTION_ENABLED=false \
          RAZORPAY_KEY_ID="secretref:${key_id}" \
          RAZORPAY_KEY_SECRET="secretref:${key_secret}" \
          RAZORPAY_WEBHOOK_SECRET="secretref:${webhook_secret}" \
          RAZORPAY_WEBHOOK_URL="$webhook_url" \
          RAZORPAY_AUTO_CAPTURE=true \
          CRAVES_PAYMENT_ORDER_API_ENABLED="$order_api" \
          CRAVES_RAZORPAY_WEBHOOK_INGRESS_ENABLED=true \
          CRAVES_RAZORPAY_WEBHOOK_WORKER_ENABLED=true \
          CASHFREE_API_ENABLED=false \
          CASHFREE_TRAFFIC_ALLOWED=false \
          PAYMENT_PROVIDER_ENVIRONMENT=sandbox \
          CRAVES_CASHFREE_PRODUCTION_ACTIVATION_APPROVED=false \
          CRAVES_CASHFREE_PRODUCTION_PAYMENT_EXECUTION_ENABLED=false \
          CRAVES_CASHFREE_WEBHOOK_INGRESS_ENABLED=false \
          CRAVES_CASHFREE_WEBHOOK_WORKER_ENABLED=false \
          CRAVES_REFUND_PROVIDER_EXECUTION_ENABLED=false \
          CRAVES_REFUND_RECONCILIATION_ENABLED=false \
          CRAVES_REFUND_PRODUCTION_PROVIDER_EXECUTION_APPROVED=false \
          CRAVES_REFUND_PRODUCTION_RECONCILIATION_APPROVED=false >/dev/null

        latest=$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query properties.latestRevisionName -o tsv --only-show-errors)
        ready=''
        replicas=0
        for _ in $(seq 1 60); do
          ready=$(az containerapp revision show -g '$(resourceGroup)' -n '$(containerApp)' --revision "$latest" --query properties.provisioningState -o tsv 2>/dev/null || true)
          replicas=$(az containerapp revision show -g '$(resourceGroup)' -n '$(containerApp)' --revision "$latest" --query properties.replicas -o tsv 2>/dev/null || echo 0)
          [[ "$ready" == Provisioned && "$replicas" -ge 1 ]] && break
          sleep 10
        done
        [[ "$ready" == Provisioned && "$replicas" -ge 1 ]] || {
          echo 'Razorpay revision did not become healthy.' >&2
          exit 2
        }

        fqdn=$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
        curl -fsS --max-time 30 "https://${fqdn}/actuator/health" >/dev/null

        env_json=$(az containerapp show -g '$(resourceGroup)' -n '$(containerApp)' --query 'properties.template.containers[0].env' -o json --only-show-errors)
        value() { jq -r --arg name "$1" '.[] | select(.name == $name) | (.value // "")' <<<"$env_json" | tail -1; }
        [[ "$(value PAYMENT_PROVIDER_NAME)" == RAZORPAY ]]
        [[ "$(value RAZORPAY_ENVIRONMENT)" == "$environment" ]]
        [[ "$(value RAZORPAY_PRODUCTION_PAYMENT_EXECUTION_ENABLED)" == false ]]
        [[ "$(value CASHFREE_API_ENABLED)" == false ]]
        [[ "$(value CASHFREE_TRAFFIC_ALLOWED)" == false ]]
        [[ "$(value CRAVES_CASHFREE_WEBHOOK_INGRESS_ENABLED)" == false ]]
        [[ "$(value CRAVES_RAZORPAY_WEBHOOK_WORKER_ENABLED)" == true ]]

        if [[ "$environment" == PRODUCTION ]]; then
          [[ "$(value CRAVES_PAYMENT_ORDER_API_ENABLED)" == false ]]
          echo 'Razorpay PRODUCTION is configured but LIVE MONEY IS STILL DISABLED.'
          echo 'Run the dedicated Razorpay production activation pipeline only after Dashboard/APIM/webhook/live-readiness checks pass.'
        else
          echo 'Razorpay SANDBOX is configured for test transactions. Cashfree traffic remains disabled.'
        fi
