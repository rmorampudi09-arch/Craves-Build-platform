trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - bash: |
      set -euo pipefail
      cd services/integration-service
      mvn -B -ntp clean verify
    displayName: Verify Razorpay backend, subscriptions, webhooks and refunds

  - bash: |
      set -euo pipefail
      cd services/order-service
      mvn -B -ntp clean verify
    displayName: Verify provider-neutral refund status consumption

  - task: NodeTool@0
    inputs:
      versionSpec: 24.x

  - bash: |
      set -euo pipefail
      cd apps/customer-web-next
      npm ci --no-audit --no-fund
      npm run lint
      npm run typecheck
      npm run test
      npm run build
    displayName: Verify Razorpay customer checkout

  - bash: |
      set -euo pipefail

      test -s azure-pipelines-razorpay-environment.yml
      test -s azure-pipelines-razorpay-production-activation.yml
      test -s azure-pipelines-razorpay-production-rollback.yml
      test -s azure-pipelines-razorpay-webhook-apim.yml
      test -s services/integration-service/modules/razorpay-production/README.md
      test -s docs/handover/2026-08-20-razorpay-full-scale-production.md
      test -s docs/handover/2026-08-20-razorpay-production-handover-addendum.md
      test -s services/integration-service/src/main/resources/db/migration/V112__razorpay_webhook_delivery_guard.sql
      test -s services/integration-service/src/main/java/in/craves/integration/payment/RazorpayWebhookInboxService.java
      test -s services/integration-service/src/main/java/in/craves/integration/payment/RazorpayWebhookWorker.java
      test -s services/integration-service/src/main/java/in/craves/integration/payment/RazorpayProductionReadinessService.java
      test -s services/integration-service/src/main/java/in/craves/integration/admin/AdminRazorpayProductionReadinessController.java

      pages=$(grep -c 'page-break-after: always' docs/handover/2026-08-20-razorpay-full-scale-production.md)
      [[ "$pages" -ge 50 ]] || { echo "Razorpay handover must remain at least 50 rendered pages; found $pages page breaks." >&2; exit 2; }

      grep -Fq 'PAYMENT_PROVIDER_NAME=RAZORPAY' azure-pipelines-razorpay-environment.yml
      grep -Fq 'CASHFREE_API_ENABLED=false' azure-pipelines-razorpay-environment.yml
      grep -Fq 'CASHFREE_TRAFFIC_ALLOWED=false' azure-pipelines-razorpay-environment.yml
      grep -Fq 'CRAVES_CASHFREE_WEBHOOK_INGRESS_ENABLED=false' azure-pipelines-razorpay-environment.yml
      grep -Fq 'CRAVES_CASHFREE_WEBHOOK_WORKER_ENABLED=false' azure-pipelines-razorpay-environment.yml
      grep -Fq 'CRAVES_RAZORPAY_WEBHOOK_WORKER_ENABLED=true' azure-pipelines-razorpay-environment.yml
      grep -Fq 'RAZORPAY_PRODUCTION_PAYMENT_EXECUTION_ENABLED=false' azure-pipelines-razorpay-environment.yml

      grep -Fq '@Value("${PAYMENT_PROVIDER_NAME:RAZORPAY}")' services/integration-service/src/main/java/in/craves/integration/config/PaymentRoutingProperties.java
      grep -Fq '@Value("${CASHFREE_TRAFFIC_ALLOWED:false}")' services/integration-service/src/main/java/in/craves/integration/config/PaymentRoutingProperties.java
      grep -Fq 'RAZORPAY_PREVIOUS_WEBHOOK_SECRET' services/integration-service/src/main/java/in/craves/integration/config/RazorpayProviderProperties.java

      grep -Fq 'FOR UPDATE SKIP LOCKED' services/integration-service/src/main/java/in/craves/integration/payment/RazorpayWebhookInboxService.java
      grep -Fq 'X-Razorpay-Event-Id' services/integration-service/src/main/java/in/craves/integration/web/PaymentController.java
      grep -Fq 'razorpayWebhookInboxService.accept' services/integration-service/src/main/java/in/craves/integration/web/PaymentController.java
      grep -Fq 'verifyCapturedProviderState' services/integration-service/src/main/java/in/craves/integration/payment/RazorpayWebhookWorker.java
      grep -Fq 'IGNORE_STALE_NON_TERMINAL_EVENT' services/integration-service/src/main/java/in/craves/integration/payment/RazorpayWebhookWorker.java
      grep -Fq 'queryParam("receipt", receipt)' services/integration-service/src/main/java/in/craves/integration/payment/RazorpayPaymentClient.java
      grep -Fq 'previousWebhookSecret' services/integration-service/src/main/java/in/craves/integration/payment/RazorpayPaymentClient.java
      grep -Fq 'amount_paid' services/integration-service/src/main/java/in/craves/integration/payment/RazorpayPaymentClient.java
      grep -Fq 'amount_due' services/integration-service/src/main/java/in/craves/integration/payment/RazorpayPaymentClient.java

      grep -Fq 'X-Refund-Idempotency' services/integration-service/src/main/java/in/craves/integration/refund/RazorpayRefundClient.java
      ! grep -Fq 'X-Razorpay-Idempotency-Key' services/integration-service/src/main/java/in/craves/integration/refund/RazorpayRefundClient.java
      grep -Fq 'requireMutationConfiguration' services/integration-service/src/main/java/in/craves/integration/refund/RazorpayRefundClient.java
      grep -Fq 'requireReadConfiguration' services/integration-service/src/main/java/in/craves/integration/refund/RazorpayRefundClient.java

      grep -Fq 'X-Razorpay-Signature' infra/apim/customer-payments/razorpay-webhook-policy.xml
      ! grep -Fq 'validate-jwt' infra/apim/customer-payments/razorpay-webhook-policy.xml
      grep -Fq 'checkout.razorpay.com/v1/checkout.js' apps/customer-web-next/src/components/checkout/RazorpayPayment.tsx
      grep -Fq 'checkout.razorpay.com/v1/checkout.js' apps/customer-web-next/src/components/subscription-razorpay-payment.tsx
      ! rg -n 'sdk.cashfree.com' apps/customer-web-next/src/components/checkout apps/customer-web-next/src/components/subscription-razorpay-payment.tsx

      grep -Fq 'CRAVES_PAYMENT_ORDER_API_ENABLED=false' azure-pipelines-razorpay-production-rollback.yml
      grep -Fq 'RAZORPAY_API_ENABLED=true' azure-pipelines-razorpay-production-rollback.yml
      grep -Fq 'CRAVES_RAZORPAY_WEBHOOK_INGRESS_ENABLED=true' azure-pipelines-razorpay-production-rollback.yml
      grep -Fq 'CRAVES_RAZORPAY_WEBHOOK_WORKER_ENABLED=true' azure-pipelines-razorpay-production-rollback.yml
      grep -Fq 'CRAVES_REFUND_PROVIDER_EXECUTION_ENABLED=false' azure-pipelines-razorpay-production-rollback.yml
      grep -Fq 'CRAVES_REFUND_RECONCILIATION_ENABLED=true' azure-pipelines-razorpay-production-rollback.yml
      grep -Fq 'CRAVES_REFUND_PRODUCTION_RECONCILIATION_APPROVED=true' azure-pipelines-razorpay-production-rollback.yml
      grep -Fq 'CASHFREE_TRAFFIC_ALLOWED=false' azure-pipelines-razorpay-production-rollback.yml

      grep -Fq 'controlled live-test window' services/integration-service/modules/razorpay-production/README.md
      grep -Fq 'ACTIVATE_RAZORPAY_LIVE_MONEY' services/integration-service/modules/razorpay-production/README.md
      grep -Fq 'STOP_RAZORPAY_LIVE_MONEY' services/integration-service/modules/razorpay-production/README.md
      grep -Fq 'Authoritative production execution order' docs/handover/2026-08-20-razorpay-production-handover-addendum.md

      git diff --check origin/main...HEAD
    displayName: Verify Razorpay production invariants, documentation and fail-closed routing
