trigger: none
pr: none

parameters:
  - name: activationStage
    type: string
    default: pause
    values: [pause, downstream, reconciliation, provider_execution]
  - name: applyConfiguration
    type: boolean
    default: false
  - name: expectedReleaseSha
    type: string
    default: ''
  - name: expectedImage
    type: string
    default: ''
  - name: expectedReadyRevision
    type: string
    default: ''
  - name: reviewedPlanRunId
    type: string
    default: '0'
  - name: expectedExposureJson
    type: string
    default: '{"executableRefundCount":0,"reconcilableRefundCount":0,"processingRefundCount":0,"refundDeadLetterCount":0,"unknownOutcomeCount":0,"historicalModeMismatchCount":0,"statusOutboxDeadLetterCount":0,"requestInboxFailureCount":0}'

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false
  - ${{ if eq(parameters.applyConfiguration, true) }}:
    - task: DownloadPipelineArtifact@2
      displayName: Read previously reviewed refund plan
      inputs:
        buildType: specific
        project: $(System.TeamProject)
        definition: $(System.DefinitionId)
        buildVersionToDownload: specific
        pipelineId: ${{ parameters.reviewedPlanRunId }}
        artifactName: refund-runtime-plan
        targetPath: $(Pipeline.Workspace)/reviewed-refund-plan
  - task: AzureCLI@2
    displayName: Plan or apply only reviewed refund gates
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        python3 - <<'PY'
        import json, os, pathlib, subprocess
        root=pathlib.Path(os.environ['BUILD_SOURCESDIRECTORY'])
        out=pathlib.Path(os.environ['BUILD_ARTIFACTSTAGINGDIRECTORY'])/'refund-runtime'
        out.mkdir(parents=True,exist_ok=True)
        expected=out/'expected-exposure.json'
        expected.write_text(json.dumps(json.loads(os.environ['REFUND_EXPECTED_EXPOSURE'])))
        args=['python3',str(root/'scripts/refund/refund_production_release.py'),
          '--stage',os.environ['REFUND_STAGE'],'--expected-release-sha',os.environ['REFUND_EXPECTED_SHA'],
          '--expected-image',os.environ['REFUND_EXPECTED_IMAGE'],'--expected-revision',os.environ['REFUND_EXPECTED_REVISION'],
          '--expected-exposure',str(expected),'--output',str(out)]
        if os.environ['REFUND_APPLY'].lower()=='true':
          if not os.environ['REFUND_PLAN_RUN'].isdigit() or int(os.environ['REFUND_PLAN_RUN'])<=0:
            raise SystemExit('A successful reviewed plan run is required')
          args+=['--apply','--reviewed-plan',str(pathlib.Path(os.environ['PIPELINE_WORKSPACE'])/'reviewed-refund-plan/refund-runtime-plan.json')]
        raise SystemExit(subprocess.run(args,cwd=root).returncode)
        PY
    env:
      REFUND_STAGE: ${{ parameters.activationStage }}
      REFUND_APPLY: ${{ parameters.applyConfiguration }}
      REFUND_EXPECTED_SHA: ${{ parameters.expectedReleaseSha }}
      REFUND_EXPECTED_IMAGE: ${{ parameters.expectedImage }}
      REFUND_EXPECTED_REVISION: ${{ parameters.expectedReadyRevision }}
      REFUND_EXPECTED_EXPOSURE: ${{ parameters.expectedExposureJson }}
      REFUND_PLAN_RUN: ${{ parameters.reviewedPlanRunId }}
      CRAVES_INTERNAL_SMOKE_SECRET: $(CRAVES_INTERNAL_SMOKE_SECRET)
  - task: PublishPipelineArtifact@1
    condition: always()
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/refund-runtime
      artifact: refund-runtime-plan
    displayName: Publish redacted refund configuration evidence
