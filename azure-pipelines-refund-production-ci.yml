trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

resources:
  containers:
    - container: refundPostgres
      image: postgres:16
      ports: ['5432:5432']
      env:
        POSTGRES_DB: craves_refund_test
        POSTGRES_USER: refund_ci
        POSTGRES_PASSWORD: refund_ci_disposable_only
      options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

jobs:
  - job: refund_safety
    timeoutInMinutes: 25
    services:
      postgres: refundPostgres
    steps:
      - checkout: self
        clean: true
        persistCredentials: false
      - task: JavaToolInstaller@0
        inputs:
          versionSpec: '21'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled
        displayName: Use Java 21
      - bash: |
          set -euo pipefail
          mvn -B -ntp -f services/integration-service/pom.xml \
            -Dtest=RazorpayRefundClientTest,RefundExecutionWorkerTest,RefundProductionReadinessServiceTest,RefundProductionApprovalDefaultsTest,RefundDispatchDatabaseTest,RefundMigrationDatabaseTest,RefundRequestServiceTest,RefundStatusEventFactoryTest,RefundEventValidatorTest,RefundWorkflowPropertiesTest \
            clean verify
          python3 scripts/refund/verify-refund-safety-evidence.py
          python3 -m unittest discover -s scripts/refund -p 'test_*.py' -v
        env:
          REFUND_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/craves_refund_test
          REFUND_TEST_DB_USER: refund_ci
          REFUND_TEST_DB_PASSWORD: refund_ci_disposable_only
          CRAVES_REFUND_DISPOSABLE_DATABASE: 'true'
        displayName: Require refund protocol and disposable database acceptance
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: services/integration-service/target/surefire-reports/TEST-*.xml
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: services/integration-service/target/surefire-reports
          artifact: refund-safety-test-evidence
