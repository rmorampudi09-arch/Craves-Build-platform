trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: requireCommittedNodeLockfiles
    displayName: Require committed Next.js and React Native lockfiles
    type: boolean
    default: false
  - name: runAzureReadiness
    displayName: Run read-only Azure readiness after source verification
    type: boolean
    default: true

pool:
  vmImage: ubuntu-latest

stages:
  - stage: SourceIntegrity
    displayName: Source and production-pack integrity
    jobs:
      - job: SourceGates
        displayName: Run non-runtime source gates
        steps:
          - checkout: self
            persistCredentials: false
            fetchDepth: 1
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: Use Python 3.12
          - bash: |
              set -euo pipefail
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends libxml2-utils
              python -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
              chmod +x scripts/release/*.sh
              scripts/release/validate-production-completion-pack.sh
              scripts/release/verify-release-gate-inventory.sh .
              python scripts/release/validate-pipeline-yaml.py
              scripts/release/scan-secret-material.sh .
              scripts/release/validate-dockerfiles.sh .
              python scripts/release/validate-flyway-migrations.py
              scripts/release/validate-apim-assets.sh .
              scripts/release/validate-rollback-readiness.sh .
            displayName: Run source-only release gates

  - stage: CompileAndTest
    displayName: Compile and test locked technology stacks
    dependsOn: SourceIntegrity
    condition: succeeded()
    jobs:
      - job: JavaServices
        displayName: Java 21 verification for all seven services
        timeoutInMinutes: 120
        steps:
          - checkout: self
            persistCredentials: false
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
            displayName: Use Java 21
          - bash: |
              set -euo pipefail
              mapfile -t services < <(jq -r '.backendServices[].path' config/production/production-completion-pack.json)
              for service in "${services[@]}"; do
                echo "========== MAVEN VERIFY $service =========="
                (cd "$service" && mvn -B -ntp clean verify)
              done
            displayName: Maven verify all backend services
      - job: NodeApplications
        displayName: Next.js and React Native verification
        timeoutInMinutes: 90
        steps:
          - checkout: self
            persistCredentials: false
          - task: NodeTool@0
            inputs:
              versionSpec: '24.x'
            displayName: Use Node.js 24
          - bash: |
              set -euo pipefail
              for app in apps/customer-web-next apps/mobile/customer-app; do
                echo "========== NODE VERIFY $app =========="
                pushd "$app" >/dev/null
                if [[ -f package-lock.json ]]; then
                  npm ci --ignore-scripts
                else
                  if [[ '${{ parameters.requireCommittedNodeLockfiles }}' == 'true' ]]; then
                    echo "ERROR: $app/package-lock.json is required." >&2
                    exit 1
                  fi
                  echo "WARNING: $app/package-lock.json is missing; npm install is non-deterministic." >&2
                  npm install --ignore-scripts
                fi
                npm run verify
                popd >/dev/null
              done
            displayName: Verify customer web and mobile

  - ${{ if eq(parameters.runAzureReadiness, true) }}:
      - stage: AzureReadiness
        displayName: Read-only Azure runtime readiness
        dependsOn: CompileAndTest
        condition: succeeded()
        jobs:
          - job: RuntimeReadiness
            displayName: Verify all seven existing Container Apps without mutation
            steps:
              - checkout: self
                persistCredentials: false
              - task: AzureCLI@2
                displayName: Run read-only Azure release gates
                inputs:
                  azureSubscription: Craves-Dev-Service-Connection
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    set -euo pipefail
                    set +x
                    PACK='config/production/production-completion-pack.json'
                    RG='${{ parameters.resourceGroupName }}'
                    EXPECTED_RG=$(jq -r '.azure.resourceGroup' "$PACK")
                    [[ "$RG" == "$EXPECTED_RG" ]] || {
                      echo "ERROR: resource group must be $EXPECTED_RG" >&2
                      exit 1
                    }
                    APPS=$(jq -r '[.backendServices[].containerApp] | join(",")' "$PACK")
                    INTEGRATION_APP=$(jq -r '.backendServices[] | select(.key == "integration") | .containerApp' "$PACK")
                    chmod +x scripts/release/*.sh
                    scripts/release/verify-containerapps-readonly.sh "$RG" "$APPS"
                    scripts/release/verify-failclosed-controls.sh "$RG" "$INTEGRATION_APP"
                    scripts/release/smoke-containerapp-health.sh "$RG" "$APPS"
                    scripts/release/verify-observability-baseline.sh "$RG" "$APPS"

  - stage: ReleaseManifest
    displayName: Generate immutable release evidence
    dependsOn:
      - CompileAndTest
      - ${{ if eq(parameters.runAzureReadiness, true) }}:
          - AzureReadiness
    condition: succeeded()
    jobs:
      - job: Manifest
        displayName: Build and publish release manifest
        steps:
          - checkout: self
            persistCredentials: false
            fetchDepth: 1
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
            displayName: Use Python 3.12
          - bash: |
              set -euo pipefail
              export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
              export CRAVES_RELEASE_MANIFEST="$(Build.ArtifactStagingDirectory)/release-manifest.json"
              python scripts/release/generate-release-manifest.py
              jq -e '.dirty == false and (.files | length > 0)' "$CRAVES_RELEASE_MANIFEST" >/dev/null
              python scripts/release/generate-production-completion-runbook.py \
                '$(Build.ArtifactStagingDirectory)/production-completion-run-plan.md'
            displayName: Generate exact release manifest and run plan
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: craves-release-readiness-manifest
            displayName: Publish readiness evidence
