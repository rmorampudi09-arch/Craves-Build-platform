# Rider pilot runtime switches (docs/riders/GO-LIVE.md). Manual only; writes only from main at the reviewed commit.
# status: read only. wire: base URLs, support contacts, realtime push (fleet stays off). enable: fleet, rider API and
# location ingest on with test mode on (the pilot zone). disable: the kill switch.
trigger: none
pr: none

parameters:
  - name: stage
    displayName: Stage
    type: string
    default: status
    values: [status, wire, enable, disable]
  - name: apply
    displayName: Apply (unticked = plan only, nothing changes)
    type: boolean
    default: false
  - name: expectedReleaseSha
    displayName: Reviewed main commit (40 characters; needed to apply)
    type: string
    default: ' '
  - name: supportPhone
    displayName: Rider support phone (+91 and 10 digits; wire)
    type: string
    default: ' '
  - name: supportWhatsappUrl
    displayName: Riders' WhatsApp group link (optional; wire)
    type: string
    default: ' '
  - name: opsAlertEmails
    displayName: Ops lead emails, comma-separated (wire)
    type: string
    default: ' '
  - name: insuranceLabel
    displayName: Insurance line on the rider's profile (optional; wire)
    type: string
    default: ' '
  - name: minAppVersion
    displayName: Lowest rider app version allowed online (wire)
    type: string
    default: 1.0.0
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false

  - bash: |
      set -euo pipefail
      if [[ "${APPLY,,}" == true ]]; then
        [[ "$BUILD_SOURCEBRANCH" == refs/heads/main ]] || { echo 'ERROR: changes are made only from main.' >&2; exit 1; }
        SHA="$(echo "$EXPECTED_SHA" | xargs)"
        [[ "$SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$SHA" ]] || { echo "ERROR: expectedReleaseSha must be this run's exact commit." >&2; exit 1; }
      fi
      echo "Stage ${STAGE}, apply ${APPLY}, commit $(git rev-parse HEAD)"
    displayName: Changes only from main at the reviewed commit
    env:
      APPLY: ${{ parameters.apply }}
      EXPECTED_SHA: ${{ parameters.expectedReleaseSha }}
      STAGE: ${{ parameters.stage }}

  - bash: python3 -m unittest discover -s scripts/riders -p 'test_*.py' -v
    displayName: Test the runtime script

  - task: AzureCLI@2
    displayName: Rider pilot runtime (${{ parameters.stage }})
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        trim() { echo "$1" | xargs; }
        args=(--stage "$STAGE" --resource-group "$RG" --output "$(Build.ArtifactStagingDirectory)/rider-pilot-runtime.json"
              --support-phone "$(trim "$SUPPORT_PHONE")" --support-whatsapp-url "$(trim "$SUPPORT_WHATSAPP_URL")"
              --ops-alert-emails "$(trim "$OPS_ALERT_EMAILS")" --insurance-label "$(trim "$INSURANCE_LABEL")"
              --min-app-version "$(trim "$MIN_APP_VERSION")")
        if [[ "${APPLY,,}" == true ]]; then
          args+=(--apply --expected-source-sha "$(trim "$EXPECTED_SHA")")
        fi
        python3 scripts/riders/rider_pilot_runtime.py "${args[@]}"
    env:
      STAGE: ${{ parameters.stage }}
      APPLY: ${{ parameters.apply }}
      EXPECTED_SHA: ${{ parameters.expectedReleaseSha }}
      RG: ${{ parameters.resourceGroupName }}
      SUPPORT_PHONE: ${{ parameters.supportPhone }}
      SUPPORT_WHATSAPP_URL: ${{ parameters.supportWhatsappUrl }}
      OPS_ALERT_EMAILS: ${{ parameters.opsAlertEmails }}
      INSURANCE_LABEL: ${{ parameters.insuranceLabel }}
      MIN_APP_VERSION: ${{ parameters.minAppVersion }}

  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Keep the plan (no secret values)
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/rider-pilot-runtime.json
      artifact: rider-pilot-runtime-$(System.JobAttempt)
