trigger: none
pr: none

parameters:
  - name: targetEnvironment
    type: string
    default: STAGING
    values:
      - STAGING
      - PRODUCTION
  - name: enableProvider
    type: boolean
    default: false
  - name: confirmProductionActivation
    type: boolean
    default: false
  - name: providerBaseUrl
    type: string
    default: https://replace-before-run.invalid
  - name: authSecretName
    type: string
    default: shadowfax-api-token
  - name: clientCodeSecretName
    type: string
    default: shadowfax-client-code
  - name: callbackSecretName
    type: string
    default: shadowfax-callback-token
  - name: maximumAcceptedEtaMinutes
    type: number
    default: 0
  - name: confirmHyperlocalContractVerified
    type: boolean
    default: false
  - name: confirmHyderabadServiceabilityVerified
    type: boolean
    default: false
  - name: confirmCallbackRegistered
    type: boolean
    default: false
  - name: confirmCreateReconciliationVerified
    type: boolean
    default: false
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: AzureCLI@2
    displayName: Apply fail-closed Shadowfax environment state
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        RG='${{ parameters.resourceGroupName }}'
        APP='${{ parameters.integrationContainerAppName }}'
        environment='${{ parameters.targetEnvironment }}'
        enable_raw='${{ parameters.enableProvider }}'
        enable="${enable_raw,,}"
        confirm_raw='${{ parameters.confirmProductionActivation }}'
        confirm="${confirm_raw,,}"
        base_url='${{ parameters.providerBaseUrl }}'
        secret_name='${{ parameters.authSecretName }}'
        client_code_secret_name='${{ parameters.clientCodeSecretName }}'
        callback_secret_name='${{ parameters.callbackSecretName }}'
        maximum_eta='${{ parameters.maximumAcceptedEtaMinutes }}'
        contract_verified='${{ parameters.confirmHyperlocalContractVerified }}'
        hyderabad_verified='${{ parameters.confirmHyderabadServiceabilityVerified }}'
        callback_registered='${{ parameters.confirmCallbackRegistered }}'
        reconciliation_verified='${{ parameters.confirmCreateReconciliationVerified }}'
        app_yml='services/integration-service/src/main/resources/application.yml'
        adapter_dir='services/integration-service/src/main/java/in/craves/integration/delivery/shadowfax'

        fail() { echo "ERROR: $*" >&2; exit 2; }

        wait_ready() {
          local latest ready
          latest="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv --only-show-errors)"
          for _ in $(seq 1 60); do
            ready="$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv --only-show-errors 2>/dev/null || true)"
            [[ "$ready" == "$latest" ]] && return 0
            sleep 10
          done
          fail 'Integration Service revision did not become ready.'
        }

        [[ "$environment" == 'STAGING' || "$environment" == 'PRODUCTION' ]] || fail 'targetEnvironment must be STAGING or PRODUCTION.'
        [[ "$enable" == 'true' || "$enable" == 'false' ]] || fail 'enableProvider must resolve to true or false.'

        runtime_config_present=false
        if grep -Fq 'SHADOWFAX_API_ENABLED' "$app_yml" && grep -Fq 'SHADOWFAX_API_ENVIRONMENT' "$app_yml"; then
          runtime_config_present=true
        fi
        adapter_present=false
        if [[ -d "$adapter_dir" ]] && find "$adapter_dir" -type f -name '*.java' -print -quit | grep -q .; then
          adapter_present=true
        fi

        if [[ "$enable" == 'true' || "$environment" == 'PRODUCTION' ]]; then
          [[ "$adapter_present" == 'true' ]] || fail 'Shadowfax Hyperlocal Spring adapter is not implemented.'
          [[ "$runtime_config_present" == 'true' ]] || fail 'Shadowfax Hyperlocal runtime configuration is not implemented.'
          [[ "$environment" != 'STAGING' || "$base_url" == 'https://hlbackend.staging.shadowfax.in' ]] || fail 'Shadowfax staging must use the published HL Marketplace host.'
          [[ "$environment" != 'PRODUCTION' || "$base_url" == 'https://api.shadowfax.in' ]] || fail 'Shadowfax production must use the published HL Marketplace host.'
          [[ "$environment" != 'PRODUCTION' || "$confirm" == 'true' ]] || fail 'Production switch requires confirmProductionActivation=true.'
          [[ "$maximum_eta" =~ ^[0-9]+$ && "$maximum_eta" -gt 0 ]] || fail 'maximumAcceptedEtaMinutes must be explicitly configured.'
          [[ "${contract_verified,,}" == 'true' ]] || fail 'Shadowfax HL Marketplace contract verification is required.'
          [[ "${hyderabad_verified,,}" == 'true' ]] || fail 'Authenticated Hyderabad serviceability verification is required.'
          [[ "${callback_registered,,}" == 'true' ]] || fail 'Shadowfax production callback registration is required.'
          [[ "${reconciliation_verified,,}" == 'true' ]] || fail 'Deterministic uncertain-create reconciliation is required.'
          secrets="$(az containerapp secret list -g "$RG" -n "$APP" --query '[].name' -o tsv --only-show-errors)"
          grep -qx "$secret_name" <<<"$secrets" || fail "Missing Container App secret $secret_name."
          grep -qx "$client_code_secret_name" <<<"$secrets" || fail "Missing Container App secret $client_code_secret_name."
          grep -qx "$callback_secret_name" <<<"$secrets" || fail "Missing Container App secret $callback_secret_name."
        fi

        db_url="$(az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_URL']|[0].value" -o tsv --only-show-errors)"
        db_user="$(az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_USERNAME']|[0].value" -o tsv --only-show-errors)"
        db_secret_url="$(az containerapp secret list -g "$RG" -n "$APP" --query "[?name=='kv-db-password']|[0].keyVaultUrl" -o tsv --only-show-errors)"
        [[ "$db_url" == jdbc:postgresql://* && -n "$db_user" && "$db_secret_url" == https://*.vault.azure.net/secrets/* ]] || fail 'Integration database binding is incomplete.'
        vault_name="$(cut -d. -f1 <<<"${db_secret_url#https://}")"
        db_secret_name="${db_secret_url##*/}"
        db_password="$(az keyvault secret show --vault-name "$vault_name" --name "$db_secret_name" --query value -o tsv --only-show-errors)"
        export PGPASSWORD="$db_password" PGUSER="$db_user"
        DB="${db_url#jdbc:}"

        if [[ "$enable" == 'false' ]]; then
          psql "$DB" -v ON_ERROR_STOP=1 -c "UPDATE delivery_schema.delivery_provider SET is_active=FALSE, updated_at=now() WHERE provider_id='shadowfax';" >/dev/null
          az containerapp update -g "$RG" -n "$APP" \
            --set-env-vars \
              SHADOWFAX_API_ENVIRONMENT="$environment" \
              SHADOWFAX_PRODUCTION_ACTIVATION_APPROVED=false \
              SHADOWFAX_CONTRACT_VERIFIED=false \
              SHADOWFAX_HYDERABAD_SERVICEABILITY_VERIFIED=false \
              SHADOWFAX_CALLBACK_REGISTERED=false \
              SHADOWFAX_CREATE_RECONCILIATION_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CONTRACT_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CREDENTIAL_MODEL_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_SERVICEABILITY_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_QUOTE_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CREATE_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CANCEL_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_TRACK_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_WEBHOOK_SCHEMA_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CREATE_RECONCILIATION_VERIFIED=false \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_HYDERABAD_SERVICEABILITY_VERIFIED=false \
              SHADOWFAX_API_ENABLED=false \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
          wait_ready
        else
          approved=false
          [[ "$environment" == 'PRODUCTION' ]] && approved=true
          az containerapp update -g "$RG" -n "$APP" \
            --set-env-vars \
              SHADOWFAX_API_ENVIRONMENT="$environment" \
              SHADOWFAX_PRODUCTION_ACTIVATION_APPROVED="$approved" \
              SHADOWFAX_API_BASE_URL="$base_url" \
              SHADOWFAX_API_AUTH_TOKEN="secretref:${secret_name}" \
              SHADOWFAX_CLIENT_CODE="secretref:${client_code_secret_name}" \
              SHADOWFAX_CALLBACK_TOKEN="secretref:${callback_secret_name}" \
              SHADOWFAX_CALLBACK_URL='https://api.craves.in/api/v1/webhooks/delivery/shadowfax' \
              SHADOWFAX_MAX_ACCEPTED_ETA_MINUTES="$maximum_eta" \
              SHADOWFAX_CONTRACT_VERIFIED=true \
              SHADOWFAX_HYDERABAD_SERVICEABILITY_VERIFIED=true \
              SHADOWFAX_CALLBACK_REGISTERED=true \
              SHADOWFAX_CREATE_RECONCILIATION_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CONTRACT_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CONTRACT_VERSION='hl-marketplace-api-v2-2026-09-08' \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CREDENTIAL_MODEL_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_SERVICEABILITY_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_QUOTE_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CREATE_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CANCEL_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_TRACK_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_WEBHOOK_SCHEMA_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_CREATE_RECONCILIATION_VERIFIED=true \
              CRAVES_DELIVERY_PROVIDER_CONTRACTS_SHADOWFAX_HYDERABAD_SERVICEABILITY_VERIFIED=true \
              SHADOWFAX_API_ENABLED=true \
              CRAVES_DELIVERY_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED=true \
              CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=true \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
          wait_ready
          psql "$DB" -v ON_ERROR_STOP=1 -c "UPDATE delivery_schema.delivery_provider SET is_active=TRUE, updated_at=now() WHERE provider_id='shadowfax';" >/dev/null
          [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE provider_id='shadowfax' AND is_active=TRUE;")" == '1' ]] || fail 'Shadowfax provider catalog activation failed.'
          az containerapp update -g "$RG" -n "$APP" --set-env-vars CRAVES_DELIVERY_COMMAND_ENABLED=true >/dev/null
          wait_ready
        fi

        if [[ "$enable" == 'false' ]]; then
          [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE provider_id='shadowfax' AND is_active=TRUE;")" == '0' ]] || fail 'Shadowfax provider catalog is not fail-closed.'
          active_provider_count="$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE is_active=TRUE;")"
          if [[ "$active_provider_count" == '0' ]]; then
            az containerapp update -g "$RG" -n "$APP" --set-env-vars CRAVES_DELIVERY_COMMAND_ENABLED=false >/dev/null
            wait_ready
          else
            echo "INFO: $active_provider_count other provider(s) remain active; global delivery worker remains unchanged."
          fi
        fi

        env_json="$(az containerapp show -g "$RG" -n "$APP" --query 'properties.template.containers[0].env' -o json --only-show-errors)"
        value() { jq -r --arg name "$1" '.[] | select(.name == $name) | (.value // "")' <<<"$env_json" | tail -1; }
        [[ "$(value SHADOWFAX_API_ENVIRONMENT)" == "$environment" ]] || fail 'Shadowfax environment verification failed.'
        [[ "$(value SHADOWFAX_API_ENABLED)" == "$enable" ]] || fail 'Shadowfax enabled-state verification failed.'

        unset db_password PGPASSWORD PGUSER
        echo '============================================================'
        echo 'SHADOWFAX DELIVERY PROVIDER SWITCH: PASS'
        echo "Environment: $environment"
        echo "Provider enabled: $enable"
        [[ "$enable" == 'false' ]] && echo 'Mode: FAIL_CLOSED'
        echo "Spring adapter detected: $adapter_present"
        echo "Spring runtime configuration detected: $runtime_config_present"
        echo '============================================================'
