trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-subscription-service-p
  - name: sourceContainerAppName
    type: string
    default: ca-craves-user-chef-service-prod
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: services/subscription-service
  imageRepository: craves/subscription-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      cd $(modulePath)
      mvn -B clean package
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Build and push image to ACR
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        az acr login --name "$ACR"
        docker build -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Update Container App revision
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        SOURCE_APP='${{ parameters.sourceContainerAppName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'

        read_source_env() {
          local env_name="$1"
          az containerapp show \
            --name "$SOURCE_APP" \
            --resource-group "$RG" \
            --query "properties.template.containers[0].env[?name=='$env_name'].value | [0]" \
            -o tsv
        }

        DB_URL="$(read_source_env SPRING_DATASOURCE_URL)"
        DB_USER="$(read_source_env SPRING_DATASOURCE_USERNAME)"
        DB_PASSWORD="$(read_source_env SPRING_DATASOURCE_PASSWORD)"
        JWT_PUBLIC_KEY="$(read_source_env CRAVES_JWT_VERIFICATION_PEM_BASE64)"
        JWT_ISSUER="$(read_source_env CRAVES_JWT_ISSUER)"
        JWT_AUDIENCE="$(read_source_env CRAVES_JWT_AUDIENCE)"

        JWT_ISSUER="${JWT_ISSUER:-https://api.craves.in/auth}"
        JWT_AUDIENCE="${JWT_AUDIENCE:-craves-api}"

        if [ -z "$DB_URL" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ] || [ -z "$JWT_PUBLIC_KEY" ]; then
          echo "Required runtime env is missing from source app: $SOURCE_APP" >&2
          echo "Need SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD, CRAVES_JWT_VERIFICATION_PEM_BASE64." >&2
          exit 1
        fi

        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        az containerapp ingress update --name "$APP" --resource-group "$RG" --type external --target-port 8080 -o none
        az containerapp update \
          --name "$APP" \
          --resource-group "$RG" \
          --image "$IMAGE" \
          --set-env-vars \
            SERVER_PORT=8080 \
            SPRING_PROFILES_ACTIVE=prod \
            SPRING_DATASOURCE_URL="$DB_URL" \
            SPRING_DATASOURCE_USERNAME="$DB_USER" \
            SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
            CRAVES_JWT_VERIFICATION_PEM_BASE64="$JWT_PUBLIC_KEY" \
            CRAVES_JWT_ISSUER="$JWT_ISSUER" \
            CRAVES_JWT_AUDIENCE="$JWT_AUDIENCE" \
          -o none
        az containerapp show --name "$APP" --resource-group "$RG" --query "{name:name, latestRevision:properties.latestRevisionName, runningStatus:properties.runningStatus, image:properties.template.containers[0].image, targetPort:properties.configuration.ingress.targetPort, fqdn:properties.configuration.ingress.fqdn}" -o table
