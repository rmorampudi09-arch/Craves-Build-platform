trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-subscription-service-p
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: services/subscription-service
  imageRepository: craves/subscription-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      cd $(modulePath)
      mvn -B clean package
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Build and push image to ACR
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        az acr login --name "$ACR"
        docker build -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Update Container App revision
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        DS_URL="$[ variables.SPRING_DATASOURCE_URL ]"
        DS_USER="$[ variables.SPRING_DATASOURCE_USERNAME ]"
        DS_PASS="$[ variables.SPRING_DATASOURCE_PASSWORD ]"
        JWT_PEM="$[ variables.CRAVES_JWT_VERIFICATION_PEM_BASE64 ]"
        az containerapp ingress update --name "$APP" --resource-group "$RG" --type external --target-port 8080 -o none
        az containerapp update \
          --name "$APP" \
          --resource-group "$RG" \
          --image "$IMAGE" \
          --set-env-vars \
            SERVER_PORT=8080 \
            SPRING_PROFILES_ACTIVE=prod \
            SPRING_DATASOURCE_URL="$DS_URL" \
            SPRING_DATASOURCE_USERNAME="$DS_USER" \
            SPRING_DATASOURCE_PASSWORD="$DS_PASS" \
            CRAVES_JWT_VERIFICATION_PEM_BASE64="$JWT_PEM" \
            CRAVES_JWT_ISSUER="https://api.craves.in/auth" \
            CRAVES_JWT_AUDIENCE="craves-api" \
          --no-wait
        az containerapp show --name "$APP" --resource-group "$RG" --query "{name:name, latestRevision:properties.latestRevisionName, runningStatus:properties.runningStatus, image:properties.template.containers[0].image, targetPort:properties.configuration.ingress.targetPort, fqdn:properties.configuration.ingress.fqdn}" -o table
