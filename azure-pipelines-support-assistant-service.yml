trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ''
  - name: imageTag
    type: string
    default: $(Build.BuildId)
  - name: deploy
    type: boolean
    default: false

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection
  modulePath: services/support-assistant-service
  imageRepository: craves/support-assistant-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false
    fetchDepth: 1

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail
      cd $(modulePath)
      mvn -B -ntp clean verify
    displayName: Maven build and tests

  - script: |
      set -euo pipefail
      scripts/release/scan-secret-material.sh $(modulePath)
      scripts/release/validate-dockerfiles.sh . $(modulePath)/Dockerfile
      python3 scripts/release/validate-flyway-migrations.py
      grep -F 'CRAVES_SUPPORT_AI_ENABLED:false' $(modulePath)/src/main/resources/application.yml
      if grep -R -E 'AZURE_OPENAI_API_KEY|OPENAI_API_KEY|api-key[=:][^$({ ]' $(modulePath); then
        echo 'ERROR: Support Assistant must use managed identity; model API keys are forbidden.' >&2
        exit 1
      fi
    displayName: Validate support assistant security and release assets

  - task: AzureCLI@2
    displayName: Build and push immutable Support Assistant image
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        APP='${{ parameters.containerAppName }}'
        [[ -n "$APP" ]] || { echo 'ERROR: containerAppName is required when deploy=true.' >&2; exit 2; }
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$TAG"
        az acr login --name "$ACR" --only-show-errors
        docker build --pull -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Deploy Support Assistant image without changing runtime configuration
    condition: and(succeeded(), eq('${{ parameters.deploy }}', 'true'))
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        TAG='${{ parameters.imageTag }}'
        [[ -n "$APP" ]] || { echo 'ERROR: containerAppName is required when deploy=true.' >&2; exit 2; }
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$TAG"
        READY_ATTEMPTS=150 \
        READY_SLEEP_SECONDS=10 \
        bash scripts/release/deploy-single-service-preserve-runtime.sh \
          "$RG" \
          "$APP" \
          "$IMAGE" \
          support-assistant
