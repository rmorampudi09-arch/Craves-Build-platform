trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-user-chef-service-prod
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: authContainerAppName
    type: string
    default: ca-craves-auth-service-prodlow
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: services/user-chef-service
  imageRepository: craves/user-chef-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail
      cd $(modulePath)
      mvn -B -ntp clean verify
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Build and push immutable User-Chef image
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        az acr login --name "$ACR"
        docker build --pull -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Verify shared Key Vault and Auth dependencies
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        USER_CHEF_APP='${{ parameters.containerAppName }}'
        ORDER_APP='${{ parameters.orderContainerAppName }}'
        AUTH_APP='${{ parameters.authContainerAppName }}'
        SHARED_SECRET='craves-internal-service-secret'
        fail() { echo "ERROR: $*" >&2; exit 1; }

        USER_CHEF_URI=$(az containerapp secret list -g "$RG" -n "$USER_CHEF_APP" --query "[?name=='$SHARED_SECRET']|[0].keyVaultUrl" -o tsv)
        ORDER_URI=$(az containerapp secret list -g "$RG" -n "$ORDER_APP" --query "[?name=='$SHARED_SECRET']|[0].keyVaultUrl" -o tsv)
        USER_CHEF_IDENTITY=$(az containerapp secret list -g "$RG" -n "$USER_CHEF_APP" --query "[?name=='$SHARED_SECRET']|[0].identity" -o tsv)
        ORDER_IDENTITY=$(az containerapp secret list -g "$RG" -n "$ORDER_APP" --query "[?name=='$SHARED_SECRET']|[0].identity" -o tsv)
        USER_CHEF_REF=$(az containerapp show -g "$RG" -n "$USER_CHEF_APP" --query "properties.template.containers[0].env[?name=='CRAVES_INTERNAL_SERVICE_SECRET']|[0].secretRef" -o tsv)
        ORDER_REF=$(az containerapp show -g "$RG" -n "$ORDER_APP" --query "properties.template.containers[0].env[?name=='CRAVES_INTERNAL_SERVICE_SECRET']|[0].secretRef" -o tsv)
        [[ -n "$USER_CHEF_URI" && "$USER_CHEF_URI" == "$ORDER_URI" ]] || fail 'User-Chef and Order must reference the same version-pinned Key Vault secret.'
        [[ "$USER_CHEF_IDENTITY" == 'system' && "$ORDER_IDENTITY" == 'system' ]] || fail 'Shared Key Vault references must use system-assigned identities.'
        [[ "$USER_CHEF_REF" == "$SHARED_SECRET" && "$ORDER_REF" == "$SHARED_SECRET" ]] || fail 'Shared internal secret environment references are inconsistent.'
        case "$USER_CHEF_URI" in https://*.vault.azure.net/secrets/*/*) ;; *) fail 'Shared Key Vault URI is not version-pinned.' ;; esac

        AUTH_JSON=$(az containerapp show -g "$RG" -n "$AUTH_APP" -o json)
        AUTH_FQDN=$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$AUTH_JSON")
        AUTH_LATEST=$(jq -r '.properties.latestRevisionName // ""' <<<"$AUTH_JSON")
        AUTH_READY=$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$AUTH_JSON")
        AUTH_RUNNING=$(jq -r '.properties.runningStatus // ""' <<<"$AUTH_JSON")
        [[ -n "$AUTH_FQDN" && "$AUTH_LATEST" == "$AUTH_READY" && "$AUTH_RUNNING" == 'Running' ]] || fail 'Auth Service is not ready.'
        curl --fail --silent --show-error --max-time 30 "https://$AUTH_FQDN/actuator/health" | jq -e '.status == "UP"' >/dev/null
        echo "##vso[task.setvariable variable=AUTH_INTERNAL_BASE_URL]https://$AUTH_FQDN"
        echo 'Shared Key Vault and Auth dependencies verified.'

  - task: AzureCLI@2
    displayName: Store User-Chef database and JWT secrets
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x
        RG='${{ parameters.resourceGroupName }}'
        APP='${{ parameters.containerAppName }}'
        DB_PASSWORD='$(POSTGRES_BUSINESS_DB_PASSWORD)'
        JWT_PEM='$(CRAVES_JWT_VERIFICATION_PEM_BASE64)'
        require_value() {
          local variable_name="$1" value="$2"
          [[ -n "$value" && "$value" != "\$($variable_name)" ]] || { echo "ERROR: Secure pipeline variable $variable_name is missing." >&2; exit 1; }
        }
        require_value POSTGRES_BUSINESS_DB_PASSWORD "$DB_PASSWORD"
        require_value CRAVES_JWT_VERIFICATION_PEM_BASE64 "$JWT_PEM"
        az containerapp secret set -g "$RG" -n "$APP" --secrets \
          db-password="$DB_PASSWORD" \
          jwt-verify-pem="$JWT_PEM" \
          -o none
        echo 'User-Chef database and JWT secrets stored; values were not printed.'

  - task: AzureCLI@2
    displayName: Deploy and verify fail-closed User-Chef revision
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        TAG='${{ parameters.imageTag }}'
        IMAGE_REPOSITORY='$(imageRepository)'
        AUTH_INTERNAL_BASE_URL='$(AUTH_INTERNAL_BASE_URL)'
        [[ "$AUTH_INTERNAL_BASE_URL" == https://* ]] || { echo 'ERROR: Auth internal base URL was not resolved.' >&2; exit 1; }
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv)
        IMAGE="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$TAG"
        APP_BEFORE=$(az containerapp show -g "$RG" -n "$APP" -o json)
        PREVIOUS_REVISION=$(jq -r '.properties.latestRevisionName // ""' <<<"$APP_BEFORE")
        PREVIOUS_IMAGE=$(jq -r '.properties.template.containers[0].image // ""' <<<"$APP_BEFORE")
        [[ -n "$PREVIOUS_REVISION" && -n "$PREVIOUS_IMAGE" ]] || { echo 'ERROR: Existing User-Chef state is incomplete.' >&2; exit 1; }
        [[ "$PREVIOUS_IMAGE" != "$IMAGE" ]] || { echo 'ERROR: Target image is already deployed. Use a new immutable image tag.' >&2; exit 1; }

        az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" --set-env-vars \
          SPRING_PROFILES_ACTIVE=prod \
          SPRING_DATASOURCE_URL='$(POSTGRES_BUSINESS_DB_URL)' \
          SPRING_DATASOURCE_USERNAME='$(POSTGRES_BUSINESS_DB_USER)' \
          SPRING_DATASOURCE_PASSWORD=secretref:db-password \
          CRAVES_JWT_VERIFICATION_PEM_BASE64=secretref:jwt-verify-pem \
          CRAVES_JWT_ISSUER='https://api.craves.in/auth' \
          CRAVES_JWT_AUDIENCE=craves-api \
          CRAVES_STORAGE_ENDPOINT_VALUE='$(CRAVES_STORAGE_ENDPOINT_VALUE)' \
          CRAVES_STORAGE_DOCUMENTS_CONTAINER=documents \
          CRAVES_INTERNAL_SERVICE_SECRET=secretref:craves-internal-service-secret \
          CRAVES_AUTH_INTERNAL_BASE_URL="$AUTH_INTERNAL_BASE_URL" \
          CRAVES_NOTIFICATION_DIRECT_DISPATCH_ENABLED=false \
          CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_ENABLED=false \
          CRAVES_TOKEN_REVOCATION_ENABLED=false \
          --no-wait -o none

        for attempt in $(seq 1 60); do
          APP_JSON=$(az containerapp show -g "$RG" -n "$APP" -o json)
          LATEST=$(jq -r '.properties.latestRevisionName // ""' <<<"$APP_JSON")
          READY=$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$APP_JSON")
          RUNNING=$(jq -r '.properties.runningStatus // ""' <<<"$APP_JSON")
          LATEST_IMAGE=''; HEALTH=''
          if [[ -n "$LATEST" ]]; then
            LATEST_IMAGE=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST" --query 'properties.template.containers[0].image' -o tsv 2>/dev/null || true)
            HEALTH=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST" --query properties.healthState -o tsv 2>/dev/null || true)
          fi
          env_value() { jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name)][0].value // ""' <<<"$APP_JSON"; }
          secret_ref() { jq -r --arg name "$1" '[.properties.template.containers[0].env[]? | select(.name == $name)][0].secretRef // ""' <<<"$APP_JSON"; }
          DIRECT=$(env_value CRAVES_NOTIFICATION_DIRECT_DISPATCH_ENABLED)
          OUTBOX=$(env_value CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_ENABLED)
          REVOCATION=$(env_value CRAVES_TOKEN_REVOCATION_ENABLED)
          AUTH_URL=$(env_value CRAVES_AUTH_INTERNAL_BASE_URL)
          DB_REF=$(secret_ref SPRING_DATASOURCE_PASSWORD)
          JWT_REF=$(secret_ref CRAVES_JWT_VERIFICATION_PEM_BASE64)
          INTERNAL_REF=$(secret_ref CRAVES_INTERNAL_SERVICE_SECRET)
          echo "Attempt $attempt/60 latest=$LATEST ready=$READY running=$RUNNING health=$HEALTH image=$LATEST_IMAGE direct=$DIRECT outbox=$OUTBOX revocation=$REVOCATION authUrl=$AUTH_URL dbRef=$DB_REF jwtRef=$JWT_REF internalRef=$INTERNAL_REF"
          if [[ "$LATEST" != "$PREVIOUS_REVISION" && "$LATEST" == "$READY" && "$RUNNING" == 'Running' && "$HEALTH" == 'Healthy' && "$LATEST_IMAGE" == "$IMAGE" && "${DIRECT,,}" == 'false' && "${OUTBOX,,}" == 'false' && "${REVOCATION,,}" == 'false' && "$AUTH_URL" == "$AUTH_INTERNAL_BASE_URL" && "$DB_REF" == 'db-password' && "$JWT_REF" == 'jwt-verify-pem' && "$INTERNAL_REF" == 'craves-internal-service-secret' ]]; then
            FQDN=$(jq -r '.properties.configuration.ingress.fqdn // ""' <<<"$APP_JSON")
            [[ -n "$FQDN" ]] || { echo 'ERROR: User-Chef FQDN is missing.' >&2; exit 1; }
            curl --fail --silent --show-error --max-time 30 "https://$FQDN/actuator/health" | jq -e '.status == "UP"' >/dev/null
            echo "SUCCESS: User-Chef revision $LATEST is healthy, secret-bound and fail-closed."
            echo "Rollback image: $PREVIOUS_IMAGE"
            exit 0
          fi
          if [[ "$HEALTH" == 'Unhealthy' || "$RUNNING" == 'Failed' ]]; then
            az containerapp logs show -g "$RG" -n "$APP" --revision "$LATEST" --type console --tail 200 --format text || true
            echo 'ERROR: User-Chef revision became unhealthy.' >&2
            exit 1
          fi
          sleep 10
        done
        echo 'ERROR: User-Chef revision did not become healthy and fail-closed within 10 minutes.' >&2
        exit 1
