components:
  schemas:
    BulkOrderAccept:
      properties:
        expectedVersion:
          format: int64
          type: integer
      required:
      - expectedVersion
      type: object
    BulkOrderDecline:
      properties:
        reason:
          maxLength: 300
          minLength: 0
          type: string
      required:
      - reason
      type: object
    BulkOrderItem:
      properties:
        menuItemId:
          format: uuid
          type: string
        quantity:
          format: int32
          maximum: 5000
          minimum: 1
          type: integer
      required:
      - menuItemId
      - quantity
      type: object
    BulkOrderLine:
      properties:
        listPricePaise:
          format: int64
          type: integer
        menuItemId:
          format: uuid
          type: string
        name:
          type: string
        quantity:
          format: int32
          type: integer
        unitPricePaise:
          format: int64
          type: integer
      type: object
    BulkOrderPolicy:
      properties:
        depositPercent:
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        maxDaysAhead:
          format: int32
          maximum: 365
          minimum: 1
          type: integer
        minLeadHours:
          format: int32
          maximum: 720
          minimum: 0
          type: integer
        minPortions:
          format: int32
          maximum: 10000
          minimum: 1
          type: integer
      required:
      - depositPercent
      - maxDaysAhead
      - minLeadHours
      - minPortions
      type: object
    BulkOrderPolicyView:
      properties:
        depositPercent:
          format: int32
          type: integer
        maxDaysAhead:
          format: int32
          type: integer
        minLeadHours:
          format: int32
          type: integer
        minPortions:
          format: int32
          type: integer
        updatedAt:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      type: object
    BulkOrderView:
      properties:
        createdAt:
          format: date-time
          type: string
        declineReason:
          type: string
        depositPaise:
          format: int64
          type: integer
        depositPercent:
          format: int32
          type: integer
        eventAt:
          format: date-time
          type: string
        expired:
          type: boolean
        guests:
          format: int32
          type: integer
        id:
          format: uuid
          type: string
        kitchenId:
          format: uuid
          type: string
        lines:
          items:
            $ref: "#/components/schemas/BulkOrderLine"
          type: array
        notes:
          type: string
        portions:
          format: int32
          type: integer
        quoteNote:
          type: string
        quoteValidUntil:
          format: date-time
          type: string
        status:
          enum:
          - REQUESTED
          - QUOTED
          - ACCEPTED
          - DECLINED
          - CANCELLED
          type: string
        totalPaise:
          format: int64
          type: integer
        version:
          format: int64
          type: integer
      type: object
    BulkQuote:
      properties:
        expectedVersion:
          format: int64
          type: integer
        lines:
          items:
            $ref: "#/components/schemas/BulkQuoteLine"
          maxItems: 30
          minItems: 0
          type: array
        note:
          maxLength: 500
          minLength: 0
          type: string
        validUntil:
          format: date-time
          type: string
      required:
      - expectedVersion
      - lines
      - validUntil
      type: object
    BulkQuoteLine:
      properties:
        menuItemId:
          format: uuid
          type: string
        unitPricePaise:
          format: int64
          maximum: 10000000
          minimum: 0
          type: integer
      required:
      - menuItemId
      - unitPricePaise
      type: object
    NewBulkOrder:
      properties:
        eventAt:
          format: date-time
          type: string
        guests:
          format: int32
          maximum: 10000
          minimum: 1
          type: integer
        items:
          items:
            $ref: "#/components/schemas/BulkOrderItem"
          maxItems: 30
          minItems: 0
          type: array
        kitchenId:
          format: uuid
          type: string
        notes:
          maxLength: 500
          minLength: 0
          type: string
      required:
      - eventAt
      - items
      - kitchenId
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: "Generated from services/advanced-features-service. Base URL https://api.craves.in.\
    \ Errors: {timestamp, code, message, details, correlationId}. Feature switch:\
    \ CRAVES_ADV_BULK_ORDERS_ENABLED."
  title: Craves bulk-orders API
  version: v1
openapi: 3.0.1
paths:
  /api/v1/advanced/bulk-orders:
    post:
      operationId: createBulkOrder
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBulkOrder"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderView"
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
  /api/v1/advanced/bulk-orders/admin/policy:
    put:
      operationId: setBulkOrderPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOrderPolicy"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderPolicyView"
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: staff
  /api/v1/advanced/bulk-orders/chef/requests:
    get:
      operationId: chefBulkOrders
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/BulkOrderView"
                type: array
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
  /api/v1/advanced/bulk-orders/chef/requests/{bulkOrderId}/decline:
    post:
      operationId: declineBulkOrder
      parameters:
      - in: path
        name: bulkOrderId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOrderDecline"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderView"
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
  /api/v1/advanced/bulk-orders/chef/requests/{bulkOrderId}/quote:
    post:
      operationId: quoteBulkOrder
      parameters:
      - in: path
        name: bulkOrderId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkQuote"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderView"
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
  /api/v1/advanced/bulk-orders/mine:
    get:
      operationId: myBulkOrders
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/BulkOrderView"
                type: array
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
  /api/v1/advanced/bulk-orders/policy:
    get:
      operationId: bulkOrderPolicy
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderPolicyView"
          description: OK
      security: []
      tags:
      - bulk-order-controller
      x-craves-auth: public
  /api/v1/advanced/bulk-orders/{bulkOrderId}:
    get:
      operationId: bulkOrder
      parameters:
      - in: path
        name: bulkOrderId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderView"
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
  /api/v1/advanced/bulk-orders/{bulkOrderId}/accept:
    post:
      operationId: acceptBulkQuote
      parameters:
      - in: path
        name: bulkOrderId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkOrderAccept"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderView"
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
  /api/v1/advanced/bulk-orders/{bulkOrderId}/cancel:
    post:
      operationId: cancelBulkOrder
      parameters:
      - in: path
        name: bulkOrderId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BulkOrderView"
          description: OK
      tags:
      - bulk-order-controller
      x-craves-auth: user
security:
- bearer: []
servers:
- url: https://api.craves.in
