components:
  schemas:
    AnalyticsEvent:
      properties:
        eventId:
          format: uuid
          type: string
        experimentKey:
          pattern: "[a-z][a-z0-9-]{1,39}"
          type: string
        name:
          pattern: "[a-z][a-z0-9_.]{1,59}"
          type: string
        occurredAt:
          format: date-time
          type: string
        properties:
          additionalProperties:
            type: object
          type: object
      required:
      - eventId
      - name
      - occurredAt
      type: object
    AnalyticsEventBatch:
      properties:
        events:
          items:
            $ref: "#/components/schemas/AnalyticsEvent"
          maxItems: 50
          minItems: 0
          type: array
      required:
      - events
      type: object
    AnalyticsReceipt:
      properties:
        accepted:
          format: int32
          type: integer
        consented:
          type: boolean
        recorded:
          format: int32
          type: integer
      type: object
    DailyEventCount:
      properties:
        day:
          format: date
          type: string
        events:
          format: int64
          type: integer
        people:
          format: int64
          type: integer
      type: object
    EventCounts:
      properties:
        days:
          items:
            $ref: "#/components/schemas/DailyEventCount"
          type: array
        eventName:
          type: string
        suppressedBelow:
          format: int32
          type: integer
      type: object
    ExperimentAssignment:
      properties:
        experimentKey:
          type: string
        variant:
          type: string
      type: object
    ExperimentDraftChange:
      properties:
        description:
          maxLength: 300
          minLength: 0
          type: string
        expectedVersion:
          format: int64
          type: integer
        variants:
          items:
            $ref: "#/components/schemas/ExperimentVariant"
          maxItems: 5
          minItems: 2
          type: array
      required:
      - description
      - expectedVersion
      - variants
      type: object
    ExperimentResults:
      properties:
        eventName:
          type: string
        experimentKey:
          type: string
        suppressedBelow:
          format: int32
          type: integer
        variants:
          items:
            $ref: "#/components/schemas/VariantResult"
          type: array
      type: object
    ExperimentTransition:
      properties:
        expectedVersion:
          format: int64
          type: integer
      required:
      - expectedVersion
      type: object
    ExperimentVariant:
      properties:
        key:
          pattern: "[a-z][a-z0-9-]{1,39}"
          type: string
        weight:
          format: int32
          maximum: 10000
          minimum: 1
          type: integer
      required:
      - key
      - weight
      type: object
    ExperimentView:
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        key:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          enum:
          - DRAFT
          - RUNNING
          - STOPPED
          type: string
        stoppedAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        variants:
          items:
            $ref: "#/components/schemas/ExperimentVariant"
          type: array
        version:
          format: int64
          type: integer
      type: object
    NewExperiment:
      properties:
        description:
          maxLength: 300
          minLength: 0
          type: string
        key:
          pattern: "[a-z][a-z0-9-]{1,39}"
          type: string
        variants:
          items:
            $ref: "#/components/schemas/ExperimentVariant"
          maxItems: 5
          minItems: 2
          type: array
      required:
      - description
      - key
      - variants
      type: object
    VariantResult:
      properties:
        events:
          format: int64
          type: integer
        people:
          format: int64
          type: integer
        peopleWithEvent:
          format: int64
          type: integer
        variant:
          type: string
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: "Generated from services/advanced-features-service. Base URL https://api.craves.in.\
    \ Errors: {timestamp, code, message, details, correlationId}. Feature switch:\
    \ CRAVES_ADV_EXPERIMENTS_ENABLED."
  title: Craves experiments API
  version: v1
openapi: 3.0.1
paths:
  /api/v1/advanced/experiments/admin/events/daily:
    get:
      operationId: dailyEventCounts
      parameters:
      - in: query
        name: name
        required: true
        schema:
          type: string
      - in: query
        name: from
        required: true
        schema:
          format: date
          type: string
      - in: query
        name: to
        required: true
        schema:
          format: date
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventCounts"
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/experiments/admin/experiments:
    get:
      operationId: listExperiments
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/ExperimentView"
                type: array
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
    post:
      operationId: createExperiment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewExperiment"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExperimentView"
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/experiments/admin/experiments/{key}:
    get:
      operationId: getExperiment
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExperimentView"
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
    put:
      operationId: changeExperimentDraft
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentDraftChange"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExperimentView"
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/experiments/admin/experiments/{key}/results:
    get:
      operationId: experimentResults
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      - in: query
        name: event
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExperimentResults"
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/experiments/admin/experiments/{key}/start:
    post:
      operationId: startExperiment
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentTransition"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExperimentView"
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/experiments/admin/experiments/{key}/stop:
    post:
      operationId: stopExperiment
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentTransition"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExperimentView"
          description: OK
      tags:
      - experiment-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/experiments/events:
    post:
      operationId: recordAnalyticsEvents
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventBatch"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnalyticsReceipt"
          description: OK
      tags:
      - experiment-controller
      x-craves-auth: user
  /api/v1/advanced/experiments/mine:
    get:
      operationId: myExperimentVariants
      parameters:
      - in: query
        name: keys
        required: true
        schema:
          items:
            type: string
          type: array
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/ExperimentAssignment"
                type: array
          description: OK
      tags:
      - experiment-controller
      x-craves-auth: user
security:
- bearer: []
servers:
- url: https://api.craves.in
