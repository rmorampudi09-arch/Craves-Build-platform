components:
  schemas:
    Badge:
      properties:
        allergens:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
          uniqueItems: true
        hasNutrition:
          type: boolean
        label:
          type: string
        mayContain:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
          uniqueItems: true
        menuItemId:
          format: uuid
          type: string
      type: object
    ChefFactsView:
      properties:
        content:
          $ref: "#/components/schemas/FactsContent"
        menuItemId:
          format: uuid
          type: string
        publishedLabel:
          type: string
        reviewNote:
          type: string
        reviewedAt:
          format: date-time
          type: string
        status:
          type: string
        submittedAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
        warnings:
          items:
            type: string
          type: array
      type: object
    FactsContent:
      properties:
        allergens:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
          uniqueItems: true
        evidenceReference:
          maxLength: 200
          minLength: 0
          type: string
        ingredients:
          items:
            $ref: "#/components/schemas/Ingredient"
          maxItems: 60
          minItems: 0
          type: array
        mayContain:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
          uniqueItems: true
        nutrition:
          $ref: "#/components/schemas/Nutrition"
        servingSizeGrams:
          format: int32
          maximum: 5000
          minimum: 1
          type: integer
        source:
          enum:
          - CHEF_DECLARED
          - LAB_TESTED
          - LABEL_DERIVED
          type: string
      required:
      - ingredients
      - source
      type: object
    FreeFromPage:
      properties:
        menuItemIds:
          items:
            format: uuid
            type: string
          type: array
        nextCursor:
          type: string
      type: object
    Ingredient:
      properties:
        allergens:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
          uniqueItems: true
        name:
          maxLength: 80
          minLength: 0
          type: string
      required:
      - name
      type: object
    LookupRequest:
      properties:
        menuItemIds:
          items:
            format: uuid
            type: string
          maxItems: 100
          minItems: 0
          type: array
      required:
      - menuItemIds
      type: object
    Nutrition:
      properties:
        carbohydrateG:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 2000
          minimum: 0
          type: number
        energyKcal:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 5000
          minimum: 0
          type: number
        fatG:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 2000
          minimum: 0
          type: number
        fibreG:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 2000
          minimum: 0
          type: number
        proteinG:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 2000
          minimum: 0
          type: number
        saturatedFatG:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 2000
          minimum: 0
          type: number
        sodiumMg:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 20000
          minimum: 0
          type: number
        sugarsG:
          exclusiveMaximum: false
          exclusiveMinimum: false
          maximum: 2000
          minimum: 0
          type: number
      type: object
    PublicFacts:
      properties:
        allergens:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
          uniqueItems: true
        disclaimer:
          type: string
        ingredients:
          items:
            $ref: "#/components/schemas/Ingredient"
          type: array
        label:
          type: string
        mayContain:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
          uniqueItems: true
        menuItemId:
          format: uuid
          type: string
        nutrition:
          $ref: "#/components/schemas/Nutrition"
        publishedAt:
          format: date-time
          type: string
        servingSizeGrams:
          format: int32
          type: integer
        source:
          type: string
      type: object
    QueueEntry:
      properties:
        chefId:
          format: uuid
          type: string
        content:
          $ref: "#/components/schemas/FactsContent"
        kitchenId:
          format: uuid
          type: string
        menuItemId:
          format: uuid
          type: string
        submittedAt:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
        warnings:
          items:
            type: string
          type: array
      type: object
    QueuePage:
      properties:
        entries:
          items:
            $ref: "#/components/schemas/QueueEntry"
          type: array
        nextCursor:
          type: string
      type: object
    Review:
      properties:
        expectedVersion:
          format: int64
          type: integer
        note:
          maxLength: 300
          minLength: 0
          type: string
      required:
      - expectedVersion
      type: object
    Vocabulary:
      properties:
        allergens:
          items:
            enum:
            - GLUTEN_CEREALS
            - CRUSTACEANS
            - MOLLUSCS
            - EGGS
            - FISH
            - PEANUTS
            - TREE_NUTS
            - MILK
            - SOY
            - SESAME
            - MUSTARD
            - CELERY
            - LUPIN
            - SULPHITES
            type: string
          type: array
        disclaimer:
          type: string
        sources:
          items:
            enum:
            - CHEF_DECLARED
            - LAB_TESTED
            - LABEL_DERIVED
            type: string
          type: array
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: "Generated from services/advanced-features-service. Base URL https://api.craves.in.\
    \ Errors: {timestamp, code, message, details, correlationId}. Feature switch:\
    \ CRAVES_ADV_FOOD_FACTS_ENABLED."
  title: Craves food-facts API
  version: v1
openapi: 3.0.1
paths:
  /api/v1/advanced/food-facts/admin/menu-items/{menuItemId}/reject:
    post:
      operationId: reject
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Review"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChefFactsView"
          description: OK
      tags:
      - food-facts-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/food-facts/admin/menu-items/{menuItemId}/verify:
    post:
      operationId: verify
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Review"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChefFactsView"
          description: OK
      tags:
      - food-facts-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/food-facts/admin/queue:
    get:
      operationId: queue
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/QueuePage"
          description: OK
      tags:
      - food-facts-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/food-facts/chef/menu-items/{menuItemId}:
    delete:
      operationId: withdraw
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          description: OK
      tags:
      - food-facts-controller
      x-craves-auth: user
    get:
      operationId: chefView
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChefFactsView"
          description: OK
      tags:
      - food-facts-controller
      x-craves-auth: user
    put:
      operationId: saveDraft
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FactsContent"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChefFactsView"
          description: OK
      tags:
      - food-facts-controller
      x-craves-auth: user
  /api/v1/advanced/food-facts/chef/menu-items/{menuItemId}/submit:
    post:
      operationId: submit
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: If-Match
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChefFactsView"
          description: OK
      tags:
      - food-facts-controller
      x-craves-auth: user
  /api/v1/advanced/food-facts/free-from:
    get:
      operationId: freeFrom
      parameters:
      - in: query
        name: allergens
        required: true
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FreeFromPage"
          description: OK
      security: []
      tags:
      - food-facts-controller
      x-craves-auth: public
  /api/v1/advanced/food-facts/menu-items/lookup:
    post:
      operationId: lookup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/Badge"
                type: array
          description: OK
      security: []
      tags:
      - food-facts-controller
      x-craves-auth: public
  /api/v1/advanced/food-facts/menu-items/{menuItemId}:
    get:
      operationId: publicFacts
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PublicFacts"
          description: OK
      security: []
      tags:
      - food-facts-controller
      x-craves-auth: public
  /api/v1/advanced/food-facts/vocabulary:
    get:
      operationId: vocabulary
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Vocabulary"
          description: OK
      security: []
      tags:
      - food-facts-controller
      x-craves-auth: public
security:
- bearer: []
servers:
- url: https://api.craves.in
