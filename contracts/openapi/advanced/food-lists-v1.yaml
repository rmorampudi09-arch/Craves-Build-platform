          description: OK
      security: []
      tags:
      - shared-food-list-controller
      x-craves-auth: public
  /api/v1/advanced/shared-food-lists/{token}/copy:
    post:
      operationId: copy
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
