components:
  schemas:
    BatchAvailability:
      properties:
        id:
          format: uuid
          type: string
        menuItemId:
          format: uuid
          type: string
        open:
          type: boolean
        orderCutoff:
          format: date-time
          type: string
        portions:
          format: int32
          type: integer
        readyAt:
          format: date-time
          type: string
        remaining:
          format: int32
          type: integer
        serviceDate:
          format: date
          type: string
      type: object
    BatchChange:
      properties:
        expectedVersion:
          format: int64
          type: integer
        orderCutoff:
          format: date-time
          type: string
        portions:
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        readyAt:
          format: date-time
          type: string
        status:
          enum:
          - OPEN
          - CLOSED
          type: string
      required:
      - expectedVersion
      - portions
      - status
      type: object
    ChefBatch:
      properties:
        confirmed:
          format: int32
          type: integer
        held:
          format: int32
          type: integer
        id:
          format: uuid
          type: string
        menuItemId:
          format: uuid
          type: string
        orderCutoff:
          format: date-time
          type: string
        portions:
          format: int32
          type: integer
        readyAt:
          format: date-time
          type: string
        remaining:
          format: int32
          type: integer
        serviceDate:
          format: date
          type: string
        status:
          enum:
          - OPEN
          - CLOSED
          type: string
        version:
          format: int64
          type: integer
      type: object
    HoldConfirmation:
      properties:
        orderId:
          format: uuid
          type: string
      required:
      - orderId
      type: object
    HoldVoid:
      properties:
        reason:
          maxLength: 300
          minLength: 0
          type: string
      required:
      - reason
      type: object
    KitchenLoad:
      properties:
        extraPrepMinutes:
          format: int32
          type: integer
        kitchenId:
          format: uuid
          type: string
        until:
          format: date-time
          type: string
      type: object
    KitchenLoadRequest:
      properties:
        extraPrepMinutes:
          format: int32
          maximum: 180
          minimum: 0
          type: integer
        until:
          format: date-time
          type: string
      required:
      - extraPrepMinutes
      - until
      type: object
    NewBatch:
      properties:
        menuItemId:
          format: uuid
          type: string
        orderCutoff:
          format: date-time
          type: string
        portions:
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        readyAt:
          format: date-time
          type: string
        serviceDate:
          format: date
          type: string
      required:
      - menuItemId
      - portions
      - serviceDate
      type: object
    NewHold:
      properties:
        portions:
          format: int32
          maximum: 50
          minimum: 1
          type: integer
      required:
      - portions
      type: object
    PortionHold:
      properties:
        batchId:
          format: uuid
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        orderId:
          format: uuid
          type: string
        portions:
          format: int32
          type: integer
        status:
          enum:
          - HELD
          - CONFIRMED
          - RELEASED
          type: string
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: "Generated from services/advanced-features-service. Base URL https://api.craves.in.\
    \ Errors: {timestamp, code, message, details, correlationId}. Feature switch:\
    \ CRAVES_ADV_KITCHEN_CAPACITY_ENABLED."
  title: Craves kitchen-capacity API
  version: v1
openapi: 3.0.1
paths:
  /api/v1/advanced/kitchen-capacity/batches/{batchId}/holds:
    post:
      operationId: holdPortions
      parameters:
      - in: path
        name: batchId
        required: true
        schema:
          format: uuid
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewHold"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PortionHold"
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/chef/batches:
    get:
      operationId: chefBatches
      parameters:
      - in: query
        name: date
        required: false
        schema:
          format: date
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/ChefBatch"
                type: array
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
    post:
      operationId: createBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBatch"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChefBatch"
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/chef/batches/{batchId}:
    put:
      operationId: updateBatch
      parameters:
      - in: path
        name: batchId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchChange"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChefBatch"
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/chef/batches/{batchId}/holds:
    get:
      operationId: chefBatchHolds
      parameters:
      - in: path
        name: batchId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/PortionHold"
                type: array
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/chef/holds/{holdId}/void:
    post:
      operationId: voidHold
      parameters:
      - in: path
        name: holdId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldVoid"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PortionHold"
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/chef/load:
    put:
      operationId: setKitchenLoad
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KitchenLoadRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KitchenLoad"
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/holds/{holdId}:
    delete:
      operationId: releaseHold
      parameters:
      - in: path
        name: holdId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/holds/{holdId}/confirm:
    post:
      operationId: confirmHold
      parameters:
      - in: path
        name: holdId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldConfirmation"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PortionHold"
          description: OK
      tags:
      - kitchen-capacity-controller
      x-craves-auth: user
  /api/v1/advanced/kitchen-capacity/kitchens/{kitchenId}/load:
    get:
      operationId: kitchenLoad
      parameters:
      - in: path
        name: kitchenId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/KitchenLoad"
          description: OK
      security: []
      tags:
      - kitchen-capacity-controller
      x-craves-auth: public
  /api/v1/advanced/kitchen-capacity/menu-items/{menuItemId}/batches:
    get:
      operationId: dishBatches
      parameters:
      - in: path
        name: menuItemId
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: date
        required: false
        schema:
          format: date
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/BatchAvailability"
                type: array
          description: OK
      security: []
      tags:
      - kitchen-capacity-controller
      x-craves-auth: public
security:
- bearer: []
servers:
- url: https://api.craves.in
