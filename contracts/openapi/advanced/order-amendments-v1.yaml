components:
  schemas:
    OrderAmendmentAccept:
      properties:
        expectedVersion:
          format: int64
          type: integer
      required:
      - expectedVersion
      type: object
    OrderAmendmentChange:
      properties:
        kind:
          enum:
          - REMOVE
          - REDUCE
          - REPLACE
          - ADJUST
          type: string
        note:
          maxLength: 200
          minLength: 0
          type: string
        orderItemId:
          format: uuid
          type: string
        quantity:
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        substituteMenuItemId:
          format: uuid
          type: string
      required:
      - kind
      - orderItemId
      type: object
    OrderAmendmentDecline:
      properties:
        reason:
          maxLength: 300
          minLength: 0
          type: string
      type: object
    OrderAmendmentLine:
      properties:
        deltaPaise:
          format: int64
          type: integer
        itemName:
          type: string
        kind:
          enum:
          - REMOVE
          - REDUCE
          - REPLACE
          - ADJUST
          type: string
        menuItemId:
          format: uuid
          type: string
        note:
          type: string
        orderItemId:
          format: uuid
          type: string
        quantityAfter:
          format: int32
          type: integer
        quantityBefore:
          format: int32
          type: integer
        substituteMenuItemId:
          format: uuid
          type: string
        substituteName:
          type: string
        substituteUnitPricePaise:
          format: int64
          type: integer
        unitPricePaise:
          format: int64
          type: integer
      type: object
    OrderAmendmentRequest:
      properties:
        changes:
          items:
            $ref: "#/components/schemas/OrderAmendmentChange"
          maxItems: 30
          minItems: 0
          type: array
        note:
          maxLength: 300
          minLength: 0
          type: string
      required:
      - changes
      type: object
    OrderAmendmentView:
      properties:
        answerNote:
          type: string
        answeredAt:
          format: date-time
          type: string
        changes:
          items:
            $ref: "#/components/schemas/OrderAmendmentLine"
          type: array
        createdAt:
          format: date-time
          type: string
        expired:
          type: boolean
        expiresAt:
          format: date-time
          type: string
        foodDeltaPaise:
          format: int64
          type: integer
        id:
          format: uuid
          type: string
        kitchenId:
          format: uuid
          type: string
        note:
          type: string
        orderId:
          format: uuid
          type: string
        proposedBy:
          enum:
          - CUSTOMER
          - CHEF
          type: string
        status:
          enum:
          - PROPOSED
          - ACCEPTED
          - DECLINED
          - WITHDRAWN
          type: string
        version:
          format: int64
          type: integer
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
