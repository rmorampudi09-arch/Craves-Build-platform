components:
  schemas:
    PlannedSearch:
      properties:
        ownWords:
          type: boolean
        text:
          type: string
      type: object
    SearchConceptDraft:
      properties:
        active:
          type: boolean
        category:
          maxLength: 80
          minLength: 0
          type: string
        expectedVersion:
          format: int64
          type: integer
        foodType:
          pattern: VEG|NON_VEG|EGG
          type: string
        phrase:
          maxLength: 60
          minLength: 0
          type: string
        searchTerms:
          items:
            maxLength: 40
            minLength: 0
            type: string
          maxItems: 4
          minItems: 0
          type: array
        spiceLevel:
          pattern: MILD|MEDIUM|SPICY
          type: string
      required:
      - phrase
      - searchTerms
      type: object
    SearchConceptView:
      properties:
        active:
          type: boolean
        category:
          type: string
        foodType:
          type: string
        id:
          format: uuid
          type: string
        phrase:
          type: string
        searchTerms:
          items:
            type: string
          type: array
        spiceLevel:
          type: string
        updatedAt:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      type: object
    SearchPlan:
      properties:
        category:
          type: string
        foodType:
          type: string
        matchedPhrases:
          items:
            type: string
          type: array
        normalized:
          type: string
        query:
          type: string
        searches:
          items:
            $ref: "#/components/schemas/PlannedSearch"
          type: array
        spiceLevel:
          type: string
      type: object
    SemanticDish:
      properties:
        category:
          type: string
        description:
          type: string
        distanceMeters:
          format: int64
          type: integer
        foodType:
          type: string
        imageUrl:
          type: string
        itemName:
          type: string
        kitchenId:
          format: uuid
          type: string
        kitchenName:
          type: string
        matchedBy:
          items:
            type: string
          type: array
        menuItemId:
          format: uuid
          type: string
        pricePaise:
          format: int64
          type: integer
        score:
          format: int32
          type: integer
        spiceLevel:
          type: string
      type: object
    SemanticSearchResult:
      properties:
        complete:
          type: boolean
        dishes:
          items:
            $ref: "#/components/schemas/SemanticDish"
          type: array
        plan:
          $ref: "#/components/schemas/SearchPlan"
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: "Generated from services/advanced-features-service. Base URL https://api.craves.in.\
    \ Errors: {timestamp, code, message, details, correlationId}. Feature switch:\
    \ CRAVES_ADV_SEMANTIC_SEARCH_ENABLED."
  title: Craves semantic-search API
  version: v1
openapi: 3.0.1
paths:
  /api/v1/advanced/semantic-search/admin/concepts:
    get:
      operationId: listSearchConcepts
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/SearchConceptView"
                type: array
          description: OK
      tags:
      - semantic-search-admin-controller
      x-craves-auth: staff
    post:
      operationId: createSearchConcept
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchConceptDraft"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchConceptView"
          description: OK
      tags:
      - semantic-search-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/semantic-search/admin/concepts/{id}:
    put:
      operationId: changeSearchConcept
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchConceptDraft"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchConceptView"
          description: OK
      tags:
      - semantic-search-admin-controller
      x-craves-auth: staff
  /api/v1/advanced/semantic-search/dishes:
    get:
      operationId: semanticSearchDishes
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
      - in: query
        name: latitude
        required: true
        schema:
          type: number
      - in: query
        name: longitude
        required: true
        schema:
          type: number
      - in: query
        name: radiusMeters
        required: true
        schema:
          format: int32
          type: integer
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SemanticSearchResult"
          description: OK
      security: []
      tags:
      - semantic-search-controller
      x-craves-auth: public
  /api/v1/advanced/semantic-search/plan:
    get:
      operationId: semanticSearchPlan
      parameters:
      - in: query
        name: q
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SearchPlan"
          description: OK
      security: []
      tags:
      - semantic-search-controller
      x-craves-auth: public
security:
- bearer: []
servers:
- url: https://api.craves.in
