openapi: 3.0.3
info:
  title: Craves Chef Fee Preview
  version: 1.0.0
  description: Side-effect-free simulation. This contract does not activate fees, create earnings or transfer money.
paths:
  /api/v1/admin/chef-fee-policies/preview:
    post:
      operationId: previewChefFeePolicy
      security: [{ bearerAuth: [] }]
      description: Requires PLATFORM_ADMIN or PAYMENTS_ADMIN. No policy activation endpoint is provided in this release.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewRequest' }
      responses:
        '200':
          description: Simulation with decimal-string amounts, simulation=true and activated=false.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewResponse' }
        '400': { description: Invalid policy or exact-paise monetary input. }
        '403': { description: Payments administration role required. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Money:
      type: string
      pattern: '^[0-9]{1,14}(\.[0-9]{1,2})?$'
      example: '369.00'
    PreviewRequest:
      type: object
      required: [version, currency, mode, tiers, chefOrderGrossAmounts]
      properties:
        version: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,119}$' }
        currency: { type: string, enum: [INR] }
        mode: { type: string, enum: [PROGRESSIVE, WHOLE_AMOUNT_BAND] }
        ceiling: { $ref: '#/components/schemas/Money' }
        tiers:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [percentage]
            properties:
              upperBound:
                type: string
                nullable: true
                description: Exact-paise cumulative upper bound. Omit or use null only for the last unbounded tier.
              percentage: { type: string, pattern: '^[0-9]{1,3}(\.[0-9]{1,6})?$' }
        chefOrderGrossAmounts:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Money' }
    PreviewResponse:
      type: object
      required: [simulation, activated, policyVersion, policyHash, basis, currency, rounding, results, notice]
      properties:
        simulation: { type: boolean, enum: [true] }
        activated: { type: boolean, enum: [false] }
        policyVersion: { type: string }
        policyHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        basis: { type: string, enum: [CHEF_ORDER_GROSS] }
        currency: { type: string, enum: [INR] }
        rounding: { type: string, enum: [HALF_UP_2DP] }
        results:
          type: array
          items:
            type: object
            required: [chefOrderGross, fee, estimatedPayableBeforeTaxAndAdjustments]
            properties:
              chefOrderGross: { $ref: '#/components/schemas/Money' }
              fee: { $ref: '#/components/schemas/Money' }
              estimatedPayableBeforeTaxAndAdjustments: { $ref: '#/components/schemas/Money' }
        notice: { type: string }
