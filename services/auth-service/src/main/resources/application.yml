server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: craves-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/craves_auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:cravesadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Shared database budget: scripts/release/check-db-connection-budget.py
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:3}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:1}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

craves:
  # CH-03 per-service identity for /internal calls. Empty keys/enforced-paths = monitor only (no behaviour change).
  internal-auth:
    service-name: ${CRAVES_INTERNAL_AUTH_SERVICE_NAME:}
    signing-key: ${CRAVES_INTERNAL_AUTH_SIGNING_KEY:}
    caller-keys: ${CRAVES_INTERNAL_AUTH_CALLER_KEYS:}
    enforced-paths: ${CRAVES_INTERNAL_AUTH_ENFORCED_PATHS:}
    allowed-callers: ${CRAVES_INTERNAL_AUTH_ALLOWED_CALLERS:/internal/v1/roles/chef/**=user-chef;/internal/v1/roles/rider/**=integration;/internal/v1/identities/**=user-chef|notification}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
    check-revoked: ${FIREBASE_CHECK_REVOKED:true}
  jwt:
    issuer: ${CRAVES_JWT_ISSUER:https://api.craves.in/auth}
    audience: ${CRAVES_JWT_AUDIENCE:craves-api}
    access-token-ttl: ${CRAVES_JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${CRAVES_JWT_REFRESH_TOKEN_TTL:30d}
    private-key-pem-base64: ${CRAVES_JWT_PRIVATE_KEY_PEM_BASE64:}
    public-key-pem-base64: ${CRAVES_JWT_PUBLIC_KEY_PEM_BASE64:}
    allow-generated-local-keys: ${CRAVES_JWT_ALLOW_GENERATED_LOCAL_KEYS:false}
  internal:
    service-secret: ${CRAVES_INTERNAL_SERVICE_SECRET:}
  internal-admin-rbac:
    api-enabled: ${CRAVES_INTERNAL_ADMIN_RBAC_API_ENABLED:false}
    maximum-list-size: ${CRAVES_INTERNAL_ADMIN_RBAC_MAXIMUM_LIST_SIZE:100}
    chef-role-revoke-enabled: ${CRAVES_CHEF_ROLE_REVOKE_ENABLED:false}
  admin-account-intervention:
    api-enabled: ${CRAVES_ADMIN_ACCOUNT_INTERVENTION_API_ENABLED:false}
    firebase-worker-enabled: ${CRAVES_ADMIN_ACCOUNT_INTERVENTION_FIREBASE_WORKER_ENABLED:false}
    batch-size: ${CRAVES_ADMIN_ACCOUNT_INTERVENTION_BATCH_SIZE:20}
    max-attempts: ${CRAVES_ADMIN_ACCOUNT_INTERVENTION_MAX_ATTEMPTS:8}
    stale-lock-minutes: ${CRAVES_ADMIN_ACCOUNT_INTERVENTION_STALE_LOCK_MINUTES:5}
    retry-base-seconds: ${CRAVES_ADMIN_ACCOUNT_INTERVENTION_RETRY_BASE_SECONDS:30}
    worker-fixed-delay-ms: ${CRAVES_ADMIN_ACCOUNT_INTERVENTION_WORKER_FIXED_DELAY_MS:5000}
  account-deletion:
    enabled: ${CRAVES_ACCOUNT_DELETION_ENABLED:false}
    worker-enabled: ${CRAVES_ACCOUNT_DELETION_WORKER_ENABLED:false}
    worker-delay: ${CRAVES_ACCOUNT_DELETION_WORKER_DELAY:PT1M}
    wait-days: ${CRAVES_ACCOUNT_DELETION_WAIT_DAYS:30}
    reminder-days: ${CRAVES_ACCOUNT_DELETION_REMINDER_DAYS:7}
    call-timeout: ${CRAVES_ACCOUNT_DELETION_CALL_TIMEOUT:PT20S}
    referral-hmac-key-base64: ${CRAVES_ACCOUNT_DELETION_REFERRAL_HMAC_BASE64:}
    services:
      subscription:
        base-url: ${CRAVES_ACCOUNT_DELETION_SUBSCRIPTION_BASE_URL:}
        credential: ${CRAVES_ACCOUNT_DELETION_SUBSCRIPTION_CREDENTIAL:}
      order:
        base-url: ${CRAVES_ACCOUNT_DELETION_ORDER_BASE_URL:}
        credential: ${CRAVES_ACCOUNT_DELETION_ORDER_CREDENTIAL:}
      integration:
        base-url: ${CRAVES_ACCOUNT_DELETION_INTEGRATION_BASE_URL:}
        credential: ${CRAVES_ACCOUNT_DELETION_INTEGRATION_CREDENTIAL:}
      advanced:
        base-url: ${CRAVES_ACCOUNT_DELETION_ADVANCED_BASE_URL:}
        credential: ${CRAVES_ACCOUNT_DELETION_ADVANCED_CREDENTIAL:}
      notification:
        base-url: ${CRAVES_ACCOUNT_DELETION_NOTIFICATION_BASE_URL:}
        credential: ${CRAVES_ACCOUNT_DELETION_NOTIFICATION_CREDENTIAL:}
      catalog:
        base-url: ${CRAVES_ACCOUNT_DELETION_CATALOG_BASE_URL:}
        credential: ${CRAVES_ACCOUNT_DELETION_CATALOG_CREDENTIAL:}
      user-chef:
        base-url: ${CRAVES_ACCOUNT_DELETION_USER_CHEF_BASE_URL:}
        credential: ${CRAVES_ACCOUNT_DELETION_USER_CHEF_CREDENTIAL:}
      referral:
        base-url: ${CRAVES_ACCOUNT_DELETION_REFERRAL_BASE_URL:}

# Handbook 099: every log line carries the request's X-Correlation-ID (MDC key correlationId, set by CorrelationIdConfiguration).
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
