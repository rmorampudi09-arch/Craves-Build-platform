server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: craves-catalog-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/craves_business_db}
    username: ${SPRING_DATASOURCE_USERNAME:cravesadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Shared database budget: scripts/release/check-db-connection-budget.py
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:2}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:1}
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: catalog_schema
    schemas: catalog_schema
    table: flyway_schema_history
  servlet:
    multipart:
      max-file-size: ${CRAVES_CATALOG_MAX_IMAGE_FILE_SIZE:8MB}
      max-request-size: ${CRAVES_CATALOG_MAX_IMAGE_REQUEST_SIZE:10MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${CRAVES_REDIS_HEALTH_ENABLED:false}

craves:
  # CH-03 per-service identity for /internal calls. Empty keys/enforced-paths = monitor only (no behaviour change).
  internal-auth:
    service-name: ${CRAVES_INTERNAL_AUTH_SERVICE_NAME:}
    signing-key: ${CRAVES_INTERNAL_AUTH_SIGNING_KEY:}
    caller-keys: ${CRAVES_INTERNAL_AUTH_CALLER_KEYS:}
    enforced-paths: ${CRAVES_INTERNAL_AUTH_ENFORCED_PATHS:}
    allowed-callers: ${CRAVES_INTERNAL_AUTH_ALLOWED_CALLERS:/api/v1/catalog/internal/**=order}
  http-client:
    connect-timeout: ${CRAVES_HTTP_CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${CRAVES_HTTP_CLIENT_READ_TIMEOUT:30s}
  jwt:
    issuer: ${CRAVES_JWT_ISSUER:https://api.craves.in/auth}
    audience: ${CRAVES_JWT_AUDIENCE:craves-api}
    verification-pem-base64: ${CRAVES_JWT_VERIFICATION_PEM_BASE64:}
  internal:
    access-value: ${CRAVES_INTERNAL_SERVICE_SECRET:}
  public-catalog:
    privacy-enforcement-enabled: ${CRAVES_PUBLIC_CATALOG_PRIVACY_ENFORCEMENT_ENABLED:false}
  storage:
    endpoint-value: ${CRAVES_STORAGE_ENDPOINT_VALUE:}
    media-container: ${CRAVES_STORAGE_MEDIA_CONTAINER:media}
    public-media-base-url: ${CRAVES_MEDIA_PUBLIC_BASE_URL:}
    max-image-file-size-bytes: ${CRAVES_CATALOG_MAX_IMAGE_FILE_SIZE_BYTES:8388608}
  discovery:
    default-radius-km: ${CRAVES_DISCOVERY_DEFAULT_RADIUS_KM:10}
    max-radius-km: ${CRAVES_DISCOVERY_MAX_RADIUS_KM:15}
    max-query-radius-meters: ${CRAVES_DISCOVERY_MAX_QUERY_RADIUS_METERS:50000}
    max-page-size: ${CRAVES_DISCOVERY_MAX_PAGE_SIZE:100}
    cache:
      enabled: ${CRAVES_DISCOVERY_CACHE_ENABLED:false}
      ttl-seconds: ${CRAVES_DISCOVERY_CACHE_TTL_SECONDS:120}
      failure-backoff-seconds: ${CRAVES_DISCOVERY_CACHE_FAILURE_BACKOFF_SECONDS:30}
      key-prefix: ${CRAVES_DISCOVERY_CACHE_KEY_PREFIX:craves:catalog:discovery}
  user-chef:
    # Kitchen photo import pulls approved registration photos from user-chef-service; blank = import off.
    internal-base-url: ${CRAVES_USER_CHEF_INTERNAL_BASE_URL:}
    # Defaults to the shared internal secret that user-chef-service also reads as CRAVES_INTERNAL_SERVICE_SECRET.
    internal-secret: ${CRAVES_USER_CHEF_INTERNAL_SECRET:${CRAVES_INTERNAL_SERVICE_SECRET:}}
  pickup-provisioning:
    enabled: ${CRAVES_PICKUP_PROVISIONING_ENABLED:false}
    integration-base-url: ${CRAVES_INTEGRATION_SERVICE_BASE_URL:}
    internal-service-key: ${CRAVES_INTERNAL_SERVICE_KEY:}
    batch-size: ${CRAVES_PICKUP_PROVISIONING_BATCH_SIZE:25}
    max-attempts: ${CRAVES_PICKUP_PROVISIONING_MAX_ATTEMPTS:12}
    stale-minutes: ${CRAVES_PICKUP_PROVISIONING_STALE_MINUTES:5}
    fixed-delay-ms: ${CRAVES_PICKUP_PROVISIONING_FIXED_DELAY_MS:15000}