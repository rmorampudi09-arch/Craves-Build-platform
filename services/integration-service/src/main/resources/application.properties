# Additive finance settings; existing application.yml remains authoritative for other modules.
# Money movement remains disabled until both source certification and merchant setup are complete.
craves.finance.authoritative-source-ready=${CRAVES_FINANCE_AUTHORITATIVE_SOURCE_READY:false}
craves.ledger.posting-enabled=${CRAVES_LEDGER_POSTING_ENABLED:false}
craves.razorpayx.production-approved=${CRAVES_RAZORPAYX_PRODUCTION_APPROVED:false}
craves.razorpayx.worker-enabled=${CRAVES_RAZORPAYX_WORKER_ENABLED:false}
craves.razorpayx.key-id=${CRAVES_RAZORPAYX_KEY_ID:}
craves.razorpayx.key-secret=${CRAVES_RAZORPAYX_KEY_SECRET:}
craves.razorpayx.account-number=${CRAVES_RAZORPAYX_ACCOUNT_NUMBER:}
craves.razorpayx.webhook-secret=${CRAVES_RAZORPAYX_WEBHOOK_SECRET:}
craves.razorpayx.poll-interval-ms=${CRAVES_RAZORPAYX_POLL_INTERVAL_MS:30000}
