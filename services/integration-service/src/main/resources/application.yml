server:
  port: 8080

spring:
  application:
    name: craves-integration-service
  datasource:
    hikari:
      # Shared database budget: scripts/release/check-db-connection-budget.py. 8 on one replica (blueprint E3): referral
      # checkouts open a second transaction, and the fleet's location calls and jobs need room beside them.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:1}
  servlet:
    multipart:
      # Rider document photos (POST /api/v1/rider/documents), at most 10 MB each.
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: payment_schema
    schemas: payment_schema
    table: flyway_schema_history

craves:
  # Rider fleet (in.craves.integration.fleet, docs/riders/BACKEND.md). The flags only switch code paths on; with
  # CRAVES_FLEET_ENABLED off no fleet bean or job exists. Dispatch mode and pay live in fleet_schema tables.
  fleet:
    enabled: ${CRAVES_FLEET_ENABLED:false}
    rider-api-enabled: ${CRAVES_FLEET_RIDER_API_ENABLED:false}
    location-ingest-enabled: ${CRAVES_FLEET_LOCATION_INGEST_ENABLED:false}
    # Keep false: automated payouts do not exist; FleetPayouts only logs that it refuses (payouts stay manual).
    payout-execution-enabled: ${CRAVES_FLEET_PAYOUT_EXECUTION_ENABLED:false}
    # While on, dispatch touches only riders and kitchens in fleet_schema.test_mode_rider / test_mode_kitchen.
    test-mode: ${CRAVES_FLEET_TEST_MODE:true}
    # Ops may give a rider's trip before pickup to another rider (a new trip). Switch on only once order-service from the
    # same release is live: an older one refuses the rider-to-rider handoff, and the order would keep the first rider.
    rider-handover-enabled: ${CRAVES_FLEET_RIDER_HANDOVER_ENABLED:false}
    # Trip steps may come from the phone's native outbox with the shift credential instead of a JWT (P2-01): only the
    # rider's trip in progress or one that ended during the shift. Keep false until the security review signs it off.
    trip-shift-credential-enabled: ${CRAVES_FLEET_TRIP_SHIFT_CREDENTIAL_ENABLED:false}
    # How often a phone waiting for offers uploads (P2-04), 5 to 30 s; lower it only if offer receipts show pushes ring late.
    idle-poll-seconds: ${CRAVES_FLEET_IDLE_POLL_SECONDS:10}
    # Phones upload on location callbacks with short wake locks instead of one for the whole shift (P2-10). Keep false
    # until PHONE-TESTS section 1 passes with it on and battery per hour is no worse; needed before a Play rollout.
    callback-uploads-enabled: ${CRAVES_FLEET_CALLBACK_UPLOADS_ENABLED:false}
    # Daily deletion of shift selfies after 30 days and delivery photos after 90, unless flagged or disputed (P2-09,
    # FleetPhotoRetention). While false it only logs how many are due; turn it on once the lawyer agrees the periods.
    photo-retention-enabled: ${CRAVES_FLEET_PHOTO_RETENTION_ENABLED:false}
    # The privacy notice in force (P2-09, DPDP) and where its text is ({language} becomes en, te or hi). Riders accept a
    # new version before they continue; leave both empty until the lawyer's text is published at that address.
    # Offers go to the riders nearest by road among the 5 nearest by straight line (P3-06; 5 road-distance calls an order).
    # Turn it on only when pilot_health.sql's pickup_detour shows over 20% of pickups longer than 1.5 x the straight line.
    road-ranking-enabled: ${CRAVES_FLEET_ROAD_RANKING_ENABLED:false}
    privacy-notice-version: ${CRAVES_FLEET_PRIVACY_NOTICE_VERSION:}
    privacy-notice-url: ${CRAVES_FLEET_PRIVACY_NOTICE_URL:}
    # Riders may take a break while online and choose the farthest pickup and drop they hear of (Phase 4). Switch on once
    # the APIM routes for /shift/pause, /shift/resume and /preferences are published and the app that shows them is out.
    rider-choices-enabled: ${CRAVES_FLEET_RIDER_CHOICES_ENABLED:false}
    # R16 16 (DISPATCH.md §2, "A phone that doesn't ring"), 0 = off: with rounds, an offer whose phone hasn't reported ringing
    # this many seconds after it went out (15: one idle poll and a margin) no longer holds up the next rider; the first
    # accept wins. It changes who hears of an order: 14 days' notice to riders first, and only once offer_outcomes shows
    # over 20% of offers expiring unanswered for two weeks with every rider on app 1.1.0 or later (GO-LIVE.md §8).
    unheard-next-rider-seconds: ${CRAVES_FLEET_UNHEARD_NEXT_RIDER_SECONDS:0}
    # The fleet engine (Phase 5, services/fleet-engine, docs/riders/SCALE.md). off: nothing is written to Redis. shadow:
    # rider events and every order's ranking go to the engine, which compares and logs (FLEET_ENGINE_SHADOW); offers stay
    # Java's. live: dispatch asks the engine first and ranks itself after reply-timeout-ms. Partitions and key prefix must
    # equal the engine's FLEET_ENGINE_* settings. joint shares out orders asked at once: 14 days' notice to riders first.
    engine:
      mode: ${CRAVES_FLEET_ENGINE_MODE:off}
      joint: ${CRAVES_FLEET_ENGINE_JOINT:false}
      rider-partitions: ${CRAVES_FLEET_ENGINE_RIDER_PARTITIONS:16}
      dispatch-partitions: ${CRAVES_FLEET_ENGINE_DISPATCH_PARTITIONS:16}
      stream-keep-seconds: ${CRAVES_FLEET_ENGINE_STREAM_KEEP_SECONDS:120}
      reply-timeout-ms: ${CRAVES_FLEET_ENGINE_REPLY_TIMEOUT_MS:300}
      queue-capacity: ${CRAVES_FLEET_ENGINE_QUEUE_CAPACITY:10000}
      key-prefix: "${CRAVES_FLEET_ENGINE_KEY_PREFIX:craves:fleet:}"
    # The travel-time model (Phase 5, ml/fleet-eta, docs/riders/DISPATCH.md §2): minutes to the kitchen and to the door
    # predicted from Craves's own finished trips. off: today's 20 km/h rule. shadow: dispatch logs how the model would rank
    # (FLEET_ETA_SHADOW); nothing riders see changes. live: offers and the chef's arrival time show predicted minutes, and
    # riders are ranked by them only where the dispatch policy's rank_by_travel_time rule says so (14 days' notice) and the
    # version's ranking passed. model-version names a row of fleet_schema.eta_model (python -m fleet_eta sql); without
    # one, today's rule stays.
    eta:
      mode: ${CRAVES_FLEET_ETA_MODE:off}
      model-version: ${CRAVES_FLEET_ETA_MODEL_VERSION:}
    # Rain mode (R16 19, docs/riders/DISPATCH.md "Rain mode"): ops switch it from the console. With this on, it also comes on
    # by itself while the last 30 minutes' rides to the door run 1.3 times the travel-time model's minutes (eta.mode live
    # only). Riders must have had 14 days' notice before its first use, automatic or not.
    rain-auto: ${CRAVES_FLEET_RAIN_AUTO:false}
    # RIDER grant and revoke (auth-service InternalRoleController); no call is made until both are set.
    auth-base-url: ${CRAVES_AUTH_INTERNAL_BASE_URL:}
    internal-service-key: ${CRAVES_INTERNAL_SERVICE_KEY:}
    # Private document storage, the same settings as user-chef-service's KYC documents.
    storage-endpoint: ${CRAVES_STORAGE_ENDPOINT_VALUE:}
    storage-container: ${CRAVES_STORAGE_DOCUMENTS_CONTAINER:documents}
    # Rider support line answered in every slot; set it before turning the rider API on.
    support-phone: ${CRAVES_FLEET_SUPPORT_PHONE:}
    support-whatsapp-url: ${CRAVES_FLEET_SUPPORT_WHATSAPP_URL:}
    # Blocks going online below this app version, never a running shift; rider.min_app_version overrides it.
    min-app-version: ${CRAVES_FLEET_MIN_APP_VERSION:1.0.0}
    insurance-label: ${CRAVES_FLEET_INSURANCE_LABEL:}
    # Dispatch (P3): road distance, the delivery code check, offer pushes and ops alerts. Each client calls nothing
    # until its URL and CRAVES_INTERNAL_SERVICE_KEY are set (road distance then uses straight line x 1.3).
    services:
      user-chef-base-url: ${CRAVES_USER_CHEF_INTERNAL_BASE_URL:}
      order-base-url: ${CRAVES_FLEET_ORDER_BASE_URL:}
      notification-base-url: ${CRAVES_NOTIFICATION_INTERNAL_BASE_URL:}
    # Rider money (P4, docs/riders/BACKEND.md "Money"). Credits post to the financial journal, so they also need
    # CRAVES_LEDGER_POSTING_ENABLED. TDS stays off until the CA names the section and rate (100 basis points = 1%).
    money-interval-ms: ${CRAVES_FLEET_MONEY_INTERVAL_MS:60000}
    tds:
      enabled: ${CRAVES_FLEET_TDS_ENABLED:false}
      section: ${CRAVES_FLEET_TDS_SECTION:}
      rate-basis-points: ${CRAVES_FLEET_TDS_RATE_BASIS_POINTS:0}
      annual-threshold-paise: ${CRAVES_FLEET_TDS_ANNUAL_THRESHOLD_PAISE:0}
    # Debt from a negative adjustment is recovered from future pay, at most this much a week (a business input).
    recovery-weekly-cap-paise: ${CRAVES_FLEET_RECOVERY_WEEKLY_CAP_PAISE:50000}
  # CH-07 Idempotency-Key replay; only requests that send the header are affected.
  idempotency:
    enabled: ${CRAVES_IDEMPOTENCY_ENABLED:true}
  # CH-04 read-only silent-failure checks; findings are CRAVES_ALERT log lines (infra/monitoring).
  monitoring:
    enabled: ${CRAVES_MONITORING_ENABLED:true}
    stuck-order-minutes: ${CRAVES_MONITORING_STUCK_ORDER_MINUTES:90}
    lookback-days: ${CRAVES_MONITORING_LOOKBACK_DAYS:7}
  # CH-03 per-service identity for /internal calls. Empty keys/enforced-paths = monitor only (no behaviour change).
  internal-auth:
    service-name: ${CRAVES_INTERNAL_AUTH_SERVICE_NAME:}
    signing-key: ${CRAVES_INTERNAL_AUTH_SIGNING_KEY:}
    caller-keys: ${CRAVES_INTERNAL_AUTH_CALLER_KEYS:}
    enforced-paths: ${CRAVES_INTERNAL_AUTH_ENFORCED_PATHS:}
    allowed-callers: ${CRAVES_INTERNAL_AUTH_ALLOWED_CALLERS:/internal/v1/finance/quotes=order;/internal/v1/finance/events=order;/internal/v1/finance/catalog-eligibility=catalog;/internal/v1/delivery-pickup-locations/**=catalog}
  http-client:
    connect-timeout: ${CRAVES_HTTP_CLIENT_CONNECT_TIMEOUT:2s}
    read-timeout: ${CRAVES_HTTP_CLIENT_READ_TIMEOUT:30s}
  delivery-feedback:
    enabled: ${CRAVES_DELIVERY_FEEDBACK_ENABLED:true}
    batch-size: ${CRAVES_DELIVERY_FEEDBACK_BATCH_SIZE:50}
    max-attempts: ${CRAVES_DELIVERY_FEEDBACK_MAX_ATTEMPTS:8}
  delivery-intelligence:
    enabled: ${CRAVES_DELIVERY_INTELLIGENCE_ENABLED:false}
    live-window-days: ${CRAVES_DELIVERY_LIVE_WINDOW_DAYS:7}
    global-prior: ${CRAVES_DELIVERY_GLOBAL_PRIOR:100.0}
    momentum-threshold: ${CRAVES_DELIVERY_MOMENTUM_THRESHOLD:3.0}
    live-pull-k: ${CRAVES_DELIVERY_LIVE_PULL_K:10.0}
    fade-factor: ${CRAVES_DELIVERY_DAILY_FADE_FACTOR:0.965}
    max-stored-weight: ${CRAVES_DELIVERY_MAX_STORED_WEIGHT:400.0}
    ml-weight: ${CRAVES_DELIVERY_ML_WEIGHT:0.55}
    rolling-score-weight: ${CRAVES_DELIVERY_ROLLING_SCORE_WEIGHT:0.35}
    exploration-weight: ${CRAVES_DELIVERY_EXPLORATION_WEIGHT:0.10}
    proximity-weight: ${CRAVES_DELIVERY_PROXIMITY_WEIGHT:0.60}
    quality-weight: ${CRAVES_DELIVERY_QUALITY_WEIGHT:0.40}
    search-radius-km: ${CRAVES_DELIVERY_SEARCH_RADIUS_KM:5.0}
    max-pickup-eta-minutes: ${CRAVES_DELIVERY_MAX_PICKUP_ETA_MINUTES:30.0}
    unknown-proximity-score: ${CRAVES_DELIVERY_UNKNOWN_PROXIMITY_SCORE:50.0}
    softmax-temperature: ${CRAVES_DELIVERY_SOFTMAX_TEMPERATURE:10.0}
    success-threshold: ${CRAVES_DELIVERY_SUCCESS_THRESHOLD:70.0}
    neutral-rating-score: ${CRAVES_DELIVERY_NEUTRAL_RATING_SCORE:70.0}
    default-strategy: ${CRAVES_DELIVERY_ASSIGNMENT_STRATEGY:STOCHASTIC}
    maintenance-cron: ${CRAVES_DELIVERY_MAINTENANCE_CRON:0 0 2 * * *}
    maintenance-zone: ${CRAVES_DELIVERY_MAINTENANCE_ZONE:Asia/Kolkata}
  delivery-command:
    enabled: ${CRAVES_DELIVERY_COMMAND_ENABLED:false}
    reconciliation-enabled: ${CRAVES_DELIVERY_RECONCILIATION_ENABLED:false}
    webhook-processing-enabled: ${CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED:false}
    tracking-reconciliation-enabled: ${CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED:false}
    status-publisher-enabled: ${CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED:false}
    borzo-pidge-handoff-enabled: ${CRAVES_BORZO_PIDGE_HANDOFF_ENABLED:false}
    fully-qualified-namespace: ${SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE:}
    connection-string: ${SERVICE_BUS_CONNECTION_STRING:}
    topic-name: ${SERVICE_BUS_TOPIC_NAME:craves-domain-events}
    chef-accepted-subscription-name: ${SERVICE_BUS_CHEF_ACCEPTED_SUBSCRIPTION:integration-service-chef-accepted}
    queue-name: ${SERVICE_BUS_DELIVERY_COMMAND_QUEUE:delivery-command}
    lead-time-minutes: ${CRAVES_DELIVERY_COMMAND_LEAD_TIME_MINUTES:10}
    # R16 10: off until 2 to 4 weeks of ready taps (pilot_health.sql ready_vs_promise); docs/riders/GO-LIVE.md.
    ready-correction-enabled: ${CRAVES_DELIVERY_READY_CORRECTION_ENABLED:false}
    # R16 18: start at predicted ready - free riders' predicted ride to the kitchen - 2 min, never earlier than the lead says.
    # Works only with CRAVES_FLEET_ETA_MODE=live, a version whose ranking passed and dispatch live; off until 500 delivered
    # legs and the ready correction has run (docs/riders/DISPATCH.md §9).
    food-timed-dispatch-enabled: ${CRAVES_DELIVERY_FOOD_TIMED_DISPATCH_ENABLED:false}
    quote-timeout-seconds: ${CRAVES_DELIVERY_QUOTE_TIMEOUT_SECONDS:4}
    max-provider-attempts: ${CRAVES_DELIVERY_MAX_PROVIDER_ATTEMPTS:3}
    max-delivery-attempts: ${CRAVES_DELIVERY_MAX_DELIVERY_ATTEMPTS:5}
    retry:
      base-seconds: ${CRAVES_DELIVERY_RETRY_BASE_SECONDS:30}
      max-seconds: ${CRAVES_DELIVERY_RETRY_MAX_SECONDS:600}
      claim-contention-seconds: ${CRAVES_DELIVERY_CLAIM_CONTENTION_SECONDS:10}
    max-concurrent-messages: ${CRAVES_DELIVERY_MAX_CONCURRENT_MESSAGES:4}
    prefetch-count: ${CRAVES_DELIVERY_PREFETCH_COUNT:8}
    max-auto-lock-renew-minutes: ${CRAVES_DELIVERY_MAX_AUTO_LOCK_RENEW_MINUTES:5}
    outbox-batch-size: ${CRAVES_DELIVERY_OUTBOX_BATCH_SIZE:20}
    outbox-publish-interval-ms: ${CRAVES_DELIVERY_OUTBOX_PUBLISH_INTERVAL_MS:5000}
    reconciliation-batch-size: ${CRAVES_DELIVERY_RECONCILIATION_BATCH_SIZE:20}
    reconciliation-interval-ms: ${CRAVES_DELIVERY_RECONCILIATION_INTERVAL_MS:15000}
    max-reconciliation-attempts: ${CRAVES_DELIVERY_MAX_RECONCILIATION_ATTEMPTS:20}
    reconciliation-retry-base-seconds: ${CRAVES_DELIVERY_RECONCILIATION_RETRY_BASE_SECONDS:30}
    reconciliation-stale-minutes: ${CRAVES_DELIVERY_RECONCILIATION_STALE_MINUTES:10}
    webhook-batch-size: ${CRAVES_DELIVERY_WEBHOOK_BATCH_SIZE:20}
    webhook-processing-interval-ms: ${CRAVES_DELIVERY_WEBHOOK_PROCESSING_INTERVAL_MS:2000}
    max-webhook-attempts: ${CRAVES_DELIVERY_MAX_WEBHOOK_ATTEMPTS:10}
    webhook-retry-base-seconds: ${CRAVES_DELIVERY_WEBHOOK_RETRY_BASE_SECONDS:5}
    webhook-stale-minutes: ${CRAVES_DELIVERY_WEBHOOK_STALE_MINUTES:5}
    tracking-batch-size: ${CRAVES_DELIVERY_TRACKING_BATCH_SIZE:20}
    tracking-reconciliation-interval-ms: ${CRAVES_DELIVERY_TRACKING_RECONCILIATION_INTERVAL_MS:15000}
    tracking-poll-seconds: ${CRAVES_DELIVERY_TRACKING_POLL_SECONDS:60}
    max-tracking-attempts: ${CRAVES_DELIVERY_MAX_TRACKING_ATTEMPTS:20}
    tracking-retry-base-seconds: ${CRAVES_DELIVERY_TRACKING_RETRY_BASE_SECONDS:30}
    tracking-stale-minutes: ${CRAVES_DELIVERY_TRACKING_STALE_MINUTES:5}
  refund:
    consumer-enabled: ${CRAVES_REFUND_CONSUMER_ENABLED:false}
    provider-execution-enabled: ${CRAVES_REFUND_PROVIDER_EXECUTION_ENABLED:false}
    reconciliation-enabled: ${CRAVES_REFUND_RECONCILIATION_ENABLED:false}
    status-publisher-enabled: ${CRAVES_REFUND_STATUS_PUBLISHER_ENABLED:false}
    production-provider-execution-approved: ${CRAVES_REFUND_PRODUCTION_PROVIDER_EXECUTION_APPROVED:false}
    production-reconciliation-approved: ${CRAVES_REFUND_PRODUCTION_RECONCILIATION_APPROVED:false}
    fully-qualified-namespace: ${SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE:}
    connection-string: ${SERVICE_BUS_CONNECTION_STRING:}
    topic-name: ${SERVICE_BUS_TOPIC_NAME:craves-domain-events}
    subscription-name: ${SERVICE_BUS_REFUND_REQUESTED_SUBSCRIPTION:integration-service-refund-requested}
    max-concurrent-messages: ${CRAVES_REFUND_MAX_CONCURRENT_MESSAGES:2}
    prefetch-count: ${CRAVES_REFUND_PREFETCH_COUNT:4}
    max-delivery-attempts: ${CRAVES_REFUND_MAX_DELIVERY_ATTEMPTS:5}
    worker-batch-size: ${CRAVES_REFUND_WORKER_BATCH_SIZE:20}
    worker-fixed-delay-ms: ${CRAVES_REFUND_WORKER_FIXED_DELAY_MS:30000}
    max-provider-attempts: ${CRAVES_REFUND_MAX_PROVIDER_ATTEMPTS:8}
    retry-base-delay-seconds: ${CRAVES_REFUND_RETRY_BASE_DELAY_SECONDS:60}
    stale-lock-seconds: ${CRAVES_REFUND_STALE_LOCK_SECONDS:300}
    status-outbox-batch-size: ${CRAVES_REFUND_STATUS_OUTBOX_BATCH_SIZE:20}
    status-outbox-fixed-delay-ms: ${CRAVES_REFUND_STATUS_OUTBOX_FIXED_DELAY_MS:5000}
  subscription-payments:
    consumer-enabled: ${CRAVES_SUBSCRIPTION_PAYMENT_CONSUMER_ENABLED:false}
    status-publisher-enabled: ${CRAVES_SUBSCRIPTION_PAYMENT_STATUS_PUBLISHER_ENABLED:false}
    fully-qualified-namespace: ${SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE:}
    connection-string: ${SERVICE_BUS_CONNECTION_STRING:}
    topic-name: ${SERVICE_BUS_TOPIC_NAME:craves-domain-events}
    request-subscription-name: ${SERVICE_BUS_SUBSCRIPTION_PAYMENT_REQUESTED_SUBSCRIPTION:integration-service-subscription-payment-requested}
    subscription-service-base-url: ${CRAVES_SUBSCRIPTION_SERVICE_BASE_URL:}
    max-concurrent-messages: ${CRAVES_SUBSCRIPTION_PAYMENT_MAX_CONCURRENT_MESSAGES:2}
    prefetch-count: ${CRAVES_SUBSCRIPTION_PAYMENT_PREFETCH_COUNT:4}
    max-delivery-attempts: ${CRAVES_SUBSCRIPTION_PAYMENT_MAX_DELIVERY_ATTEMPTS:5}
    outbox-batch-size: ${CRAVES_SUBSCRIPTION_PAYMENT_OUTBOX_BATCH_SIZE:20}
    max-publish-attempts: ${CRAVES_SUBSCRIPTION_PAYMENT_MAX_PUBLISH_ATTEMPTS:10}
    stale-lock-minutes: ${CRAVES_SUBSCRIPTION_PAYMENT_STALE_LOCK_MINUTES:5}
    outbox-fixed-delay-ms: ${CRAVES_SUBSCRIPTION_PAYMENT_OUTBOX_FIXED_DELAY_MS:5000}
  cashfree:
    webhook:
      worker-enabled: ${CRAVES_CASHFREE_WEBHOOK_WORKER_ENABLED:false}
      batch-size: ${CRAVES_CASHFREE_WEBHOOK_BATCH_SIZE:20}
      fixed-delay-ms: ${CRAVES_CASHFREE_WEBHOOK_FIXED_DELAY_MS:2000}
      max-attempts: ${CRAVES_CASHFREE_WEBHOOK_MAX_ATTEMPTS:10}
      stale-minutes: ${CRAVES_CASHFREE_WEBHOOK_STALE_MINUTES:5}
      retry-base-seconds: ${CRAVES_CASHFREE_WEBHOOK_RETRY_BASE_SECONDS:5}
  providers:
    pidge:
      enabled: ${PIDGE_API_ENABLED:false}
      create-enabled: ${PIDGE_CREATE_ENABLED:false}
      production-activation-approved: ${PIDGE_PRODUCTION_ACTIVATION_APPROVED:false}
      manual-allocation-verified: ${PIDGE_MANUAL_ALLOCATION_VERIFIED:false}
      webhook-verified: ${PIDGE_WEBHOOK_VERIFIED:false}
      environment: ${PIDGE_API_ENVIRONMENT:PRODUCTION}
      base-url: ${PIDGE_API_BASE_URL:https://api.pidge.in}
      auth-token: ${PIDGE_API_AUTH_TOKEN:}
      channel: ${PIDGE_CHANNEL:Craves Hyperlocal}
      webhook-token: ${PIDGE_WEBHOOK_TOKEN:}
      callback-url: ${PIDGE_CALLBACK_URL:https://api.craves.in/api/v1/webhooks/delivery/pidge}
      connect-timeout-seconds: ${PIDGE_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${PIDGE_READ_TIMEOUT_SECONDS:20}
      default-volumetric-weight-grams: ${PIDGE_DEFAULT_VOLUMETRIC_WEIGHT_GRAMS:900}
    borzo:
      enabled: ${BORZO_API_ENABLED:false}
      create-enabled: ${BORZO_CREATE_ENABLED:false}
      environment: ${BORZO_API_ENVIRONMENT:SANDBOX}
      production-activation-approved: ${BORZO_PRODUCTION_ACTIVATION_APPROVED:false}
      base-url: ${BORZO_API_BASE_URL:https://robotapitest-in.borzodelivery.com/api/business/1.8}
      auth-token: ${BORZO_API_AUTH_TOKEN:}
      callback-secret: ${BORZO_CALLBACK_TOKEN:}
      callback-url: ${BORZO_CALLBACK_URL:}
      connect-timeout-seconds: ${BORZO_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${BORZO_READ_TIMEOUT_SECONDS:20}
      reconciliation-page-size: ${BORZO_RECONCILIATION_PAGE_SIZE:50}
      reconciliation-max-pages: ${BORZO_RECONCILIATION_MAX_PAGES:5}
      reconciliation-lookback-seconds: ${BORZO_RECONCILIATION_LOOKBACK_SECONDS:120}
    shiprocket:
      enabled: ${SHIPROCKET_API_ENABLED:false}
      create-enabled: ${SHIPROCKET_CREATE_ENABLED:false}
      environment: ${SHIPROCKET_API_ENVIRONMENT:READ_ONLY}
      production-activation-approved: ${SHIPROCKET_PRODUCTION_ACTIVATION_APPROVED:false}
      attribution-approved: ${SHIPROCKET_ATTRIBUTION_APPROVED:false}
      base-url: ${SHIPROCKET_API_BASE_URL:https://apiv2.shiprocket.in/v1/external}
      email: ${SHIPROCKET_API_EMAIL:}
      password: ${SHIPROCKET_API_PASSWORD:}
      webhook-token: ${SHIPROCKET_WEBHOOK_TOKEN:}
      order-email: ${SHIPROCKET_ORDER_EMAIL:}
      package-length-cm: ${SHIPROCKET_PACKAGE_LENGTH_CM:}
      package-breadth-cm: ${SHIPROCKET_PACKAGE_BREADTH_CM:}
      package-height-cm: ${SHIPROCKET_PACKAGE_HEIGHT_CM:}
      connect-timeout-seconds: ${SHIPROCKET_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${SHIPROCKET_READ_TIMEOUT_SECONDS:20}
      read-retry-attempts: ${SHIPROCKET_READ_RETRY_ATTEMPTS:3}
      auth-refresh-skew-minutes: ${SHIPROCKET_AUTH_REFRESH_SKEW_MINUTES:60}
      maximum-accepted-eta-minutes: ${SHIPROCKET_MAX_ACCEPTED_ETA_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        payments:
          include: readinessState,db
        token-revocation:
          include: readinessState,redis
