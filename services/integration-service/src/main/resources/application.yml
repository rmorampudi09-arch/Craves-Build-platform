management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        payments:
          include: readinessState,db
        token-revocation:
          include: readinessState,redis

# Handbook 099: every log line carries the request's X-Correlation-ID (MDC key correlationId, set by CorrelationIdConfiguration).
logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
