server:
  port: 8080

spring:
  application:
    name: craves-notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/craves_business_db}
    username: ${SPRING_DATASOURCE_USERNAME:cravesadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:craves}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: notification_schema
    schemas: notification_schema

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

craves:
  jwt:
    issuer: ${CRAVES_JWT_ISSUER:craves-auth-service}
    audience: ${CRAVES_JWT_AUDIENCE:craves-clients}
    verification-pem-base64: ${CRAVES_JWT_VERIFICATION_PEM_BASE64:}
  internal:
    service-key: ${CRAVES_INTERNAL_SERVICE_KEY:}
  servicebus:
    enabled: ${CRAVES_SERVICEBUS_ENABLED:false}
    connection-string: ${CRAVES_SERVICEBUS_CONNECTION_STRING:}
    notification-queue-name: ${CRAVES_NOTIFICATION_QUEUE_NAME:notification-command}
  notification:
    email-enabled: ${CRAVES_EMAIL_ENABLED:false}
    push-enabled: ${CRAVES_PUSH_ENABLED:false}
    sms-enabled: ${CRAVES_SMS_ENABLED:false}
    from-email: ${CRAVES_NOTIFICATION_FROM_EMAIL:}
